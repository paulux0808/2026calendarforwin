<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="description" content="학사일정, 월별 운영계획, 학생일정, 부서별 일정과 창체 누가기록">
<title>학사관리</title>
<style>
:root{--ink:#182536;--muted:#617083;--line:#d7dee7;--soft:#f3f6fa;--navy:#173857;--blue:#235fa9;--red:#b43c47;--paper:#fff;--radius:5px;font-family:"Pretendard","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;color:var(--ink);font-synthesis:none;font-size:100%}

*{box-sizing:border-box}
body{margin:0;background:#edf1f5;font-size:.9375rem;line-height:1.5;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{touch-action:manipulation}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.48}
button,input,select,textarea{border:1px solid #bdc9d7;border-radius:var(--radius);background:#fff}
button{min-height:32px;padding:3px 10px;font-weight:550;white-space:nowrap;flex-shrink:0}
button:hover:not(:disabled){background:#eaf0f7;border-color:#9aafc6}
button:active:not(:disabled){background:#dae5f2}
input,select{min-height:32px;padding:3px 8px}
textarea{width:100%;padding:8px;resize:vertical;line-height:1.6}
input[type=checkbox]{width:16px;height:16px;min-height:0;accent-color:var(--navy);margin:0}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid #4378be;outline-offset:2px}
a{color:var(--blue)}
[hidden]{display:none!important}
h1,h2,h3,p{margin:0}
h1{font-size:1.08rem;letter-spacing:-.04em}
h2{font-size:1.1rem}
h3{font-size:.9375rem}
svg{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
mark{background:#ffe497;color:inherit;padding:0}
small,.subtle{font-size:.8125rem;color:var(--muted)}
.nums{font-variant-numeric:tabular-nums;white-space:nowrap;overflow-wrap:normal;word-break:normal}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
.skip{position:fixed;top:-70px;left:10px;z-index:100;background:white;padding:8px}
.skip:focus{top:8px}
.primary{background:var(--navy);border-color:var(--navy);color:white}
.primary:hover:not(:disabled){background:#254c71;border-color:#254c71}
.quiet{background:transparent;border-color:transparent}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;padding:4px}
.text-btn{border:0;background:none;padding:0;min-height:0;color:var(--blue);text-align:left}
.text-btn:hover:not(:disabled){background:none;text-decoration:underline}
.inline{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.spacer{flex:1}
.topbar{background:#fff;border-top:3px solid var(--navy);border-bottom:1px solid var(--line);padding:5px 18px;display:flex;align-items:center;gap:20px;min-height:48px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;white-space:nowrap;flex-shrink:0}
.brand-symbol{height:24px;width:24px;display:grid;place-items:center;color:var(--navy);border:1.5px solid var(--navy);border-radius:3px}
.top-actions{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap;max-width:100%}
.topdate{font-size:.8125rem;color:var(--muted);white-space:nowrap}
.nav{display:flex;align-items:stretch;gap:4px;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:thin}
.nav button{border:0;border-radius:0;min-height:39px;padding:6px 13px;white-space:nowrap;border-bottom:3px solid transparent;background:transparent;color:var(--muted)}
.nav button[aria-current=page]{color:var(--navy);border-bottom-color:var(--navy);font-weight:750}
.workspace{max-width:1800px;margin:auto;padding:10px 18px 18px}
.notice-strip{margin-bottom:8px;border:1px solid #c4d1e0;background:#fff;padding:5px 10px}
.notice-strip summary{cursor:pointer;color:var(--navy);font-size:.875rem;overflow-wrap:anywhere}
.notice-body{border-top:1px solid var(--line);margin-top:5px;padding-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
.notice-body+.notice-body{margin-top:8px}
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.period-group{display:flex;align-items:center;gap:4px;flex-wrap:wrap;min-width:0;max-width:100%}
.period-nav{display:flex;align-items:center;gap:4px;min-width:0;max-width:100%}
.period-nav input{font-weight:650;font-variant-numeric:tabular-nums;width:11rem;min-width:0;max-width:calc(100% - 72px)}
.period-nav .year-input{width:6rem}
#viewControls{min-width:0;max-width:100%}
#viewControls>h2,#viewControls>.subtle{white-space:nowrap;flex-shrink:0}
.view-toggle{display:flex;gap:0;flex-shrink:0}
.view-toggle button{border-radius:0;border-right-width:0;padding:3px 9px;font-size:.875rem}
.view-toggle button:first-child{border-radius:5px 0 0 5px}
.view-toggle button:last-child{border-radius:0 5px 5px 0;border-right-width:1px}
.view-toggle button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.searchbox{display:flex;align-items:center;border:1px solid #bdc9d7;background:#fff;border-radius:5px;margin-left:auto;width:265px;max-width:100%;gap:6px;padding:0 6px}
.searchbox svg{color:var(--muted);width:16px;flex-shrink:0}
.searchbox input{border:0;outline-offset:0;min-width:0;flex:1;width:100%;padding-left:0;background:transparent;font-size:.875rem}
.searchbox button{border:0;width:24px;min-height:26px;padding:0;background:transparent;color:var(--muted)}
.filters{display:flex;align-items:center;gap:7px 16px;flex-wrap:wrap;margin:0 0 7px;font-size:.875rem}
.filters label{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.filters select{font-size:.875rem;min-height:29px;padding:1px 6px}
.resultline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-height:26px;font-size:.8125rem;color:var(--muted);margin-bottom:4px}
.resultline strong{font-weight:650;color:var(--ink)}
.search-note{color:#765619}
.status-warning{color:#98501c}
.feedback{padding:8px 10px;border:1px solid #e4caac;background:#fff8ed;margin:0 0 8px;font-size:.875rem;overflow-wrap:anywhere}
.feedback button{font-size:.8125rem;min-height:26px;padding:1px 7px;margin-left:5px}
.table-wrap{background:#fff;border:1px solid var(--line);border-radius:5px;overflow:auto}
.data-table{border-collapse:collapse;width:100%;table-layout:fixed;font-variant-numeric:tabular-nums}
.data-table th{background:#edf2f8;font-size:.875rem;text-align:left;font-weight:650;color:#3b5068;padding:6px 9px;border-bottom:1px solid #c6d1df;position:sticky;top:0;z-index:1;white-space:nowrap;overflow-wrap:normal}
.data-table td{padding:3px 9px;border-bottom:1px solid #e1e6ed;vertical-align:top;overflow-wrap:anywhere}
.data-table tr:last-child td{border-bottom:0}
.data-table tbody tr:hover{background:#f8fafd}
.data-table .date-col{width:6rem}
.data-table .day-col{width:3rem}
.data-table .prayer-col{width:9rem}
.data-table .study-col{width:7rem}
.data-table td:first-child,.data-table td:nth-child(2){white-space:nowrap;overflow-wrap:normal}
.plan-table{min-width:36rem}
.data-table .day-button{min-height:22px}
.day-button{display:inline-flex;align-items:center;justify-content:center;font-weight:650;padding:0 4px;min-height:25px;min-width:30px;background:transparent;border:1px solid transparent;border-radius:4px;font-variant-numeric:tabular-nums;color:inherit;white-space:nowrap;overflow-wrap:normal}
.day-button:hover:not(:disabled){background:#e3edf9}
.saturday{color:var(--blue)}
.sunday{color:var(--red)}
.today .day-button,.day-button.today{background:var(--navy);color:#fff;border-color:var(--navy)}
.today td:first-child{box-shadow:inset 3px 0 var(--navy)}
.day-muted{background:#fafbfd}
.day-muted td{color:#9aa7b6}
.day-muted td:first-child,.day-muted td:nth-child(2){color:inherit}
.event{display:flex;gap:6px;align-items:baseline;line-height:1.5;min-width:0}
.event+.event{margin-top:3px}
.tag{font-size:.8125rem;font-weight:550;border:1px solid rgba(25,40,60,.1);background:var(--tag,#e9ecef);border-radius:3px;color:#172434;white-space:nowrap;padding:0 5px;line-height:1.55;flex-shrink:0;min-height:0;vertical-align:baseline}
.tag:hover:not(:disabled){background:var(--tag,#e9ecef);filter:brightness(.96);border-color:#8797a9}
.event-text{color:inherit;font-weight:400;min-height:0;min-width:0;flex-shrink:1;border:0;background:transparent;text-align:left;padding:0;line-height:inherit;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}
.event-text:hover:not(:disabled){background:transparent;color:var(--blue);text-decoration:underline}
.events-inline .event{display:inline;line-height:1.8}
.events-inline .event+.event:before{content:" / ";color:#9aa7b6}
.events-inline .tag{margin-right:4px}
.events-inline .event-text{display:inline}
.empty{background:#fff;border:1px solid var(--line);border-radius:5px;padding:25px 14px;text-align:center;color:var(--muted)}
.empty h3{color:var(--ink);margin-bottom:4px}
.empty button{margin-top:10px}
.month-separator td{background:#eaf0f7!important;font-weight:700;font-size:.875rem;padding:5px 9px!important;color:var(--navy)}
.calendar-scroll{max-width:100%;overflow-x:auto}
.calendar{min-width:var(--calendar-min,42rem);background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.calendar-head,.calendar-week{display:grid;grid-template-columns:repeat(var(--days,7),minmax(0,1fr))}
.calendar-head>div{font-size:.8125rem;font-weight:650;background:#edf2f8;padding:4px 8px;border-right:1px solid var(--line)}
.calendar-head>div:last-child{border-right:0}
.calendar-cell{border-top:1px solid var(--line);border-right:1px solid var(--line);padding:3px 6px 6px;min-height:102px;min-width:0}
.calendar-cell:last-child{border-right:0}
.calendar-cell.blank{background:#f7f9fc}
.calendar-cell.today{background:#f5f9ff}
.cell-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:3px}
.cell-count{font-size:.75rem;color:#66778b;white-space:nowrap;flex-shrink:0}
.calendar-cell .event{display:block;border-left:3px solid var(--tag);padding:2px 4px;background:color-mix(in srgb,var(--tag) 22%,white);font-size:.875rem}
.calendar-cell .tag{display:inline-block;border:0;padding:0 3px;font-size:.75rem;margin-right:3px;white-space:nowrap}
.calendar-cell .event-text{display:inline}
.calendar-cell .event+.event{margin-top:4px}
.month-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:10px}
.mini-month{background:#fff;border:1px solid var(--line);border-radius:5px;overflow:hidden}
.mini-title{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;border-bottom:1px solid var(--line);background:#f3f6fa}
.mini-title button{font-size:.9375rem;font-weight:700;padding:0 3px;min-height:27px;border:0;background:transparent}
.mini-days{display:grid;grid-template-columns:repeat(var(--days,7),minmax(0,1fr));padding:3px}
.mini-days .weekday{font-size:.75rem;text-align:center;color:var(--muted);padding:2px}
.mini-days .weekday.saturday{color:var(--blue)}
.mini-days .weekday.sunday{color:var(--red)}
.mini-day{min-height:35px;border:0;background:transparent;border-radius:3px;padding:1px;font-size:.8125rem;display:flex;align-items:center;justify-content:center;gap:3px;font-variant-numeric:tabular-nums}
.mini-day .amount{font-size:.65rem;color:var(--navy);background:#e2ebf7;line-height:1.4;min-width:14px;border-radius:2px;font-weight:650}
.mini-day.has-event{font-weight:650}
.mini-day.today{outline:1.5px solid var(--navy);outline-offset:-2px}
.department-heading{border-left:5px solid var(--tag);padding-left:8px}
.totals{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap;border:1px solid var(--line);border-bottom:0;background:#fff;padding:7px 10px;border-radius:5px 5px 0 0;font-size:.875rem}
.totals+.table-wrap{border-radius:0 0 5px 5px}
.total-pair{display:flex;gap:5px;align-items:center;white-space:nowrap;max-width:100%;min-width:0}
.total-pair>b,.total-pair>.subtle{flex-shrink:0}
.tag-variable{white-space:normal;word-break:keep-all;overflow-wrap:anywhere;max-width:100%;flex-shrink:1}
.total-pair b{font-variant-numeric:tabular-nums}
.grand-total{margin-left:auto;font-weight:650;white-space:nowrap}
.activity-table{min-width:54rem}
.activity-table .a-date{width:9.25rem}
.activity-table .a-area{width:6.25rem}
.activity-table .a-period{width:6.25rem}
.activity-table .a-hours{width:4rem}
.activity-table .a-cumulative{width:var(--cumulative-width,4rem)}
.activity-table .a-note{width:20%}
.activity-table td:nth-child(2){white-space:normal}
.activity-table td:nth-child(4),.activity-table td:nth-child(5){text-align:right;white-space:nowrap;overflow-wrap:normal}
.invalid-value{color:#a44a28;font-size:.8125rem}
.support-values{font-size:.8125rem;color:var(--muted);white-space:pre-wrap}
.source-area{margin-top:9px;font-size:.8125rem;color:var(--muted)}
.source-area summary{cursor:pointer;display:list-item}
.source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:6px;background:#fff;border:1px solid var(--line);border-radius:4px}
.source-item{padding:7px 9px;border-bottom:1px solid var(--line);display:flex;gap:5px;flex-direction:column;min-width:0}
.source-item strong{color:var(--ink);font-size:.875rem}
.source-item p{overflow-wrap:anywhere}
.source-item a{margin-left:auto}
.source-item:last-child,.source-item:nth-last-child(2),.source-item:nth-last-child(3){border-bottom:0}
.source-issues{margin-top:4px;white-space:pre-wrap;color:#8e4c27}
.source-foot{margin-top:6px;display:flex;gap:12px;flex-wrap:wrap}
.modal{padding:0;border:1px solid #bdc9d7;border-radius:8px;box-shadow:0 18px 80px #10243b40;width:min(660px,calc(100vw - 24px));max-height:calc(100dvh - 32px);color:var(--ink)}
.modal::backdrop{background:#13243b66}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:#f7f9fc;position:sticky;top:0;z-index:3}
.modal-head h2{font-size:1.05rem;min-width:0;word-break:keep-all}
#detailTitle{white-space:nowrap}
.modal-body{padding:12px 14px}
.modal-footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:7px;padding:9px 14px;border-top:1px solid var(--line);background:#fff;position:sticky;bottom:0}
.detail-section+.detail-section{margin-top:13px}
.detail-section h3{font-size:.875rem;color:var(--muted);margin-bottom:5px}
.detail-section ul{list-style:none;margin:0;padding:0}
.detail-section li+li{margin-top:5px}
.detail-section .event-text{cursor:default}
.detail-grid{display:grid;grid-template-columns:88px 1fr;gap:4px 8px;font-size:.9375rem}
.detail-grid dt{color:var(--muted)}
.detail-grid dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.detail-empty{font-size:.875rem;color:var(--muted)}
.detail-context{border-top:1px solid var(--line);padding-top:10px;margin-top:12px}
.form-row{display:flex;gap:10px;margin-bottom:10px}
.form-field{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.form-field label{font-size:.875rem;font-weight:600}
.form-field input{width:100%;min-width:0}
.form-meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;font-size:.8125rem;color:var(--muted);margin-top:4px}
.request-status{font-size:.875rem;white-space:pre-wrap;overflow-wrap:anywhere;margin-top:10px}
.request-status:not(:empty){padding:8px 10px;background:#fff7e8;border:1px solid #ebd3a7;border-radius:4px}
.context-add{margin-bottom:10px;background:#edf3fa;border:1px solid #cdd9e7;padding:8px;font-size:.875rem}
.context-add pre{font:inherit;max-height:120px;overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;margin:0 0 6px}
.copy-fallback{width:100%;min-height:130px;font-size:.875rem}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);padding:8px 14px;background:#173857;color:#fff;border-radius:5px;z-index:1000;font-size:.875rem;max-width:calc(100vw - 24px);box-shadow:0 3px 16px #142b4133;pointer-events:none}
.print-modal{width:min(840px,calc(100vw - 20px))}
.print-tools{padding:9px 14px;border-bottom:1px solid var(--line);font-size:.875rem;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.print-preview{background:#dce2e9;padding:12px;overflow:hidden}
.paper-preview-wrapper{position:relative;margin:auto}
.paper{width:190mm;background:white;color:#182536;font-family:"Noto Sans KR","Malgun Gothic",sans-serif;font-size:11pt;line-height:1.25;position:absolute;top:0;left:0;transform-origin:top left;padding:0;box-sizing:border-box}
.paper-title{text-align:center;font-size:1.5em;font-weight:750;letter-spacing:-.03em;margin:0 0 2.5mm}
.paper-meta{display:flex;justify-content:space-between;gap:8px;font-size:.8em;margin:0 0 1.5mm}
.paper table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:inherit;line-height:inherit}
.paper th,.paper td{border:.25mm solid #aeb8c4;padding:var(--pad,2px) 4px;vertical-align:top;overflow-wrap:anywhere;word-break:normal}
.paper th{background:#e9eef4;text-align:center;font-weight:650;white-space:nowrap;overflow-wrap:normal}
.paper .p-date{width:8mm;text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap;overflow-wrap:normal}
.paper .p-day{width:11mm;text-align:center;white-space:nowrap;overflow-wrap:normal}
.paper .p-prayer{width:24mm}
.paper .p-study{width:23mm}
.paper .p-empty{color:#a7b0bb}
.paper .p-item{line-height:inherit}
.paper .p-item+.p-item{margin-top:1px}
.paper .p-inline .p-item{display:inline}
.paper .p-inline .p-item+.p-item:before{content:" / ";color:#6d7886}
.paper .p-tag{display:inline-block;background:var(--tag);border-radius:1px;padding:0 2px;font-size:.88em;color:#172434;white-space:nowrap}
.paper .p-note{font-size:.72em;margin-top:1.5mm;white-space:pre-wrap;overflow-wrap:anywhere}
.paper .p-warning{color:#8c431e}
.paper tr{break-inside:avoid}
.paper .p-prayer-value,.paper .p-study-value{white-space:pre-wrap}
.paper mark{background:#fff1b8}
.print-stage{position:fixed;left:-300vw;top:0;width:190mm;height:276mm;pointer-events:none;visibility:hidden;z-index:-100}
.print-fineprint{font-size:.8125rem;color:var(--muted)}

@media(max-width:1100px){.toolbar{gap:6px}
.topdate{display:none}
.calendar-cell{padding:3px 4px 5px}
.data-table .prayer-col{width:7.25rem}
.data-table .study-col{width:6rem}
}

@media(max-width:760px){.topbar{padding:5px 10px;gap:8px}
.top-actions button{font-size:.8125rem;padding:4px 8px}
.brand-symbol{display:none}
.nav{padding:0 6px;gap:0}
.nav button{padding:6px 10px;font-size:.875rem;min-height:42px}
.workspace{padding:8px 9px 14px}
.toolbar{gap:6px}
.toolbar .searchbox{order:5;width:100%;flex-basis:100%;margin-left:0}
.toolbar>.spacer{display:none}
.toolbar h2{font-size:1rem}
.filters{gap:8px 12px;font-size:.875rem}
.filters label{min-height:30px}
.filters select{min-height:34px}
.resultline{gap:4px 8px}
.calendar-head>div{padding:4px 2px;text-align:center}
.calendar-cell{min-height:92px;padding:2px;overflow-wrap:anywhere}
.calendar-cell .day-button{min-width:25px;min-height:30px}
.calendar-cell .event{padding:1px 2px;border-left-width:2px;font-size:.8125rem}
.calendar-cell .tag{font-size:.75rem;margin-right:3px}
.calendar-cell .event-text{font-size:.8125rem}
.cell-count{display:none}
.month-grid{gap:7px}
.mini-day{min-height:35px}
.data-table .date-col{width:4.5rem}
.data-table th,.data-table td{padding:5px}
.data-table .prayer-col{width:7rem}
.data-table .study-col{width:6rem}
.activity-table .a-note{width:9rem}
.event{gap:4px}
.tag{font-size:.75rem}
.data-table{font-size:.9375rem}
.source-grid{grid-template-columns:1fr 1fr}
.source-item:nth-last-child(3){border-bottom:1px solid var(--line)}
.form-row{gap:8px}
.modal-body{padding:10px 12px}
.modal-head,.modal-footer{padding:9px 12px}
.modal button{min-height:36px}
.grand-total{margin-left:0}
.totals{gap:6px 12px}
.print-preview{padding:8px}
.print-tools{padding:8px 10px}
.print-modal{max-height:calc(100dvh - 16px)}
.paper .p-tag{font-size:.88em}
}

@media(max-width:420px){.view-toggle button{padding:3px 7px}
.mini-days{padding:1px}
.mini-day{gap:0;font-size:.75rem}

 const fit=fitPrintSheet();if(!fit||fit.height<=0)throw new Error('인쇄 크기를 계산할 수 없습니다.');activePrint.fit=fit;openModal('printDialog');renderPrintPreview(fit);$('printSummary').textContent=`A4 세로 1쪽 · ${doc.dateCount}일 · 일정 ${doc.rowCount}건${state.q?' · 검색 적용':''}`;const warnings=[...doc.notes];if(fit.effectiveFont<8)warnings.push(`내용이 많아 약 ${fit.effectiveFont.toFixed(1)}pt로 축소했습니다. 미리보기의 글자 크기를 확인해 주세요.`);$('printWarnings').hidden=!warnings.length;$('printWarnings').textContent=warnings.join(' ');
 }catch(e){preparingPrint=false;activePrint=null;$('printStage').replaceChildren();toast('인쇄 준비에 실패했습니다. 다시 시도해 주세요.');renderStatus();updatePrintAvailability();}
}
function finishPrint(){if(!printing)return;printing=false;preparingPrint=false;closeModal('printDialog');activePrint=null;renderMain();renderNotices();renderStatus();updatePrintAvailability();}
function nativePrint(){if(!activePrint||printing)return;printing=true;renderStatus();try{window.print();}catch{printing=false;toast('브라우저 인쇄를 열지 못했습니다.');renderStatus();}}
function draftReset(){if(sending)return;if(!draftDiscardArmed&&(draft.content||draft.name)){draftDiscardArmed=true;$('resetDraft').textContent='초안 삭제 확인';$('requestStatus').textContent='초안을 비우려면 “초안 삭제 확인”을 한 번 더 누르세요.';return;}draft={name:'',type:'일정수정',content:'',delivery:'',lastAttempt:null};$('requestName').value='';$('requestType').value='일정수정';$('requestContent').value='';$('requestStatus').textContent='';saveDraft();}
function onSearch(){if(composition)return;clearTimeout(queryTimer);queryTimer=setTimeout(()=>{state.q=$('search').value.trim();$('clearSearch').hidden=!state.q;renderMain();},130);}
function clearSearch(){clearTimeout(queryTimer);state.q='';$('search').value='';$('clearSearch').hidden=true;renderMain();$('search').focus();}
function dayCheck(){const next=localToday();if(next!==today){today=next;rebuild();if(!printing&&!preparingPrint){renderNotices();renderMain();renderStatus();if($('detailDialog').open)renderDetail();}}}
document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-close')){closeModal(b.dataset.close);return;}
 if(b.hasAttribute('data-view')){switchView(b.dataset.view);return;}
 if(b.hasAttribute('data-refresh')){refreshData();return;}
 if(b.hasAttribute('data-date')){openDetail(b.dataset.date,b.dataset.event||null);return;}
 if(b.hasAttribute('data-department')){if(!has(DEPARTMENTS,b.dataset.department))return;state.department=b.dataset.department;closeModal('detailDialog');switchView('department');return;}
 if(b.hasAttribute('data-area')){state.area=state.area===b.dataset.area?'':b.dataset.area;state.q='';renderControls();renderMain();persistState();return;}
 if(b.hasAttribute('data-grade')){state.grade=+b.dataset.grade;state.area='';state.q='';renderControls();renderMain();persistState();return;}
 if(b.hasAttribute('data-mode')){state.academicMode=b.dataset.mode;renderControls();renderMain();persistState();return;}
 if(b.hasAttribute('data-month')){state.academicMode='list';changeMonth(b.dataset.month);return;}
 switch(b.id){case'prevPeriod':movePeriod(-1);break;case'nextPeriod':movePeriod(1);break;case'thisMonth':changeMonth(today.slice(0,7));break;case'openPrint':preparePrint();break;case'appendContext':if(!sending){const next=$('requestContent').value+'\n\n'+pendingContext;if(next.length>10000){$('requestStatus').textContent='관련 일정을 추가하면 10,000자를 초과합니다. 기존 내용을 줄인 뒤 추가해 주세요.';break;}$('requestContent').value=next;pendingContext='';renderRequestContext();saveDraft();}break;case'dismissContext':pendingContext='';renderRequestContext();break;}
});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='periodInput'){if(state.view==='academic'&&state.academicMode==='year'){const y=Number(el.value);if(Number.isInteger(y)&&y>=1900&&y<=9998)changeMonth(`${y}-${state.month.slice(5)}`);else renderControls();}else changeMonth(el.value);}else if(el.id==='departmentSelect'){state.department=el.value;state.q='';renderControls();renderMain();persistState();}else if(el.id==='areaSelect'){state.area=el.value;renderMain();persistState();}else if(el.dataset.option&&state.options[state.view]){const name=el.dataset.option;state.options[state.view][name]=el.type==='checkbox'?el.checked:el.value;renderMain();persistState();}});
$('refreshBtn').addEventListener('click',refreshData);$('requestBtn').addEventListener('click',()=>showRequest());$('clearSearch').addEventListener('click',clearSearch);$('search').addEventListener('input',onSearch);$('search').addEventListener('compositionstart',()=>{composition=true;clearTimeout(queryTimer);});$('search').addEventListener('compositionend',()=>{composition=false;onSearch();});
$('copyDetail').addEventListener('click',()=>copyText(detailText()));$('detailRequest').addEventListener('click',()=>{const context=contextForDate();closeModal('detailDialog');showRequest(context);});
for(const id of ['requestName','requestType','requestContent'])$(id).addEventListener('input',saveDraft);$('requestForm').addEventListener('submit',submitRequest);$('resetDraft').addEventListener('click',draftReset);$('copyRequest').addEventListener('click',()=>{saveDraft();copyText(`${draft.name}\n${draft.type}\n\n${draft.content}`);});$('doPrint').addEventListener('click',nativePrint);
for(const d of document.querySelectorAll('dialog')){d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeModal(d.id);}});d.addEventListener('close',()=>{if(d.id==='requestDialog')saveDraft();if(d.id==='printDialog'&&!printing){preparingPrint=false;activePrint=null;renderMain();renderNotices();renderStatus();updatePrintAvailability();}if(returnFocus?.isConnected&&!document.querySelector('dialog[open]'))returnFocus.focus();});}
window.addEventListener('beforeprint',()=>{if(activePrint)return;const kind=state.view==='student'?'student':'plan',reason=printBlockReason(kind);if(reason){$('printStage').innerHTML=`<div class="paper"><p>${esc(reason)}</p></div>`;return;}printing=true;const doc=printMarkup(kind);$('printStage').innerHTML=doc.html;activePrint=doc;activePrint.fit=fitPrintSheet();});window.addEventListener('afterprint',finishPrint);const printMedia=window.matchMedia('print');if(printMedia.addEventListener)printMedia.addEventListener('change',e=>{if(!e.matches)finishPrint();});
window.addEventListener('focus',()=>{if(printing&&!printMedia.matches)setTimeout(()=>{if(printing&&!printMedia.matches)finishPrint();},700);});
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if($('printDialog').open&&activePrint?.fit&&!printing)renderPrintPreview(activePrint.fit);},100);});
document.addEventListener('keydown',e=>{if(e.isComposing||composition)return;const editing=e.target.closest('input,textarea,select,[contenteditable="true"]');if(editing)return;if(document.querySelector('dialog[open]'))return;if(e.key==='/'&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();$('search').focus();}else if(e.altKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){if(['academic','plan','student'].includes(state.view)){e.preventDefault();movePeriod(e.key==='ArrowLeft'?-1:1);}}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='p'){e.preventDefault();preparePrint();}});
window.addEventListener('pagehide',()=>{persistState();if($('requestDialog').open)saveDraft();});document.addEventListener('visibilitychange',()=>{if(!document.hidden){dayCheck();if(Date.now()-lastRefresh>=300000)refreshData();}});
setInterval(()=>{dayCheck();if(!document.hidden&&Date.now()-lastRefresh>=300000)refreshData();},30000);
rebuild();renderControls();renderMain();renderNotices();renderStatus();refreshData();
</script>
