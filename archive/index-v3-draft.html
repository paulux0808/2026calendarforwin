function saveDraft(){if(!$("#requestForm"))return;draft={name:$("#author").value,type:$("#requestType").value,content:$("#requestText").value};draftPersisted=persist(DRAFT_KEY,draft);$("#textCount").textContent=`${draft.content.length}자`;$("#draftHint").textContent=draftPersisted?"작성 내용 자동 저장":"이 탭에서 작성 내용 보관 중";}
function syncRequest(){if(!$("#requestForm"))return;all("input,textarea,select,button",$("#requestForm")).forEach(e=>e.disabled=sending);$("#requestForm button[type=submit]").textContent=sending?"전송 중…":"요청 제출";$("#requestStatus").textContent=requestMessage;}
async function submitRequest(event){event.preventDefault();if(sending)return;saveDraft();const payload={name:draft.name.trim(),type:draft.type,content:draft.content.trim()};if(!payload.name||!payload.content){toast("성함과 요청 내용을 입력해 주세요.");return;}sending=true;requestMessage="";syncRequest();const abort=new AbortController(),timeout=setTimeout(()=>abort.abort(),20000);try{await fetch(CONFIG.WEB_APP_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:JSON.stringify(payload),signal:abort.signal});requestMessage="전송을 시도했습니다. 접수 여부를 확인할 수 없어 작성 내용을 보관했습니다. 재전송 전 담당자에게 접수 여부를 확인해 주세요.";}catch{requestMessage="전송 결과를 확인하지 못했습니다. 작성 내용은 보관했습니다. 접수 여부를 확인한 뒤 재시도해 주세요.";}finally{clearTimeout(timeout);sending=false;syncRequest();toast(requestMessage);}}
function dayDetail(key){return{schedule:scheduleDays.get(key)||[],student:studentDays.get(key)||[],prayer:model.prayer.get(key),supervisor:model.supervisor.get(key)};}
function fillDay(key,selected=""){const date=readDate(key),rows=dayDetail(key);dialogDate=key;dialogEvent=selected;$("#dialogTitle").textContent=`${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 (${WEEK[date.getDay()]})`;let html="";for(const [label,list] of [["학사일정",rows.schedule],["학생일정",rows.student]]){html+=`<h3>${label}</h3>`+(list.length?list.map(e=>`<div class="detail-entry ${e.id===selected?"selected":""}">${e.dept?`<button class="control" data-department="${esc(e.dept)}">${esc(e.dept)}</button>`:""}<p>${esc(e.text)}</p></div>`).join(""):'<p class="no-event">등록된 일정이 없습니다.</p>');}const details=[["경건회",rows.prayer?.name],["말씀",rows.prayer?.bible],["찬송",rows.prayer?.hymn],["자습감독",rows.supervisor]].filter(([,v])=>v);if(details.length)html+=`<h3>담당 정보</h3><dl class="detail-meta">${details.map(([k,v])=>`<dt>${k}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`;$("#dialogBody").innerHTML=html;$("#copyDay").hidden=false;}
function openDay(key,selected=""){fillDay(key,selected);if(!$("#detailDialog").open)$("#detailDialog").showModal();}
function showNotices(){dialogDate="";$("#dialogTitle").textContent="공지사항";$("#dialogBody").innerHTML=activeNotices().map(n=>`<p class="notice-text">${esc(n.text)}</p>`).join("");$("#copyDay").hidden=true;if(!$("#detailDialog").open)$("#detailDialog").showModal();}
async function copyDay(){if(!dialogDate)return;const d=dayDetail(dialogDate),lines=[$("#dialogTitle").textContent,...d.schedule.map(e=>`[${e.dept}] ${e.text}`),...d.student.map(e=>`[학생] ${e.text}`)];if(d.prayer)lines.push(`경건회 ${d.prayer.name} / 말씀 ${d.prayer.bible} / 찬송 ${d.prayer.hymn}`);if(d.supervisor)lines.push(`자습감독 ${d.supervisor}`);try{await navigator.clipboard.writeText(lines.join("\n"));toast("복사했습니다.");}catch{toast("복사할 수 없습니다. 내용을 선택해서 복사해 주세요.");}}

const PRINT={width:196,height:281,maxFont:11,minFont:7};
const millimeters=mm=>mm*96/25.4;
function paperHTML(view){
 const isPlan=view==="plan",options=state[view],rows=monthRows(view),date=readDate(state.month+"-01");
 const title=`${academicYear(date)}학년도 ${date.getMonth()+1}월 ${isPlan?"학사운영 계획":"학생일정"}`;
 return `<div class="paper-content ${options.horizontal?"paper-horizontal":""}"><h1>${esc(title)}</h1><table class="paper-table"><colgroup><col style="width:7mm"><col style="width:7mm"><col>${isPlan&&options.showPrayer?'<col style="width:19mm">':""}${isPlan&&options.showSupervisor?'<col style="width:19mm">':""}</colgroup><thead><tr><th class="paper-date">날짜</th><th class="paper-dow">요일</th><th>${isPlan?"주요 행사":"학생일정"}</th>${isPlan&&options.showPrayer?'<th class="paper-duty">경건회</th>':""}${isPlan&&options.showSupervisor?'<th class="paper-duty">자습감독</th>':""}</tr></thead><tbody>${rows.map(row=>`<tr class="${[0,6].includes(row.date.getDay())?"paper-weekend":""}"><td class="paper-date">${row.date.getDate()}</td><td class="paper-dow">${WEEK[row.date.getDay()]}</td><td>${row.events.map(e=>`<div class="paper-event">${isPlan&&options.showDept?`<span class="paper-dept">[${esc(e.dept)}]</span>`:""}${esc(e.text)}</div>`).join("")||'<span class="paper-empty">—</span>'}</td>${isPlan&&options.showPrayer?`<td class="paper-duty">${esc(row.prayer)}</td>`:""}${isPlan&&options.showSupervisor?`<td class="paper-duty">${esc(row.supervisor)}</td>`:""}</tr>`).join("")}</tbody></table></div>`;
}
function fitScale(width,height,availableWidth,availableHeight){
 if(![width,height,availableWidth,availableHeight].every(n=>Number.isFinite(n)&&n>0))throw new Error("인쇄 크기를 계산할 수 없습니다.");
 return Math.min(1,availableWidth/width,availableHeight/height);
}
function largestFittingFont(measure,availableHeight,min=7,max=11){
 if(measure(max)<=availableHeight)return max;
 let low=min,high=max;
 for(let i=0;i<12;i++){const mid=(low+high)/2;if(measure(mid)<=availableHeight)low=mid;else high=mid;}
 return Math.floor(low*100)/100;
}
function createPrintPage(){
 if(printActive||!["plan","student"].includes(state.view))return;
 const root=document.createElement("section");root.id="printPage";root.className="print-page";root.setAttribute("aria-hidden","true");root.innerHTML=paperHTML(state.view);document.body.appendChild(root);
 try{
  const content=root.querySelector(".paper-content");
  const width=millimeters(PRINT.width),height=millimeters(PRINT.height)-2;
  const measure=font=>{content.style.setProperty("--paper-font",`${font}pt`);return content.getBoundingClientRect().height;};
  // Measure the actual print tree with the same CSS in screen and print media.
  let font=largestFittingFont(measure,height,PRINT.minFont,PRINT.maxFont);
  measure(font);
  if(content.getBoundingClientRect().height>height){content.style.setProperty("--paper-pad","0.5px");font=largestFittingFont(measure,height,PRINT.minFont,PRINT.maxFont);measure(font);}
  const dimensions=()=>{const rect=content.getBoundingClientRect();return{width:content.scrollWidth>rect.width+1?content.scrollWidth:rect.width,height:rect.height};};
  let natural=dimensions();let scale=fitScale(natural.width,natural.height,width,height);
  // Long dates get natural height; short dates share the remaining page space.
  if(scale===1){const count=content.querySelectorAll("tbody tr").length;let low=0,high=height/Math.max(count,1);for(let i=0;i<12;i++){const mid=(low+high)/2;content.style.setProperty("--paper-row",`${mid}px`);if(content.getBoundingClientRect().height<=height)low=mid;else high=mid;}content.style.setProperty("--paper-row",`${Math.floor(low*100)/100}px`);natural=dimensions();scale=fitScale(natural.width,natural.height,width,height);}
  // Uniform scaling is the final fallback. No event text is clipped or omitted.
  if(scale<1)scale*=.999;
  content.style.transform=`scale(${scale})`;
  content.style.left=`${Math.max(0,(width-natural.width*scale)/2)}px`;
  root.dataset.scale=String(scale);root.dataset.font=String(font);
  printActive=true;document.body.classList.add("print-single");
 }catch(error){root.remove();throw error;}
}
function clearPrintPage(){
 $("#printPage")?.remove();document.body.classList.remove("print-single");printActive=false;
}
async function printMonth(){
 if(printBusy||printActive||!["plan","student"].includes(state.view))return;
 printBusy=true;
 try{
  const requestedView=state.view;
  if(loadJob)await loadJob;
  if(state.view!==requestedView)return;
  if(!sheetReady.has(state.view==="plan"?"schedule":"student")){toast("인쇄할 데이터를 먼저 불러와 주세요.");return;}
  if(document.fonts?.ready)await document.fonts.ready;
  createPrintPage();window.print();
 }catch(error){clearPrintPage();toast("인쇄 양식을 만들지 못했습니다. 다시 시도해 주세요.");}
 finally{printBusy=false;}
}
window.addEventListener("beforeprint",()=>{if(!printActive&&["plan","student"].includes(state.view)){try{createPrintPage();}catch{clearPrintPage();toast("인쇄 크기를 계산하지 못했습니다.");}}});
window.addEventListener("afterprint",clearPrintPage);

document.addEventListener("click",event=>{
 const target=event.target.closest("button");if(!target)return;
 if(target.dataset.view){switchView(target.dataset.view);return;}
 if(target.dataset.event){const row=events.get(target.dataset.event);if(row)openDay(row.key,row.id);return;}
 if(target.dataset.day){openDay(target.dataset.day);return;}
 if(target.dataset.department){$("#detailDialog").close();state.dept=target.dataset.department;switchView("dept");return;}
 if(target.dataset.grade){state.grade=+target.dataset.grade;state.category="전체";render(true);all("[data-grade]").find(b=>+b.dataset.grade===state.grade)?.focus({preventScroll:true});return;}
 if(target.dataset.category){state.category=target.dataset.category;render(true);all("[data-category]").find(b=>b.dataset.category===state.category)?.focus({preventScroll:true});return;}
 const action=target.dataset.action;if(action==="previous")changeMonth(-1);if(action==="next")changeMonth(1);if(action==="today"){state.month=todayKey().slice(0,7);render(true);}if(action==="print")printMonth();if(action==="reload")refresh();if(action==="dismiss-error")$("#loadAlert").hidden=true;if(action==="close-dialog")$("#detailDialog").close();
});
document.addEventListener("change",event=>{const el=event.target;if(el.dataset.setting){const [group,key]=el.dataset.setting.split(".");if(state[group]&&typeof state[group][key]==="boolean"){state[group][key]=el.checked;settingsOpen=true;render(true);}}if(el.id==="monthInput"){const value=el.type==="number"?`${el.value}-01`:el.value;if(/^\d{4}-\d{2}$/.test(value)&&readDate(value+"-01")){state.month=value;render(true);}else el.value=el.type==="number"?state.month.slice(0,4):state.month;}if(el.id==="department"){state.dept=el.value;render(true);}if(el.closest("#requestForm"))saveDraft();});
document.addEventListener("toggle",event=>{if(event.target.isConnected&&event.target.matches(".settings"))settingsOpen=event.target.open;},true);
document.addEventListener("input",event=>{if(event.target.closest("#requestForm"))saveDraft();});
document.addEventListener("submit",event=>{if(event.target.id==="requestForm")submitRequest(event);});
let searchTimer;
function searchChanged(){clearTimeout(searchTimer);state.query=$("#search").value;render(true);}
$("#search").addEventListener("input",event=>{clearTimeout(searchTimer);if(!event.isComposing)searchTimer=setTimeout(searchChanged,120);});$("#search").addEventListener("compositionend",searchChanged);
$("#reloadButton").addEventListener("click",refresh);$("#noticeButton").addEventListener("click",showNotices);$("#copyDay").addEventListener("click",copyDay);
$("#detailDialog").addEventListener("click",event=>{if(event.target!==event.currentTarget)return;const r=event.currentTarget.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)event.currentTarget.close();});
$("#detailDialog").addEventListener("close",()=>{dialogDate="";dialogEvent="";});
document.addEventListener("keydown",event=>{if($("#detailDialog").open)return;const typing=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName)||document.activeElement?.isContentEditable;if(event.key==="/"&&!typing&&state.view!=="request"){event.preventDefault();$("#search").focus();}if(event.altKey&&!typing&&["calendar","plan","student"].includes(state.view)&&["ArrowLeft","ArrowRight"].includes(event.key)){event.preventDefault();changeMonth(event.key==="ArrowLeft"?-1:1);}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){updateNotices();if(Date.now()-lastRefresh>300000&&!sending)refresh();}});setInterval(()=>{if(!document.hidden&&!sending)refresh();},300000);
restore();loading=true;render();refresh();

</script></body></html>
