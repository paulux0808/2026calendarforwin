<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>학사일정</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("hs-prefs-v2") || "{}");
    var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") &&
      matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if([0.92,1,1.1,1.22].indexOf(p.fs) >= 0) document.documentElement.style.setProperty("--fs", p.fs);
  }catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>
<link rel="stylesheet" href="styles/base.css">
<link rel="stylesheet" href="src/views/calendar.css">
<link rel="stylesheet" href="src/views/table.css">
<link rel="stylesheet" href="src/views/dept.css">
<link rel="stylesheet" href="src/views/nuga.css">
<link rel="stylesheet" href="src/views/request.css">
<link rel="stylesheet" href="src/print/print.css">
<style id="printPageStyle">@page{size:A4 portrait;margin:7mm}</style>
</head>
<body>

<header class="top">
  <div class="row row-1">
    <span class="wm">학사일정</span>
    <nav class="tabs" id="tabs" aria-label="화면"></nav>
    <div class="find" id="find">
      <input class="fld" id="q" type="search" autocomplete="off" aria-label="검색" placeholder="검색">
      <span class="n" id="qn"></span>
    </div>
    <button class="btn btn-q" id="setBtn" type="button">설정</button>
  </div>
  <div class="row row-2" id="tools"></div>
  <div class="row row-hits" id="hits" role="group" aria-label="검색 결과 달" hidden></div>
</header>

<div class="strip strip-n" id="notice" hidden>
  <b>공지</b><p id="noticeText"></p>
  <button class="btn btn-s" data-a="notices" type="button" hidden id="noticeMore">모두 보기</button>
</div>
<div class="strip strip-w" id="alert" hidden role="status">
  <p id="alertText"></p>
  <button class="btn btn-s" data-a="reload" type="button">다시 시도</button>
  <button class="btn btn-s btn-q" data-a="alert-x" type="button">닫기</button>
</div>

<main id="main" tabindex="-1"><div id="view"></div>
<details class="src" id="src"><summary id="srcSum">자료 불러오는 중</summary><div id="srcBody"></div></details>
</main>

<dialog id="ddlg" aria-labelledby="dtitle">
  <div class="dh">
    <h2 id="dtitle"></h2>
    <button class="btn btn-n" data-a="d-prev" type="button" aria-label="이전 날">‹</button>
    <button class="btn btn-n" data-a="d-next" type="button" aria-label="다음 날">›</button>
  </div>
  <div class="db" id="dbody"></div>
  <div class="df">
    <button class="btn grow" style="justify-content:flex-start;border:0" data-a="d-ask" type="button">이 날짜로 수정 요청</button>
    <button class="btn" data-a="d-copy" type="button">복사</button>
    <button class="btn btn-key" data-a="close" type="button">닫기</button>
  </div>
</dialog>

<dialog id="pdlg" aria-labelledby="ptitle">
  <div class="dh"><h2 id="ptitle">인쇄</h2></div>
  <div class="db">
    <div class="plan">
      <div class="view" id="pview"></div>
      <div class="pset" id="pset"></div>
    </div>
  </div>
  <div class="df">
    <p class="fit" id="fit"></p>
    <button class="btn" data-a="close" type="button">닫기</button>
    <button class="btn btn-key" data-a="print" type="button">인쇄</button>
  </div>
</dialog>

<dialog id="sdlg" aria-labelledby="stitle">
  <div class="dh"><h2 id="stitle">설정</h2></div>
  <div class="db" id="sbody"></div>
  <div class="df"><button class="btn btn-key" data-a="close" type="button">닫기</button></div>
</dialog>

<dialog id="idlg" aria-labelledby="ititle">
  <div class="dh"><h2 id="ititle"></h2></div>
  <div class="db" id="ibody"></div>
  <div class="df"><button class="btn btn-key" data-a="close" type="button">닫기</button></div>
</dialog>

<div id="proot" aria-hidden="true"><div class="stage" id="stage"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script type="module" src="src/main.js"></script>
<script>
/* 배포 직후에는 브라우저가 옛 파일과 새 파일을 섞어 받을 수 있다. 4초 안에 시작하지 못하면 새로고침을 안내한다. */
addEventListener("load", function(){
  setTimeout(function(){
    if(window.__hsBooted) return;
    var s = document.createElement("div"), b = document.createElement("button");
    s.setAttribute("role", "alert");
    s.style.cssText = "display:flex;align-items:center;gap:10px;padding:10px 12px;background:#FFF7E8;color:#7A5410;border-bottom:1px solid #E0BE79;font:14px/1.4 system-ui,sans-serif";
    s.appendChild(document.createTextNode("화면을 불러오지 못했습니다"));
    b.type = "button"; b.textContent = "새로고침";
    b.style.cssText = "padding:4px 10px;border:1px solid #E0BE79;border-radius:4px;background:#fff;color:inherit;font:inherit;cursor:pointer";
    b.onclick = function(){ location.reload(); };
    s.appendChild(b);
    document.body.insertBefore(s, document.body.firstChild);
  }, 4000);
});
</script>
<noscript><p style="margin:0;padding:10px 12px;background:#FFF7E8;color:#7A5410;font:14px/1.4 system-ui,sans-serif">자바스크립트를 켜야 학사일정을 볼 수 있습니다.</p></noscript>
</body>
</html>
