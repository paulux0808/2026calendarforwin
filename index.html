<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학사관리 시스템</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#eef1f4;--border:#8b929a;--border-soft:#d9dde2;
  --text:#171a1f;--muted:#5f6770;--accent:#228be6;--accent-soft:#e7f5ff;
  --danger:#c92a2a;--warning:#e67700;--today:#fcc419;--shadow:0 12px 30px rgba(0,0,0,.12);
  --font:14px;--cell-h:126px;--gap:6px;--header-h:0px;
}
body.dark{
  --bg:#1c1f24;--surface:#282c32;--surface-2:#343941;--border:#59616b;--border-soft:#444b54;
  --text:#f1f3f5;--muted:#b7bec7;--accent:#74c0fc;--accent-soft:#173b58;
  --today:#ffd43b;--shadow:0 12px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow:hidden}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--font);overflow:hidden;display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.no-print{}
.app-header{
  flex:0 0 auto;background:var(--surface);border-bottom:2px solid var(--border);padding:max(6px,env(safe-area-inset-top)) 10px 6px;
  z-index:100;box-shadow:0 1px 0 rgba(0,0,0,.03)
}
.topbar{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:10px;align-items:center}
.brand{font-weight:950;font-size:18px;white-space:nowrap}
.search-wrap{display:flex;align-items:center;gap:7px;min-width:0}
.search-input{
  width:100%;min-width:0;border:2px solid var(--border);border-radius:9px;padding:8px 11px;
  background:var(--bg);color:var(--text);outline:none
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search-meta,.sync{font-size:11px;font-weight:850;color:var(--muted);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#868e96}
.sync.loading .sync-dot{background:#f59f00}.sync.ok .sync-dot{background:#2f9e44}.sync.warn .sync-dot{background:#e03131}
.header-actions{display:flex;gap:5px;align-items:center}
.icon-btn,.btn{
  border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;font-weight:850;
  min-height:36px;padding:6px 10px
}
.icon-btn{min-width:38px;padding:5px 8px}
.icon-btn:hover,.btn:hover{background:var(--surface-2)}
.nav{
  margin-top:6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:3px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px
}
.nav-btn{
  border:0;border-radius:7px;background:transparent;color:var(--muted);min-height:40px;font-weight:900;padding:6px 7px
}
.nav-btn:hover{background:var(--surface);color:var(--text)}
.nav-btn.active{background:var(--border);color:#fff}
.nav-btn.request{color:var(--danger)}.nav-btn.request.active{background:var(--danger);color:#fff}
.app-main{flex:1 1 auto;min-height:0;overflow:auto;overscroll-behavior:contain;padding:2px 0 8px}
.page{width:calc(100% - 8px);margin:0 auto}
.toolbar{
  position:sticky;top:0;z-index:50;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;
  align-items:center;padding:4px 0;border-bottom:2px solid var(--border)
}
.toolbar-title{display:flex;align-items:center;gap:8px;font-weight:950;font-size:17px}
.toolbar-sub{font-size:11.5px;color:var(--muted);font-weight:750;margin-top:2px}
.month-nav{display:grid;grid-template-columns:auto auto minmax(110px,auto) auto auto;gap:4px;align-items:center}
.month-nav.no-print-btn{grid-template-columns:auto auto minmax(110px,auto) auto}
.month-title{text-align:center;font-size:16px;font-weight:950;white-space:nowrap}
.options{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:5px 0;margin-bottom:3px
}
.options-title{font-size:11.5px;font-weight:900;color:var(--muted)}
.option{
  display:inline-flex;align-items:center;gap:6px;border:2px solid var(--border);border-radius:7px;padding:5px 8px;
  min-height:34px;background:var(--surface);font-weight:850
}
.option input{width:16px;height:16px;accent-color:var(--accent)}
.option.on{border-color:var(--accent);background:var(--accent-soft)}
.inline-info{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--muted);font-weight:800;padding:2px 0}
.legend{display:flex;gap:4px;flex-wrap:wrap}
.chip,.dept-tag{
  display:inline-block;color:#111;border:1px solid rgba(0,0,0,.15);border-radius:4px;padding:1px 5px;font-size:10px;font-weight:950;white-space:nowrap
}
.calendar-wrap,.table-wrap{width:100%;overflow:auto;-webkit-overflow-scrolling:touch}
.calendar{
  min-width:700px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));grid-auto-rows:minmax(var(--cell-h),auto);gap:var(--gap)
}
.cal-head{background:var(--surface-2);border:2px solid var(--border);border-radius:6px;text-align:center;padding:7px;font-weight:950}
.cal-cell{
  background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:6px;min-width:0;outline:none
}
.cal-cell:hover,.cal-cell:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}
.cal-cell.today{border:3px solid var(--today);background:#fff9db;color:#171a1f}
body.dark .cal-cell.today{background:#3b3000;color:#fff}
.cal-cell.other{opacity:.34;background:var(--bg)}
.cal-date{font-weight:950;margin-bottom:5px}
.event-list{display:flex;flex-direction:column;gap:4px}
.event{display:grid;grid-template-columns:auto 1fr;gap:5px;align-items:start;cursor:pointer;font-size:calc(var(--font) - 2px);font-weight:700;line-height:1.35}
.event:hover .event-text{text-decoration:underline}
mark{background:#ffe066;color:#111;padding:0 2px;border-radius:3px}
.table-wrap{border:2px solid var(--border);border-radius:7px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:650px;table-layout:fixed;background:var(--surface)}
th{position:sticky;top:0;z-index:5;background:var(--surface-2);border-bottom:2px solid var(--border);padding:6px;font-weight:950}
td{border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);padding:5px;text-align:center;vertical-align:top}
tr.weekend-sun{background:#ff6b6b;color:#111}tr.weekend-sat{background:#4dabf7;color:#111}
tr.today-row{outline:3px solid var(--today);outline-offset:-3px}
.event-row{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:start;text-align:left;font-weight:750;line-height:1.35;cursor:pointer}
.event-row.horizontal{display:inline-flex;align-items:center;width:auto;margin-right:6px}
.mobile-card{
  background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:9px;margin-bottom:4px
}
.mobile-card.today{border:3px solid var(--today)}
.mobile-date{font-weight:950;border-bottom:1px solid var(--border-soft);padding-bottom:4px;margin-bottom:6px}
.mobile-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:6px;padding:5px 7px;font-size:12px;color:var(--muted);font-weight:750}
.section-title{font-size:17px;font-weight:950;border-bottom:3px solid var(--border);padding-bottom:3px;margin:8px 0 5px}
.dept-picker,.nuga-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:5px;margin:4px 0}
.dept-pick,.nuga-filter{
  border:2px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);min-height:40px;padding:6px 8px;font-weight:900
}
.dept-pick.active{box-shadow:inset 0 0 0 2px var(--dept-color);background:var(--surface-2)}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:8px}
.dept-card{background:var(--surface);border:2px solid var(--border);border-left:7px solid var(--dept-color);border-radius:9px;padding:10px;cursor:pointer}
.dept-card:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(0,0,0,.08)}
.grade-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border:2px solid var(--border);border-radius:9px;background:var(--surface-2)}
.grade-btn{border:0;border-radius:6px;background:transparent;color:var(--muted);min-height:36px;font-weight:900}
.grade-btn.active{background:var(--accent);color:#fff}
.nuga-filter{border-left:7px solid var(--cat);display:flex;justify-content:space-between;align-items:center;text-align:left}
.nuga-filter strong{font-size:18px}.nuga-filter small{font-size:10px;color:var(--muted)}
.nuga-filter.active{box-shadow:inset 0 0 0 2px var(--cat);background:var(--surface-2)}
.empty{min-height:110px;border:2px dashed var(--border);border-radius:10px;background:var(--surface);display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:800;padding:18px}
.request-form{max-width:820px;margin:4px auto;background:var(--surface);border:2px solid var(--border);border-radius:11px;padding:15px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-group{margin-bottom:10px}.form-label{display:block;font-weight:900;margin-bottom:4px}
.form-input,.form-textarea{width:100%;border:2px solid var(--border);border-radius:8px;padding:11px;background:var(--bg);color:var(--text);outline:none}
.form-input:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.form-textarea{min-height:150px;resize:vertical}
.form-help{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11.5px;margin-top:4px}
.submit{min-width:190px;background:var(--border);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:950}
.form-actions{text-align:right}
.required{font-size:10px;background:#ffe3e3;color:#c92a2a;border-radius:4px;padding:2px 4px}
.banner{
  display:none;position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:5000;width:min(900px,94vw);
  background:#fff5f5;color:#c92a2a;border:2px solid #c92a2a;border-radius:10px;padding:10px 12px;font-weight:850;box-shadow:var(--shadow)
}
.banner-actions{display:flex;gap:5px;justify-content:flex-end;margin-top:7px}
.loading{position:fixed;inset:0;z-index:6000;background:var(--bg);display:grid;place-items:center}
.loading-inner{text-align:center;font-weight:900}
.spinner{width:42px;height:42px;margin:0 auto 12px;border:5px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{
  display:none;position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:14px
}
.modal.open{display:flex}
.modal-box{width:min(640px,96vw);max-height:88vh;background:var(--surface);border:3px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.modal-head{padding:15px 17px;border-bottom:2px solid var(--border);font-size:19px;font-weight:950;background:var(--surface-2)}
.modal-body{padding:18px;white-space:pre-wrap;line-height:1.65;overflow:auto;max-height:65vh}
.modal-foot{padding:10px 14px;border-top:2px solid var(--border);display:flex;justify-content:flex-end;gap:6px;background:var(--surface-2)}
.detail{
  position:fixed;top:0;right:0;z-index:3500;width:min(390px,92vw);height:100dvh;background:var(--surface);
  border-left:3px solid var(--border);box-shadow:-12px 0 35px rgba(0,0,0,.24);transform:translateX(105%);visibility:hidden;
  transition:transform .18s ease,visibility .18s;display:grid;grid-template-rows:auto 1fr auto
}
.detail.open{transform:none;visibility:visible}
.detail-head,.detail-foot{padding:12px 14px;border-bottom:2px solid var(--border)}
.detail-foot{border-top:2px solid var(--border);border-bottom:0;display:flex;justify-content:space-between}
.detail-body{overflow:auto;padding:12px 14px}
.detail-event{display:grid;grid-template-columns:auto 1fr;gap:6px;border-bottom:1px solid var(--border-soft);padding:8px 0}
.detail-event.selected{background:var(--accent-soft);margin:0 -6px;padding:8px 6px;border-radius:6px}
.detail-section{margin-bottom:15px}.detail-section h3{font-size:12px;color:var(--muted);margin:0 0 5px}
.mobile-fab,.mobile-menu,.mobile-backdrop{display:none}
.print-title{display:none}
@media(max-width:1100px){
  .topbar{grid-template-columns:auto 1fr}.header-actions{grid-column:1/-1;justify-content:flex-end}
  .nav{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:850px){
  .app-header{padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
  .topbar{grid-template-columns:1fr}.brand{text-align:center}.search-wrap{width:100%}.header-actions{justify-content:center}
  .nav{display:none}
  .page{width:calc(100% - 4px)}
  .toolbar{grid-template-columns:1fr}
  .toolbar-title .toolbar-sub{display:none}
  .month-nav,.month-nav.no-print-btn{grid-template-columns:auto auto minmax(90px,1fr) auto}
  .month-nav .print-button{display:none}
  .options{align-items:flex-start}
  .calendar{min-width:0;grid-template-columns:1fr;grid-auto-rows:auto}
  .cal-head{display:none}.cal-cell{min-height:64px}.cal-cell.other{display:none}
  .cal-cell:not(:has(.event)){min-height:54px}
  .dept-picker{display:none}
  .dept-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}.request-form{padding:10px}.form-actions .submit{width:100%}
  .detail{display:none!important}
  .mobile-fab{
    display:flex;position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));z-index:2300;
    width:64px;height:64px;border:3px solid var(--border);border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;
    font-weight:950;box-shadow:var(--shadow)
  }
  .mobile-backdrop.open{display:block;position:fixed;inset:0;z-index:2200;background:rgba(0,0,0,.35)}
  .mobile-menu.open{
    display:block;position:fixed;right:max(10px,env(safe-area-inset-right));bottom:84px;z-index:2250;width:min(356px,calc(100vw - 20px));
    background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:9px;box-shadow:var(--shadow)
  }
  .mobile-menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
  .mobile-menu .nav-btn{display:block;background:var(--bg);border:2px solid transparent}
  .mobile-menu .nav-btn.active{background:var(--border);color:#fff;border-color:var(--border)}
  .app-main{padding-bottom:82px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{
  @page{size:A4 portrait;margin:8mm}
  html,body{height:auto!important;overflow:visible!important;background:#fff!important;color:#000!important}
  .app-header,.banner,.loading,.modal,.detail,.mobile-fab,.mobile-menu,.mobile-backdrop,.toolbar,.options,.mobile-only,.no-print{display:none!important}
  .app-main{overflow:visible!important;padding:0}.page{width:100%}.print-title{display:block;text-align:center;font-size:20px;font-weight:950;margin-bottom:7px}
  .desktop-only{display:block!important}.table-wrap{border:0;overflow:visible}.plan-table{min-height:265mm}
  table{min-width:0!important;background:#fff!important}th{position:static!important;background:#eee!important;color:#000!important}
  th,td{border:1px solid #000!important;color:#000!important;padding:2px!important}
  .event-row{font-size:12px}.dept-tag{font-size:10px;background:transparent!important}.weekend-sat{background:#4dabf7!important}.weekend-sun{background:#ff6b6b!important}
}
</style>
</head>
<body>

<div id="loading" class="loading">
  <div class="loading-inner">
    <div class="spinner"></div>
    <div>학사 데이터 동기화 중...</div>
  </div>
</div>

<div id="errorBanner" class="banner">
  <div>⚠️ 일부 데이터를 불러오지 못했습니다. <span id="errorText"></span></div>
  <div class="banner-actions">
    <button class="btn" id="retryBtn">재시도</button>
    <button class="btn" id="closeBannerBtn">닫기</button>
  </div>
</div>

<header class="app-header">
  <div class="topbar">
    <div class="brand">학사관리 시스템</div>

    <div class="search-wrap">
      <input
        id="searchInput"
        class="search-input"
        placeholder="행사 내용 또는 부서 검색 (공백=AND)"
      >
      <span id="searchMeta" class="search-meta">AND 검색</span>
      <span id="syncStatus" class="sync loading">
        <span class="sync-dot"></span>
        <span id="syncText">동기화 중</span>
      </span>
    </div>

    <div class="header-actions">
      <button id="refreshBtn" class="icon-btn" title="데이터 새로고침">↻</button>
      <button id="scaleDownBtn" class="icon-btn" title="작게">A−</button>
      <button id="scaleResetBtn" class="icon-btn" title="보통 크기">A</button>
      <button id="scaleUpBtn" class="icon-btn" title="크게">A+</button>
      <button id="darkBtn" class="icon-btn" title="다크모드">🌙</button>
      <button id="viewBtn" class="icon-btn" title="화면 모드">📱</button>
    </div>
  </div>

  <nav id="topNav" class="nav" aria-label="주요 업무 메뉴"></nav>
</header>

<main id="appMain" class="app-main"></main>

<div id="mobileBackdrop" class="mobile-backdrop"></div>

<div id="mobileMenu" class="mobile-menu">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px">
    <strong>메뉴</strong>
    <button id="mobileCloseBtn" class="icon-btn" aria-label="메뉴 닫기">×</button>
  </div>
  <div id="mobileMenuGrid" class="mobile-menu-grid"></div>
</div>

<button id="mobileFab" class="mobile-fab" aria-label="메뉴 열기">
  ☰<br><span style="font-size:11px">메뉴</span>
</button>

<div id="noticeModal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div class="modal-head">📢 공지사항</div>
    <div id="noticeBody" class="modal-body"></div>
    <div class="modal-foot">
      <button class="btn" data-close-modal="noticeModal">확인</button>
    </div>
  </div>
</div>

<div id="eventModal" class="modal" role="dialog" aria-modal="true">
  <div class="modal-box">
    <div id="eventModalTitle" class="modal-head">📌 일정 상세</div>
    <div id="eventModalBody" class="modal-body"></div>
    <div class="modal-foot">
      <button id="eventDeptBtn" class="btn">부서별로 보기</button>
      <button class="btn" data-close-modal="eventModal">닫기</button>
    </div>
  </div>
</div>

<aside id="detailPanel" class="detail">
  <div class="detail-head">
    <div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
      <div>
        <div id="detailTitle" style="font-size:19px;font-weight:950"></div>
        <div id="detailSub" style="font-size:11.5px;color:var(--muted);font-weight:800;margin-top:2px"></div>
      </div>
      <button id="detailCloseBtn" class="icon-btn">×</button>
    </div>

    <div style="display:flex;gap:4px;margin-top:8px">
      <button id="detailPrevBtn" class="btn">◀ 전날</button>
      <button id="detailTodayBtn" class="btn">오늘</button>
      <button id="detailNextBtn" class="btn">다음날 ▶</button>
    </div>
  </div>

  <div id="detailBody" class="detail-body"></div>

  <div class="detail-foot">
    <button id="detailCopyBtn" class="btn">내용 복사</button>
    <button id="detailDoneBtn" class="btn">확인</button>
  </div>
</aside>

<script>
"use strict";

/* =========================
   1. 변경 불가 외부 계약
   ========================= */

const CONFIG = Object.freeze({
  WEB_APP_URL: "https://script.google.com/macros/s/AKfycbzk1DN0iDS7EdZvKq-iomzgxmiCzOwCUZwWZkN4fjvkzOZPdF1d3P9d1xt6Ii8VNnmmPQ/exec",
  SHEET_ID: "10blDNZ4zjrFU5lwCvgtoD3npwIwcCMQTeqwPgpQ_Ffg",
  STUDENT_SCHEDULE_GID: "1112677469",

  SHEETS: [
    { key:"schedule",   gid:"0",          label:"연중행사계획" },
    { key:"student",    gid:"1112677469", label:"학생일정" },

const $ = (selector,root=document) =>
  root.querySelector(selector);

const $$ = (selector,root=document) =>
  [...root.querySelectorAll(selector)];

const clamp = (min,max,value) =>
  Math.max(min,Math.min(max,value));

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#39;");
}

function normalizeQuery(query){
  return String(query || "")
    .trim()
    .toLowerCase()
    .replace(/\s+/g," ");
}

function getDateKey(date){
  return [
    date.getFullYear(),
    String(date.getMonth()+1).padStart(2,"0"),
    String(date.getDate()).padStart(2,"0")
  ].join("-");
}

function dateFromKey(key){
  return new Date(key + "T00:00:00");
}

function getCellText(cell){
  if(cell == null){
    return "";
  }

  if(
    typeof cell === "string" ||
    typeof cell === "number"
  ){
    return String(cell).trim();
  }

  if(
    cell.f != null &&
    String(cell.f).trim() !== ""
  ){
    return String(cell.f).trim();
  }

  if(cell.v != null){
    return String(cell.v).trim();
  }

  return "";
}

function parseGDate(value){
  if(!value){
    return null;
  }

  if(value instanceof Date){
    return Number.isNaN(value.getTime())
      ? null
      : new Date(
          value.getFullYear(),
          value.getMonth(),
          value.getDate()
        );
  }

  if(
    typeof value === "number" &&
    Number.isFinite(value)
  ){
    const utc = new Date(
      Math.round(
        (value - 25569) *
        86400 *
        1000
      )
    );

    if(!Number.isNaN(utc.getTime())){
      return new Date(
        utc.getUTCFullYear(),
        utc.getUTCMonth(),
        utc.getUTCDate()
      );
    }
  }

  const raw = String(value).trim();

  if(
    !raw ||
    raw === "null" ||
    raw === "undefined"
  ){
    return null;
  }

  let match = raw.match(
    /Date\s*\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/
  );

  if(match){
    return new Date(
      +match[1],
      +match[2],
      +match[3]
    );
  }

  match = raw.match(
    /(\d{4})\D+(\d{1,2})\D+(\d{1,2})/
  );

  if(match){
    return new Date(
      +match[1],
      +match[2]-1,
      +match[3]
    );
  }

  return null;
}

function highlight(text){
  const safe = escapeHTML(text);

  if(!state.search.tokens.length){
    return safe;
  }

  const tokens = [
    ...new Set(state.search.tokens)
  ]
  .sort((a,b)=>b.length-a.length)
  .map(token=>
    token.replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    )
  );

  return safe.replace(
    new RegExp(
      `(${tokens.join("|")})`,
      "ig"
    ),
    "<mark>$1</mark>"
  );
}

function matches(dept,text){
  if(!state.search.tokens.length){
    return true;
  }

  const hay =
    `${dept} ${text}`.toLowerCase();

  return state.search.tokens.every(
    token=>hay.includes(token)
  );
}

function matchesStudent(text){
  if(!state.search.tokens.length){
    return true;
  }

  const hay =
    String(text || "").toLowerCase();

  return state.search.tokens.every(
    token=>hay.includes(token)
  );
}

function stripLeadingDeptTag(text){
  return String(text || "")
    .replace(/^\s*[-•]\s*/,"")
    .replace(/^\s*\[[^\]]+\]\s*/,"")
    .trim();
}

function parsePeriods(cell){
  if(cell == null){
    return {
      periods:"",
      hours:0
    };
  }

  let raw = "";

  for(
    const candidate of [
      cell?.f,
      cell?.v,
      cell
    ]
  ){
    if(candidate == null){
      continue;
    }

    const value =
      String(candidate).trim();

    if(
      value &&
      ![
        "null",
        "undefined",
        "[object Object]"
      ].includes(value)
    ){
      raw = value;
      break;
    }
  }

  if(!raw){
    return {
      periods:"",
      hours:0
    };
  }

  const display = raw
    .replace(/[\[\]]/g,"")
    .replace(/\s+/g,"")
    .replace(/교시/g,"");

  const tokens = display
    .replace(/[，、\/|.]+/g,",")
    .split(",")
    .filter(Boolean);

  let hours = 0;

  for(const token of tokens){
    const range = token.match(
      /^(\d+)[~\-–—](\d+)$/
    );

    hours += range
      ? Math.abs(
          +range[2] -
          +range[1]
        ) + 1
      : /^\d+$/.test(token)
        ? 1
        : 0;
  }

  return {
    periods:display || raw,
    hours
  };
}

function normalizeHeader(value){
  return String(value ?? "")
    .replace(/\s+/g,"")
    .trim();
}

function normalizeCategory(value){
  return String(value ?? "")
    .replace(/\(.*$/,"")
    .trim();
}

function isCheckedGrade(value){
  return [
    "1","o","○","◯","v",
    "✓","✔","true","y"
  ].includes(
    String(value ?? "")
      .trim()
      .toLowerCase()
  );
}

function parseLooseDate(cell){
  if(
    cell &&
    typeof cell === "object"
  ){
    const rawDate =
      parseGDate(cell.v);

    if(rawDate){
      return rawDate;
    }
  }

  return parseGDate(
    getCellText(cell)
  );
}

function currentScheduleYear(){
  const date =
    data.schedule.find(
      item=>item.date instanceof Date
    )?.date;

  return date
    ? date.getFullYear()
    : state.viewDate.getFullYear();
}

function parseStudentDateCell(cell){
  if(
    cell &&
    typeof cell === "object"
  ){
    const rawDate =
      parseGDate(cell.v);

    if(rawDate){
      return rawDate;
    }
  }

  const text =
    getCellText(cell);

  const parsed =
    parseGDate(text);

  if(parsed){
    return parsed;
  }

  const md = text.match(
    /(\d{1,2})\s*[-./]\s*(\d{1,2})/
  );

  return md
    ? new Date(
        currentScheduleYear(),
        +md[1]-1,
        +md[2]
      )
    : null;
}

function studentFallbackContent(text){
  const raw =
    String(text || "").trim();

  let match = raw.match(
    /^\s*\d{4}\D+\d{1,2}\D+\d{1,2}\s*[월화수목금토일]?\s*(.*)$/
  );

  if(match){
    return stripLeadingDeptTag(
      match[1]
    );
  }

  match = raw.match(
    /^\s*\d{1,2}\s*[-./]\s*\d{1,2}\s*[월화수목금토일]?\s*(.*)$/
  );

  return match
    ? stripLeadingDeptTag(
        match[1]
      )
    : "";
}

const adapters = {

  schedule(raw){
    const result = [];

    for(
      const row of
      raw?.table?.rows || []
    ){
      if(!row?.c?.[0]){
        continue;
      }

      const date =
        parseGDate(
          row.c[0].v
        );

      const content =
        row.c[2]?.v != null
          ? String(
              row.c[2].v
            ).trim()
          : "";

      if(
        !date ||
        !content ||
        content === "null"
      ){
        continue;
      }

      const events = content
        .split("\n")
        .filter(
          line=>
            line.trim() &&
            line !== "null"
        )
        .map(line=>{

          const match =
            line.match(
              /^\[([^\]]+)\]/
            );

          let dept =
            match
              ? match[1].trim()
              : "기타";

          let text =
            match
              ? line
                  .replace(
                    match[0],
                    ""
                  )
                  .trim()
              : line.trim();

          if(
            !FIXED_DEPTS.includes(
              dept
            )
          ){
            dept = "기타";
            text = line.trim();
          }

          return {
            dept,
            text
          };
        });

      result.push({
        date,
        events
      });
    }

    return result.sort(
      (a,b)=>a.date-b.date
    );
  },

  student(raw){
    const result = [];

    for(
      const row of
      raw?.table?.rows || []
    ){
      if(!row?.c?.[0]){
        continue;
      }

      const date =
        parseStudentDateCell(
          row.c[0]
        );

      if(!date){
        continue;
      }

      const primary = [];

      for(
        let i=2;
        i<row.c.length;
        i++
      ){
        const text =
          getCellText(
            row.c[i]
          );

        if(
          text &&
          text !== "null"
        ){
          primary.push(text);
        }
      }

      const secondary = [];

      for(
        let i=1;
        i<row.c.length;
        i++
      ){
        const text =
          getCellText(
            row.c[i]
          );

        if(
          !text ||
          text === "null" ||
          /^[월화수목금토일]$/.test(
            text
          )
        ){
          continue;
        }

        secondary.push(text);
      }

      let content =
        primary
          .join("\n")
          .trim() ||
        secondary
          .join("\n")
          .trim() ||
        studentFallbackContent(
          getCellText(
            row.c[0]
          )
        );

      if(
        !content ||
        content === "null"
      ){
        continue;
      }

      const events =
        content
          .split("\n")
          .map(
            stripLeadingDeptTag
          )
          .filter(Boolean);

      if(events.length){
        result.push({
          date,
          events
        });
      }
    }

    return result.sort(
      (a,b)=>a.date-b.date
    );
  },

  supervisor(raw){
    const result = {};

    for(
      const row of
      raw?.table?.rows || []
    ){
      if(!row?.c?.[0]){
        continue;
      }

      const date =
        parseGDate(
          row.c[0].v
        );

      const name =
        row.c[2]?.v != null
          ? String(
              row.c[2].v
            ).trim()
          : "";

      if(
        date &&
        name &&
        name !== "null"
      ){
        result[
          getDateKey(date)
        ] = name;
      }
    }

    return result;
  },

  prayer(raw){
    const result = {};

    (
      raw?.table?.rows || []
    ).forEach((row,index)=>{

      if(
        index < 1 ||
        !row?.c?.[0]
      ){
        return;
      }

      const date =
        parseGDate(
          row.c[0].v
        );

      if(!date){
        return;
      }

      const name =
        row.c[2]?.v != null
          ? String(
              row.c[2].v
            ).trim()
          : "";

      const bible =
        row.c[3]?.v != null
          ? String(
              row.c[3].v
            ).trim()
          : "";

      const hymn =
        row.c[4]?.v != null
          ? String(
              row.c[4].v
            ).trim()
          : "";

      if(
        name &&
        name !== "null"
      ){
        result[
          getDateKey(date)
        ] = {
          name,
          hymn,
          bible
        };
      }
    });

    return result;
  },

  notice(raw){
    const result = [];

    const today =
      new Date();

    today.setHours(
      0,0,0,0
    );

    for(
      const row of
      raw?.table?.rows || []
    ){
      if(
        !row?.c ||
        row.c.length < 3
      ){
        continue;
      }

      const start =
        parseGDate(
          row.c[0]?.v
        );

      const end =
        parseGDate(
          row.c[1]?.v
        );

      const content =
        row.c[2]?.v != null
          ? String(
              row.c[2].v
            ).trim()
          : "";

      if(
        !content ||
        content === "null"
      ){
        continue;
      }

      let visible = true;

      if(
        start &&
        end
      ){
        start.setHours(
          0,0,0,0
        );

        end.setHours(
          0,0,0,0
        );

        visible =
          today >= start &&
          today <= end;
      }

      if(visible){
        result.push(content);
      }
    }

    return result;
  },

  nuga(raw){
    const result = [];

    const cols =
      Array.isArray(
        raw?.table?.cols
      )
        ? raw.table.cols
        : [];

    const columnMap =
      Object.create(null);

    cols.forEach(
      (column,index)=>{

        [
          column?.label,
          column?.id,
          column?.pattern
        ].forEach(key=>{

          const normalized =
            normalizeHeader(key);

          if(normalized){
            columnMap[
              normalized
            ] = index;
          }
        });
      }
    );

    const pick = (
      names,
      fallback
    ) => {

      for(
        const name of names
      ){
        const normalized =
          normalizeHeader(name);

        if(
          Object.prototype
            .hasOwnProperty
            .call(
              columnMap,
              normalized
            )
        ){
          return columnMap[
            normalized
          ];
        }
      }

      return fallback;
    };

    const index = {
      category:
        pick(
          ["영역"],
          1
        ),

      date:
        pick(
          ["일자","날짜"],
          2
        ),

      periods:
        pick(
          ["교시텍스트","교시"],
          3
        ),

      g1:
        pick(
          ["1학년","1"],
          4
        ),

      g2:
        pick(
          ["2학년","2"],
          5
        ),

      g3:
        pick(
          ["3학년","3"],
          6
        ),

      content:
        pick(
          ["활동내용","내용"],
          7
        ),

      remark:
        pick(
          ["비고"],
          8
        )
    };

    for(
      const row of
      raw?.table?.rows || []
    ){
      if(!row?.c){
        continue;
      }

      const rawCategory =
        normalizeCategory(
          getCellText(
            row.c[
              index.category
            ]
          )
        );

      const date =
        parseLooseDate(
          row.c[
            index.date
          ]
        );

      if(
        !rawCategory ||
        !date
      ){
        continue;
      }

      const {
        periods,
        hours
      } = parsePeriods(
        row.c[
          index.periods
        ]
      );

      const autoVol =
        rawCategory === "자율" ||
        rawCategory === "봉사";

      result.push({
        displayCategory:{
          1:
            autoVol
              ? "자율자치"
              : rawCategory,

          2:
            autoVol
              ? "자율자치"
              : rawCategory,

          3:
            rawCategory
        },

        date,

        dateKey:
          getDateKey(date),

        dayOfWeek:
          DOW[
            date.getDay()
          ],

        periods,
        hours,

        grades:[
          isCheckedGrade(
            getCellText(
              row.c[index.g1]
            )
          ),

          isCheckedGrade(
            getCellText(
              row.c[index.g2]
            )
          ),

          isCheckedGrade(
            getCellText(
              row.c[index.g3]
            )
          )
        ],

        content:
          getCellText(
            row.c[
              index.content
            ]
          ),

        remark:
          getCellText(
            row.c[
              index.remark
            ]
          )
      });
    }

    return result.sort(
      (a,b)=>a.date-b.date
    );
  }
};

function hideError(){

function loadSheet(
  sheet,
  generation
){
  return new Promise(
    resolve=>{

      const callback =
        `__sheet_${sheet.key}_${generation}_${Date.now()}_${Math.random().toString(36).slice(2)}`;

      const script =
        document.createElement(
          "script"
        );

      let done = false;

      const cleanup = ()=>{
        if(done){
          return;
        }

        done = true;

        script.remove();

        try{
          delete window[
            callback
          ];
        }catch{}
      };

      const finish = (
        error,
        value
      )=>{
        cleanup();

        resolve({
          key:sheet.key,
          label:sheet.label,
          err:error,
          value
        });
      };

      window[callback] = raw=>{
        try{
          finish(
            null,
            adapters[
              sheet.key
            ](raw)
          );
        }catch(error){
          finish(
            error,
            null
          );
        }
      };

      script.onerror = ()=>{
        finish(
          new Error(
            `${sheet.label} 로딩 실패`
          ),
          null
        );
      };

      script.src =
        `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq` +
        `?tqx=out:json;responseHandler:${callback}` +
        `&gid=${sheet.gid}` +
        `&_=${Date.now()}`;

      document.body.appendChild(
        script
      );
    }
  );
}

async function reloadAll(){

  const generation =
    ++state.load.generation;

  if(state.load.timer){
    clearTimeout(
      state.load.timer
    );
  }

  $("#loading").style.display =
    "grid";

  hideError();

  setSync(
    "loading",
    "동기화 중"
  );

  state.load.errors = {};

  const timeout =
    new Promise(
      resolve=>{

        state.load.timer =
          setTimeout(
            ()=>resolve(
              "timeout"
            ),
            12000
          );
      }
    );

  const work =
    Promise.all(
      CONFIG.SHEETS.map(
        sheet=>
          loadSheet(
            sheet,
            generation
          )
      )
    );

  const winner =
    await Promise.race([
      work,
      timeout
    ]);

  if(
    generation !==
    state.load.generation
  ){
    return;
  }

  if(
    winner === "timeout"
  ){
    $("#loading").style.display =
      "none";

    showError(
      "일부 시트 로딩이 12초 이상 지연되고 있습니다. 재시도해 주세요."
    );

    return;
  }

  for(
    const item of winner
  ){
    if(item.err){
      state.load.errors[
        item.key
      ] = item.err;

      continue;
    }

    data[
      item.key
    ] = item.value;
  }

  rebuildIndexes();

  alignViewDate();

  state.load.lastRefresh =
    Date.now();

  $("#loading").style.display =
    "none";

  const failures =
    Object.keys(
      state.load.errors
    );

  if(failures.length){

    showError(
      CONFIG.SHEETS
        .filter(
          sheet=>

            )
        )
        .map(
          sheet=>sheet.label
        )
        .join(", ") +
      " 데이터를 불러오지 못했습니다."
    );

  }else{

    const now =
      new Date();

    setSync(
      "ok",
      `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} 갱신`
    );
  }

function rebuildIndexes(){

  data.eventsById =
    Object.create(null);

  data.daysByKey =
    Object.create(null);

  data.deptIndex =
    Object.create(null);

  let id = 0;

  for(
    const day of
    data.schedule
  ){
    const key =
      getDateKey(
        day.date
      );

    data.daysByKey[
      key
    ] ??= {
      dateKey:key,
      date:day.date,
      eventIds:[]
    };

    for(
      const event of
      day.events
    ){
      data.eventsById[
        id
      ] = {
        id,
        dateKey:key,
        dept:event.dept,
        text:event.text
      };

      data.daysByKey[
        key
      ].eventIds.push(
        id
      );

      (
        data.deptIndex[
          event.dept
        ] ??= []
      ).push(id);

      id++;
    }
  }

  Object.values(
    data.deptIndex
  ).forEach(ids=>{

    ids.sort(
      (a,b)=>
        data.eventsById[
          a
        ].dateKey.localeCompare(
          data.eventsById[
            b
          ].dateKey
        ) ||
        a-b
    );
  });

  data.studentEventsById =
    Object.create(null);

  data.studentDaysByKey =
    Object.create(null);

  let studentId = 0;

  for(
    const day of
    data.student
  ){
    const key =
      getDateKey(
        day.date
      );

    data.studentDaysByKey[
      key
    ] ??= {
      dateKey:key,
      date:day.date,
      eventIds:[]
    };

    for(
      const text of
      day.events
    ){
      data.studentEventsById[
        studentId
      ] = {
        id:studentId,
        dateKey:key,
        text
      };

      data.studentDaysByKey[
        key
      ].eventIds.push(
        studentId++
      );
    }
  }
}

function alignViewDate(){

  const source =
    data.schedule.length
      ? data.schedule
      : data.student;

  if(!source.length){
    return;
  }

  const dates =
    source
      .map(
        item=>item.date
      )
      .sort(
        (a,b)=>a-b
      );

  const today =
    new Date();

  const sameMonth =
    dates.some(
      date=>
        date.getFullYear() ===
          today.getFullYear() &&
        date.getMonth() ===
          today.getMonth()
    );

  const chosen =
    sameMonth
      ? today
      : (
          dates.find(
            date=>date>=today
          ) ||
          dates[
            dates.length-1
          ]
        );

  state.viewDate =
    new Date(
      chosen.getFullYear(),
      chosen.getMonth(),
      1
    );
}

  }catch{}
}

function restorePrefs(){
  try{

    const prefs =
      JSON.parse(
        localStorage.getItem(
          STORAGE_KEY
        ) || "{}"
      );

    if(
      [
        "calendar",
        "plan",
        "student",
        "dept",
        "nuga",
        "request"
      ].includes(
        prefs.tab
      )
    ){
      state.tab =
        prefs.tab;
    }

    if(
      Number.isInteger(
        prefs.y
      ) &&
      Number.isInteger(
        prefs.m
      )
    ){
      state.viewDate =
        new Date(
          prefs.y,
          prefs.m,
          1
        );
    }

    if(
      typeof prefs.mobile ===
      "boolean"
    ){
      state.mobile =
        prefs.mobile;
    }

    if(
      typeof prefs.dark ===
      "boolean"
    ){
      state.dark =
        prefs.dark;
    }

    if(
      Number.isFinite(
        prefs.scale
      )
    ){
      state.scale =
        clamp(
          -2,
          2,
          prefs.scale
        );
    }

    if(prefs.calendar){
      Object.assign(
        state.calendar,
        prefs.calendar
      );
    }

    if(prefs.plan){
      Object.assign(
        state.plan,
        prefs.plan
      );
    }

    if(prefs.student){
      Object.assign(
        state.student,
        prefs.student
      );
    }

    if(prefs.nuga){
      Object.assign(
        state.nuga,
        prefs.nuga
      );
    }

    if(
      FIXED_DEPTS.includes(
        prefs.dept
      )
    ){
      state.dept =
        prefs.dept;
    }

  }catch{}
}

function renderCalendar(){

  const year =
    state.viewDate
      .getFullYear();

  const currentMonth =
    state.viewDate
      .getMonth();

  const todayKey =
    getDateKey(
      new Date()
    );

  let output = `
    <div class="page">

      ${
        toolbar(
          "🗓️",
          "달력 일정",
          "월별 일정을 확인하고 날짜를 눌러 상세 정보를 봅니다.",
          monthNav(
            `${year}년 ${
              state.calendar.yearly
                ? "전체"
                : currentMonth+1+"월"
            }`
          )
        )
      }

      <div class="options">

        <span class="options-title">
          보기 방식
        </span>

        ${
          option(
            "1년 전체 보기",
            state.calendar.yearly,
            "yearly",
            "calendar"
          )
        }

      </div>
  `;

  const start =
    state.calendar.yearly
      ? 0
      : currentMonth;

  const end =
    state.calendar.yearly
      ? 11
      : currentMonth;

  for(
    let month=start;
    month<=end;
    month++
  ){

    if(
      state.calendar.yearly
    ){
      output += `
        <div class="section-title">
          ${year}년 ${month+1}월
        </div>
      `;
    }

    const monthly =
      Object.values(
        data.eventsById
      )
      .filter(event=>{

        const date =
          dateFromKey(
            event.dateKey
          );

        return (
          date.getFullYear() === year &&
          date.getMonth() === month &&
          matches(
            event.dept,
            event.text
          )
        );
      });

    output += `
      <div class="inline-info">

        <span>
          표시 일정 ${monthly.length}건
        </span>

        <div class="legend">
          ${
            [
              ...new Set(
                monthly.map(
                  event=>event.dept
                )
              )
            ]
            .map(
              dept=>`
                <span
                  class="chip"
                  style="background:${DEPT_COLORS[dept]}"
                >
                  ${escapeHTML(dept)}
                </span>
              `
            )
            .join("")
          }
        </div>

      </div>
    `;

    output += `
      <div class="calendar-wrap">
        <div class="calendar">

          ${
            [
              "월",
              "화",
              "수",
              "목",
              "금"
            ]
            .map(
              day=>`
                <div class="cal-head">
                  ${day}
                </div>
              `
            )
            .join("")
          }
    `;

    const first =
      new Date(
        year,
        month,
        1
      );

    const last =
      new Date(
        year,
        month+1,
        0
      );

    const cursor =
      new Date(first);

    let diff =
      cursor.getDay()-1;

    if(diff === -1){
      diff = 6;
    }

    cursor.setDate(
      cursor.getDate()-diff
    );

    for(
      let i=0;
      i<42;
      i++
    ){

      const weekend =
        cursor.getDay() === 0 ||
        cursor.getDay() === 6;

      if(
        !state.mobile &&
        weekend
      ){
        cursor.setDate(
          cursor.getDate()+1
        );

        continue;
      }

      const key =
        getDateKey(cursor);

      const day =
        data.daysByKey[key];

      const ids =
        filteredEventIds(day);

      if(
        state.mobile &&
        state.search.tokens.length &&
        !ids.length
      ){
        cursor.setDate(
          cursor.getDate()+1
        );

        if(cursor > last){
          break;
        }

        continue;
      }

      const other =
        cursor.getMonth() !==
        month;

      if(
        state.mobile &&
        other
      ){
        cursor.setDate(
          cursor.getDate()+1
        );

        continue;
      }

      const events =
        ids
          .map(id=>{

            const event =
              data.eventsById[id];

            return `
              <div
                class="event"
                data-event-id="${id}"
              >

                <span
                  class="dept-tag"
                  style="background:${DEPT_COLORS[event.dept]}"
                >
                  ${highlight(event.dept)}
                </span>

                <span class="event-text">
                  ${highlight(event.text)}
                </span>

              </div>
            `;
          })
          .join("");

      output += `
        <div
          class="cal-cell
            ${other?"other":""}
            ${key===todayKey?"today":""}
          "
          data-day="${key}"
          tabindex="0"
        >

          <div class="cal-date">
            ${cursor.getDate()}
            ${
              state.mobile
                ? ` (${DOW[cursor.getDay()]})`
                : ""
            }
          </div>

          <div class="event-list">
            ${events}
          </div>

        </div>
      `;

      cursor.setDate(
        cursor.getDate()+1
      );

      if(
        state.mobile &&
        cursor > last
      ){
        break;
      }

      if(
        !state.mobile &&
        cursor > last &&
        cursor.getDay() === 1
      ){
        break;
      }
    }

    output += `
        </div>
      </div>
    `;
  }

  output += `
    </div>
  `;

  return output;
}

function planEvents(

    student

    (
      day?.eventIds || []
    )
    .filter(id=>

      student
        ? matchesStudent(
            data.studentEventsById[
              id
            ].text
          )
        : matches(
            data.eventsById[
              id
            ].dept,

            data.eventsById[
              id
            ].text
          )
    );

  if(student){

    return ids
      .map(
        (id,index)=>{

          return `
            <div
              class="event-row ${horizontal?"horizontal":""}"
              data-student-id="${id}"
            >

              <span>
                ${
                  highlight(
                    data.studentEventsById[
                      id

            ${
              horizontal &&
              index < ids.length-1
                ? "<span> | </span>"
                : ""
            }

      )

  }

  return ids
    .map(
      (id,index)=>{

            data-event-id="${id}"

          </div>

          ${
            horizontal &&
            index < ids.length-1
              ? "<span> | </span>"
              : ""
          }
        `;
      }
    )
    .join("");
}

  output += `
    </div>

    <div
      class="desktop-only ${state.mobile?"hidden":""}"
    >

      <div class="table-wrap">

        <table>

          <thead>
            <tr>

              <th style="width:42px">

              </th>

              <th style="width:42px">
                요일
              </th>

              <th>
                학생 일정
              </th>

            </tr>
          </thead>

          <tbody>
  `;

  for(
    let day=1;
    day<=lastDay;
    day++
  ){

    const date =
      new Date(
        year,
        month,
        day
      );

    const dow =
      date.getDay();

    if(
      options.excludeWeekends &&
      (
        dow === 0 ||
        dow === 6
      )
    ){
      continue;
    }

    const key =
      getDateKey(date);

    const events =
      planEvents(
        key,
        false,
        options.horizontal,
        true
      );

    output += `
      <tr
        class="
          ${
            dow===0
              ? "weekend-sun"
              : dow===6

                : ""

function renderDept(){

  const ids =
    (
      data.deptIndex[
        state.dept
      ] || []
    )
    .filter(id=>
      matches(
        data.eventsById[id].dept,
        data.eventsById[id].text
      )
    );

  const groups =
    new Map();

  ids.forEach(id=>{

    const event =
      data.eventsById[id];

    const date =
      dateFromKey(
        event.dateKey
      );

    const key =
      `${date.getFullYear()}년 ${date.getMonth()+1}월`;

    if(!groups.has(key)){
      groups.set(
        key,
        []
      );
    }

    groups
      .get(key)
      .push({
        id,
        ev:event,
        d:date
      });
  });

  let output = `
    <div class="page">

      ${
        toolbar(
          "🏢",
          "부서별 조회",
          "부서를 선택해 월별 일정만 모아 봅니다.",
          `
            <select
              id="deptSelect"
              class="btn"
            >
              ${
                FIXED_DEPTS
                  .map(
                    dept=>`
                      <option
                        ${dept===state.dept?"selected":""}

                        ${escapeHTML(dept)}
                      </option>
                    `
                  )
                  .join("")
              }
            </select>
          `
        )
      }

      <div class="dept-picker no-print">

        ${
          FIXED_DEPTS
            .map(
              dept=>`
                <button
                  class="dept-pick ${dept===state.dept?"active":""}"
                  style="--dept-color:${DEPT_COLORS[dept]}"
                  data-dept="${escapeHTML(dept)}"
                >
                  ${escapeHTML(dept)}
                </button>
              `
            )
            .join("")
        }

      </div>
  `;

  if(!groups.size){
    return (
      output +
      empty(
        "등록된 일정이 없습니다."
      ) +
      "</div>"
    );
  }

  for(
    const [
      month,
      items
    ] of groups
  ){

    output += `
      <div class="section-title">
        ${month}
      </div>

      <div class="dept-grid">
    `;

    for(
      const item of items
    ){

      output += `
        <div
          class="dept-card"
          style="--dept-color:${DEPT_COLORS[state.dept]}"
          data-event-id="${item.id}"
          tabindex="0"
        >

          <strong>
            ${item.d.getMonth()+1}월
            ${item.d.getDate()}일
            (${DOW[item.d.getDay()]})
          </strong>

          <div style="margin-top:6px">
            • ${highlight(item.ev.text)}
          </div>

        </div>
      `;
    }

    output += `
      </div>
    `;
  }

  output += `
    </div>
  `;

  return output;
}

function nugaCategories(){

  return state.nuga.grade === 3
    ? [
        "전체",
        "자율",
        "봉사",
        "동아리",
        "진로"
      ]
    : [
        "전체",
        "자율자치",
        "동아리",
        "진로"
      ];
}

function nugaMatch(
  row,
  category
){
  return (
    category === "전체" ||
    row.displayCategory[
      state.nuga.grade
    ] === category
  );
}

function renderNuga(){

  const gradeIndex =
    state.nuga.grade - 1;

  const categories =
    nugaCategories();

  if(
    !categories.includes(
      state.nuga.category
    )
  ){
    state.nuga.category =
      "전체";
  }

  const gradeRows =
    data.nuga.filter(
      row=>
        row.grades[
          gradeIndex
        ]
    );

  const hours = {};

  categories.forEach(
    category=>{

      hours[category] =
        gradeRows
          .filter(
            row=>
              nugaMatch(
                row,
                category
              )
          )
          .reduce(
            (sum,row)=>
              sum +
              row.hours,
            0
          );
    }
  );

  const rows =
    gradeRows
      .filter(
        row=>
          nugaMatch(
            row,
            state.nuga.category
          )
      )
      .filter(row=>{

        if(
          !state.search.tokens.length
        ){
          return true;
        }

        const hay =
          `${row.displayCategory[state.nuga.grade]} ${row.content} ${row.remark}`
            .toLowerCase();

        return state.search.tokens.every(
          token=>
            hay.includes(token)
        );
      });

  let output = `
    <div class="page">

      ${
        toolbar(
          "📝",
          "누가기록",
          "학년과 영역별 활동 내역 및 이수시간을 확인합니다.",
          `
            <div class="grade-switch">

              ${
                [1,2,3]
                  .map(
                    grade=>`
                      <button
                        class="grade-btn ${grade===state.nuga.grade?"active":""}"
                        data-grade="${grade}"
                      >
                        ${grade}학년
                      </button>
                    `
                  )
                  .join("")
              }

            </div>
          `
        )
      }

      <div class="nuga-filters no-print">

        ${
          categories
            .map(
              category=>`
                <button
                  class="nuga-filter ${category===state.nuga.category?"active":""}"
                  style="--cat:${NUGA_COLORS[category] || "#868e96"}"
                  data-category="${category}"
                >

                  <span>
                    ${category}
                  </span>

                  <strong>
                    ${hours[category] || 0}
                    <small>
                      시간
                    </small>
                  </strong>

                </button>
              `
            )
            .join("")
        }

      </div>
  `;

  if(!rows.length){
    return (
      output +
      empty(
        "해당 조건의 누가기록이 없습니다."
      ) +
      "</div>"
    );
  }

  if(state.mobile){

    let total = 0;

    rows.forEach(row=>{

      total +=
        row.hours;

      const category =
        row.displayCategory[
          state.nuga.grade
        ];

      const color =
        NUGA_COLORS[
          category
        ] ||
        "#e9ecef";

      output += `
        <div
          class="mobile-card"
          style="border-left:6px solid ${color}"
        >

          <div class="mobile-date">
            ${row.date.getMonth()+1}/${row.date.getDate()}
            (${row.dayOfWeek})
          </div>

          <div>

            <span
              class="dept-tag"
              style="background:${color}"
            >
              ${escapeHTML(category)}
            </span>

            <strong>
              ${highlight(row.content)}
            </strong>

          </div>

          <div
            class="mobile-meta"
            style="margin-top:6px"
          >

            <span>
              교시 ${escapeHTML(row.periods)}
            </span>

            <span>
              ${row.hours}시간 · 누계 ${total}
            </span>

          </div>

          ${
            row.remark
              ? `
                <div
                  style="
                    margin-top:5px;
                    color:var(--muted)
                  "
                >
                  비고:
                  ${highlight(row.remark)}
                </div>
              `
              : ""
          }

        </div>
      `;
    });

  }else{

    let total = 0;

    output += `
      <div class="table-wrap">

        <table>

          <thead>
            <tr>

              <th style="width:38px">
                No
              </th>

              <th style="width:75px">
                영역
              </th>

              <th style="width:75px">
                일자
              </th>

              <th style="width:42px">
                요일
              </th>

              <th style="width:72px">
                교시
              </th>

              <th style="width:62px">
                이수시간
              </th>

              <th>
                활동내용
              </th>

              <th style="width:20%">
                비고
              </th>

            </tr>
          </thead>

          <tbody>
    `;

    rows.forEach(
      (row,index)=>{

        total +=
          row.hours;

        const category =
          row.displayCategory[
            state.nuga.grade
          ];

        const color =
          NUGA_COLORS[
            category
          ] ||
          "#e9ecef";

        output += `
          <tr>

            <td>
              ${index+1}
            </td>

            <td>

              <span
                class="dept-tag"
                style="background:${color}"
              >
                ${escapeHTML(category)}
              </span>

            </td>

            <td>
              ${row.date.getMonth()+1}/${row.date.getDate()}
            </td>

            <td>
              ${row.dayOfWeek}
            </td>

            <td>
              ${escapeHTML(row.periods)}
            </td>

            <td>
              <strong>
                ${row.hours}
              </strong>
            </td>

            <td style="text-align:left">
              ${highlight(row.content)}
            </td>

            <td
              style="
                text-align:left;
                color:var(--muted)
              "
            >
              ${highlight(row.remark)}
            </td>

          </tr>
        `;
      }
    );

    output += `
      <tr>

        <td
          colspan="5"
          style="text-align:right"
        >
          <strong>
            합계
          </strong>
        </td>

        <td>
          <strong>
            ${total}
          </strong>
        </td>

        <td colspan="2"></td>

      </tr>

          </tbody>

        </table>

      </div>
    `;
  }

  output += `
    </div>
  `;

  return output;
}

function showNotices(){

    data.notices.join(
      "\n\n────────────────\n\n"
    );

function openEvent(id){

  const event =
    data.eventsById[id];

  if(!event){
    return;
  }

  if(
    !state.mobile &&
    window.innerWidth > 850
  ){
    openDetail(
      event.dateKey,
      id,
      null
    );

    return;
  }

  const date =
    dateFromKey(
      event.dateKey
    );

  const lines = [
    `날짜: ${event.dateKey} (${DOW[date.getDay()]})`,
    `부서: ${event.dept}`,
    `내용: ${event.text}`
  ];

  const prayer =
    data.prayer[
      event.dateKey
    ];

  if(prayer?.name){

    lines.push(
      "",
      "기도/말씀",
      `- 담당: ${prayer.name}`
    );

    if(prayer.hymn){
      lines.push(
        `- 찬송: ${prayer.hymn}`
      );
    }

    if(prayer.bible){
      lines.push(
        `- 말씀: ${prayer.bible}`
      );
    }
  }

  if(
    data.supervisor[
      event.dateKey
    ]
  ){
    lines.push(
      "",
      `자습감독: ${data.supervisor[event.dateKey]}`
    );
  }

  $("#eventModalTitle").textContent =
    `📌 ${date.getMonth()+1}월 ${date.getDate()}일 (${DOW[date.getDay()]}) · ${event.dept}`;

  $("#eventModalBody").textContent =
    lines.join("\n");

  $("#eventDeptBtn").style.display =
    "";

  $("#eventDeptBtn").onclick =
    ()=>{

      state.dept =
        event.dept;

      closeModal(
        "eventModal"
      );

      switchTab(
        "dept"
      );
    };

  $("#eventModal").classList.add(
    "open"
  );
}

function dayText(key){

  const date =
    dateFromKey(key);

  const lines = [
    `${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 (${DOW[date.getDay()]})`
  ];

  (
    data.daysByKey[
      key
    ]?.eventIds || []
  )
  .forEach(id=>{

    const event =
      data.eventsById[id];

    lines.push(
      `[${event.dept}] ${event.text}`
    );
  });

  (
    data.studentDaysByKey[
      key
    ]?.eventIds || []
  )
  .forEach(id=>

    lines.push(
      `[학생] ${data.studentEventsById[id].text}`
    )
  );

  const prayer =
    data.prayer[key];

  if(prayer?.name){
    lines.push(
      `경건회: ${prayer.name}`
    );
  }

  if(
    data.supervisor[key]
  ){
    lines.push(
      `자습감독: ${data.supervisor[key]}`
    );
  }

  return lines.join("\n");
}

    `;
  }

  $("#detailBody").innerHTML =
    body;

  $("#detailPanel").classList.add(
    "open"
  );
}

function closeDetail(){

  state.detailDate =
    "";

  $("#detailPanel").classList.remove(
    "open"
  );
}

function moveDetail(delta){

  if(
    !state.detailDate
  ){
    return;
  }

  const date =
    dateFromKey(
      state.detailDate
    );

  date.setDate(
    date.getDate()+delta
  );

  openDetail(
    getDateKey(date)
  );
}

/* =========================
   11. 상태 변경
   ========================= */

function switchTab(tab){

  state.tab =
    tab;

  closeDetail();

  closeMobileMenu();

  render();
}

function changeMonth(delta){

  const step =
    state.tab === "calendar" &&
    state.calendar.yearly
      ? 12
      : 1;

  state.viewDate =
    new Date(
      state.viewDate.getFullYear(),
      state.viewDate.getMonth() +
        delta * step,
      1
    );

  render();
}

function goToday(){

  const today =
    new Date();

  state.viewDate =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      1
    );

  render();
}

function setMobile(value){

  state.mobile =
    !!value;

  closeDetail();

  closeMobileMenu();

  render();
}

function updateSearch(value){

  state.search.query =
    normalizeQuery(value);

  state.search.tokens =
    state.search.query
      ? state.search.query
          .split(" ")
          .filter(Boolean)
      : [];

  render();
}

function updateSearchMeta(){

  if(
    !state.search.tokens.length
  ){
    $("#searchMeta").textContent =
      "AND 검색";

    return;
  }

  let count = 0;

  if(
    state.tab === "student"
  ){

    count =
      Object.values(
        data.studentEventsById
      )
      .filter(
        event=>
          matchesStudent(
            event.text
          )
      )
      .length;

  }else if(
    state.tab === "dept"
  ){

    count =
      (
        data.deptIndex[
          state.dept
        ] || []
      )
      .filter(id=>
        matches(
          data.eventsById[
            id
          ].dept,

          data.eventsById[
            id
          ].text
        )
      )
      .length;

  }else if(
    state.tab === "nuga"
  ){

    count =
      data.nuga
        .filter(row=>{

          const hay =
            `${row.displayCategory[state.nuga.grade]} ${row.content} ${row.remark}`
              .toLowerCase();

          return state.search.tokens.every(
            token=>
              hay.includes(token)
          );
        })
        .length;

  }else{

    count =
      Object.values(
        data.eventsById
      )
      .filter(
        event=>
          matches(
            event.dept,
            event.text
          )
      )
      .length;
  }

  $("#searchMeta").textContent =
    `${count}건`;
}

function scrollToday(){

  const main =
    $("#appMain");

  const target =
    $(
      ".today,.today-row",
      main
    );

  if(!target){
    return;
  }

  const targetRect =
    target.getBoundingClientRect();

  const mainRect =
    main.getBoundingClientRect();

  main.scrollTop =
    Math.max(
      0,
      main.scrollTop +
      (
        targetRect.top -
        mainRect.top
      ) -
      Math.max(
        0,
        (
          main.clientHeight -
          targetRect.height
        ) / 2
      )
    );
}

/* =========================
   12. 요청 전송
   ========================= */

async function submitRequest(event){

  event.preventDefault();

  const name =
    $("#reqName")
      .value
      .trim();

  const type =
    $("#reqType")
      .value;

  const content =
    $("#reqContent")
      .value
      .trim();

  const button =
    $("#submitRequestBtn");

  if(
    !name ||
    !content
  ){
    alert(
      "성함과 요청 내용을 모두 입력해 주세요."
    );

    return;
  }

  const draft = {
    name,
    type,
    content,
    createdAt:Date.now()
  };

  try{
    localStorage.setItem(
      "academic-calendar-request-draft",
      JSON.stringify(draft)
    );
  }catch{}

  button.disabled =
    true;

  button.textContent =
    "전송 중...";

  try{

    await fetch(
      CONFIG.WEB_APP_URL,
      {
        method:"POST",
        mode:"no-cors",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:
          JSON.stringify({
            name,
            type,
            content
          })
      }
    );

    alert(
      "전송 요청을 보냈습니다. 현재 Apps Script 전송 방식에서는 서버의 최종 저장 성공 여부를 브라우저에서 확인할 수 없습니다."
    );

  }catch(error){

    alert(
      "전송 요청을 시작하지 못했습니다. 입력 내용은 브라우저에 임시 저장되어 있습니다."
    );

  }finally{

    button.disabled =
      false;

    button.textContent =
      "요청 보내기";
  }
}

function restoreRequestDraft(){

  if(
    state.tab !== "request"
  ){
    return;
  }

  try{

    const draft =
      JSON.parse(
        localStorage.getItem(
          "academic-calendar-request-draft"
        ) ||
        "null"
      );

    if(!draft){
      return;
    }

    $("#reqName").value =
      draft.name || "";

    $("#reqType").value =
      draft.type ||
      "일정수정";

    $("#reqContent").value =
      draft.content ||
      "";

    $("#reqCount").textContent =
      $("#reqContent")
        .value
        .length;

  }catch{}
}

/* =========================
   13. 모바일 메뉴
   ========================= */

function openMobileMenu(){

  $("#mobileMenu").classList.add(
    "open"
  );

  $("#mobileBackdrop").classList.add(
    "open"
  );
}

function closeMobileMenu(){

  $("#mobileMenu").classList.remove(
    "open"
  );

  $("#mobileBackdrop").classList.remove(
    "open"
  );
}

/* =========================
   14. 이벤트 위임
   ========================= */

document.addEventListener(
  "click",
  event=>{

    const tab =
      event.target.closest(
        "[data-tab]"
      );

    if(tab){
      switchTab(
        tab.dataset.tab
      );

      return;
    }

    const eventItem =
      event.target.closest(
        "[data-event-id]"
      );

    if(eventItem){
      openEvent(
        +eventItem.dataset.eventId
      );

      return;
    }

    const studentItem =
      event.target.closest(
        "[data-student-id]"
      );

    if(studentItem){
      openStudentEvent(
        +studentItem.dataset.studentId
      );

      return;
    }

    const day =
      event.target.closest(
        "[data-day]"
      );

    if(
      day &&
      !state.mobile &&
      window.innerWidth > 850
    ){
      openDetail(
        day.dataset.day
      );

      return;
    }

    const dept =
      event.target.closest(
        "[data-dept]"
      );

    if(dept){
      state.dept =
        dept.dataset.dept;

      render();

      return;
    }

    const category =
      event.target.closest(
        "[data-category]"
      );

    if(category){
      state.nuga.category =
        category.dataset.category;

      render();

      return;
    }

    const grade =
      event.target.closest(
        "[data-grade]"
      );

    if(grade){

      state.nuga.grade =
        +grade.dataset.grade;

      state.nuga.category =
        "전체";

      render();

      return;
    }

    const panelDept =
      event.target.closest(
        "[data-panel-dept]"
      );

    if(panelDept){

      state.dept =
        panelDept.dataset.panelDept;

      closeDetail();

      switchTab(
        "dept"
      );

      return;
    }

    const action =
      event.target
        .closest(
          "[data-action]"
        )
        ?.dataset
        .action;

    if(
      action ===
      "prev-month"
    ){
      changeMonth(-1);
      return;
    }

    if(
      action ===
      "next-month"
    ){
      changeMonth(1);
      return;
    }

    if(
      action ===
      "today"
    ){
      goToday();
      return;
    }

    if(
      action ===
      "print"
    ){
      window.print();
      return;
    }

    const close =
      event.target.closest(
        "[data-close-modal]"
      );

    if(close){
      closeModal(
        close.dataset.closeModal
      );

      return;
    }

    if(
      event.target
        .classList
        .contains(
          "modal"
        )
    ){
      event.target
        .classList
        .remove(
          "open"
        );
    }
  }
);

document.addEventListener(
  "change",
  event=>{

    if(
      event.target.matches(
        "[data-option-group]"
      )
    ){

      const group =
        event.target.dataset
          .optionGroup;

      const key =
        event.target.dataset
          .optionKey;

      state[group][key] =
        event.target.checked;

      render();

      return;
    }

    if(
      event.target.id ===
      "deptSelect"
    ){
      state.dept =
        event.target.value;

      render();
    }
  }
);

document.addEventListener(
  "input",
  event=>{

    if(
      event.target.id ===
      "reqContent"
    ){
      $("#reqCount").textContent =
        event.target
          .value
          .length;
    }
  }
);

document.addEventListener(
  "submit",
  event=>{

    if(
      event.target.id ===
      "requestForm"
    ){
      submitRequest(event);
    }
  }
);

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key ===
      "Escape"
    ){
      closeDetail();

      closeMobileMenu();

      $$(".modal.open")
        .forEach(
          modal=>
            modal.classList.remove(
              "open"
            )
        );
    }

    const active =
      document.activeElement;

    if(
      (
        event.key ===
        "Enter" ||
        event.key ===
        " "
      ) &&
      active?.matches(
        ".cal-cell[data-day],.dept-card[data-event-id]"
      )
    ){
      event.preventDefault();

      if(
        active.matches(
          ".dept-card"
        )
      ){
        openEvent(
          +active.dataset.eventId
        );
      }else{
        openDetail(
          active.dataset.day
        );
      }
    }

    if(
      event.key === "/" &&
      ![
        "INPUT",
        "TEXTAREA",
        "SELECT"
      ].includes(
        active?.tagName
      )
    ){
      event.preventDefault();

      $("#searchInput").focus();
    }

    if(
      event.altKey &&
      event.key ===
      "ArrowLeft"
    ){
      event.preventDefault();

      changeMonth(-1);
    }

    if(
      event.altKey &&
      event.key ===
      "ArrowRight"
    ){
      event.preventDefault();

      changeMonth(1);
    }
  }
);

/* =========================
   15. 고정 컨트롤
   ========================= */

let searchTimer = null;

$("#searchInput")
  .addEventListener(
    "input",
    event=>{

      clearTimeout(
        searchTimer
      );

      searchTimer =
        setTimeout(
          ()=>{
            updateSearch(
              event.target.value
            );
          },
          140
        );
    }
  );

$("#retryBtn").onclick =
  reloadAll;

$("#closeBannerBtn").onclick =
  hideError;

$("#refreshBtn").onclick =
  reloadAll;

$("#scaleDownBtn").onclick =
  ()=>{

    state.scale =
      clamp(
        -2,
        2,
        state.scale-1
      );

    render();
  };

$("#scaleResetBtn").onclick =
  ()=>{

    state.scale =
      0;

    render();
  };

$("#scaleUpBtn").onclick =
  ()=>{

    state.scale =
      clamp(
        -2,
        2,
        state.scale+1
      );

    render();
  };

$("#darkBtn").onclick =
  ()=>{

    state.dark =
      !state.dark;

    render();
  };

$("#viewBtn").onclick =
  ()=>setMobile(
    !state.mobile
  );

$("#mobileFab").onclick =
  openMobileMenu;

$("#mobileCloseBtn").onclick =
  closeMobileMenu;

$("#mobileBackdrop").onclick =
  closeMobileMenu;

$("#detailCloseBtn").onclick =
  closeDetail;

$("#detailDoneBtn").onclick =
  closeDetail;

$("#detailPrevBtn").onclick =
  ()=>moveDetail(-1);

$("#detailNextBtn").onclick =
  ()=>moveDetail(1);

$("#detailTodayBtn").onclick =
  ()=>openDetail(
    getDateKey(
      new Date()
    )
  );

$("#detailCopyBtn").onclick =
  ()=>{

    if(
      state.detailDate &&
      navigator.clipboard
    ){
      navigator.clipboard.writeText(
        dayText(
          state.detailDate
        )
      );
    }
  };

/* =========================
   16. 부팅
   ========================= */

restorePrefs();

applyPrefs();

render();

let resizeTimer = null;

window.addEventListener(
  "resize",
  ()=>{

    clearTimeout(
      resizeTimer
    );

    resizeTimer =
      setTimeout(
        ()=>{

          const shouldMobile =
            window.innerWidth <= 850;

          if(
            shouldMobile !==
              state.mobile &&
            window.innerWidth <= 850
          ){
            setMobile(true);
          }

          if(
            window.innerWidth > 850 &&
            state.mobile &&
            matchMedia(
              "(pointer:fine)"
            ).matches
          ){
            setMobile(false);
          }

        },
        180
      );
  }
);

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(
      !document.hidden &&
      state.load.lastRefresh &&
      Date.now() -
        state.load.lastRefresh >
        300000
    ){
      reloadAll();
    }
  }
);

setInterval(
  ()=>{

    if(
      !document.hidden &&
      state.load.lastRefresh
    ){
      reloadAll();
    }
  },
  300000
);

reloadAll();
</script>
