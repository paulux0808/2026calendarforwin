<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="교무실 학사일정·월중계획·자습감독·창체 누가기록을 한 곳에서 보고 A4 한 장으로 인쇄합니다.">
<meta name="theme-color" content="#1E3D63">
<title>학사력</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%2032%2032%27%3E%3Crect%20width%3D%2732%27%20height%3D%2732%27%20rx%3D%276%27%20fill%3D%27%23B33A26%27%2F%3E%3Ctext%20x%3D%2716%27%20y%3D%2724%27%20font-size%3D%2721%27%20text-anchor%3D%27middle%27%20fill%3D%27%23FCFCFA%27%20font-family%3D%27Noto%20Serif%20KR%2Cserif%27%20font-weight%3D%27700%27%3E%ED%95%99%3C%2Ftext%3E%3C%2Fsvg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<script>
/* 저장해 둔 테마를 먼저 적용해 첫 화면이 번쩍이지 않게 한다. */
(function(){
  try{
    var saved = JSON.parse(localStorage.getItem("hs-calendar-prefs-v1") || "{}");
    var theme = saved && saved.theme;
    var dark = theme === "dark" || ((!theme || theme === "system") &&
      window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if(saved && [0.92,1,1.12].indexOf(saved.fontScale) >= 0){
      document.documentElement.style.setProperty("--fs", String(saved.fontScale));
    }
  }catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>

<style>
/* ============================================================
   학사력 — 교무 학사일정
   디자인: 「잉크와 갱지」. 종이 학사력의 괘선·표·도장을 옮기고,
   종이가 못 하는 것(내 당번·검색·학년도 조망)을 얹는다.
   ============================================================ */

/* --- 1. 토큰 ------------------------------------------------ */
:root{
  color-scheme: light;

  --paper:#F4F4F0;        /* 갱지 바탕 */
  --sheet:#FCFCFA;        /* 표·카드 면 */
  --sheet-2:#F0F0EA;      /* 표 머리 */
  --ink:#14181D;
  --ink-2:#4A525C;
  --ink-3:#79828D;
  --rule:#E2E0D8;         /* 괘선 */
  --rule-2:#D2CFC4;
  --indigo:#1E3D63;       /* 주색 — 청람 */
  --indigo-soft:#E7EDF5;
  --seal:#B33A26;         /* 도장색 — 오늘·내 차례에만 */
  --seal-soft:#F7E7E2;
  --sat:#2A66C6;          /* 토 */
  --sun:#B33A26;          /* 일 */
  --shadow:0 1px 2px rgba(20,24,29,.05), 0 8px 24px rgba(20,24,29,.06);
  --shadow-lift:0 2px 6px rgba(20,24,29,.08), 0 18px 44px rgba(20,24,29,.12);

  /* 창체 영역 4색 — 명도대역·CVD 분리 검증 통과 */
  --c-auto:#2A66C6; --c-serve:#118A72; --c-club:#C4700F; --c-career:#9040AE;

  /* 부서 색 — 부서마다 --dh(색상) --ds(채도) 를 주입하고,
     아래 보정치로 칩·괘선·글자색을 그 자리에서 만든다. */
  --tint-s:0%;  --tint-l:90%;   /* 칩 바탕 */
  --soft-s:0%;  --soft-l:95.5%; /* 마우스를 올렸을 때 */
  --label-s:18%; --label-l:27%; /* 칩 글자 */
  --edge-s:11%; --edge-l:44%;   /* 왼쪽 괘선 */

  --fs:1;
  --t-2xs:calc(10.5px * var(--fs));
  --t-xs:calc(11.5px * var(--fs));
  --t-sm:calc(12.5px * var(--fs));
  --t-md:calc(13.5px * var(--fs));
  --t-lg:calc(15px * var(--fs));
  --t-xl:calc(19px * var(--fs));
  --t-display:calc(32px * var(--fs));

  --serif:"Noto Serif KR", ui-serif, Batang, "Times New Roman", serif;
  --sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
         "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", system-ui, sans-serif;

  --rail:248px;
  --r-sm:5px; --r-md:9px; --r-lg:14px;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --paper:#14161A; --sheet:#1B1E23; --sheet-2:#22262C;
  --ink:#E8E8E3; --ink-2:#A9B1BB; --ink-3:#7C848F;
  --rule:#2B2F36; --rule-2:#3A404A;
  --indigo:#86AEE0; --indigo-soft:#1D2A3A;
  --seal:#EE7059; --seal-soft:#2E1D1A;
  --sat:#7FA9DC; --sun:#EE7059;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.36);
  --shadow-lift:0 2px 6px rgba(0,0,0,.5), 0 18px 44px rgba(0,0,0,.5);
  --c-auto:#4A87DA; --c-serve:#10A288; --c-club:#CC7F2A; --c-career:#A868C8;
  --tint-s:-6%; --tint-l:24%;
  --soft-s:-10%; --soft-l:18%;
  --label-s:16%; --label-l:78%;
  --edge-s:11%; --edge-l:57%;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--t-md); line-height:1.5;
  font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;background:none;border:0;padding:0;touch-action:manipulation}
button:disabled{cursor:not-allowed;opacity:.45}
a{color:var(--indigo)}
h1,h2,h3,h4,p,dl,dd,figure{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:3px}
::selection{background:var(--indigo-soft);color:var(--ink)}
mark{background:hsl(48 90% 72% / .55);color:inherit;border-radius:2px;padding:0 1px}
:root[data-theme="dark"] mark{background:hsl(48 70% 40% / .45)}

/* --- 2. 공통 조각 ------------------------------------------- */
.eyebrow{
  font-size:var(--t-2xs); font-weight:700; letter-spacing:.15em;
  color:var(--ink-3); text-transform:uppercase;
}
.serif{font-family:var(--serif);font-weight:700;letter-spacing:-.02em}
.seal-dot{
  display:inline-block;width:6px;height:6px;background:var(--seal);
  vertical-align:middle;flex:none;
}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:34px;padding:0 11px;border:1px solid var(--rule-2);border-radius:var(--r-sm);
  background:var(--sheet);color:var(--ink);font-size:var(--t-sm);font-weight:600;
  white-space:nowrap;transition:background .12s,border-color .12s,color .12s;
}
.btn:hover:not(:disabled){background:var(--sheet-2);border-color:var(--ink-3)}
.btn[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:var(--sheet)}
.btn-primary{background:var(--indigo);border-color:var(--indigo);color:#FCFCFA}
:root[data-theme="dark"] .btn-primary{color:#12161C}
.btn-primary:hover:not(:disabled){filter:brightness(1.08);background:var(--indigo)}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover:not(:disabled){background:var(--sheet-2);border-color:transparent}
.btn-icon{min-width:34px;padding:0 7px}
.btn-sm{min-height:28px;padding:0 8px;font-size:var(--t-xs)}

.field{
  min-height:34px;padding:0 9px;border:1px solid var(--rule-2);border-radius:var(--r-sm);
  background:var(--sheet);font-size:var(--t-sm);
}
.field:focus{outline:2px solid var(--indigo);outline-offset:-1px;border-color:var(--indigo)}

.card{
  background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-md);
}
.card-head{
  display:flex;align-items:center;gap:8px;padding:11px 14px 0;
}
.card-head h2,.card-head h3{font-size:var(--t-sm);font-weight:700;letter-spacing:-.01em}
.card-head .count{font-size:var(--t-xs);color:var(--ink-3);font-weight:600;margin-left:auto}

.chip{
  display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px;
  border-radius:3px;font-size:var(--t-2xs);font-weight:700;letter-spacing:-.01em;
  background:hsl(var(--dh,210) calc(var(--ds,8%) + var(--tint-s)) var(--tint-l));color:hsl(var(--dh,210) calc(var(--ds,8%) + var(--label-s)) var(--label-l));white-space:nowrap;flex:none;
}

/* 일정 한 줄 — 부서 색을 왼쪽 괘선으로 */
.ev{
  display:flex;gap:7px;align-items:baseline;width:100%;text-align:left;
  padding:2px 4px 2px 8px;border-left:3px solid hsl(var(--dh,210) calc(var(--ds,8%) + var(--edge-s)) var(--edge-l));
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  font-size:var(--t-sm);line-height:1.45;overflow-wrap:anywhere;
  transition:background .12s;
}
.ev:hover{background:hsl(var(--dh,210) calc(var(--ds,8%) + var(--soft-s)) var(--soft-l))}
.ev .ev-dept{
  font-size:var(--t-2xs);font-weight:700;color:hsl(var(--dh,210) calc(var(--ds,8%) + var(--label-s)) var(--label-l));flex:none;
  background:hsl(var(--dh,210) calc(var(--ds,8%) + var(--tint-s)) var(--tint-l));border-radius:3px;padding:1px 5px;line-height:1.5;
}
.ev .ev-text{min-width:0}
.ev.is-student{border-left-style:dashed}

.empty{
  padding:34px 16px;text-align:center;color:var(--ink-3);font-size:var(--t-sm);
  border:1px dashed var(--rule-2);border-radius:var(--r-md);
}
.empty strong{display:block;color:var(--ink-2);font-size:var(--t-md);margin-bottom:4px}

/* --- 3. 골격 ------------------------------------------------ */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100dvh}

.rail{
  position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;
  gap:14px;padding:18px 14px;border-right:1px solid var(--rule);background:var(--sheet);
}
.brand{display:flex;align-items:center;gap:9px;padding:0 4px}
.brand-seal{
  display:grid;place-items:center;width:30px;height:30px;flex:none;
  background:var(--seal);color:#FCFCFA;border-radius:3px;
  font-family:var(--serif);font-size:17px;line-height:1;padding-bottom:2px;
}
.brand-name{font-family:var(--serif);font-size:19px;font-weight:700;letter-spacing:-.03em}
.brand-year{font-size:var(--t-2xs);color:var(--ink-3);font-weight:600;letter-spacing:.04em}

.nav{display:flex;flex-direction:column;gap:1px}
.nav button{
  display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:var(--r-sm);
  font-size:var(--t-md);font-weight:600;color:var(--ink-2);text-align:left;
  transition:background .12s,color .12s;
}
.nav button:hover{background:var(--sheet-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--indigo-soft);color:var(--indigo);font-weight:700}
.nav .nav-key{
  margin-left:auto;font-size:var(--t-2xs);color:var(--ink-3);font-weight:600;
  border:1px solid var(--rule);border-radius:3px;padding:0 4px;min-width:17px;text-align:center;
}
.nav button[aria-current="page"] .nav-key{border-color:transparent}
.nav-mark{width:3px;height:15px;background:currentColor;opacity:0;border-radius:2px;flex:none}
.nav button[aria-current="page"] .nav-mark{opacity:1}

.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.duty-card{
  padding:11px 12px;border:1px solid var(--rule);border-radius:var(--r-md);
  background:var(--paper);display:block;width:100%;text-align:left;
}
.duty-card:hover{border-color:var(--ink-3)}
.duty-card .dc-top{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.duty-card .dc-name{font-size:var(--t-sm);font-weight:700}
.duty-card .dc-when{font-size:var(--t-xs);color:var(--ink-2);line-height:1.45}
.duty-card .dc-dday{
  font-family:var(--serif);font-size:calc(17px * var(--fs));color:var(--seal);
  font-weight:700;letter-spacing:-.02em;
}
.rail-tools{display:flex;gap:5px}
.rail-tools .btn{flex:1;padding:0 6px}
.sync{font-size:var(--t-2xs);color:var(--ink-3);text-align:center;letter-spacing:.02em}

/* 모바일 하단 탭 */
.tabbar{display:none}

/* --- 4. 무대(콘텐츠) ---------------------------------------- */
.stage{min-width:0;display:flex;flex-direction:column}
.stage-head{
  position:sticky;top:0;z-index:30;background:var(--paper);
  border-bottom:1px solid var(--rule);
  padding:16px clamp(16px,2.4vw,30px) 0;
}
.head-top{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head-title{min-width:0;margin-right:auto}
.head-title h1{
  font-family:var(--serif);font-size:var(--t-display);font-weight:700;
  letter-spacing:-.035em;line-height:1.15;margin-top:1px;
}
.head-title h1 .h1-sub{
  font-family:var(--sans);font-size:var(--t-md);font-weight:600;
  color:var(--ink-3);letter-spacing:0;margin-left:9px;
}
.head-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding-bottom:3px}
.stepper{display:flex;align-items:center;gap:3px}
.stepper .field{width:150px;font-weight:600}
.search{position:relative;display:flex;align-items:center}
.search input{width:clamp(150px,17vw,250px);padding-right:52px}
.search .hit{
  position:absolute;right:9px;font-size:var(--t-2xs);color:var(--ink-3);
  font-weight:700;pointer-events:none;
}
.view-tools{
  display:flex;align-items:center;gap:7px;flex-wrap:wrap;
  padding:12px 0 13px;
}

/* 시그니처 — 학년도 띠 */
.ribbon{
  display:grid;grid-template-columns:repeat(12,1fr);gap:2px;
  align-items:end;padding:9px 0 0;position:relative;
}
.ribbon-m{
  display:flex;flex-direction:column;align-items:stretch;gap:4px;
  padding:0;border-radius:3px;position:relative;
}
.ribbon-bar{
  height:18px;display:flex;align-items:flex-end;justify-content:center;
  border-bottom:1px solid var(--rule-2);
}
.ribbon-fill{
  width:64%;background:var(--rule-2);border-radius:1px 1px 0 0;
  min-height:2px;transition:background .15s,height .2s;
}
.ribbon-m:hover .ribbon-fill{background:var(--ink-3)}
.ribbon-label{
  font-size:var(--t-2xs);font-weight:700;color:var(--ink-3);text-align:center;
  padding-bottom:9px;letter-spacing:-.02em;
}
.ribbon-m[aria-current="true"] .ribbon-fill{background:var(--indigo)}
.ribbon-m[aria-current="true"] .ribbon-label{color:var(--indigo)}
.ribbon-m.has-today .ribbon-bar{border-bottom-color:var(--seal);border-bottom-width:2px}
.ribbon-m.has-today .ribbon-label::after{
  content:"";display:block;width:5px;height:5px;background:var(--seal);
  margin:3px auto 0;
}
.ribbon-m.semester-break .ribbon-label{opacity:.55}

.stage-body{padding:18px clamp(16px,2.4vw,30px) 60px;flex:1}

.notice-bar{
  display:flex;gap:11px;align-items:flex-start;margin-bottom:14px;padding:10px 13px;
  border:1px solid var(--rule-2);border-left:3px solid var(--seal);
  border-radius:var(--r-sm);background:var(--sheet);font-size:var(--t-sm);
}
.notice-bar .eyebrow{flex:none;padding-top:2px;color:var(--seal)}
.notice-bar p{white-space:pre-wrap;overflow-wrap:anywhere}
.alert{
  display:flex;gap:10px;align-items:center;margin-bottom:14px;padding:9px 12px;
  border:1px solid hsl(38 55% 70%);background:hsl(43 90% 96%);color:hsl(28 60% 26%);
  border-radius:var(--r-sm);font-size:var(--t-sm);
}
:root[data-theme="dark"] .alert{background:hsl(38 30% 15%);color:hsl(40 70% 78%);border-color:hsl(38 30% 34%)}
.alert p{flex:1}

/* --- 5. 오늘 ------------------------------------------------ */
.today-grid{display:grid;gap:14px;align-items:start;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.today-grid > .span-all{grid-column:1/-1}

.datestamp{
  display:flex;align-items:baseline;gap:14px;padding:16px 18px 18px;
  border-bottom:1px solid var(--rule);
}
.datestamp .ds-day{
  font-family:var(--serif);font-size:calc(52px * var(--fs));font-weight:700;
  line-height:.9;letter-spacing:-.05em;
}
.datestamp .ds-meta{display:flex;flex-direction:column;gap:2px}
.datestamp .ds-dow{font-size:var(--t-lg);font-weight:700;letter-spacing:-.02em}
.datestamp .ds-dow.sun{color:var(--sun)} .datestamp .ds-dow.sat{color:var(--sat)}
.datestamp .ds-when{font-size:var(--t-xs);color:var(--ink-3);font-weight:600}
.list-plain{padding:6px 12px 12px;display:flex;flex-direction:column;gap:3px}
.list-plain .ev{padding-top:5px;padding-bottom:5px;font-size:var(--t-md)}
.list-none{padding:14px;color:var(--ink-3);font-size:var(--t-sm);text-align:center}

.duty-today{display:grid;gap:1px;background:var(--rule);border-radius:0 0 var(--r-md) var(--r-md);overflow:hidden}
.duty-today > div{background:var(--sheet);padding:10px 14px;display:flex;gap:10px;align-items:baseline}
.duty-today dt{font-size:var(--t-2xs);font-weight:700;color:var(--ink-3);letter-spacing:.1em;width:52px;flex:none}
.duty-today dd{font-size:var(--t-sm);font-weight:600}
.duty-today .is-me{background:var(--seal-soft)}
.duty-today .is-me dd{color:var(--seal);font-weight:700}

.weekstrip{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule);border-top:1px solid var(--rule)}
.weekstrip > button{
  background:var(--sheet);padding:8px 7px 10px;min-height:96px;text-align:left;
  display:flex;flex-direction:column;gap:5px;transition:background .12s;
}
.weekstrip > button:hover{background:var(--sheet-2)}
.weekstrip .ws-date{display:flex;align-items:baseline;gap:4px;font-weight:700;font-size:var(--t-sm)}
.weekstrip .ws-date small{font-size:var(--t-2xs);font-weight:600;color:var(--ink-3)}
.weekstrip .ws-date.sun,.weekstrip .ws-date.sun small{color:var(--sun)}
.weekstrip .ws-date.sat,.weekstrip .ws-date.sat small{color:var(--sat)}
.weekstrip .is-today .ws-date::before{content:"";width:5px;height:5px;background:var(--seal);display:inline-block}
.weekstrip button.is-today{background:var(--seal-soft)}
.weekstrip ul{display:flex;flex-direction:column;gap:3px}
.weekstrip li{
  font-size:var(--t-2xs);line-height:1.35;padding-left:6px;
  border-left:2px solid hsl(var(--dh,210) calc(var(--ds,8%) + var(--edge-s)) var(--edge-l));overflow-wrap:anywhere;color:var(--ink-2);
}
.weekstrip .ws-more{color:var(--ink-3);border:0;padding-left:0}
.ws-filler{display:none;background:var(--sheet)}

.upcoming{display:flex;flex-direction:column}
.upcoming > button{
  display:grid;grid-template-columns:58px 44px minmax(0,1fr);gap:4px 10px;align-items:baseline;
  padding:8px 14px;border-top:1px solid var(--rule);text-align:left;
}
.upcoming > button:first-child{border-top:0}
.upcoming > button:hover{background:var(--sheet-2)}
.upcoming .up-when{font-size:var(--t-xs);color:var(--ink-3);font-weight:700;white-space:nowrap}
.upcoming .up-dd{font-size:var(--t-xs);color:var(--seal);font-weight:700;white-space:nowrap}
.upcoming .up-body{display:flex;gap:7px;align-items:baseline;min-width:0}

/* --- 6. 달력 ------------------------------------------------ */
.legend{
  display:flex;flex-wrap:wrap;gap:4px;align-items:center;
}
.legend button{
  display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:3px;
  font-size:var(--t-2xs);font-weight:700;border:1px solid transparent;
  background:hsl(var(--dh,210) calc(var(--ds,8%) + var(--tint-s)) var(--tint-l));color:hsl(var(--dh,210) calc(var(--ds,8%) + var(--label-s)) var(--label-l));
}
.legend button[aria-pressed="false"]{background:transparent;color:var(--ink-3);border-color:var(--rule)}
.legend .swatch{width:8px;height:8px;background:hsl(var(--dh,210) calc(var(--ds,8%) + var(--edge-s)) var(--edge-l));flex:none}
.legend button[aria-pressed="false"] .swatch{opacity:.35}

.month{
  display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:var(--r-md);
  overflow:hidden;
}
.month + .month-caption{margin-top:24px}
.month-caption{
  font-family:var(--serif);font-size:var(--t-xl);font-weight:700;
  margin:0 0 8px;letter-spacing:-.03em;
}
.dow-head{
  padding:7px 6px;text-align:center;background:var(--sheet-2);
  font-size:var(--t-2xs);font-weight:700;letter-spacing:.1em;color:var(--ink-3);
}
.dow-head.sun{color:var(--sun)} .dow-head.sat{color:var(--sat)}
.day{
  background:var(--sheet);padding:6px 7px 8px;min-height:112px;min-width:0;
  display:flex;flex-direction:column;gap:4px;
}
.day.is-weekend{background:var(--paper)}
.day-filler{background:var(--paper)}
.day.is-today{background:var(--seal-soft);box-shadow:inset 0 2px 0 var(--seal)}
.day-num{
  display:inline-flex;align-items:baseline;gap:4px;align-self:flex-start;
  padding:1px 4px;margin:-1px -4px 0;border-radius:3px;font-weight:700;font-size:var(--t-md);
}
.day-num small{font-size:var(--t-2xs);font-weight:600;color:var(--ink-3)}
.day-num:hover{background:var(--sheet-2);text-decoration:underline}
.day.sun .day-num,.day.sun .day-num small{color:var(--sun)}
.day.sat .day-num,.day.sat .day-num small{color:var(--sat)}
.day-events{display:flex;flex-direction:column;gap:2px;min-width:0}
.day .ev{font-size:var(--t-xs);padding-left:6px;border-left-width:3px}
.day .ev-dept{display:block}
.weekend-fold{
  margin-top:auto;padding-top:5px;border-top:1px dashed var(--rule-2);
  display:flex;flex-direction:column;gap:2px;
}
.weekend-fold .wf-label{font-size:var(--t-2xs);font-weight:700;color:var(--ink-3);letter-spacing:.08em}
.day-none{font-size:var(--t-2xs);color:var(--ink-3);display:none}

/* --- 7. 표 (월중계획 · 학생일정) ---------------------------- */
.sheet-frame{border:1px solid var(--rule);border-radius:var(--r-md);background:var(--sheet);overflow:hidden}
table.rows{width:100%;border-collapse:collapse;table-layout:fixed}
table.rows th{
  padding:8px 10px;text-align:left;background:var(--sheet-2);color:var(--ink-3);
  font-size:var(--t-2xs);font-weight:700;letter-spacing:.04em;white-space:nowrap;
  border-bottom:1px solid var(--rule-2);position:sticky;top:0;z-index:2;
}
table.rows td{padding:5px 10px;vertical-align:top;border-bottom:1px solid var(--rule);overflow-wrap:anywhere}
table.rows tr:last-child td{border-bottom:0}
table.rows tr.is-weekend{background:var(--paper)}
table.rows tr.is-today{background:var(--seal-soft);box-shadow:inset 3px 0 0 var(--seal)}
.col-date{width:58px}.col-dow{width:46px}.col-duty{width:104px}
table.rows .day-num small{display:none}
td.cell-date{padding-top:4px}
td.cell-dow{font-size:var(--t-xs);color:var(--ink-3);font-weight:600;padding-top:8px}
tr.sun td.cell-dow,tr.sun .day-num{color:var(--sun)}
tr.sat td.cell-dow,tr.sat .day-num{color:var(--sat)}
td.cell-duty{font-size:var(--t-sm);padding-top:7px}
td.cell-duty .duty-me{
  display:inline-flex;align-items:center;gap:4px;font-weight:700;color:var(--seal);
}
td.cell-body{padding-top:3px}
.cell-events{display:flex;flex-direction:column;gap:2px;padding:2px 0}
.is-inline .cell-events{display:block}
.is-inline .ev{
  display:inline;border-left:0;padding:0;margin-right:10px;
  border-bottom:2px solid hsl(var(--dh,210) calc(var(--ds,8%) + var(--edge-s)) var(--edge-l));line-height:1.7;
}
.is-inline .ev:hover{background:hsl(var(--dh,210) calc(var(--ds,8%) + var(--soft-s)) var(--soft-l))}
.dash{color:var(--ink-3);font-size:var(--t-xs)}

/* --- 8. 부서별 ---------------------------------------------- */
.dept-month{margin-bottom:22px}
.dept-list{border:1px solid var(--rule);border-radius:var(--r-md);background:var(--sheet);overflow:hidden}
.dept-row{
  display:grid;grid-template-columns:118px minmax(0,1fr);gap:12px;
  padding:8px 13px;border-bottom:1px solid var(--rule);align-items:baseline;
}
.dept-row:last-child{border-bottom:0}
.dept-row .dr-when{font-size:var(--t-xs);color:var(--ink-3);font-weight:700}
.dept-row .dr-when .is-today-tag{color:var(--seal)}
.dept-row .ev{font-size:var(--t-md)}

/* --- 9. 누가기록 -------------------------------------------- */
.seg{display:inline-flex;gap:2px;padding:2px;background:var(--sheet-2);border-radius:var(--r-sm)}
.seg button{
  padding:5px 11px;border-radius:4px;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);
  display:inline-flex;align-items:baseline;gap:5px;
}
.seg button small{font-size:var(--t-2xs);color:var(--ink-3);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"] small{color:var(--ink-2)}

.hours-summary{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.hstat{padding:11px 13px;border:1px solid var(--rule);border-radius:var(--r-md);background:var(--sheet)}
.hstat .hs-top{display:flex;align-items:center;gap:6px;margin-bottom:7px}
.hstat .hs-mark{width:9px;height:9px;flex:none;background:var(--cat)}
.hstat .hs-name{font-size:var(--t-xs);font-weight:700}
.hstat .hs-value{font-family:var(--serif);font-size:calc(23px * var(--fs));font-weight:700;line-height:1;letter-spacing:-.03em}
.hstat .hs-value span{font-family:var(--sans);font-size:var(--t-xs);font-weight:600;color:var(--ink-3);margin-left:3px}
.hstat .hs-track{height:4px;background:var(--sheet-2);border-radius:2px;margin-top:8px;overflow:hidden}
.hstat .hs-bar{height:100%;background:var(--cat);border-radius:2px}
.cat-mark{width:9px;height:9px;flex:none;display:inline-block;background:var(--cat);vertical-align:-1px}
.hours-table td{font-size:var(--t-sm)}
.hours-table .col-num{width:80px;text-align:right;white-space:nowrap}
.hours-table .col-when{width:84px;white-space:nowrap}
.hours-table tfoot td{background:var(--sheet-2);font-weight:700;border-top:1px solid var(--rule-2)}
.hours-cards{display:none}
.warn{
  font-size:var(--t-xs);color:var(--ink-2);background:var(--sheet-2);
  padding:8px 11px;border-radius:var(--r-sm);margin-bottom:10px;
  border-left:3px solid hsl(38 60% 55%);
}

/* --- 10. 요청 폼 -------------------------------------------- */
.form{max-width:720px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.form-field label{font-size:var(--t-xs);font-weight:700;color:var(--ink-2)}
.form-field .field{width:100%;padding:8px 10px;min-height:38px}
.form-field textarea.field{min-height:170px;resize:vertical;line-height:1.6}
.form-meta{display:flex;justify-content:space-between;gap:10px;font-size:var(--t-2xs);color:var(--ink-3);margin-top:-8px}
.form-foot{display:flex;align-items:center;gap:12px;justify-content:flex-end;margin-top:6px}
.form-status{font-size:var(--t-sm);line-height:1.5;flex:1}
.form-status.ok{color:var(--indigo);font-weight:600}
.form-status.warn-text{color:var(--seal)}

/* --- 11. 다이얼로그 ----------------------------------------- */
dialog{
  width:min(660px,calc(100vw - 24px));max-height:86dvh;padding:0;border:0;
  border-radius:var(--r-lg);background:var(--sheet);color:var(--ink);box-shadow:var(--shadow-lift);
}
dialog::backdrop{background:rgba(15,20,26,.5);backdrop-filter:blur(2px)}
dialog[open]{display:flex;flex-direction:column}
.dlg-head{
  display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--rule);
}
.dlg-head h2{font-family:var(--serif);font-size:var(--t-xl);font-weight:700;letter-spacing:-.03em;margin-right:auto}
.dlg-body{padding:14px 16px;overflow:auto;min-height:0;overflow-wrap:anywhere}
.dlg-body h3{
  font-size:var(--t-2xs);font-weight:700;letter-spacing:.12em;color:var(--ink-3);
  margin:16px 0 7px;display:flex;align-items:center;gap:7px;
}
.dlg-body h3::after{content:"";flex:1;height:1px;background:var(--rule)}
.dlg-body h3:first-child{margin-top:0}
.dlg-foot{padding:11px 16px;border-top:1px solid var(--rule);display:flex;gap:7px;justify-content:flex-end;flex-wrap:wrap}
.dlg-foot .spacer{margin-right:auto}
.detail-item{padding:7px 9px;border-radius:var(--r-sm);display:flex;gap:8px;align-items:baseline}
.detail-item + .detail-item{border-top:1px solid var(--rule)}
.detail-item.selected{background:var(--indigo-soft)}
.detail-item p{white-space:pre-wrap;min-width:0}
.detail-meta{display:grid;grid-template-columns:60px minmax(0,1fr);gap:5px 10px;font-size:var(--t-sm)}
.detail-meta dt{color:var(--ink-3);font-weight:600}
.detail-meta dd.is-me{color:var(--seal);font-weight:700}
.kbd-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:7px 18px}
.kbd-list div{display:flex;gap:9px;align-items:center;font-size:var(--t-sm)}
kbd{
  font:inherit;font-size:var(--t-2xs);font-weight:700;min-width:22px;text-align:center;
  border:1px solid var(--rule-2);border-bottom-width:2px;border-radius:4px;padding:1px 5px;
  background:var(--paper);
}
.duty-log{display:flex;flex-direction:column}
.duty-log button{
  display:grid;grid-template-columns:96px 74px minmax(0,1fr);gap:10px;align-items:baseline;
  padding:8px 9px;border-radius:var(--r-sm);text-align:left;font-size:var(--t-sm);
}
.duty-log button:hover{background:var(--sheet-2)}
.duty-log .dl-past{color:var(--ink-3)}
.duty-log .dl-next{color:var(--seal);font-weight:700}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);
  max-width:calc(100vw - 24px);padding:10px 15px;border-radius:var(--r-sm);
  background:var(--ink);color:var(--paper);font-size:var(--t-sm);font-weight:600;
  z-index:900;box-shadow:var(--shadow-lift);
}

/* --- 12. 인쇄 미리보기 · 종이 ------------------------------- */
#printDialog{width:min(940px,calc(100vw - 24px))}
.print-layout{display:grid;grid-template-columns:minmax(0,1fr) 232px;gap:16px}
.paper-viewport{
  background:var(--sheet-2);border:1px solid var(--rule);border-radius:var(--r-sm);
  padding:12px;display:block;overflow:hidden;
}
.paper-stage{
  width:196mm;height:281mm;background:#fff;position:relative;flex:none;
  transform-origin:top left;box-shadow:0 2px 14px rgba(0,0,0,.18);
}
.print-options{display:flex;flex-direction:column;gap:9px}
.print-options .opt-group{display:flex;flex-direction:column;gap:2px}
.print-note{
  font-size:var(--t-xs);color:var(--ink-2);background:var(--paper);
  border-radius:var(--r-sm);padding:9px 11px;line-height:1.5;
}
.print-note.tight{border-left:3px solid var(--seal);color:var(--seal)}
.print-note b{font-weight:700}
.check{
  display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:var(--t-sm);
  cursor:pointer;border-radius:var(--r-sm);
}
.check:hover{background:var(--sheet-2)}
.check input{width:15px;height:15px;margin:0;accent-color:var(--indigo);flex:none}

/* 종이 조판 — 화면과 인쇄가 동일한 트리를 쓴다 */
.paper{
  position:absolute;left:0;top:0;width:196mm;transform-origin:top left;
  color:#111;background:#fff;
  font-family:var(--sans);font-size:var(--paper-font,10pt);line-height:1.25;
}
.paper-head{display:flex;align-items:flex-end;gap:8px;margin:0 0 2.6mm;padding-bottom:1.4mm;border-bottom:1.2pt solid #222}
.paper-head h1{font-family:var(--serif);font-size:1.62em;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-right:auto}
.paper-head .ph-meta{font-size:.82em;color:#555;padding-bottom:.4mm}
table.paper-table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:inherit}
.paper-table th,.paper-table td{
  border:.5pt solid #6b6b6b;padding:var(--paper-pad,1.3px) 3px;line-height:1.22;
  vertical-align:middle;overflow-wrap:anywhere;
}
.paper-table th{background:#ecedea;font-weight:700;text-align:center;font-size:.9em;letter-spacing:.02em}
.paper-table tbody tr{height:var(--paper-row,auto)}
.paper-table .p-date{width:7mm;text-align:center;font-weight:700}
.paper-table .p-dow{width:8.5mm;text-align:center;white-space:nowrap}
.paper-table .p-duty{width:20mm;text-align:center}
.paper-table .p-weekend{background:#f4f4f1}
.paper-table .p-today{background:#efe6e2;box-shadow:inset 2pt 0 0 #B33A26}
.p-ev{display:block;margin-bottom:.4mm}
.p-ev:last-child{margin-bottom:0}
.paper.is-inline .p-ev{display:inline;margin:0}
.paper.is-inline .p-ev + .p-ev::before{content:" · ";color:#777}
.p-dept{font-weight:700;font-size:.86em;color:#333;margin-right:2px;white-space:nowrap}
.p-none{color:#a9a9a9}
.paper-foot{margin-top:1.8mm;display:flex;justify-content:space-between;font-size:.76em;color:#666}
/* 종이 달력 */
.paper-cal{display:grid;gap:0;border:.5pt solid #6b6b6b;border-width:.5pt 0 0 .5pt}
.paper-cal .pc-head,.paper-cal .pc-day{border:.5pt solid #6b6b6b;border-width:0 .5pt .5pt 0;padding:1mm 1.2mm}
.paper-cal .pc-head{background:#ecedea;text-align:center;font-weight:700;font-size:.9em}
.paper-cal .pc-day{min-height:var(--paper-row,20mm);overflow:hidden}
.paper-cal .pc-num{font-weight:700;display:block;margin-bottom:.5mm}
.paper-cal .pc-weekend{background:#f4f4f1}
.paper-cal .pc-today{background:#efe6e2}

/* --- 13. 반응형 --------------------------------------------- */
@media (max-width:1039px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{
    position:static;height:auto;flex-direction:row;align-items:center;gap:10px;
    padding:9px max(12px,env(safe-area-inset-left)) 9px max(12px,env(safe-area-inset-right));
    padding-top:max(9px,env(safe-area-inset-top));
    border-right:0;border-bottom:1px solid var(--rule);
    position:sticky;top:0;z-index:40;
  }
  .rail .nav,.rail .duty-card,.rail .sync{display:none}
  .rail-foot{margin:0 0 0 auto;flex-direction:row;align-items:center}
  .tabbar{
    display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1px;
    position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--rule);
    border-top:1px solid var(--rule);
    padding-bottom:env(safe-area-inset-bottom);
  }
  .tabbar button{
    background:var(--sheet);display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:7px 2px 8px;font-size:var(--t-2xs);font-weight:700;color:var(--ink-3);
  }
  .tabbar button[aria-current="page"]{color:var(--indigo);box-shadow:inset 0 2px 0 var(--indigo)}
  .tabbar .tb-glyph{font-size:15px;line-height:1}
  .stage-head{padding:12px 14px 0}
  .head-title h1{font-size:calc(25px * var(--fs))}
  .head-title h1 .h1-sub{display:block;margin:2px 0 0;font-size:var(--t-sm)}
  .head-actions{width:100%;gap:6px}
  .search{flex:1}
  .search input{width:100%;font-size:16px}
  .stepper{flex:1}
  .stepper .field{flex:1;width:auto;font-size:16px}
  .stage-body{padding:14px 14px 96px}
  .today-grid{grid-template-columns:minmax(0,1fr)}
  .ribbon{padding-top:7px}
  .ribbon-bar{height:16px}
}
@media (max-width:719px){
  .ribbon-label{font-size:9px}
  .month{display:flex;flex-direction:column;background:var(--sheet);gap:0}
  .dow-head{display:none}
  .day{
    display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;
    min-height:0;padding:8px 10px;border-bottom:1px solid var(--rule);align-items:start;
  }
  .day:last-child{border-bottom:0}
  .day-num{
    grid-row:1/3;flex-direction:column;align-items:center;justify-content:center;gap:0;
    margin:0;min-height:36px;font-size:var(--t-lg);
  }
  .day-num small{font-size:9px}
  .day-events{grid-column:2}
  .day .ev{font-size:var(--t-sm)}
  .day-none{display:block;grid-column:2;padding-top:6px}
  .weekend-fold{grid-column:2;margin-top:4px}
  .weekstrip{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ws-filler{display:block}
  .weekstrip > button{min-height:0}
  table.rows,table.rows tbody{display:block;width:100%}
  table.rows thead{display:none}
  table.rows tbody tr{
    display:grid;grid-template-columns:42px minmax(0,1fr);gap:3px 10px;
    padding:8px 11px;border-bottom:1px solid var(--rule);
  }
  table.rows tbody tr:last-child{border-bottom:0}
  table.rows td{display:block;border:0;padding:0;width:auto}
  table.rows td.cell-date{grid-row:1/6}
  table.rows td.cell-dow{display:none}
  table.rows td.cell-body,table.rows td.cell-duty{grid-column:2}
  table.rows td.cell-duty{font-size:var(--t-xs);color:var(--ink-2)}
  table.rows td.cell-duty:empty{display:none}
  table.rows td.cell-duty:not(:empty)::before{content:attr(data-label) " ";color:var(--ink-3);font-weight:700}
  .dept-row{grid-template-columns:minmax(0,1fr);gap:3px}
  .hours-desktop{display:none}
  .hours-cards{display:block}
  .hours-card{padding:10px 12px;border-bottom:1px solid var(--rule)}
  .hours-card:last-child{border-bottom:0}
  .hours-card .hc-top{display:flex;gap:8px;align-items:center;font-size:var(--t-xs);color:var(--ink-3);margin-bottom:4px}
  .hours-card .hc-text{font-size:var(--t-md)}
  .hours-card .hc-foot{display:flex;justify-content:space-between;gap:10px;font-size:var(--t-xs);color:var(--ink-3);margin-top:4px}
  .form-grid{grid-template-columns:1fr;gap:0}
  .print-layout{grid-template-columns:minmax(0,1fr)}
  .print-options{order:-1}
  dialog{width:calc(100vw - 16px);max-height:90dvh}
  .dlg-foot .btn{flex:1}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}

/* --- 14. 인쇄 ----------------------------------------------- */
@page{size:A4 portrait;margin:7mm}
#printRoot{position:absolute;left:-100000px;top:0;visibility:hidden;pointer-events:none}
@media print{
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important}
  body.printing > *:not(#printRoot){display:none!important}
  body.printing #printRoot{position:static;visibility:visible;pointer-events:auto}
  body.printing #printRoot .paper-stage{
    transform:none!important;box-shadow:none;width:196mm;height:281mm;overflow:hidden;
  }
  .paper{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body:not(.printing) .rail,body:not(.printing) .tabbar,body:not(.printing) .stage-head,
  body:not(.printing) .toast,dialog{display:none!important}
  body:not(.printing) .app{display:block}
  body:not(.printing) .stage-body{padding:0}
  .day,.dept-row,tr{break-inside:avoid}
}
</style>
</head>
<body>

<div class="app">
  <!-- 레일 / 상단바 -->
  <header class="rail">
    <div class="brand">
      <span class="brand-seal" aria-hidden="true">학</span>
      <span>
        <span class="brand-name">학사력</span>
        <span class="brand-year" id="brandYear">불러오는 중</span>
      </span>
    </div>

    <nav class="nav" id="railNav" aria-label="화면"></nav>

    <div class="rail-foot">
      <button class="duty-card" id="dutyCard" type="button" hidden></button>

<script>
"use strict";

/* ============================================================
   1. 설정
   ============================================================ */
const CONFIG = Object.freeze({
  WEB_APP_URL: "https://script.google.com/macros/s/AKfycbzk1DN0iDS7EdZvKq-iomzgxmiCzOwCUZwWZkN4fjvkzOZPdF1d3P9d1xt6Ii8VNnmmPQ/exec",
  SHEET_ID: "10blDNZ4zjrFU5lwCvgtoD3npwIwcCMQTeqwPgpQ_Ffg",
  SHEETS: [
    { key:"schedule",   gid:"0",          label:"연중행사계획" },
    { key:"student",    gid:"1112677469", label:"학생일정" },
    { key:"supervisor", gid:"1459415616", label:"자습감독" },

    { key:"notice",     gid:"1487091944", label:"공지사항" },

  ],
  REFRESH_MS: 5 * 60 * 1000,
  REQUEST_TIMEOUT_MS: 20000,
  SHEET_TIMEOUT_MS: 12000
});

/* 부서 — [이름, 색상(hue), 채도]. 계열을 색상군으로 묶어 부서 성격이 색에 드러나게 한다.
   기획·행정(청람) / 학생지원(자주) / 학년부(황토) / 인문교과(연두-초록) / 자연·예체능(청록) */
const DEPARTMENTS = [
  ["교목부",292,40], ["교무부",220,44], ["연구부",232,42], ["상담부",320,38], ["정보부",244,40],
  ["1학년부",16,52], ["2학년부",30,54], ["3학년부",44,54], ["기획위원",254,38], ["행정실",210,26],
  ["국어과",108,40], ["영어과",124,38], ["수학과",160,42], ["사회과",138,36], ["과학과",172,42],
  ["예체능과",184,40], ["정보과",196,42], ["외국어과",66,46], ["기타",210,8]
];
const DEPT_NAMES = DEPARTMENTS.map(d => d[0]);
const DEPT_TONE = new Map(DEPARTMENTS.map(([name, h, s]) => [name, `--dh:${h};--ds:${s}%`]));
const toneOf = dept => DEPT_TONE.get(dept) || DEPT_TONE.get("기타");

const CATEGORY_TONE = {
  "자율":"var(--c-auto)", "자율자치":"var(--c-auto)", "봉사":"var(--c-serve)",
  "동아리":"var(--c-club)", "진로":"var(--c-career)"
};

const WEEK = ["일","월","화","수","목","금","토"];
const VIEWS = {
  today:   { title:"오늘",       glyph:"◉", head:"오늘",        month:true  },
  calendar:{ title:"달력",       glyph:"▦", head:"학사일정",     month:true  },
  plan:    { title:"월중 계획",   glyph:"▤", head:"월중 계획",    month:true  },
  student: { title:"학생일정",    glyph:"▥", head:"학생일정",     month:true  },
  dept:    { title:"부서별",      glyph:"◧", head:"부서별 일정",  month:false },
  nuga:    { title:"누가기록",    glyph:"▣", head:"창체 누가기록", month:false },
  request: { title:"수정 요청",   glyph:"✎", head:"수정·추가 요청", month:false }
};
const VIEW_KEYS = Object.keys(VIEWS);
const PAPER_VIEWS = { calendar:"달력", plan:"월중 계획", student:"학생일정" };

const PREF_KEY = "hs-calendar-prefs-v1";
const CACHE_KEY = "hs-calendar-cache-v1";
const DRAFT_KEY = "hs-calendar-draft-v1";
const LEGACY_KEYS = ["academic-calendar-flow-v1", "academic-calendar-clean-v2"];

/* ============================================================
   2. 유틸
   ============================================================ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));

const esc = value => String(value ?? "").replace(/[&<>"']/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

const pad2 = n => String(n).padStart(2, "0");
const dateKey = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const todayKey = () => dateKey(new Date());

function makeDate(y, m, d){
  if(!Number.isInteger(y) || y < 1900 || y > 9999 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const date = new Date(y, m - 1, d);
  return date.getFullYear() === y && date.getMonth() === m - 1 && date.getDate() === d ? date : null;
}
/* 구글 시트가 돌려주는 온갖 날짜 표기를 하나로 모은다. */
function readDate(value){
  if(value == null || value === "") return null;
  if(value instanceof Date) return Number.isNaN(+value) ? null
    : makeDate(value.getFullYear(), value.getMonth() + 1, value.getDate());
  if(typeof value === "object") return readDate(value.v) || readDate(value.f);
  if(typeof value === "number"){
    const d = new Date(Math.floor(value - 25569) * 86400000);
    return makeDate(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  const text = String(value).trim();
  const gviz = text.match(/^Date\s*\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})(?:\s*,[^)]*)?\s*\)$/);
  if(gviz) return makeDate(+gviz[1], +gviz[2] + 1, +gviz[3]);
  const plain = text.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})(?!\d)/);
  return plain ? makeDate(+plain[1], +plain[2], +plain[3]) : null;
}
function cellText(cell){
  if(cell == null) return "";
  if(typeof cell !== "object") return String(cell).trim();
  const formatted = cell.f != null ? String(cell.f).trim() : "";
  return formatted !== "" ? formatted : String(cell.v ?? "").trim();
}
/* "1~3교시", "2,4" 같은 표기를 시간 수로 바꾼다. 해석 못 하면 valid:false. */
function parsePeriods(cell){
  const label = cellText(cell).normalize("NFKC").replace(/[[\]]/g, "").replace(/교시/g, "").trim();
  if(!label) return { label, hours:0, valid:false };
  const set = new Set();
  const normalized = label.replace(/\s*([~〜～–—-])\s*/g, "$1").replace(/[，、/|.\s]+/g, ",");
  for(const part of normalized.split(",").filter(Boolean)){
    const range = part.match(/^(\d+)(?:[~〜～–—-](\d+))?$/);
    if(!range) return { label, hours:0, valid:false };
    const from = +range[1], to = +(range[2] ?? range[1]);
    if(from < 1 || from > to || to > 24) return { label, hours:0, valid:false };
    for(let p = from; p <= to; p++) set.add(p);
  }
  return { label, hours:set.size, valid:set.size > 0 };
}

/* 3월에 시작하는 학년도. 1·2월은 앞 학년도에 속한다. */
const academicYearOf = date => date.getFullYear() - (date.getMonth() < 2 ? 1 : 0);
const semesterOf = date => (date.getMonth() >= 2 && date.getMonth() <= 7) ? "1학기" : "2학기";
function weekOfMonth(date){
  const first = new Date(date.getFullYear(), date.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;           // 월요일 시작
  return Math.floor((date.getDate() + offset - 1) / 7) + 1;
}
const monthKey = date => `${date.getFullYear()}-${pad2(date.getMonth() + 1)}`;
const firstOfMonth = key => readDate(key + "-01");
function addMonths(key, delta){
  const date = firstOfMonth(key);
  date.setMonth(date.getMonth() + delta);
  return monthKey(date);
}
function daysOfMonth(key, skipWeekends = false){
  const start = firstOfMonth(key);
  const year = start.getFullYear(), month = start.getMonth();
  const last = new Date(year, month + 1, 0).getDate();
  return Array.from({ length:last }, (_, i) => new Date(year, month, i + 1))
    .filter(d => !skipWeekends || (d.getDay() !== 0 && d.getDay() !== 6));
}
const dayDiff = (fromKey, toKey) =>
  Math.round((readDate(toKey) - readDate(fromKey)) / 86400000);

function readStore(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw == null ? fallback : (JSON.parse(raw) ?? fallback); }
  catch{ return fallback; }
}
function writeStore(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); return true; }catch{ return false; }
}

/* ============================================================
   3. 상태
   ============================================================ */
const state = {
  view: "today",
  month: monthKey(new Date()),
  query: "",
  me: "",
  theme: "system",
  fontScale: 1,
  dept: DEPT_NAMES[0],
  deptFilter: [],                                   // 달력에서 숨긴 부서
  grade: 1,
  category: "전체",
  calendar: { weekends:true, yearly:false },
  plan: { showDept:true, showPrayer:true, showSupervisor:true, skipWeekends:false, inline:false },
  student: { skipWeekends:false, inline:false },
  print: { weekends:true, showDept:true, showPrayer:true, showSupervisor:true, inline:false }
};
let hadSavedMonth = false;

function restorePrefs(){
  let saved = readStore(PREF_KEY, null);
  if(!saved || typeof saved !== "object"){
    for(const key of LEGACY_KEYS){
      const legacy = readStore(key, null);
      if(legacy && typeof legacy === "object"){ saved = legacy; break; }
    }
  }
  const p = saved && typeof saved === "object" ? saved : {};

  const view = p.view ?? p.tab;
  if(Object.hasOwn(VIEWS, view)) state.view = view;
  const month = p.month || (Number.isInteger(p.y) && Number.isInteger(p.m) ? `${p.y}-${pad2(p.m + 1)}` : null);
  if(typeof month === "string" && /^\d{4}-\d{2}$/.test(month) && firstOfMonth(month)){
    state.month = month; hadSavedMonth = true;
  }
  for(const group of ["calendar", "plan", "student", "print"]){
    for(const key of Object.keys(state[group])){
      if(typeof p[group]?.[key] === "boolean") state[group][key] = p[group][key];
    }
  }
  if(typeof p.me === "string") state.me = p.me.slice(0, 20);
  if(["light", "dark", "system"].includes(p.theme)) state.theme = p.theme;
  if([0.92, 1, 1.12].includes(p.fontScale)) state.fontScale = p.fontScale;
  if(DEPT_NAMES.includes(p.dept)) state.dept = p.dept;
  if(Array.isArray(p.deptFilter)) state.deptFilter = p.deptFilter.filter(d => DEPT_NAMES.includes(d));
  if([1, 2, 3].includes(p.grade ?? p.nuga?.grade)) state.grade = p.grade ?? p.nuga.grade;
  if(typeof (p.category ?? p.nuga?.category) === "string") state.category = p.category ?? p.nuga.category;
}
function savePrefs(){
  writeStore(PREF_KEY, {
    view:state.view, month:state.month, me:state.me, theme:state.theme, fontScale:state.fontScale,
    dept:state.dept, deptFilter:state.deptFilter, grade:state.grade, category:state.category,
    calendar:state.calendar, plan:state.plan, student:state.student, print:state.print
  });
}
function applyTheme(){
  const dark = state.theme === "dark" ||
    (state.theme === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.style.setProperty("--fs", String(state.fontScale));
  $('meta[name="theme-color"]')?.setAttribute("content", dark ? "#14161A" : "#1E3D63");
}

/* ============================================================
   4. 데이터
   ============================================================ */
const model = { schedule:[], student:[], prayer:new Map(), supervisor:new Map(), notices:[], nuga:[] };
const index = { events:new Map(), byDay:new Map(), studentByDay:new Map(), monthCount:new Map() };
const sheetReady = new Set();

let loading = false, loaded = false, loadJob = null, lastRefresh = 0, firstLoad = true;
let cacheStamp = 0, printing = false, printTimer = null;

function decodeSheet(key, raw){
  const rows = raw.table.rows.map(r => r.c || []);

  if(key === "schedule"){
    return rows.flatMap((row, n) => {
      const date = readDate(row[0]), content = cellText(row[2]);
      if(!date || !content || content === "null") return [];
      return content.split(/\r?\n/).map(s => s.trim()).filter(s => s && s !== "null")
        .map((line, i) => {
          const tagged = line.match(/^\[([^\]]+)\]\s*/);
          const known = tagged && DEPT_NAMES.includes(tagged[1].trim());
          return {
            id:`s-${n}-${i}`, key:dateKey(date), date,
            dept:known ? tagged[1].trim() : "기타",
            text:known ? line.slice(tagged[0].length) : line,
            source:"schedule"
          };
        });
    }).sort((a, b) => a.date - b.date);
  }

  if(key === "student"){
    const baseYear = academicYearOf(model.schedule[0]?.date || firstOfMonth(state.month));
    return rows.flatMap((row, n) => {
      let date = readDate(row[0]);
      const rawDate = cellText(row[0]);
      if(!date && !/^\d{4}/.test(rawDate)){
        const md = rawDate.match(/^(\d{1,2})\s*[-./]\s*(\d{1,2})(?!\d)/);
        if(md) date = makeDate(baseYear + (+md[1] < 3 ? 1 : 0), +md[1], +md[2]);
      }
      if(!date) return [];
      let text = row.slice(2).map(cellText).filter(v => v && v !== "null").join("\n")
        || row.slice(1).map(cellText)
             .filter(v => v && v !== "null" && !/^[월화수목금토일]$/.test(v)).join("\n");
      if(!text){
        const trailing = rawDate.match(/^\s*(?:\d{4}\D+)?\d{1,2}\s*[-./월]\s*\d{1,2}\s*일?\s*\(?[월화수목금토일]?\)?\s*(.*)$/);
        text = trailing?.[1] || "";
      }
      return text.split(/\r?\n/)
        .map(s => s.replace(/^\s*[-•]\s*/, "").replace(/^\s*\[[^\]]+\]\s*/, "").trim())
        .filter(Boolean)
        .map((line, i) => ({ id:`u-${n}-${i}`, key:dateKey(date), date, text:line, dept:"", source:"student" }));
    }).sort((a, b) => a.date - b.date);
  }

  if(key === "prayer" || key === "supervisor"){
    const map = new Map();
    for(const row of rows){
      const date = readDate(row[0]), name = cellText(row[2]);
      if(!date || !name || name === "null") continue;
      map.set(dateKey(date), key === "prayer"
        ? { name, bible:cellText(row[3]), hymn:cellText(row[4]) }
        : name);
    }
    return map;
  }

  if(key === "notice"){
    return rows
      .filter(row => cellText(row[2]) && cellText(row[2]) !== "null")
      .map(row => ({ start:readDate(row[0]), end:readDate(row[1]), text:cellText(row[2]) }));
  }

  /* 누가기록 — 열 이름을 먼저 찾고, 없으면 자리로 되돌아간다. */
  const flat = v => String(v ?? "").replace(/\s/g, "");
  const headers = new Map();
  (raw.table.cols || []).forEach((col, i) => {
    for(const label of [col.label, col.id]) if(label) headers.set(flat(label), i);
  });
  const pick = (names, fallback) =>
    names.map(flat).map(n => headers.get(n)).find(i => i != null) ?? fallback;
  const at = {
    category:pick(["영역"], 1), date:pick(["일자", "날짜"], 2), periods:pick(["교시텍스트", "교시"], 3),
    grades:[pick(["1학년", "1"], 4), pick(["2학년", "2"], 5), pick(["3학년", "3"], 6)],
    content:pick(["활동내용", "내용"], 7), remark:pick(["비고"], 8)
  };
  return rows.flatMap((row, n) => {
    const date = readDate(row[at.date]);
    const category = cellText(row[at.category]).replace(/\(.*$/, "").trim();
    if(!date || !category) return [];
    return [{
      id:`n-${n}`, key:dateKey(date), date, category,
      ...parsePeriods(row[at.periods]),
      grades:at.grades.map(i => /^(1|o|○|◯|v|✓|✔|true|y)$/i.test(cellText(row[i]))),
      text:cellText(row[at.content]), remark:cellText(row[at.remark])
    }];
  }).sort((a, b) => a.date - b.date);
}

function buildIndex(){
  index.events = new Map();
  index.byDay = new Map();
  index.studentByDay = new Map();
  index.monthCount = new Map();
  for(const [rows, map] of [[model.schedule, index.byDay], [model.student, index.studentByDay]]){
    for(const event of rows){
      index.events.set(event.id, event);
      if(!map.has(event.key)) map.set(event.key, []);
      map.get(event.key).push(event);
    }
  }
  for(const event of model.schedule){
    const key = event.key.slice(0, 7);
    index.monthCount.set(key, (index.monthCount.get(key) || 0) + 1);
  }
}

/* 마지막으로 받은 내용을 남겨 두어, 네트워크가 없어도 화면이 비지 않는다. */
function saveCache(){
  const ok = writeStore(CACHE_KEY, {
    at: Date.now(),
    schedule: model.schedule.map(e => [e.key, e.dept, e.text]),
    student: model.student.map(e => [e.key, e.text]),
    prayer: [...model.prayer],
    supervisor: [...model.supervisor],
    notices: model.notices.map(n => [n.start ? dateKey(n.start) : "", n.end ? dateKey(n.end) : "", n.text]),
    nuga: model.nuga.map(r => [r.key, r.category, r.label, r.hours, r.valid, r.grades, r.text, r.remark])
  });
  if(ok) cacheStamp = Date.now();
}
function loadCache(){
  const cached = readStore(CACHE_KEY, null);
  if(!cached || !Array.isArray(cached.schedule)) return false;
  try{
    model.schedule = cached.schedule.map(([key, dept, text], i) =>
      ({ id:`s-c${i}`, key, date:readDate(key), dept, text, source:"schedule" })).filter(e => e.date);
    model.student = cached.student.map(([key, text], i) =>
      ({ id:`u-c${i}`, key, date:readDate(key), text, dept:"", source:"student" })).filter(e => e.date);
    model.prayer = new Map(cached.prayer);
    model.supervisor = new Map(cached.supervisor);
    model.notices = cached.notices.map(([start, end, text]) =>
      ({ start:start ? readDate(start) : null, end:end ? readDate(end) : null, text }));
    model.nuga = cached.nuga.map(([key, category, label, hours, valid, grades, text, remark], i) =>
      ({ id:`n-c${i}`, key, date:readDate(key), category, label, hours, valid, grades, text, remark }))
      .filter(r => r.date);
    cacheStamp = cached.at || 0;
    buildIndex();
    loaded = model.schedule.length > 0 || model.student.length > 0;
    return loaded;
  }catch{ return false; }
}

/* gviz는 JSONP만 내주므로 script 태그로 부른다. */
function fetchSheet(sheet){
  return new Promise((resolve, reject) => {
    const name = `hsc_${sheet.key}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const script = document.createElement("script");
    let settled = false;
    const finish = (error, raw) => {
      if(settled) return;
      settled = true;
      clearTimeout(timer);
      script.remove();
      window[name] = () => {};
      setTimeout(() => { delete window[name]; }, 60000);
      error ? reject(error) : resolve(raw);
    };
    const timer = setTimeout(() => finish(new Error("시간 초과")), CONFIG.SHEET_TIMEOUT_MS);
    window[name] = raw => {
      if(raw?.status === "error" || !Array.isArray(raw?.table?.rows)) finish(new Error("응답 형식 오류"));
      else finish(null, raw);
    };
    script.onerror = () => finish(new Error("연결 실패"));
    script.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
      + `?gid=${sheet.gid}&tqx=out:json;responseHandler:${name}&_=${Date.now()}`;
    document.body.appendChild(script);
  });
}

async function refresh(){
  if(loadJob) return loadJob;
  if(printing) return Promise.resolve();
  loading = true;
  $("#reloadBtn").disabled = true;
  $("#sync").textContent = "불러오는 중";

  loadJob = (async () => {
    const results = await Promise.allSettled(CONFIG.SHEETS.map(fetchSheet));
    const failed = [];
    let ok = 0;
    results.forEach((result, i) => {
      const sheet = CONFIG.SHEETS[i];
      try{
        if(result.status !== "fulfilled") throw result.reason;
        model[sheet.key === "notice" ? "notices" : sheet.key] = decodeSheet(sheet.key, result.value);
        sheetReady.add(sheet.key);
        ok++;
      }catch{ failed.push(sheet.label); }
    });
    buildIndex();
    loaded = loaded || ok > 0;
    if(ok){ lastRefresh = Date.now(); saveCache(); }

    if(firstLoad && !hadSavedMonth) alignToData();
    firstLoad = false;

    if(!ok){
      /* 하나도 못 받았을 때와 일부만 실패했을 때를 구분해서 말한다. */
      showAlert(cacheStamp
        ? "지금은 연결되지 않아 마지막으로 저장해 둔 내용을 보여 줍니다."
        : "일정을 불러오지 못했습니다. 연결을 확인하고 다시 시도해 주세요.");
      $("#sync").textContent = cacheStamp ? "저장본 표시 중" : "갱신 실패";
    }else if(failed.length){
      showAlert(`${failed.join(", ")}을(를) 불러오지 못했습니다. 나머지는 그대로 보여 줍니다.`);
      $("#sync").textContent = "일부 갱신 실패";
    }else{
      hideAlert();
      $("#sync").textContent = `${new Date().toLocaleTimeString("ko-KR", { hour:"2-digit", minute:"2-digit", hour12:false })} 갱신`;
    }
  })().catch(() => {
    showAlert(cacheStamp
      ? "지금은 연결되지 않아 저장해 둔 내용을 보여 줍니다."
      : "일정을 불러오지 못했습니다. 연결을 확인하고 다시 시도해 주세요.");
    $("#sync").textContent = cacheStamp ? "저장본 표시 중" : "갱신 실패";
  }).finally(() => {
    loading = false;
    loadJob = null;
    $("#reloadBtn").disabled = false;
    render({ keepScroll:true });
    if(dayState.key && $("#dayDialog").open) fillDay(dayState.key, dayState.eventId);
  });
  return loadJob;
}

/* 저장된 달이 없으면 데이터가 있는 달로 맞춘다. */
function alignToData(){
  const source = model.schedule.length ? model.schedule : model.student;
  if(!source.length) return;
  if(source.some(e => e.key.startsWith(state.month))) return;
  const upcoming = source.find(e => e.key >= todayKey()) || source.at(-1);
  state.month = upcoming.key.slice(0, 7);
}

   5. 조회 · 검색 · 당번
   ============================================================ */
const searchTokens = () => state.query.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
function matches(...parts){
  const tokens = searchTokens();
  if(!tokens.length) return true;
  const hay = parts.join(" ").toLocaleLowerCase();
  return tokens.every(token => hay.includes(token));
}
function mark(value){
  const raw = String(value ?? "");
  const tokens = [...new Set(searchTokens())];
  if(!tokens.length) return esc(raw);
  const pattern = new RegExp(tokens.sort((a, b) => b.length - a.length)
    .map(t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  let out = "", cursor = 0;
  for(const hit of raw.matchAll(pattern)){
    out += esc(raw.slice(cursor, hit.index)) + `<mark>${esc(hit[0])}</mark>`;
    cursor = hit.index + hit[0].length;
  }
  return out + esc(raw.slice(cursor));
}

const isHidden = dept => state.deptFilter.includes(dept);
function scheduleOn(key){
  return (index.byDay.get(key) || []).filter(e => !isHidden(e.dept) && matches(e.dept, e.text));
}
function studentOn(key){
  return (index.studentByDay.get(key) || []).filter(e => matches(e.text));
}

/* 같은 행사가 학사일정과 학생일정에 모두 적힌 경우를 한 번만 보여 준다. */
const flatten = text => String(text || "").toLowerCase()
  .replace(/[!！]/g, "").replace(/[·•ㆍ]/g, "").replace(/[\s ]+/g, "").trim();
function dayEntries(key){
  const students = (index.studentByDay.get(key) || []).slice();
  const queues = new Map();
  for(const event of students){
    const norm = flatten(event.text);
    if(!norm) continue;
    if(!queues.has(norm)) queues.set(norm, []);
    queues.get(norm).push(event);
  }
  const staffOnly = [];
  const deptOfStudent = new Map();
  for(const event of index.byDay.get(key) || []){
    const queue = queues.get(flatten(event.text));
    if(queue?.length) deptOfStudent.set(queue.shift().id, event.dept);
    else staffOnly.push(event);
  }
  return { staffOnly, students, deptOfStudent };
}

const splitNames = value =>
  String(value || "").split(/[,/·、|]+|\s{2,}/).map(s => s.trim()).filter(Boolean);
function isMine(value){
  if(!state.me) return false;
  const me = state.me.replace(/\s/g, "");
  if(me.length < 2) return false;
  const names = splitNames(value).map(n => n.replace(/\s/g, ""));
  if(names.includes(me)) return true;
  return names.some(name => name.length >= me.length && name.includes(me));
}
/* 내 자습감독·경건회 차례를 날짜순으로 모은다. */
function myDuties(){
  if(!state.me) return [];
  const rows = [];
  for(const [key, name] of model.supervisor) if(isMine(name)) rows.push({ key, kind:"자습감독", name });
  for(const [key, entry] of model.prayer) if(isMine(entry.name)) rows.push({ key, kind:"경건회", name:entry.name });
  return rows.sort((a, b) => a.key.localeCompare(b.key));
}
function activeNotices(){
  const today = readDate(todayKey());
  return model.notices.filter(n => (!n.start || today >= n.start) && (!n.end || today <= n.end));
}

function renderRibbon(){
  const ribbon = $("#ribbon");
  if(!VIEWS[state.view].month){ ribbon.hidden = true; return; }
  ribbon.hidden = false;

  const ay = academicYearOf(firstOfMonth(state.month));
  const months = Array.from({ length:12 }, (_, i) => {
    const m = (2 + i) % 12;
    const year = ay + (m < 2 ? 1 : 0);
    return `${year}-${pad2(m + 1)}`;
  });
  const counts = months.map(key => index.monthCount.get(key) || 0);
  const peak = Math.max(1, ...counts);
  const thisMonth = todayKey().slice(0, 7);

  ribbon.innerHTML = months.map((key, i) => {
    const month = +key.slice(5);
    const height = counts[i] ? Math.max(3, Math.round(counts[i] / peak * 17)) : 2;
    const classes = ["ribbon-m"];
    if(key === thisMonth) classes.push("has-today");
    if(month === 1 || month === 2 || month === 8) classes.push("semester-break");
    return `<button type="button" class="${classes.join(" ")}" data-month="${key}"
      aria-current="${key === state.month}"
      aria-label="${month}월 · 일정 ${counts[i]}건">
      <span class="ribbon-bar"><span class="ribbon-fill" style="height:${height}px"></span></span>
      <span class="ribbon-label">${month}</span></button>`;
  }).join("");
}

        ${prayer?.hymn ? `<div><dt>찬송</dt><dd style="font-weight:400">${esc(prayer.hymn)}</dd></div>` : ""}
        <div class="${isMine(supervisor) ? "is-me" : ""}"><dt>자습감독</dt>
          <dd>${supervisor ? esc(supervisor) : '<span style="color:var(--ink-3);font-weight:400">없음</span>'}</dd></div>
      </dl>
    </section>`;

  /* 이번 주 — 월요일 시작 */
  const monday = new Date(today);
  monday.setDate(today.getDate() - ((today.getDay() + 6) % 7));
  const week = Array.from({ length:7 }, (_, i) => {
    const date = new Date(monday);
    date.setDate(monday.getDate() + i);
    return date;
  });
  const weekCard = `
    <section class="card span-all">
      <div class="card-head"><h2>이번 주</h2>
        <span class="count">${week[0].getMonth() + 1}월 ${week[0].getDate()}일 – ${week[6].getMonth() + 1}월 ${week[6].getDate()}일</span></div>
      <div class="weekstrip">${week.map(date => {
        const dk = dateKey(date);
        const list = scheduleOn(dk);
        const dow = date.getDay();
        return `<button type="button" data-day="${dk}" class="${dk === key ? "is-today" : ""}">
          <span class="ws-date ${dow === 0 ? "sun" : dow === 6 ? "sat" : ""}">${date.getDate()}<small>${WEEK[dow]}</small></span>
          <ul>${list.slice(0, 3).map(e =>
            `<li style="${toneOf(e.dept)}">${mark(e.text)}</li>`).join("")
            || '<li class="ws-more" style="--dh:210;--ds:8%">—</li>'}
            ${list.length > 3 ? `<li class="ws-more">그 밖 ${list.length - 3}건</li>` : ""}</ul>
        </button>`;
      }).join("")}<span class="ws-filler" aria-hidden="true"></span></div>
    </section>`;

  /* 앞으로 3주 */
  const horizon = new Date(today);
  horizon.setDate(today.getDate() + 21);
  const horizonKey = dateKey(horizon);
  const ahead = model.schedule
    .filter(e => e.key > key && e.key <= horizonKey && !isHidden(e.dept) && matches(e.dept, e.text))
    .slice(0, 8);
  count += ahead.length;
  const aheadCard = `
    <section class="card span-all">
      <div class="card-head"><h2>앞으로 3주</h2><span class="count">${ahead.length}건</span></div>
      ${ahead.length ? `<div class="upcoming">${ahead.map(e => `
        <button type="button" data-event="${e.id}">
          <span class="up-when">${e.date.getMonth() + 1}.${e.date.getDate()}(${WEEK[e.date.getDay()]})</span>
          <span class="up-dd">D-${dayDiff(key, e.key)}</span>
          <span class="up-body" style="${toneOf(e.dept)}">
            <span class="chip">${mark(e.dept)}</span><span>${mark(e.text)}</span></span>
        </button>`).join("")}</div>`
      : '<p class="list-none">3주 안에 등록된 일정이 없습니다.</p>'}
    </section>`;

  return {
    count,
    html:`<div class="today-grid">${todayCard}
      <div style="display:flex;flex-direction:column;gap:14px">${dutyPanel}${dutyToday}</div>
      ${weekCard}${aheadCard}</div>`
  };
}
const shortDate = date => `${date.getMonth() + 1}.${date.getDate()} (${WEEK[date.getDay()]})`;
const whenLabel = key => {
  const date = readDate(key);
  return `${date.getMonth() + 1}월 ${date.getDate()}일 (${WEEK[date.getDay()]})`;
};

function renderCalendar(){
  const yearly = state.calendar.yearly;
  const weekends = state.calendar.weekends;
  const year = +state.month.slice(0, 4);
  const months = yearly
    ? Array.from({ length:12 }, (_, i) => `${year}-${pad2(i + 1)}`)
    : [state.month];
  const heads = weekends ? ["월","화","수","목","금","토","일"] : ["월","화","수","목","금"];
  const key = todayKey();
  let count = 0;

  const html = months.map(monthValue => {
    const dates = daysOfMonth(monthValue, !weekends);
    const cells = dates.map((date, i) => {
      const dk = dateKey(date);
      const dow = date.getDay();
      const list = scheduleOn(dk);
      count += list.length;

      /* 주말을 접었을 때 토·일 일정을 금요일 칸 아래에 모아 둔다. 놓치는 일정이 없도록. */
      let folded = "";
      if(!weekends && dow === 5){
        const extra = [1, 2].map(offset => {
          const side = new Date(date);
          side.setDate(date.getDate() + offset);
          if(side.getMonth() !== date.getMonth()) return null;
          const rows = scheduleOn(dateKey(side));
          count += rows.length;
          return rows.length ? { side, rows } : null;
        }).filter(Boolean);
        if(extra.length){
          folded = `<div class="weekend-fold"><span class="wf-label">주말</span>${extra.map(({ side, rows }) =>
            rows.map(e => `<button type="button" class="ev" data-event="${e.id}" style="${toneOf(e.dept)}">
              <span class="ev-dept">${WEEK[side.getDay()]} ${side.getDate()}일</span>
              <span class="ev-text">${mark(e.text)}</span></button>`).join("")).join("")}</div>`;
        }
      }

      const classes = ["day"];
      if(dk === key) classes.push("is-today");
      if(dow === 0) classes.push("sun", "is-weekend");
      if(dow === 6) classes.push("sat", "is-weekend");
      return `<section class="${classes.join(" ")}" aria-label="${dk}">
        ${dayNumHTML(date)}
        <div class="day-events">${list.map(e => eventHTML(e)).join("")}</div>
        ${list.length || folded ? "" : '<span class="day-none">일정 없음</span>'}
        ${folded}</section>`;
    }).join("");

    const columnOf = date => {
      const dow = date.getDay() || 7;
      return weekends ? dow : Math.min(dow, 5);
    };
    const columns = weekends ? 7 : 5;
    const lead = columnOf(dates[0]) - 1;
    const tail = columns - columnOf(dates.at(-1));
    const filler = n => '<div class="day-filler" aria-hidden="true"></div>'.repeat(Math.max(0, n));

    return `${yearly ? `<h2 class="month-caption">${+monthValue.slice(5)}월</h2>` : ""}
      <div class="month" style="--cols:${columns}">
        ${heads.map(d => `<div class="dow-head ${d === "토" ? "sat" : d === "일" ? "sun" : ""}" aria-hidden="true">${d}</div>`).join("")}
        ${filler(lead)}${cells}${filler(tail)}</div>`;
  }).join("");

  return { html, count };
}

function monthRows(view){
  const options = state[view];
  const source = view === "student" ? index.studentByDay : index.byDay;
  return daysOfMonth(state.month, options.skipWeekends).map(date => {
    const key = dateKey(date);
    const rows = (source.get(key) || []).filter(e =>
      view === "student" ? matches(e.text) : (!isHidden(e.dept) && matches(e.dept, e.text)));
    return {
      date, key, rows,
      prayer:model.prayer.get(key)?.name || "",
      supervisor:model.supervisor.get(key) || ""
    };
  });
}

function renderMonthTable(view){
  const options = state[view];
  const isPlan = view === "plan";
  const rows = monthRows(view);
  const key = todayKey();
  let count = 0;

  const body = rows.map(row => {
    count += row.rows.length;
    const dow = row.date.getDay();
    const classes = [];
    if(row.key === key) classes.push("is-today");
    if(dow === 0) classes.push("sun", "is-weekend");
    if(dow === 6) classes.push("sat", "is-weekend");
    return `<tr class="${classes.join(" ")}">
      <td class="cell-date">${dayNumHTML(row.date)}</td>
      <td class="cell-dow">${WEEK[dow]}</td>
      <td class="cell-body"><div class="cell-events">${
        row.rows.map(e => eventHTML(e, { showDept:isPlan && options.showDept, student:view === "student" })).join("")
        || '<span class="dash">—</span>'}</div></td>
      ${isPlan && options.showPrayer ? `<td class="cell-duty" data-label="경건회">${dutyCell(row.prayer)}</td>` : ""}
      ${isPlan && options.showSupervisor ? `<td class="cell-duty" data-label="자습감독">${dutyCell(row.supervisor)}</td>` : ""}
    </tr>`;
  }).join("");

  const html = `<div class="sheet-frame">
    <table class="rows ${options.inline ? "is-inline" : ""}">
      <thead><tr>
        <th class="col-date" scope="col">날짜</th>
        <th class="col-dow" scope="col">요일</th>
        <th scope="col">${isPlan ? "주요 행사" : "학생일정"}</th>
        ${isPlan && options.showPrayer ? '<th class="col-duty" scope="col">경건회</th>' : ""}
        ${isPlan && options.showSupervisor ? '<th class="col-duty" scope="col">자습감독</th>' : ""}
      </tr></thead>
      <tbody>${body}</tbody>
    </table></div>`;
  return { html, count };
}
const dutyCell = name => !name ? ""
  : isMine(name)
    ? `<span class="duty-me"><span class="seal-dot" aria-hidden="true"></span>${esc(name)}</span>`
    : esc(name);

function renderDept(){
  const rows = model.schedule.filter(e => e.dept === state.dept && matches(e.dept, e.text));
  if(!rows.length) return { count:0, html:emptyHTML(`${state.dept} 일정이 없습니다.`,
    state.query ? "검색어를 지우면 전체 일정을 볼 수 있습니다." : "다른 부서를 골라 보세요.") };

  const key = todayKey();
  let html = "", currentMonth = "";
  for(const row of rows){
    const month = row.key.slice(0, 7);
    if(month !== currentMonth){
      if(currentMonth) html += "</div></section>";
      html += `<section class="dept-month"><h2 class="month-caption">${month.slice(0, 4)}년 ${+month.slice(5)}월</h2><div class="dept-list">`;
      currentMonth = month;
    }
    html += `<div class="dept-row">
      <span class="dr-when ${row.key === key ? "is-today-tag" : ""}">
        ${row.date.getMonth() + 1}월 ${row.date.getDate()}일 (${WEEK[row.date.getDay()]})${row.key === key ? " · 오늘" : ""}
      </span>${eventHTML(row, { showDept:false })}</div>`;
  }
  if(currentMonth) html += "</div></section>";
  return { html, count:rows.length };
}

const displayCategory = row =>
  state.grade < 3 && ["자율", "봉사"].includes(row.category) ? "자율자치" : row.category;
const nugaCategories = () =>
  state.grade === 3 ? ["전체", "자율", "봉사", "동아리", "진로"] : ["전체", "자율자치", "동아리", "진로"];
const nugaRows = () => model.nuga.filter(row =>
  row.grades[state.grade - 1] && matches(displayCategory(row), row.text, row.remark));

function renderNuga(){
  if(!nugaCategories().includes(state.category)) state.category = "전체";
  const all = nugaRows();
  const rows = all.filter(r => state.category === "전체" || displayCategory(r) === state.category);
  if(!rows.length) return { count:0, html:emptyHTML("조건에 맞는 기록이 없습니다.", "학년이나 영역을 바꿔 보세요.") };

  const total = rows.reduce((sum, r) => sum + r.hours, 0);
  const byCategory = new Map();
  for(const row of all){
    const name = displayCategory(row);
    byCategory.set(name, (byCategory.get(name) || 0) + row.hours);
  }
  const peak = Math.max(1, ...byCategory.values());
  const summary = `<div class="hours-summary">${[...byCategory].map(([name, hours]) => `
    <article class="hstat" style="--cat:${CATEGORY_TONE[name] || "var(--ink-3)"}">
      <div class="hs-top"><span class="hs-mark" aria-hidden="true"></span><span class="hs-name">${esc(name)}</span></div>
      <p class="hs-value">${hours}<span>시간</span></p>
      <div class="hs-track"><div class="hs-bar" style="width:${Math.round(hours / peak * 100)}%"></div></div>
    </article>`).join("")}</div>`;

  const unclear = rows.some(r => !r.valid)
    ? '<p class="warn">교시를 읽을 수 없는 기록은 시간 합계에서 뺐습니다. 표에 <b>확인 필요</b>로 적어 두었습니다.</p>' : "";

  let running = 0;
  const withTotal = rows.map(r => ({ ...r, running:running += r.hours }));

  const table = `<div class="sheet-frame hours-desktop">
    <table class="rows hours-table">
      <thead><tr>
        <th class="col-when" scope="col">일자</th><th style="width:96px" scope="col">영역</th>
        <th style="width:74px" scope="col">교시</th><th class="col-num" scope="col">시간</th>
        <th scope="col">활동내용</th><th style="width:22%" scope="col">비고</th>
      </tr></thead>
      <tbody>${rows.map(r => `<tr>
        <td class="col-when">${shortDate(r.date)}</td>
        <td style="--cat:${CATEGORY_TONE[displayCategory(r)] || "var(--ink-3)"}">
          <span class="cat-mark" aria-hidden="true"></span> ${esc(displayCategory(r))}</td>
        <td>${esc(r.label)}</td>
        <td class="col-num">${r.valid ? r.hours : '<span class="dash">확인 필요</span>'}</td>
        <td>${mark(r.text)}</td><td>${mark(r.remark)}</td></tr>`).join("")}</tbody>
      <tfoot><tr><td colspan="3">합계</td><td class="col-num">${total}</td><td colspan="2"></td></tr></tfoot>
    </table></div>`;

  const cards = `<div class="sheet-frame hours-cards">${withTotal.map(r => `
    <article class="hours-card">
      <div class="hc-top" style="--cat:${CATEGORY_TONE[displayCategory(r)] || "var(--ink-3)"}">
        <span class="cat-mark" aria-hidden="true"></span><span>${esc(displayCategory(r))}</span><span>${shortDate(r.date)}</span></div>
      <p class="hc-text">${mark(r.text)}</p>
      ${r.remark ? `<p class="hc-text" style="color:var(--ink-2);font-size:var(--t-sm)">${mark(r.remark)}</p>` : ""}
      <div class="hc-foot"><span>${r.label ? esc(r.label) + "교시 · " : ""}${r.valid ? r.hours + "시간" : "교시 확인 필요"}</span>
        <span>누계 ${r.running}시간</span></div>
    </article>`).join("")}</div>`;

  return { count:rows.length, html:summary + unclear + table + cards };
}

   ============================================================ */
function render({ keepScroll = false } = {}){
  const scroll = window.scrollY;
  const active = document.activeElement;
  const focusId = active?.id;
  const focusToggle = active?.dataset?.toggle;
  const focusDept = active?.dataset?.deptToggle;

  renderNav();
  renderHead();
  renderRibbon();
  renderTools();
  renderNotice();
  updateDutyCard();

  if(state.view === "request"){
    if(!$("#requestForm")) $("#content").innerHTML = renderRequest();
    syncRequestForm();
    $("#hitCount") && ($("#hitCount").textContent = "");
  }else{
    let result;
    if(!loaded){
      result = { count:0, html:emptyHTML(
        loading ? "일정을 불러오는 중입니다." : "아직 불러온 일정이 없습니다.",
        loading ? "" : "새로고침을 눌러 다시 시도해 주세요.") };
    }else if(state.view === "today")        result = renderToday();
    else if(state.view === "calendar")      result = renderCalendar();
    else if(state.view === "plan" || state.view === "student") result = renderMonthTable(state.view);
    else if(state.view === "dept")          result = renderDept();
    else                                    result = renderNuga();
    $("#content").innerHTML = result.html;
    const hit = $("#hitCount");
    if(hit) hit.textContent = searchTokens().length ? `${result.count}건` : "";
  }

  savePrefs();

  if(focusToggle) $(`[data-toggle="${CSS.escape(focusToggle)}"]`)?.focus({ preventScroll:true });
  else if(focusDept) $(`[data-dept-toggle="${CSS.escape(focusDept)}"]`)?.focus({ preventScroll:true });
  else if(focusId && ["search", "monthInput", "deptSelect"].includes(focusId)){
    const next = $("#" + focusId);
    if(next && next !== active){
      next.focus({ preventScroll:true });
      if(next.setSelectionRange && next.type === "search"){
        const end = next.value.length;
        try{ next.setSelectionRange(end, end); }catch{}
      }
    }
  }

  if(pendingScrollToToday){
    pendingScrollToToday = false;
    const target = $(".is-today");
    if(target) target.scrollIntoView({ block:"center", behavior:"instant" });
    else if(keepScroll) window.scrollTo({ top:scroll, behavior:"instant" });
  }else if(keepScroll){
    window.scrollTo({ top:scroll, behavior:"instant" });
  }
}

function renderNotice(){
  const notices = activeNotices();
  const existing = $("#noticeBar");
  if(existing) existing.remove();
  if(!notices.length || state.view === "request") return;
  const bar = document.createElement("div");
  bar.className = "notice-bar";
  bar.id = "noticeBar";
  bar.innerHTML = `<span class="eyebrow">공지</span>
    <p>${esc(notices[0].text)}</p>
    ${notices.length > 1 ? `<button class="btn btn-sm" data-act="notices" type="button">${notices.length}건 모두 보기</button>` : ""}`;
  $("#stage").insertBefore(bar, $("#content"));
}

const showAlert = message => { $("#alertText").textContent = message; $("#alert").hidden = false; };
const hideAlert = () => { $("#alert").hidden = true; };

function toast(message){
  const el = $("#toast");
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { el.hidden = true; }, 4200);
}

function switchView(view){
  if(!Object.hasOwn(VIEWS, view) || view === state.view) return;
  saveDraft();
  state.view = view;
  state.query = "";
  pendingScrollToToday = ["plan", "student", "calendar"].includes(view) && !state.calendar.yearly;
  render();
  window.scrollTo({ top:0, behavior:"instant" });
  $("#stage").focus({ preventScroll:true });
}
function stepMonth(delta){
  const step = state.view === "calendar" && state.calendar.yearly ? 12 : 1;
  const next = addMonths(state.month, delta * step);
  if(+next.slice(0, 4) < 1900 || +next.slice(0, 4) > 9999) return;
  state.month = next;
  render();
}
function goToday(){
  state.month = todayKey().slice(0, 7);
  pendingScrollToToday = true;
  render();
}

const dayState = { key:"", eventId:"" };

function fillDay(key, selectedId = ""){

  if(!date) return;
  dayState.key = key;
  dayState.eventId = selectedId;

  $("#dayTitle").textContent =
    `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일 (${WEEK[date.getDay()]})`;

  const { staffOnly, students, deptOfStudent } = dayEntries(key);
  const prayer = model.prayer.get(key);
  const supervisor = model.supervisor.get(key) || "";
  let html = "";

  const block = (label, rows, student) => {
    html += `<h3>${label}</h3>`;
    if(!rows.length){ html += '<p class="list-none" style="text-align:left;padding:2px 0 4px">없음</p>'; return; }
    html += rows.map(event => {
      const dept = student ? deptOfStudent.get(event.id) || "" : event.dept;
      return `<div class="detail-item ${event.id === selectedId ? "selected" : ""}" style="${toneOf(dept)}">
        ${dept ? `<button class="chip" data-goto-dept="${esc(dept)}" type="button"
            title="${esc(dept)} 일정 모두 보기">${esc(dept)}</button>` : ""}
        <p>${esc(event.text)}</p></div>`;
    }).join("");
  };
  block("교직원 일정", staffOnly, false);
  block("학생 일정", students, true);

  const meta = [
    ["경건회", prayer?.name], ["말씀", prayer?.bible], ["찬송", prayer?.hymn], ["자습감독", supervisor]
  ].filter(([, value]) => value);
  if(meta.length){
    html += `<h3>담당</h3><dl class="detail-meta">${meta.map(([label, value]) =>
