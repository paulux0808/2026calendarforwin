<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>학사관리 시스템</title>
<!-- Pretendard 웹폰트 CDN 추가 -->
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#eef1f4;--border:#8b929a;--border-soft:#d9dde2;
  --text:#171a1f;--muted:#5f6770;--accent:#228be6;--accent-soft:#e7f5ff;
  --danger:#c92a2a;--warning:#e67700;--today:#fcc419;--shadow:0 12px 30px rgba(0,0,0,.12);
  --font:14px;--cell-h:126px;--gap:6px;--toolbar-h:44px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{overflow:hidden}
body{
  font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--text);font-size:var(--font);overflow:hidden;display:flex;flex-direction:column;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.no-print{}
.app-header{
  flex:0 0 auto;background:var(--surface);border-bottom:2px solid var(--border);padding:max(6px,env(safe-area-inset-top)) 12px 6px;
  z-index:100;box-shadow:0 1px 0 rgba(0,0,0,.03)
}
.topbar{display:grid;grid-template-columns:auto minmax(220px,1fr) auto;gap:12px;align-items:center}
.brand{font-weight:950;font-size:18px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.search-wrap{display:flex;align-items:center;gap:7px;min-width:0}
.search-input{
  width:100%;min-width:0;border:2px solid var(--border);border-radius:9px;padding:8px 11px;
  background:var(--bg);color:var(--text);outline:none
}
.search-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.search-meta,.sync{font-size:11px;font-weight:850;color:var(--muted);white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:5px;padding:5px 7px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#868e96}
.sync.loading .sync-dot{background:#f59f00}.sync.ok .sync-dot{background:#2f9e44}.sync.warn .sync-dot{background:#e03131}
.header-actions{display:flex;gap:5px;align-items:center}
.icon-btn,.btn{
  border:2px solid var(--border);background:var(--surface);color:var(--text);border-radius:8px;font-weight:850;
  min-height:36px;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;gap:4px;
  transition:background-color .15s ease, border-color .15s ease;
}
.icon-btn{min-width:38px;padding:5px 8px}
.icon-btn:hover,.btn:hover{background:var(--surface-2);border-color:var(--accent)}
.nav{
  margin-top:6px;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;padding:3px;
  background:var(--surface-2);border:1px solid var(--border);border-radius:10px
}
.nav-btn{
  border:0;border-radius:7px;background:transparent;color:var(--muted);min-height:40px;font-weight:900;padding:6px 7px;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .15s ease;
}
.nav-btn:hover{background:var(--surface);color:var(--text)}
.nav-btn.active{background:var(--border);color:#fff}
.nav-btn.request{color:var(--danger)}.nav-btn.request.active{background:var(--danger);color:#fff}
.app-main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:2px 0 16px}
/* PC 대화면 최적화 */
.page{width:100%;max-width:1440px;margin:0 auto;padding:0 12px}
.toolbar{
  position:sticky;top:0;z-index:50;background:var(--bg);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;
  align-items:center;padding:6px 0;border-bottom:2px solid var(--border)
}
.toolbar-title{display:flex;align-items:center;gap:8px;font-weight:950;font-size:17px}
.toolbar-sub{font-size:11.5px;color:var(--muted);font-weight:750;margin-top:2px}
.month-nav{display:grid;grid-template-columns:auto auto minmax(110px,auto) auto auto;gap:4px;align-items:center}
.month-nav.no-print-btn{grid-template-columns:auto auto minmax(110px,auto) auto}
.month-title{text-align:center;font-size:16px;font-weight:950;white-space:nowrap;padding:0 8px}
.options{
  display:flex;gap:9px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);padding:6px 0;margin-bottom:6px
}
.options-title{font-size:11.5px;font-weight:900;color:var(--muted)}
.option{
  display:inline-flex;align-items:center;gap:6px;border:2px solid var(--border);border-radius:7px;padding:5px 9px;
  min-height:34px;background:var(--surface);font-weight:850;cursor:pointer;user-select:none;transition:all .15s ease
}
.option:hover{border-color:var(--accent)}
.option input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.option.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.inline-info{display:flex;justify-content:space-between;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted);font-weight:800;padding:4px 0}
.legend{display:flex;gap:4px;flex-wrap:wrap}
.chip,.dept-tag{
  display:inline-block;color:#111;border:1px solid rgba(0,0,0,.15);border-radius:4px;padding:1px 6px;font-size:10.5px;font-weight:950;white-space:nowrap
}
.dept-tag.clickable{cursor:pointer;transition:transform .1s}
.dept-tag.clickable:hover{transform:scale(1.05)}
.calendar-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.calendar{
  min-width:700px;display:grid;grid-auto-rows:minmax(var(--cell-h),auto);gap:var(--gap)
}
.calendar.col-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.calendar.col-7{grid-template-columns:repeat(7,minmax(0,1fr))}
.cal-head{background:var(--surface-2);border:2px solid var(--border);border-radius:6px;text-align:center;padding:7px;font-weight:950}
.cal-head.sun{color:#e03131}.cal-head.sat{color:#1c7ed6}
.cal-cell{
  background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:7px;min-width:0;outline:none;
  cursor:pointer;transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease
}
.cal-cell:hover,.cal-cell:focus-visible{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);transform:translateY(-1px)}
.cal-cell.today{border:3px solid var(--today);background:#fff9db;color:#171a1f}
.cal-cell.other{opacity:.38;background:var(--bg)}
.cal-cell.weekend-sat-cell{background:rgba(77,171,247,0.06)}
.cal-cell.weekend-sun-cell{background:rgba(255,107,107,0.06)}
.cal-date{font-weight:950;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.event-list{display:flex;flex-direction:column;gap:4px}
.event{display:grid;grid-template-columns:auto 1fr;gap:5px;align-items:start;cursor:pointer;font-size:calc(var(--font) - 2px);font-weight:700;line-height:1.35}
.event:hover .event-text{text-decoration:underline;color:var(--accent)}
.event.weekend-event{border-top:1px dashed var(--border-soft);padding-top:3px;margin-top:2px}
mark{background:#ffe066;color:#111;padding:0 2px;border-radius:3px}

/* 테이블 sticky 및 PC 호버 스타일 */
.table-wrap{border:2px solid var(--border);border-radius:7px;background:var(--surface);overflow-x:auto;position:relative}
table{border-collapse:collapse;width:100%;min-width:650px;table-layout:fixed;background:var(--surface)}
th{
  position:sticky;top:0;z-index:10;background:var(--surface-2);border-bottom:2px solid var(--border);padding:8px 6px;font-weight:950;
  box-shadow:0 1px 0 var(--border);
}
td{border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);padding:6px;text-align:center;vertical-align:top}
tbody tr{cursor:pointer;transition:background-color .12s ease}
tbody tr:hover{background-color:var(--surface-2)}
tr.weekend-sun{background:rgba(255,107,107,0.22);color:#111}
tr.weekend-sun:hover{background:rgba(255,107,107,0.35)!important}
tr.weekend-sat{background:rgba(77,171,247,0.22);color:#111}
tr.weekend-sat:hover{background:rgba(77,171,247,0.35)!important}
tr.today-row{outline:3px solid var(--today);outline-offset:-3px}
.event-row{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:start;text-align:left;font-weight:750;line-height:1.35}
.event-row.horizontal{display:inline-flex;align-items:center;width:auto;margin-right:8px}

.mobile-card{
  background:var(--surface);border:2px solid var(--border);border-radius:8px;padding:10px;margin-bottom:6px
}
.mobile-card.today{border:3px solid var(--today)}
.mobile-date{font-weight:950;border-bottom:1px solid var(--border-soft);padding-bottom:4px;margin-bottom:6px}
.mobile-meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--bg);border-radius:6px;padding:5px 7px;font-size:12px;color:var(--muted);font-weight:750}
.section-title{font-size:17px;font-weight:950;border-bottom:3px solid var(--border);padding-bottom:4px;margin:12px 0 8px}
.dept-picker,.nuga-filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:6px;margin:6px 0}
.dept-pick,.nuga-filter{
  border:2px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);min-height:40px;padding:6px 8px;font-weight:900;
  transition:all .15s ease;
}
.dept-pick:hover,.nuga-filter:hover{border-color:var(--accent)}
.dept-pick.active{box-shadow:inset 0 0 0 2px var(--dept-color);background:var(--surface-2);border-color:var(--dept-color)}
.dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.dept-card{background:var(--surface);border:2px solid var(--border);border-left:7px solid var(--dept-color);border-radius:9px;padding:12px;cursor:pointer;transition:all .15s ease}
.dept-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.09);border-color:var(--accent)}
.grade-switch{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:3px;border:2px solid var(--border);border-radius:9px;background:var(--surface-2)}
.grade-btn{border:0;border-radius:6px;background:transparent;color:var(--muted);min-height:36px;font-weight:900;transition:all .15s ease}
.grade-btn:hover{color:var(--text)}
.grade-btn.active{background:var(--accent);color:#fff}
.nuga-filter{border-left:7px solid var(--cat);display:flex;justify-content:space-between;align-items:center;text-align:left}
.nuga-filter strong{font-size:17px}.nuga-filter small{font-size:11px;color:var(--muted)}
.nuga-filter.active{box-shadow:inset 0 0 0 2px var(--cat);background:var(--surface-2)}
.empty{min-height:120px;border:2px dashed var(--border);border-radius:10px;background:var(--surface);display:grid;place-items:center;text-align:center;color:var(--muted);font-weight:800;padding:20px}
.request-form{max-width:820px;margin:8px auto;background:var(--surface);border:2px solid var(--border);border-radius:11px;padding:18px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-group{margin-bottom:12px}.form-label{display:block;font-weight:900;margin-bottom:5px}
.form-input,.form-textarea{width:100%;border:2px solid var(--border);border-radius:8px;padding:11px;background:var(--bg);color:var(--text);outline:none}
.form-input:focus,.form-textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.form-textarea{min-height:150px;resize:vertical}
.form-help{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:11.5px;margin-top:4px}
.submit{min-width:190px;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-size:16px;font-weight:950;transition:opacity .15s ease}
.submit:hover{opacity:.9}
.form-actions{text-align:right}
.required{font-size:10px;background:#ffe3e3;color:#c92a2a;border-radius:4px;padding:2px 4px}
.banner{
  display:none;position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:5000;width:min(900px,94vw);
  background:#fff5f5;color:#c92a2a;border:2px solid #c92a2a;border-radius:10px;padding:10px 14px;font-weight:850;box-shadow:var(--shadow)
}
.banner-actions{display:flex;gap:5px;justify-content:flex-end;margin-top:7px}
.loading{position:fixed;inset:0;z-index:6000;background:var(--bg);display:grid;place-items:center}
.loading-inner{text-align:center;font-weight:900}
.spinner{width:42px;height:42px;margin:0 auto 12px;border:5px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.modal{
  display:none;position:fixed;inset:0;z-index:4000;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:14px
}
.modal.open{display:flex}
.modal-box{width:min(640px,96vw);max-height:88vh;background:var(--surface);border:3px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.modal-head{padding:15px 17px;border-bottom:2px solid var(--border);font-size:19px;font-weight:950;background:var(--surface-2)}
.modal-body{padding:18px;white-space:pre-wrap;line-height:1.65;overflow:auto;max-height:65vh}
.modal-foot{padding:10px 14px;border-top:2px solid var(--border);display:flex;justify-content:flex-end;gap:6px;background:var(--surface-2)}

/* 상세 패널 & 백드롭 (PC 바깥 클릭 닫기 지원) */
.detail-backdrop{
  display:none;position:fixed;inset:0;z-index:3400;background:rgba(0,0,0,.25);backdrop-filter:blur(1px)
}
.detail-backdrop.open{display:block}
.detail{
  position:fixed;top:0;right:0;z-index:3500;width:min(420px,92vw);height:100dvh;background:var(--surface);
  border-left:3px solid var(--border);box-shadow:-12px 0 35px rgba(0,0,0,.24);transform:translateX(105%);visibility:hidden;
  transition:transform .2s ease,visibility .2s;display:grid;grid-template-rows:auto 1fr auto
}
.detail.open{transform:none;visibility:visible}
.detail-head,.detail-foot{padding:12px 16px;border-bottom:2px solid var(--border);background:var(--surface-2)}
.detail-foot{border-top:2px solid var(--border);border-bottom:0;display:flex;justify-content:space-between;background:var(--surface)}
.detail-body{overflow-y:auto;padding:14px 16px}
.detail-event{display:grid;grid-template-columns:auto 1fr;gap:8px;border-bottom:1px solid var(--border-soft);padding:9px 0}
.detail-event.selected{background:var(--accent-soft);margin:0 -6px;padding:9px 6px;border-radius:6px}
.detail-section{margin-bottom:18px}.detail-section h3{font-size:12.5px;color:var(--muted);margin:0 0 7px;font-weight:900}

.mobile-fab,.mobile-menu,.mobile-backdrop{display:none}
.print-title{display:none}

@media(max-width:1100px){
  .topbar{grid-template-columns:auto 1fr}.header-actions{grid-column:1/-1;justify-content:flex-end}
  .nav{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:850px){
  .app-header{padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
  .topbar{grid-template-columns:1fr}.brand{justify-content:center}.search-wrap{width:100%}.header-actions{justify-content:center}
  .nav{display:none}
  .page{width:100%;padding:0 6px}
  .toolbar{grid-template-columns:1fr}
  .toolbar-title .toolbar-sub{display:none}
  .month-nav,.month-nav.no-print-btn{grid-template-columns:auto auto minmax(90px,1fr) auto}
  .month-nav .print-button{display:none}
  .options{align-items:flex-start}
  .calendar{min-width:0;grid-template-columns:1fr!important;grid-auto-rows:auto}
  .cal-head{display:none}.cal-cell{min-height:64px}.cal-cell.other{display:none}
  .cal-cell:not(:has(.event)){min-height:54px}
  .dept-picker{display:none}
  .dept-grid{grid-template-columns:1fr}
  .form-grid{grid-template-columns:1fr}.request-form{padding:12px}.form-actions .submit{width:100%}
  .detail{display:none!important}.detail-backdrop{display:none!important}
  .mobile-fab{
    display:flex;position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:2300;
    width:60px;height:60px;border:3px solid var(--border);border-radius:50%;background:var(--accent);color:#fff;align-items:center;justify-content:center;
    font-weight:950;box-shadow:var(--shadow)
  }
  .mobile-backdrop.open{display:block;position:fixed;inset:0;z-index:2200;background:rgba(0,0,0,.35)}
  .mobile-menu.open{
    display:block;position:fixed;right:max(10px,env(safe-area-inset-right));bottom:80px;z-index:2250;width:min(356px,calc(100vw - 20px));
    background:var(--surface);border:2px solid var(--border);border-radius:14px;padding:9px;box-shadow:var(--shadow)
  }
  .mobile-menu-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:5px}
  .mobile-menu .nav-btn{display:block;background:var(--bg);border:2px solid transparent}
  .mobile-menu .nav-btn.active{background:var(--border);color:#fff;border-color:var(--border)}
  .app-main{padding-bottom:82px}
}



/* =========================================================
   PC UI 시스템 (851px 이상)
   ========================================================= */
@media (min-width:851px){
  :root{
    --border:#c9cfd6;
    --border-soft:#e7eaee;
    --toolbar-h-desktop:52px;
  }

  body{font-weight:400}
  .page{max-width:1680px;padding:0 20px}

  /* 한 줄 상단 바 */
  .app-header{padding:0 20px;border-bottom:1px solid var(--border-soft);box-shadow:none;background:var(--surface)}
  .topbar{max-width:1680px;height:52px;margin:0 auto;display:grid;grid-template-columns:auto auto minmax(260px,1fr) auto;gap:18px;align-items:center}
  .brand{font-size:15px;font-weight:700;letter-spacing:-.2px}
  .nav{margin:0;padding:0;display:flex;gap:18px;background:transparent;border:0;border-radius:0;white-space:nowrap}
  .nav-btn{position:relative;min-height:52px;padding:0;border:0;border-radius:0;background:transparent;color:var(--muted);font-size:13px;font-weight:600}
  .nav-btn:hover{background:transparent;color:var(--text)}
  .nav-btn.active{background:transparent;color:var(--accent)}
  .nav-btn.active::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--accent)}
  .nav-btn.request{color:var(--muted)}
  .nav-btn.request.active{background:transparent!important;color:var(--danger)!important}
  .nav-btn.request.active::after{background:var(--danger)}

  .search-wrap{min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:8px}
  .search-box{position:relative;min-width:220px;width:min(100%,520px)}
  .search-input{width:100%;height:34px;border:1px solid var(--border);border-radius:7px;padding:6px 32px 6px 10px;background:var(--bg);font-size:13px;font-weight:400}
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 14%,transparent)}
  .search-input:disabled{opacity:.45;cursor:not-allowed}
  .search-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer}
  .search-meta{min-width:28px;font-size:11px;font-weight:600;color:var(--muted);text-align:right}
  .sync{min-height:28px;padding:3px 7px;border:0;background:transparent;font-size:11px;font-weight:500}
  .header-actions{display:flex;gap:4px;align-items:center;grid-column:auto}
  .utility-btn,.icon-btn,.btn{min-height:32px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);padding:4px 8px;font-size:12.5px;font-weight:600;box-shadow:none}
  .utility-btn:hover,.icon-btn:hover,.btn:hover{background:var(--surface-2);border-color:var(--border)}

  /* 모든 화면에서 동일한 sticky 컨트롤 줄 */
  .toolbar{position:sticky;top:0;z-index:120;min-height:var(--toolbar-h-desktop);display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:7px 0;background:color-mix(in srgb,var(--bg) 96%,transparent);border-bottom:1px solid var(--border-soft);backdrop-filter:blur(10px)}
  .toolbar-title{font-size:16px;font-weight:700;white-space:nowrap}
  .toolbar-sub{display:none}
  .toolbar-options{min-width:0;display:flex;align-items:center;overflow:hidden}
  .toolbar-actions{display:flex;align-items:center;justify-content:flex-end}
  .options{margin:0;padding:0;display:flex;align-items:center;gap:10px;flex-wrap:nowrap;border:0;overflow-x:auto;scrollbar-width:none}
  .options::-webkit-scrollbar,.dept-quick::-webkit-scrollbar{display:none}
  .options-title{display:none}
  .option{min-height:30px;padding:3px 4px;display:inline-flex;align-items:center;gap:5px;border:0;border-radius:5px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;white-space:nowrap}
  .option:hover{border:0;background:var(--surface-2);color:var(--text)}
  .option.on{border:0;background:transparent;color:var(--accent);font-weight:600}
  .option input{width:14px;height:14px;margin:0}

  .month-nav,.month-nav.no-print-btn{display:flex;align-items:center;gap:3px}
  .month-title{min-width:106px;padding:0 6px;text-align:center;font-size:14px;font-weight:650}
  .month-nav .btn{height:30px;min-height:30px;padding:3px 7px}
  .month-nav .month-arrow{min-width:28px;font-size:17px}
  .month-nav .today-button{margin-left:3px}
  .month-nav .print-button{margin-left:8px}

  /* sticky 테이블 헤더는 toolbar 아래 */
  .table-wrap{border:1px solid var(--border-soft);border-radius:6px;overflow:visible;background:var(--surface)}
  th{position:sticky;top:var(--toolbar-h-desktop);z-index:30;padding:7px;background:var(--surface-2);border-bottom:1px solid var(--border);font-weight:600;box-shadow:none}
  td{padding:7px;border-right:1px solid var(--border-soft);border-bottom:1px solid var(--border-soft);font-weight:400}
  tbody tr{cursor:default}
  .plan-table tbody tr,.student-table tbody tr{cursor:pointer}
  .plan-table td{padding-top:9px;padding-bottom:9px}
  .plan-table tbody tr:hover,.student-table tbody tr:hover{background:color-mix(in srgb,var(--accent) 4%,var(--surface))}
  tr.weekend-sun{background:color-mix(in srgb,#ff6b6b 4%,var(--surface));color:var(--text)}
  tr.weekend-sat{background:color-mix(in srgb,#4dabf7 4%,var(--surface));color:var(--text)}
  tr.weekend-sun:hover{background:color-mix(in srgb,#ff6b6b 7%,var(--surface))!important}
  tr.weekend-sat:hover{background:color-mix(in srgb,#4dabf7 7%,var(--surface))!important}
  tr.today-row{outline:0;box-shadow:inset 3px 0 var(--accent)}

  /* 달력: 데이터 중심 */
  .calendar{min-width:760px;gap:4px;grid-auto-rows:186px}
  .cal-head{padding:5px;border:0;border-bottom:1px solid var(--border-soft);border-radius:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600}
  .cal-cell{height:186px;min-height:186px;padding:7px;border:1px solid var(--border-soft);border-radius:6px;background:var(--surface);transition:border-color .12s ease,background-color .12s ease;transform:none;overflow:hidden;display:flex;flex-direction:column}
  .cal-cell:hover,.cal-cell:focus-visible{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 2.5%,var(--surface));box-shadow:none;transform:none}
  .cal-cell.today{border:1px solid var(--border-soft);background:var(--surface);color:var(--text)}
  .cal-cell.other{opacity:.62;background:var(--bg)}
  .cal-date{min-height:26px;margin-bottom:5px;justify-content:flex-start;font-size:12.5px;font-weight:600}
  .cal-cell.today .cal-date>span:first-child{min-width:25px;height:25px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--accent);color:#fff!important}
  .event-list{min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin}
  .event{grid-template-columns:62px minmax(0,1fr);gap:6px;font-size:11.5px;font-weight:400;line-height:1.25;align-items:start}
  .event-row{font-weight:400;grid-template-columns:minmax(0,1fr)}
  .event-row.has-dept{grid-template-columns:62px minmax(0,1fr);gap:8px}
  .event:hover .event-text{color:var(--accent);text-decoration:none}
  .dept-tag{width:62px;max-width:62px;padding:1px 4px;border:1px solid color-mix(in srgb,var(--dept-color,var(--tag-color,#e9ecef)) 55%,#adb5bd);border-radius:4px;background:var(--dept-color,var(--tag-color,#e9ecef))!important;color:#171a1f!important;font-size:11px;font-weight:600;filter:none;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .dept-tag.neutral{--dept-color:#e9ecef}
  .dept-tag.clickable:hover{transform:none;border-color:var(--accent)}
  .weekend-group-label{margin-top:4px;padding-top:5px;border-top:1px solid var(--border-soft);font-size:10.5px;font-weight:600;color:var(--muted)}
  .event.weekend-event{border-top:0;padding-top:0;margin-top:0}
  .cal-cell.weekend-sat-cell{background:color-mix(in srgb,#4dabf7 3%,var(--surface))}
  .cal-cell.weekend-sun-cell{background:color-mix(in srgb,#ff6b6b 3%,var(--surface))}
  .inline-info,.legend{display:none}

  /* 부서조회: 카드 본문은 흰색, 부서 태그만 색상 */
  .dept-quick{display:flex;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
  .seg-btn{min-height:29px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--muted);padding:3px 7px;font-size:11.5px;font-weight:500;white-space:nowrap;cursor:pointer}
  .seg-btn:hover{background:var(--surface-2);color:var(--text)}
  .seg-btn.active{background:var(--accent-soft);color:var(--accent);border-color:color-mix(in srgb,var(--accent) 25%,var(--border-soft));font-weight:600}
  .seg-btn.dept-quick-btn{background:var(--dept-color);color:#171a1f;border-color:color-mix(in srgb,var(--dept-color) 58%,#adb5bd);font-weight:600}
  .seg-btn.dept-quick-btn:hover{background:color-mix(in srgb,var(--dept-color) 90%,#fff);color:#111}
  .seg-btn.dept-quick-btn.active{background:var(--dept-color);color:#111;border-color:#495057;box-shadow:inset 0 0 0 1px #495057}
  .section-title{display:flex;align-items:center;gap:7px;margin:14px 0 7px;padding:0 0 5px;border-bottom:1px solid var(--border-soft);font-size:14px;font-weight:650}
  .section-count{font-size:11px;font-weight:500;color:var(--muted)}
  .dept-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px}
  .dept-card{min-height:76px;padding:10px 12px;border:1px solid var(--border-soft);border-radius:7px;background:var(--surface);color:var(--text);cursor:pointer;box-shadow:none;transition:border-color .12s ease,box-shadow .12s ease,transform .12s ease}
  .dept-card:hover,.dept-card:focus-visible{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 3px 10px rgba(0,0,0,.07);outline:none}
  .dept-card-date{font-size:12px;font-weight:650;color:var(--muted)}
  .dept-card-content{display:grid;grid-template-columns:62px minmax(0,1fr);gap:8px;align-items:start;margin-top:6px}
  .dept-card-text{min-width:0;font-size:13px;line-height:1.42;color:var(--text)}

  /* 누가기록 compact segmented filters */
  .nuga-toolbar-filters{display:flex;align-items:center;gap:12px;min-width:0;overflow-x:auto}
  .segment-group{display:flex;align-items:center;gap:3px;white-space:nowrap}
  .seg-count{margin-left:4px;color:inherit;font-size:10px;font-weight:600;opacity:.72}
  .seg-btn.nuga-cat{background:var(--surface);color:var(--text);border-color:var(--border-soft);font-weight:500}
  .seg-btn.nuga-cat:hover{background:var(--surface-2);color:var(--text)}
  .seg-btn.nuga-cat.active{background:var(--surface);color:var(--text);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
  .nuga-cat-tag{display:inline-block;padding:1px 5px;border:1px solid color-mix(in srgb,var(--cat) 55%,#adb5bd);border-radius:4px;background:var(--cat);color:#171a1f;font-weight:600}
  .nuga-filters{display:none}
  .grade-switch{border:0;background:transparent;padding:0}

  /* 우측 상세: backdrop 없는 비모달 */
  .detail-backdrop{display:none!important}
  .detail{width:min(430px,36vw);border-left:1px solid var(--border);box-shadow:-10px 0 28px rgba(0,0,0,.13);grid-template-rows:auto 1fr;background:var(--surface)}
  .detail-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--border-soft);background:var(--surface)}
  .detail-title{font-size:17px;font-weight:700}
  .detail-sub{margin-top:2px;font-size:11px;font-weight:500;color:var(--muted)}
  .detail-head-actions{display:flex;gap:4px}
  .detail-body{padding:12px 16px}
  .detail-section{margin-bottom:18px}
  .detail-section h3{margin:0 0 6px;font-size:11.5px;font-weight:600;color:var(--muted)}
  .detail-event{grid-template-columns:auto 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px;line-height:1.4}
  .detail-event.selected{margin:0 -6px;padding:8px 6px;background:var(--accent-soft);border-radius:5px}
  .detail-meta{display:grid;gap:5px;padding:8px 0;font-size:12.5px}
  .detail-meta>div{display:grid;grid-template-columns:76px 1fr;gap:8px}
  .detail-meta strong{font-weight:600;color:var(--muted)}
  .detail-empty{padding:5px 0;color:var(--muted);font-size:12px}

  .modal-box{border:1px solid var(--border);border-radius:10px}
  .modal-head{padding:12px 14px;border-bottom:1px solid var(--border-soft);font-size:16px;font-weight:700;background:var(--surface)}
  .modal-foot{padding:8px 12px;border-top:1px solid var(--border-soft);background:var(--surface)}
  .empty{font-weight:500}
  .request-form{border:1px solid var(--border-soft);box-shadow:none}
  .form-input,.form-textarea{border:1px solid var(--border)}
  .form-label{font-weight:600}
  .submit{font-weight:650}

  .toast{position:fixed;left:50%;bottom:24px;z-index:7000;transform:translate(-50%,12px);opacity:0;pointer-events:none;padding:7px 11px;border:1px solid var(--border);border-radius:6px;background:var(--surface);box-shadow:0 4px 16px rgba(0,0,0,.12);font-size:12px;font-weight:600;transition:.15s ease}
  .toast.show{transform:translate(-50%,0);opacity:1}
}

@media (min-width:851px) and (max-width:1100px){
  .topbar{grid-template-columns:auto auto minmax(170px,1fr) auto;gap:10px}
  .nav{gap:10px}
  .nav-btn{font-size:12px}
  .sync{display:none}
  .search-box{min-width:170px}
}


/* =========================================================
   모바일 UI 시스템 (850px 이하)
   - PC 개선판의 정보 구조/색상 규칙을 그대로 축소
   - 상단 검색 + sticky 화면 컨트롤 + bottom-sheet 메뉴
   ========================================================= */
@media (max-width:850px){
  :root{
    --border:#c9cfd6;
    --border-soft:#e7eaee;
    --mobile-toolbar-bg:rgba(246,247,249,.96);
  }

  html,body{height:100%;overflow:hidden}
  body{font-size:14px;font-weight:400;background:var(--bg)}

  /* 상단: 브랜드/유틸 1행 + 검색 1행 */
  .app-header{
    flex:0 0 auto;
    padding:7px 10px 8px;
    border-bottom:1px solid var(--border-soft);
    background:var(--surface);
    box-shadow:none;
    z-index:500;
  }
  .topbar{
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:7px 8px;
    align-items:center;
  }
  .brand{
    justify-content:flex-start;
    font-size:15px;
    font-weight:700;
    letter-spacing:-.2px;
  }
  #topNav{display:none!important}
  .header-actions{grid-column:2;grid-row:1;display:flex;gap:4px;justify-content:flex-end}
  .utility-btn,.icon-btn,.btn{
    min-height:32px;
    border:1px solid var(--border);
    border-radius:7px;
    background:var(--surface);
    color:var(--text);
    padding:4px 8px;
    font-size:12px;
    font-weight:600;
    box-shadow:none;
  }
  .search-wrap{
    grid-column:1/-1;
    grid-row:2;
    display:grid;
    grid-template-columns:minmax(0,1fr) auto;
    gap:6px;
    align-items:center;
    min-width:0;
  }
  .search-box{position:relative;min-width:0;width:100%}
  .search-input{
    width:100%;height:36px;
    padding:7px 34px 7px 10px;
    border:1px solid var(--border);
    border-radius:8px;
    background:var(--bg);
    font-size:13px;
    outline:none;
  }
  .search-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 13%,transparent)}
  .search-clear{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:26px;height:26px;border:0;background:transparent;color:var(--muted);font-size:18px}
  .search-meta{min-width:30px;font-size:11px;font-weight:600;color:var(--muted);text-align:right}
  .sync{display:none}

  .app-main{padding:0 0 calc(68px + env(safe-area-inset-bottom));overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain}
  .page{width:100%;padding:0 9px}

  /* 각 화면의 컨트롤은 모바일에서도 상단 고정 */
  .toolbar{
    position:sticky;
    top:0;
    z-index:180;
    display:grid;
    grid-template-columns:auto minmax(0,1fr);
    gap:6px 8px;
    align-items:center;
    min-height:48px;
    padding:7px 0 6px;
    border-bottom:1px solid var(--border-soft);
    background:var(--mobile-toolbar-bg);
    backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);
  }
  .toolbar-title{font-size:15px;font-weight:700;white-space:nowrap}
  .toolbar-title>span:first-child:empty{display:none}
  .toolbar-sub{display:none}
  .toolbar-actions{grid-column:2;grid-row:1;display:flex;justify-content:flex-end;min-width:0}
  .toolbar-options{grid-column:1/-1;grid-row:2;min-width:0;overflow:hidden}
  .options,.dept-quick,.nuga-toolbar-filters,.segment-group{
    display:flex;
    align-items:center;
    flex-wrap:nowrap;
    gap:4px;
    min-width:0;
    overflow-x:auto;
    scrollbar-width:none;
    -webkit-overflow-scrolling:touch;
  }
  .options::-webkit-scrollbar,.dept-quick::-webkit-scrollbar,.nuga-toolbar-filters::-webkit-scrollbar,.segment-group::-webkit-scrollbar{display:none}
  .options{margin:0;padding:0;border:0}
  .options-title{display:none}
  .option{
    flex:0 0 auto;
    min-height:30px;
    padding:3px 5px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:var(--muted);
    font-size:12px;
    font-weight:500;
    white-space:nowrap;
  }
  .option.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .option input{width:14px;height:14px;margin:0}

  .month-nav,.month-nav.no-print-btn{display:flex;align-items:center;justify-content:flex-end;gap:3px;min-width:0}
  .month-title{min-width:88px;padding:0 3px;font-size:13px;font-weight:650;text-align:center;white-space:nowrap}
  .month-nav .btn{height:30px;min-height:30px;padding:3px 7px}
  .month-nav .month-arrow{min-width:28px;font-size:17px}
  .month-nav .print-button{display:none!important}
  .month-nav .today-button{margin-left:2px}

  /* 달력은 모바일에서 날짜별 compact card */
  .calendar-wrap{width:100%;overflow:visible}
  .calendar{min-width:0!important;display:grid;grid-template-columns:1fr!important;grid-auto-rows:auto!important;gap:6px!important;padding:7px 0 2px}
  .cal-head{display:none!important}
  .cal-cell{
    height:auto!important;
    min-height:70px!important;
    padding:9px 10px!important;
    border:1px solid var(--border-soft)!important;
    border-radius:8px!important;
    background:var(--surface)!important;
    opacity:1!important;
    overflow:visible!important;
    display:block!important;
    box-shadow:none!important;
  }
  .cal-cell.other{display:none!important}
  .cal-cell.today{border-color:var(--border-soft)!important;background:var(--surface)!important}
  .cal-date{
    min-height:24px!important;
    margin:0 0 6px!important;
    padding-bottom:5px;
    border-bottom:1px solid var(--border-soft);
    display:flex;
    justify-content:flex-start!important;
    gap:5px;
    font-size:13px!important;
    font-weight:650!important;
  }
  .cal-cell.today .cal-date>span:first-child{
    min-width:24px;height:24px;
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:50%;background:var(--accent);color:#fff!important;
  }
  .event-list{display:flex;flex-direction:column;gap:5px;overflow:visible!important}
  .event{
    display:grid;
    grid-template-columns:64px minmax(0,1fr)!important;
    gap:7px!important;
    align-items:start;
    font-size:12.5px!important;
    line-height:1.35!important;
    font-weight:400!important;
  }
  .event-text{min-width:0;overflow-wrap:anywhere}
  .dept-tag{
    width:64px!important;min-width:64px!important;max-width:64px!important;
    padding:2px 4px!important;
    border:1px solid color-mix(in srgb,var(--dept-color,var(--tag-color,#e9ecef)) 55%,#adb5bd)!important;
    border-radius:4px!important;
    background:var(--dept-color,var(--tag-color,#e9ecef))!important;
    color:#171a1f!important;
    font-size:11px!important;
    font-weight:600!important;
    text-align:center;
  }
  .weekend-group-label{margin:6px 0 1px;padding-top:6px;border-top:1px solid var(--border-soft);font-size:11px;font-weight:600;color:var(--muted)}
  .cal-cell.weekend-sat-cell{background:color-mix(in srgb,#4dabf7 2.5%,var(--surface))!important}
  .cal-cell.weekend-sun-cell{background:color-mix(in srgb,#ff6b6b 2.5%,var(--surface))!important}
  .inline-info,.legend{display:none!important}

  /* 월중/학생 일정 모바일 카드 */
  .mobile-only{display:block!important}
  .desktop-only{display:none!important}
  .mobile-card{
    margin:7px 0;
    padding:9px 10px;
    border:1px solid var(--border-soft);
    border-radius:8px;
    background:var(--surface);
    box-shadow:none;
  }
  .mobile-card.today{border:1px solid var(--border-soft);box-shadow:inset 3px 0 var(--accent)}
  .mobile-date{margin:0 0 7px;padding:0 0 5px;border-bottom:1px solid var(--border-soft);font-size:12.5px;font-weight:650}
  .mobile-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:7px!important;padding:6px 7px;border-radius:6px;background:var(--bg);color:var(--muted);font-size:11.5px;font-weight:500}
  .event-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;font-size:12.5px;font-weight:400;line-height:1.4}
  .event-row.has-dept{grid-template-columns:64px minmax(0,1fr)}

  /* 부서조회 / 누가기록 */
  .seg-btn{
    flex:0 0 auto;
    min-height:30px;
    padding:3px 7px;
    border:1px solid var(--border-soft);
    border-radius:6px;
    background:var(--surface);
    color:var(--text);
    font-size:11.5px;
    font-weight:500;
    white-space:nowrap;
  }
  .seg-btn.active{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);color:var(--text)}
  .seg-btn.dept-quick-btn{background:var(--dept-color);border-color:color-mix(in srgb,var(--dept-color) 58%,#adb5bd);color:#171a1f;font-weight:600}
  .seg-btn.dept-quick-btn.active{border-color:#495057;box-shadow:inset 0 0 0 1px #495057}
  .nuga-toolbar-filters{gap:8px}
  .nuga-cat-tag{display:inline-block;padding:1px 5px;border:1px solid color-mix(in srgb,var(--cat) 55%,#adb5bd);border-radius:4px;background:var(--cat);color:#171a1f;font-weight:600}
  .seg-count{margin-left:3px;font-size:10px;font-weight:600;color:var(--muted)}
  .nuga-filters,.dept-picker{display:none!important}
  .section-title{display:flex;align-items:center;gap:6px;margin:13px 0 6px;padding-bottom:5px;border-bottom:1px solid var(--border-soft);font-size:14px;font-weight:650}
  .section-count{font-size:11px;color:var(--muted);font-weight:500}
  .dept-grid{display:grid;grid-template-columns:1fr;gap:7px}
  .dept-card{min-height:0;padding:9px 10px;border:1px solid var(--border-soft);border-left:0;border-radius:8px;background:var(--surface);box-shadow:none}
  .dept-card-date{font-size:11.5px;font-weight:600;color:var(--muted)}
  .dept-card-content{display:grid;grid-template-columns:64px minmax(0,1fr);gap:7px;align-items:start;margin-top:6px}
  .dept-card-text{font-size:12.5px;line-height:1.4}

  /* 폼 */
  .request-form{max-width:none;margin:8px 0;padding:12px;border:1px solid var(--border-soft);border-radius:9px;background:var(--surface)}
  .form-grid{grid-template-columns:1fr;gap:0}
  .form-group{margin-bottom:12px}
  .form-label{font-size:12.5px;font-weight:600}
  .form-input,.form-textarea{border:1px solid var(--border);border-radius:7px;padding:10px;background:var(--bg);font-size:14px}
  .form-textarea{min-height:180px}

  let match = raw.match(/Date\s*\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})/);
  if(match) return new Date(+match[1], +match[2], +match[3]);

  match = raw.match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
  if(match) return new Date(+match[1], +match[2]-1, +match[3]);

  return null;
}

function highlight(text){
  const safe = escapeHTML(text);
  if(!state.search.tokens.length) return safe;

  const tokens = [...new Set(state.search.tokens)]
    .sort((a,b)=>b.length-a.length)
    .map(token=>token.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));

  return safe.replace(new RegExp(`(${tokens.join("|")})`, "ig"), "<mark>$1</mark>");
}

function matches(dept,text){
  if(!state.search.tokens.length) return true;
  const hay = `${dept} ${text}`.toLowerCase();
  return state.search.tokens.every(token=>hay.includes(token));
}

function matchesStudent(text){
  if(!state.search.tokens.length) return true;
  const hay = String(text || "").toLowerCase();
  return state.search.tokens.every(token=>hay.includes(token));
}

function stripLeadingDeptTag(text){
  return String(text || "").replace(/^\s*[-•]\s*/,"").replace(/^\s*\[[^\]]+\]\s*/,"").trim();
}

function parsePeriods(cell){
  if(cell == null) return { periods:"", hours:0 };
  let raw = "";
  for(const candidate of [cell?.f, cell?.v, cell]){
    if(candidate == null) continue;
    const value = String(candidate).trim();
    if(value && !["null","undefined","[object Object]"].includes(value)){
      raw = value; break;
    }
  }
  if(!raw) return { periods:"", hours:0 };

  const display = raw.replace(/[\[\]]/g,"").replace(/\s+/g,"").replace(/교시/g,"");
  const tokens = display.replace(/[，、\/|.]+/g,",").split(",").filter(Boolean);
  let hours = 0;
  for(const token of tokens){
    const range = token.match(/^(\d+)[~\-–—](\d+)$/);
    hours += range ? Math.abs(+range[2] - +range[1]) + 1 : /^\d+$/.test(token) ? 1 : 0;
  }
  return { periods:display || raw, hours };
}

function normalizeHeader(value){
  return String(value ?? "").replace(/\s+/g,"").trim();
}

function normalizeCategory(value){
  return String(value ?? "").replace(/\(.*$/,"").trim();
}

function isCheckedGrade(value){
  return ["1","o","○","◯","v","✓","✔","true","y"].includes(String(value ?? "").trim().toLowerCase());
}

function parseLooseDate(cell){
  if(cell && typeof cell === "object"){
    const rawDate = parseGDate(cell.v);
    if(rawDate) return rawDate;
  }
  return parseGDate(getCellText(cell));
}

function currentScheduleYear(){
  const date = data.schedule.find(item=>item.date instanceof Date)?.date;
  return date ? date.getFullYear() : state.viewDate.getFullYear();
}

function parseStudentDateCell(cell){
  if(cell && typeof cell === "object"){
    const rawDate = parseGDate(cell.v);
    if(rawDate) return rawDate;
  }
  const text = getCellText(cell);
  const parsed = parseGDate(text);
  if(parsed) return parsed;
  const md = text.match(/(\d{1,2})\s*[-./]\s*(\d{1,2})/);
  return md ? new Date(currentScheduleYear(), +md[1]-1, +md[2]) : null;
}

function studentFallbackContent(text){
  const raw = String(text || "").trim();
  let match = raw.match(/^\s*\d{4}\D+\d{1,2}\D+\d{1,2}\s*[월화수목금토일]?\s*(.*)$/);
  if(match) return stripLeadingDeptTag(match[1]);
  match = raw.match(/^\s*\d{1,2}\s*[-./]\s*(\d{1,2})\s*[월화수목금토일]?\s*(.*)$/);
  return match ? stripLeadingDeptTag(match[1]) : "";
}

/* =========================
   4. 시트 어댑터
   ========================= */

const adapters = {
  schedule(raw){
    const result = [];
    for(const row of raw?.table?.rows || []){
      if(!row?.c?.[0]) continue;
      const date = parseGDate(row.c[0].v);
      const content = row.c[2]?.v != null ? String(row.c[2].v).trim() : "";
      if(!date || !content || content === "null") continue;

      const events = content.split("\n")
        .filter(line=>line.trim() && line !== "null")
        .map(line=>{
          const match = line.match(/^\[([^\]]+)\]/);
          let dept = match ? match[1].trim() : "기타";
          let text = match ? line.replace(match[0], "").trim() : line.trim();
          if(!FIXED_DEPTS.includes(dept)){
            dept = "기타";
            text = line.trim();
          }
          return { dept, text };
        });

      result.push({ date, events });
    }
    return result.sort((a,b)=>a.date-b.date);
  },

  student(raw){
    const result = [];
    for(const row of raw?.table?.rows || []){
      if(!row?.c?.[0]) continue;
      const date = parseStudentDateCell(row.c[0]);
      if(!date) continue;

      const primary = [];
      for(let i=2; i<row.c.length; i++){
        const text = getCellText(row.c[i]);
        if(text && text !== "null") primary.push(text);
      }

      const secondary = [];
      for(let i=1; i<row.c.length; i++){
        const text = getCellText(row.c[i]);
        if(!text || text === "null" || /^[월화수목금토일]$/.test(text)) continue;
        secondary.push(text);
      }

      let content = primary.join("\n").trim() || secondary.join("\n").trim() || studentFallbackContent(getCellText(row.c[0]));
      if(!content || content === "null") continue;

      const events = content.split("\n").map(stripLeadingDeptTag).filter(Boolean);
      if(events.length){
        result.push({ date, events });
      }
    }
    return result.sort((a,b)=>a.date-b.date);
  },

  supervisor(raw){
    const result = {};
    for(const row of raw?.table?.rows || []){
      if(!row?.c?.[0]) continue;
      const date = parseGDate(row.c[0].v);
      const name = row.c[2]?.v != null ? String(row.c[2].v).trim() : "";
      if(date && name && name !== "null"){
        result[getDateKey(date)] = name;
      }
    }
    return result;
  },

  prayer(raw){
    const result = {};
    (raw?.table?.rows || []).forEach((row,index)=>{
      if(index < 1 || !row?.c?.[0]) return;
      const date = parseGDate(row.c[0].v);
      if(!date) return;
      const name = row.c[2]?.v != null ? String(row.c[2].v).trim() : "";
      const bible = row.c[3]?.v != null ? String(row.c[3].v).trim() : "";
      const hymn = row.c[4]?.v != null ? String(row.c[4].v).trim() : "";
      if(name && name !== "null"){
        result[getDateKey(date)] = { name, hymn, bible };
      }
    });
    return result;
  },

  notice(raw){
    const result = [];
    const today = new Date();
    today.setHours(0,0,0,0);

    for(const row of raw?.table?.rows || []){
      if(!row?.c || row.c.length < 3) continue;
      const start = parseGDate(row.c[0]?.v);
      const end = parseGDate(row.c[1]?.v);
      const content = row.c[2]?.v != null ? String(row.c[2].v).trim() : "";
      if(!content || content === "null") continue;

      let visible = true;
      if(start && end){
        start.setHours(0,0,0,0);
        end.setHours(0,0,0,0);
        visible = today >= start && today <= end;
      }
      if(visible){
        result.push(content);
      }
    }
    return result;
  },

  nuga(raw){
    const result = [];
    const cols = Array.isArray(raw?.table?.cols) ? raw.table.cols : [];
    const columnMap = Object.create(null);

    cols.forEach((column,index)=>{
      [column?.label, column?.id, column?.pattern].forEach(key=>{
        const normalized = normalizeHeader(key);
        if(normalized) columnMap[normalized] = index;
      });
    });

    const pick = (names, fallback) => {
      for(const name of names){
        const normalized = normalizeHeader(name);
        if(Object.prototype.hasOwnProperty.call(columnMap, normalized)){
          return columnMap[normalized];
        }
      }
      return fallback;
    };

    const index = {
      category: pick(["영역"], 1),
      date: pick(["일자","날짜"], 2),
      periods: pick(["교시텍스트","교시"], 3),
      g1: pick(["1학년","1"], 4),
      g2: pick(["2학년","2"], 5),
      g3: pick(["3학년","3"], 6),
      content: pick(["활동내용","내용"], 7),
      remark: pick(["비고"], 8)
    };

    for(const row of raw?.table?.rows || []){
      if(!row?.c) continue;
      const rawCategory = normalizeCategory(getCellText(row.c[index.category]));
      const date = parseLooseDate(row.c[index.date]);
      if(!rawCategory || !date) continue;

      const { periods, hours } = parsePeriods(row.c[index.periods]);
      const autoVol = rawCategory === "자율" || rawCategory === "봉사";

      result.push({
        displayCategory:{
          1: autoVol ? "자율자치" : rawCategory,
          2: autoVol ? "자율자치" : rawCategory,
          3: rawCategory
        },
        date,
        dateKey: getDateKey(date),
        dayOfWeek: DOW[date.getDay()],
        periods,
        hours,
        grades:[
          isCheckedGrade(getCellText(row.c[index.g1])),
          isCheckedGrade(getCellText(row.c[index.g2])),
          isCheckedGrade(getCellText(row.c[index.g3]))
        ],
        content: getCellText(row.c[index.content]),
        remark: getCellText(row.c[index.remark])
      });
    }
    return result.sort((a,b)=>a.date-b.date);
  }
};

function setSync(kind,text){
  const element = $("#syncStatus");
  element.className = `sync ${kind}`;
  $("#syncText").textContent = text;
}

function showError(message){
  $("#errorText").textContent = message;
  $("#errorBanner").style.display = "block";
  setSync("warn", "일부 데이터 실패");
}

function hideError(){
  $("#errorBanner").style.display = "none";
}

function loadSheet(sheet, generation){
  return new Promise(resolve=>{
    const callback = `__sheet_${sheet.key}_${generation}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const script = document.createElement("script");
    let done = false;

    const cleanup = ()=>{
      if(done) return;
      done = true;
      script.remove();
      try{ delete window[callback]; }catch{}
    };

    const finish = (error, value)=>{
      cleanup();
      resolve({ key:sheet.key, label:sheet.label, err:error, value });
    };

    window[callback] = raw=>{
      try{
        finish(null, adapters[sheet.key](raw));
      }catch(error){
        finish(error, null);
      }
    };

    script.onerror = ()=>{
      finish(new Error(`${sheet.label} 로딩 실패`), null);
    };

    script.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${callback}&gid=${sheet.gid}&_=${Date.now()}`;
    document.body.appendChild(script);
  });
}

async function reloadAll(){
  const generation = ++state.load.generation;
  const initialLoad = !state.load.lastRefresh;
  if(state.load.timer) clearTimeout(state.load.timer);

  if(initialLoad) $("#loading").style.display = "grid";
  hideError();
  setSync("loading", "동기화 중");
  state.load.errors = {};

  const timeout = new Promise(resolve=>{
    state.load.timer = setTimeout(()=>resolve("timeout"), 12000);
  });
  const work = Promise.all(CONFIG.SHEETS.map(sheet=>loadSheet(sheet, generation)));
  const winner = await Promise.race([work, timeout]);
  if(generation !== state.load.generation) return;

  if(winner === "timeout"){
    $("#loading").style.display = "none";
    showError("데이터 로딩이 12초 이상 지연되고 있습니다. 재시도해 주세요.");
    return;
  }

  for(const item of winner){
    if(item.err){ state.load.errors[item.key] = item.err; continue; }
    data[item.key] = item.value;
  }

  rebuildIndexes();
  if(initialLoad) alignViewDate();
  state.load.lastRefresh = Date.now();
  $("#loading").style.display = "none";

  const failures = Object.keys(state.load.errors);
  if(failures.length){
    showError(CONFIG.SHEETS.filter(sheet=>failures.includes(sheet.key)).map(sheet=>sheet.label).join(", ") + " 데이터를 불러오지 못했습니다.");
  }else{
    const now = new Date();
    setSync("ok", `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")} 갱신`);
  }

  render({preserveScroll:!initialLoad,focusToday:initialLoad});
  showNotices();
}

   6. 인덱스 생성
   ========================= */

function rebuildIndexes(){
  data.eventsById = Object.create(null);
  data.daysByKey = Object.create(null);
  data.deptIndex = Object.create(null);

  let id = 0;
  for(const day of data.schedule){
    const key = getDateKey(day.date);
    data.daysByKey[key] ??= { dateKey:key, date:day.date, eventIds:[] };

    for(const event of day.events){
      data.eventsById[id] = { id, dateKey:key, dept:event.dept, text:event.text };
      data.daysByKey[key].eventIds.push(id);
      (data.deptIndex[event.dept] ??= []).push(id);
      id++;
    }
  }

  Object.values(data.deptIndex).forEach(ids=>{
    ids.sort((a,b)=> data.eventsById[a].dateKey.localeCompare(data.eventsById[b].dateKey) || a-b );
  });

  data.studentEventsById = Object.create(null);
  data.studentDaysByKey = Object.create(null);

  let studentId = 0;
  for(const day of data.student){
    const key = getDateKey(day.date);
    data.studentDaysByKey[key] ??= { dateKey:key, date:day.date, eventIds:[] };

    for(const text of day.events){
      data.studentEventsById[studentId] = { id:studentId, dateKey:key, text };
      data.studentDaysByKey[key].eventIds.push(studentId++);
    }
  }
}

function alignViewDate(){
  const source = data.schedule.length ? data.schedule : data.student;
  if(!source.length) return;

  const dates = source.map(item=>item.date).sort((a,b)=>a-b);
  const today = new Date();
  const sameMonth = dates.some(date=>date.getFullYear() === today.getFullYear() && date.getMonth() === today.getMonth());
  const chosen = sameMonth ? today : (dates.find(date=>date>=today) || dates[dates.length-1]);
  state.viewDate = new Date(chosen.getFullYear(), chosen.getMonth(), 1);
}

function renderCalendar(){
  const year = state.viewDate.getFullYear();
  const currentMonth = state.viewDate.getMonth();
  const todayKey = getDateKey(new Date());
  const showWeekends = state.calendar.showWeekends;

  const calendarOptions = `
    <div class="options calendar-options">
      ${option("주말 포함", showWeekends, "showWeekends", "calendar")}
      ${option("연간 보기", state.calendar.yearly, "yearly", "calendar")}
    </div>
  `;

  let output = `
    <div class="page">
      ${toolbar(
        "🗓️",
        "달력 일정",
        "월별 일정을 확인하고 날짜를 클릭해 상세 패널을 엽니다.",
        monthNav(`${year}년 ${state.calendar.yearly ? "전체" : currentMonth+1+"월"}`, true),
        calendarOptions
      )}
      <div class="print-title calendar-print-title">${year}학년도 ${state.calendar.yearly ? "연간" : (currentMonth+1)+"월"} 학사일정</div>
  `;

  const start = state.calendar.yearly ? 0 : currentMonth;
  const end = state.calendar.yearly ? 11 : currentMonth;

  for(let month=start; month<=end; month++){
    if(state.calendar.yearly){
      output += `<div class="section-title">${year}년 ${month+1}월</div>`;
    }

    const dayHeaders = showWeekends
      ? ["월","화","수","목","금","토","일"]
      : ["월","화","수","목","금"];

    output += `
      <div class="calendar-wrap">
        <div class="calendar ${showWeekends ? "col-7" : "col-5"}">
          ${dayHeaders.map(day=>`
            <div class="cal-head ${day==='일'?'sun':day==='토'?'sat':''}">${day}</div>
          `).join("")}
    `;

    const lastDay = new Date(year, month+1, 0).getDate();

    // 현재 월의 실제 날짜만 렌더링한다.
    // 주말 미포함이면 월 초가 토/일인 경우 다음 월요일부터 시작한다.
    let firstVisibleDay = 1;
    if(!showWeekends){
      while(firstVisibleDay <= lastDay){
        const dow = new Date(year, month, firstVisibleDay).getDay();
        if(dow !== 0 && dow !== 6) break;
        firstVisibleDay++;
      }
    }

    let firstRendered = true;

    for(let dayNumber=firstVisibleDay; dayNumber<=lastDay; dayNumber++){
      const cursor = new Date(year, month, dayNumber);
      const dow = cursor.getDay();
      const isWeekend = dow === 0 || dow === 6;

      if(!showWeekends && isWeekend) continue;

      const key = getDateKey(cursor);
      const day = data.daysByKey[key];
      const ids = filteredEventIds(day);

      if(state.mobile && state.search.tokens.length && !ids.length){
        continue;
      }

      let weekendEventsMarkup = "";
      if(!showWeekends && dow === 5){
        const sat = new Date(cursor); sat.setDate(sat.getDate()+1);
        const sun = new Date(cursor); sun.setDate(sun.getDate()+2);
        const satInMonth = sat.getFullYear() === year && sat.getMonth() === month;
        const sunInMonth = sun.getFullYear() === year && sun.getMonth() === month;
        const satIds = satInMonth ? filteredEventIds(data.daysByKey[getDateKey(sat)]) : [];
        const sunIds = sunInMonth ? filteredEventIds(data.daysByKey[getDateKey(sun)]) : [];

        if(satIds.length || sunIds.length){
          weekendEventsMarkup += `<div class="weekend-group-label">주말 일정</div>`;
        }

        satIds.forEach(id=>{
          const ev = data.eventsById[id];
          weekendEventsMarkup += `
            <div class="event weekend-event" data-event-id="${id}" title="토요일(${sat.getDate()}일) 일정">
              <span class="dept-tag" style="--dept-color:#e7f5ff">토(${sat.getDate()}일)</span>
              <span class="event-text">${highlight(ev.text)}</span>
            </div>
          `;
        });
        sunIds.forEach(id=>{
          const ev = data.eventsById[id];
          weekendEventsMarkup += `
            <div class="event weekend-event" data-event-id="${id}" title="일요일(${sun.getDate()}일) 일정">
              <span class="dept-tag" style="--dept-color:#fff0f0">일(${sun.getDate()}일)</span>
              <span class="event-text">${highlight(ev.text)}</span>
            </div>
          `;
        });
      }

      const events = ids.map(id=>{
        const event = data.eventsById[id];
        return `
          <div class="event" data-event-id="${id}">
            <span class="dept-tag" style="--dept-color:${DEPT_COLORS[event.dept]}">
              ${highlight(event.dept)}
            </span>
            <span class="event-text">${highlight(event.text)}</span>
          </div>
        `;
      }).join("") + weekendEventsMarkup;

      // 이전 달 filler를 만들지 않고 첫 실제 날짜를 해당 요일 열에 바로 배치한다.
      let firstCellStyle = "";
      if(firstRendered && !state.mobile){
        const mondayBasedColumn = dow === 0 ? 7 : dow;
        const column = showWeekends ? mondayBasedColumn : Math.min(mondayBasedColumn, 5);
        firstCellStyle = `grid-column:${column}`;
      }
      firstRendered = false;

      output += `
        <div
          class="cal-cell ${key===todayKey?"today":""} ${dow===6?"weekend-sat-cell":dow===0?"weekend-sun-cell":""}"
          data-day="${key}"
          tabindex="0"
          role="button"
          aria-label="${year}년 ${month+1}월 ${dayNumber}일 일정 상세"
          ${key===todayKey ? 'aria-current="date"' : ''}
          ${firstCellStyle ? `style="${firstCellStyle}"` : ""}
        >
          <div class="cal-date">
            <span style="${dow===0?'color:#e03131':dow===6?'color:#1c7ed6':''}">
              ${dayNumber}
            </span>
            ${state.mobile ? `<span style="font-size:11px;color:var(--muted)">(${DOW[dow]})</span>` : ""}
          </div>
          <div class="event-list">${events}</div>
        </div>
      `;
    }

    output += `
        </div>
      </div>
    `;
  }

  output += `</div>`;
  return output;
}


function planEvents(key, showDept, horizontal, student=false){
  const day = student ? data.studentDaysByKey[key] : data.daysByKey[key];
  const ids = (day?.eventIds || []).filter(id=>
    student ? matchesStudent(data.studentEventsById[id].text) : matches(data.eventsById[id].dept, data.eventsById[id].text)
  );

  if(student){
    return ids.map((id,index)=>`
      <div class="event-row ${horizontal?"horizontal":""}" data-student-id="${id}">
        <span>${highlight(data.studentEventsById[id].text)}</span>
      </div>
      ${horizontal && index < ids.length-1 ? "<span> | </span>" : ""}
    `).join("");
  }

  return ids.map((id,index)=>{
    const event = data.eventsById[id];
    return `
      <div class="event-row ${horizontal?"horizontal":""} ${showDept && !horizontal?"has-dept":""}" data-event-id="${id}">
        ${showDept ? `<span class="dept-tag" style="--dept-color:${DEPT_COLORS[event.dept]}">${highlight(event.dept)}</span>` : ""}
        <span>${highlight(event.text)}</span>
      </div>
      ${horizontal && index < ids.length-1 ? "<span> | </span>" : ""}
    `;
  }).join("");
}

function renderDept(){
  const ids = (data.deptIndex[state.dept] || []).filter(id=>
    matches(data.eventsById[id].dept, data.eventsById[id].text)
  );
  const groups = new Map();
  ids.forEach(id=>{
    const event = data.eventsById[id];
    const date = dateFromKey(event.dateKey);
    const key = `${date.getFullYear()}년 ${date.getMonth()+1}월`;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push({ id, ev:event, d:date });
  });

  const deptFilters = `
    <div class="dept-quick" role="group" aria-label="부서 선택">
      ${FIXED_DEPTS.map(dept=>`
        <button class="seg-btn dept-quick-btn ${dept===state.dept?"active":""}" style="--dept-color:${DEPT_COLORS[dept]}" data-dept="${escapeHTML(dept)}" type="button">
          ${escapeHTML(dept)}
        </button>
      `).join("")}
    </div>`;

  let output = `<div class="page">
    ${toolbar("", "부서조회", "", "", deptFilters)}
  `;

  if(!groups.size) return output + empty("등록된 부서 일정이 없습니다.") + "</div>";

  for(const [month, items] of groups){
    output += `<div class="section-title">${month}<span class="section-count">${items.length}건</span></div>
      <div class="dept-grid">`;
    for(const item of items){
      output += `
        <div class="dept-card" data-event-id="${item.id}" tabindex="0" role="button" aria-label="${item.d.getMonth()+1}월 ${item.d.getDate()}일 ${escapeHTML(item.ev.text)} 상세보기">

            <div class="dept-card-text">${highlight(item.ev.text)}</div>
          </div>
        </div>`;
    }
    output += `</div>`;
  }

  output += `</div>`;
  return output;
}

function nugaCategories(){
  return state.nuga.grade === 3
    ? ["전체","자율","봉사","동아리","진로"]
    : ["전체","자율자치","동아리","진로"];
}

function nugaMatch(row, category){
  return (category === "전체" || row.displayCategory[state.nuga.grade] === category);
}

function renderNuga(){
  const gradeIndex = state.nuga.grade - 1;
  const categories = nugaCategories();

  if(!categories.includes(state.nuga.category)){
    state.nuga.category = "전체";
  }

  const gradeRows = data.nuga.filter(row=>row.grades[gradeIndex]);
  const hours = {};

  categories.forEach(category=>{
    hours[category] = gradeRows
      .filter(row=>nugaMatch(row, category))
      .reduce((sum,row)=>sum + row.hours, 0);
  });

  const rows = gradeRows
    .filter(row=>nugaMatch(row, state.nuga.category))
    .filter(row=>{
      if(!state.search.tokens.length) return true;
      const hay = `${row.displayCategory[state.nuga.grade]} ${row.content} ${row.remark}`.toLowerCase();
      return state.search.tokens.every(token=>hay.includes(token));
    });

  const nugaFilters = `
    <div class="nuga-toolbar-filters">
      <div class="segment-group" role="group" aria-label="학년 선택">
        ${[1,2,3].map(grade=>`<button class="seg-btn ${grade===state.nuga.grade?"active":""}" data-grade="${grade}" type="button">${grade}학년</button>`).join("")}
      </div>
      <div class="segment-group" role="group" aria-label="영역 선택">
        ${categories.map(category=>`<button class="seg-btn nuga-cat ${category===state.nuga.category?"active":""}" style="--cat:${NUGA_COLORS[category] || "#e9ecef"}" data-category="${category}" type="button"><span class="nuga-cat-tag">${category}</span><span class="seg-count">${hours[category] || 0}</span></button>`).join("")}
      </div>
    </div>`;

  let output = `
    <div class="page">
      ${toolbar("", "창체 누가기록", "", "", nugaFilters)}
  `;

  if(!rows.length){
    return output + empty("해당 조건의 누가기록 데이터가 없습니다.") + "</div>";
  }

  if(state.mobile){
    let total = 0;
    rows.forEach(row=>{
      total += row.hours;
      const category = row.displayCategory[state.nuga.grade];
      const color = NUGA_COLORS[category] || "#e9ecef";

      output += `
        <div class="mobile-card" style="border-left:6px solid ${color}">
          <div class="mobile-date">
            ${row.date.getMonth()+1}/${row.date.getDate()} (${row.dayOfWeek})
          </div>
          <div>
            <span class="dept-tag" style="--tag-color:${color}">${escapeHTML(category)}</span>
            <strong>${highlight(row.content)}</strong>
          </div>
          <div class="mobile-meta" style="margin-top:6px">
            <span>교시: ${escapeHTML(row.periods)}</span>
            <span>${row.hours}시간 (누계 ${total}시간)</span>
          </div>
          ${row.remark ? `<div style="margin-top:5px;color:var(--muted);font-size:12px">비고: ${highlight(row.remark)}</div>` : ""}
        </div>
      `;
    });
  }else{
    let total = 0;
    output += `
      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th style="width:42px">No</th>
              <th style="width:80px">영역</th>
              <th style="width:80px">일자</th>
              <th style="width:46px">요일</th>
              <th style="width:75px">교시</th>
              <th style="width:70px">이수시간</th>
              <th>활동내용</th>
              <th style="width:22%">비고</th>
            </tr>
          </thead>
          <tbody>
    `;

    rows.forEach((row,index)=>{
      total += row.hours;
      const category = row.displayCategory[state.nuga.grade];
      const color = NUGA_COLORS[category] || "#e9ecef";

      output += `
        <tr>
          <td>${index+1}</td>
          <td><span class="dept-tag" style="--tag-color:${color}">${escapeHTML(category)}</span></td>
          <td>${row.date.getMonth()+1}/${row.date.getDate()}</td>
          <td>${row.dayOfWeek}</td>
          <td>${escapeHTML(row.periods)}</td>
          <td><strong>${row.hours}</strong></td>
          <td style="text-align:left">${highlight(row.content)}</td>
          <td style="text-align:left;color:var(--muted)">${highlight(row.remark)}</td>
        </tr>
      `;
    });

    output += `
      <tr style="background:var(--surface-2)">
        <td colspan="5" style="text-align:right"><strong>총 이수시간 합계</strong></td>
        <td><strong style="color:var(--accent);font-size:15px">${total}</strong></td>
        <td colspan="2"></td>
      </tr>
          </tbody>
        </table>
      </div>
    `;
  }

  output += `</div>`;
  return output;
}
