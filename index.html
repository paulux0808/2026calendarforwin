/* ============================================================
   10. 달력앱 내보내기 (.ics)
   ============================================================ */
const icsText = value => String(value ?? "")
  .replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n");
/* RFC 5545 는 한 줄 75옥텟까지만 허용한다. 글자가 쪼개지지 않게 접는다. */
function foldLine(line){
  const encoder = new TextEncoder();
  if(encoder.encode(line).length <= 74) return line;
  const out = [];
  let current = "", bytes = 0, limit = 73;
  for(const char of line){
    const size = encoder.encode(char).length;
    if(bytes + size > limit){ out.push(current); current = " "; bytes = 1; limit = 73; }
    current += char;
    bytes += size;
  }
  out.push(current);
  return out.join("\r\n");
}
function downloadICS(name, events){
  if(!events.length){ toast("내보낼 일정이 없습니다."); return; }
  const stamp = new Date().toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//학사력//KO", "CALSCALE:GREGORIAN", "METHOD:PUBLISH"];
  events.forEach((event, i) => {
    const start = readDate(event.key);
    const end = new Date(start);
    end.setDate(start.getDate() + 1);
    lines.push("BEGIN:VEVENT",
      `UID:${event.key.replace(/-/g, "")}-${i}@haksaryeok`,
      `DTSTAMP:${stamp}`,
      `DTSTART;VALUE=DATE:${event.key.replace(/-/g, "")}`,
      `DTEND;VALUE=DATE:${dateKey(end).replace(/-/g, "")}`,
      foldLine(`SUMMARY:${icsText(event.summary)}`),
      event.description ? foldLine(`DESCRIPTION:${icsText(event.description)}`) : "",
      "TRANSP:TRANSPARENT", "END:VEVENT");
  });
  lines.push("END:VCALENDAR");

  const blob = new Blob(["\ufeff" + lines.filter(Boolean).join("\r\n") + "\r\n"],
    { type:"text/calendar;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${name}.ics`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(`${events.length}건을 내려받았습니다. 달력 앱에서 열어 주세요.`);
}

/* 한 장에 담기 — 글자 크기를 먼저 키우고, 남는 세로 공간을 행이 나눠 갖고,
   그래도 넘치면 마지막에 통째로 줄인다. 어떤 경우에도 내용을 자르지 않는다. */
function fitPaper(stage){
  const paper = stage.querySelector(".paper");
  const limitH = mmToPx(PAPER.heightMm) - 2;
  const limitW = mmToPx(PAPER.widthMm);
  paper.style.removeProperty("--paper-row");
  paper.style.removeProperty("--paper-pad");
  paper.style.transform = "none";

  const heightAt = size => {
    paper.style.setProperty("--paper-font", `${size}pt`);
    return paper.getBoundingClientRect().height;
  };
  const largestFont = () => {
    if(heightAt(PAPER.maxFont) <= limitH) return PAPER.maxFont;
    let low = PAPER.minFont, high = PAPER.maxFont;
    for(let i = 0; i < 12; i++){
      const mid = (low + high) / 2;
      if(heightAt(mid) <= limitH) low = mid; else high = mid;
    }
    return Math.floor(low * 100) / 100;
  };

  let font = largestFont();
  heightAt(font);
  if(paper.getBoundingClientRect().height > limitH){
    paper.style.setProperty("--paper-pad", "0.5px");
    font = largestFont();
    heightAt(font);
  }

  let height = paper.getBoundingClientRect().height;
  let scale = Math.min(1, limitW / Math.max(paper.scrollWidth, limitW), limitH / height);

  if(scale >= 1){
    const rowCount = paper.querySelectorAll("tbody tr").length || paper.querySelectorAll(".pc-day").length;
    let low = 0, high = limitH / Math.max(rowCount, 1);
    for(let i = 0; i < 12; i++){
      const mid = (low + high) / 2;
      paper.style.setProperty("--paper-row", `${mid}px`);
      if(paper.getBoundingClientRect().height <= limitH) low = mid; else high = mid;
    }
    paper.style.setProperty("--paper-row", `${Math.floor(low * 100) / 100}px`);
    height = paper.getBoundingClientRect().height;
    scale = Math.min(1, limitH / height);
  }
  if(scale < 1) scale *= 0.998;
  paper.style.transform = `scale(${scale})`;
  return { font, scale, effective:font * scale };
}

const printState = { view:"", fit:null };

function buildPaper(){
  const stage = $("#paperStage");
  const preview = stage.style.transform;      /* 조판을 잴 때는 미리보기 축소를 잠시 끈다 */
  stage.style.transform = "none";
  stage.innerHTML = paperHTML(printState.view);
  printState.fit = fitPaper(stage);
  stage.style.transform = preview;

  const { effective } = printState.fit;
  const tight = effective < 7.4;
  const view = printState.view;
  const options = state.print;
  /* 아직 켤 수 있는 선택지만 알려 준다. 이미 끈 것을 또 권하지 않는다. */
  const tips = [];
  if(view !== "calendar" && !options.inline) tips.push("‘한 줄로 이어 쓰기’ 켜기");
  if(view === "plan" && (options.showPrayer || options.showSupervisor)) tips.push("경건회·자습감독 칸 끄기");
  if(options.weekends) tips.push("‘주말 포함’ 끄기");
  $("#printFit").className = `print-note spacer${tight ? " tight" : ""}`;
  $("#printFit").innerHTML = !tight
    ? `한 장에 모두 담았습니다 · 글자 <b>${effective.toFixed(1)}pt</b>`
    : tips.length
      ? `글자가 <b>${effective.toFixed(1)}pt</b>까지 작아졌습니다. ${esc(tips.join(" · "))} 가운데 하나만 해도 커집니다.`
      : `이 달은 내용이 많아 한 장에 담으면 글자가 <b>${effective.toFixed(1)}pt</b>입니다. 나눠서 인쇄하는 편이 읽기 좋습니다.`;
}
function scalePreview(){
  const viewport = $("#paperViewport");
  const stage = $("#paperStage");
  const available = viewport.clientWidth - 24;
  const roomForPage = Math.max(260, window.innerHeight * 0.86 - 216);
  const scale = Math.max(0.15, Math.min(1,
    available / mmToPx(PAPER.widthMm), roomForPage / mmToPx(PAPER.heightMm)));
  stage.style.transform = `scale(${scale})`;
  stage.style.marginLeft = `${Math.max(0, (available - mmToPx(PAPER.widthMm) * scale) / 2)}px`;
  viewport.style.height = `${mmToPx(PAPER.heightMm) * scale + 24}px`;
}
function printOptionsHTML(){
  const view = printState.view;
  const rows = [`<p class="eyebrow" style="padding:2px 0 4px">${esc(PAPER_VIEWS[view])} · ${+state.month.slice(5)}월</p>`];

  rows.push("</div>");
  rows.push(`<p class="print-note">A4 세로 한 장에 맞춰 글자 크기를 자동으로 정합니다. 잘리는 내용은 없습니다.</p>`);

function openPrint(){
  if(!loaded || !Object.hasOwn(PAPER_VIEWS, state.view)) return;

function closePrint(){
  $("#printRoot").appendChild($("#paperStage"));
  $("#paperStage").style.transform = "none";
}
function runPrint(){
  const stage = $("#paperStage");
  $("#printDialog").close();
  $("#printRoot").appendChild(stage);
  stage.style.transform = "none";
  printing = true;
  document.body.classList.add("printing");
  clearTimeout(printTimer);
  printTimer = setTimeout(endPrint, 4000);   /* afterprint 가 오지 않는 브라우저 대비 */
  window.print();
}
function endPrint(){
  clearTimeout(printTimer);
  if(!printing) return;
  printing = false;
  document.body.classList.remove("printing");
  if($("#printDialog").open){
    $("#paperViewport").appendChild($("#paperStage"));
    scalePreview();
  }
}
window.addEventListener("afterprint", endPrint);
window.addEventListener("beforeprint", () => {
  /* Ctrl+P 로 바로 인쇄할 때도 미리보기와 같은 결과가 나오게 한다. */
  if(printing || !loaded) return;
  const open = $("#printDialog").open;
  if(!open && !Object.hasOwn(PAPER_VIEWS, state.view)) return;
  if(!open) printState.view = state.view;
  $("#printRoot").appendChild($("#paperStage"));
  $("#paperStage").style.transform = "none";
  try{ if(!open) buildPaper(); }catch{ return; }
  printing = true;
  document.body.classList.add("printing");
  clearTimeout(printTimer);
  printTimer = setTimeout(endPrint, 4000);
});

  $("#charCount").textContent = `${draft.content.length}자`;
  $("#draftHint").textContent = stored
    ? "작성 중인 내용은 이 기기에 저장됩니다"
    : "이 탭에서만 내용을 들고 있습니다";
}
function syncRequestForm(){
  const form = $("#requestForm");
  if(!form) return;
  $$("input,textarea,select,button", form).forEach(el => { el.disabled = sending; });
  form.querySelector('button[type="submit"]').textContent = sending ? "보내는 중…" : "요청 보내기";
  const status = $("#reqStatus");
  status.textContent = requestNote;
  status.className = `form-status ${requestTone}`;
}
async function submitRequest(event){
  event.preventDefault();
  if(sending) return;
  saveDraft();
  const payload = { name:draft.name.trim(), type:draft.type, content:draft.content.trim() };
  if(!payload.name || !payload.content){
    requestNote = "작성자와 요청 내용을 모두 채워 주세요.";
    requestTone = "warn-text";
    syncRequestForm();
    return;
  }
  sending = true;
  requestNote = "";
  requestTone = "";
  syncRequestForm();

  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), CONFIG.REQUEST_TIMEOUT_MS);
  try{
    /* Apps Script 웹앱은 CORS 응답을 주지 않아 결과를 읽을 수 없다.
       그래서 성공을 단정하지 않고, 보낸 내용을 남겨 다시 보낼 수 있게 한다. */
    await fetch(CONFIG.WEB_APP_URL, {
      method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=UTF-8" },
      body:JSON.stringify(payload), signal:controller.signal
    });
    requestNote = "보냈습니다. 접수 여부는 시스템에서 확인할 수 없으니, 급한 건은 담당자에게 한 번 더 알려 주세요.";
    requestTone = "ok";
    draft = { name:payload.name, type:payload.type, content:"" };
    writeStore(DRAFT_KEY, draft);
    $("#reqText").value = "";
    $("#charCount").textContent = "0자";
  }catch{
    requestNote = "보내지 못했습니다. 작성한 내용은 그대로 두었으니 연결을 확인한 뒤 다시 눌러 주세요.";
    requestTone = "warn-text";
  }finally{
    clearTimeout(timer);
    sending = false;
    syncRequestForm();
    toast(requestNote);
  }
}

/* ============================================================
   14. 조작
   ============================================================ */
document.addEventListener("click", event => {
  const target = event.target.closest("button, [data-act]");
  if(!target) return;

  if(target.dataset.view){ switchView(target.dataset.view); return; }
  if(target.dataset.month){ state.month = target.dataset.month; render(); return; }
  if(target.dataset.event){
    const found = index.events.get(target.dataset.event);
    if(found) openDay(found.key, found.id);
    return;
  }
  if(target.dataset.day){ openDay(target.dataset.day); return; }
  if(target.dataset.gotoDept){
    $("#dayDialog").close();
    state.dept = target.dataset.gotoDept;
    state.view = "dept";
    state.query = "";
    render();
    window.scrollTo({ top:0, behavior:"instant" });
    return;
  }
  if(target.dataset.deptToggle){
    const dept = target.dataset.deptToggle;
    state.deptFilter = isHidden(dept)
      ? state.deptFilter.filter(d => d !== dept)
      : [...state.deptFilter, dept];
    render({ keepScroll:true });
    return;
  }
  if(target.dataset.toggle){
    const [group, key] = target.dataset.toggle.split(".");
    if(typeof state[group]?.[key] === "boolean" && target.tagName === "BUTTON"){
      state[group][key] = !state[group][key];
      render({ keepScroll:true });
    }
    return;
  }
  if(target.dataset.grade){
    state.grade = +target.dataset.grade;
    state.category = "전체";
    render({ keepScroll:true });
    return;
  }
  if(target.dataset.category){ state.category = target.dataset.category; render({ keepScroll:true }); return; }
  if(target.dataset.theme){ state.theme = target.dataset.theme; applyTheme(); savePrefs(); openSettings(); return; }
  if(target.dataset.font){ state.fontScale = +target.dataset.font; applyTheme(); savePrefs(); openSettings(); return; }

  switch(target.dataset.act){
    case "prev": stepMonth(-1); break;
    case "next": stepMonth(1); break;
    case "today": goToday(); break;
    case "reload": refresh(); break;
    case "alert-close": hideAlert(); break;
    case "close": target.closest("dialog")?.close(); break;
    case "print": openPrint(); break;
    case "print-now": runPrint(); break;
    case "notices": showNotices(); break;
    case "settings": openSettings(); break;
    case "show-keys": showKeys(); break;
    case "duty-log": showDutyLog(); break;
    case "duty-ics": exportDuties(); break;
    case "dept-ics": exportDept(); break;
    case "dept-all": state.deptFilter = []; render({ keepScroll:true }); break;
    case "day-prev": shiftDay(-1); break;
    case "day-next": shiftDay(1); break;
    case "day-copy": copyDay(); break;
    case "day-ics": exportDay(); break;
    case "clear-cache":
      try{ localStorage.removeItem(CACHE_KEY); }catch{}
      cacheStamp = 0;
      toast("저장본을 지웠습니다.");
      openSettings();
      break;
  }
});

document.addEventListener("change", event => {
  const el = event.target;
  if(el.dataset.toggle && el.type === "checkbox"){
    const [group, key] = el.dataset.toggle.split(".");
    if(typeof state[group]?.[key] === "boolean"){
      state[group][key] = el.checked;
      savePrefs();
      if(group === "print"){ buildPaper(); scalePreview(); }
      else render({ keepScroll:true });
    }
    return;
  }
  if(el.id === "monthInput"){
    const value = el.type === "number" ? `${el.value}-01` : el.value;
    if(/^\d{4}-\d{2}$/.test(value) && firstOfMonth(value)){ state.month = value; render(); }
    else el.value = el.type === "number" ? state.month.slice(0, 4) : state.month;
    return;
  }
  if(el.id === "deptSelect"){ state.dept = el.value; render(); return; }
  if(el.id === "meInput"){ state.me = el.value.trim().slice(0, 20); savePrefs(); render({ keepScroll:true }); return; }
  if(el.closest("#requestForm")) saveDraft();
});

document.addEventListener("input", event => {
  const el = event.target;
  if(el.id === "search"){
    clearTimeout(searchTimer);
    if(!el.dataset.composing) searchTimer = setTimeout(applySearch, 140);
    return;
  }
  if(el.id === "meInput"){
    clearTimeout(meTimer);
    meTimer = setTimeout(() => { state.me = el.value.trim().slice(0, 20); savePrefs(); }, 200);
    return;
  }
  if(el.closest("#requestForm")) saveDraft();
});
document.addEventListener("compositionstart", event => {
  if(event.target.id === "search") event.target.dataset.composing = "1";
});
document.addEventListener("compositionend", event => {
  if(event.target.id !== "search") return;
  delete event.target.dataset.composing;
  clearTimeout(searchTimer);
  applySearch();
});
document.addEventListener("submit", event => {
  if(event.target.id === "requestForm") submitRequest(event);
});

let searchTimer = null, meTimer = null;
function applySearch(){
  const input = $("#search");
  if(!input) return;
  state.query = input.value;
  render({ keepScroll:true });
}

/* 배경을 눌러 닫기 */
for(const id of ["dayDialog", "printDialog", "settingsDialog", "infoDialog"]){
  const dialog = $("#" + id);
  dialog.addEventListener("click", event => {
    if(event.target !== dialog) return;
    const box = dialog.getBoundingClientRect();
    if(event.clientX < box.left || event.clientX > box.right ||
       event.clientY < box.top || event.clientY > box.bottom) dialog.close();
  });
}
$("#dayDialog").addEventListener("close", () => { dayState.key = ""; dayState.eventId = ""; });
$("#printDialog").addEventListener("close", closePrint);
$("#settingsDialog").addEventListener("close", () => { render({ keepScroll:true }); });

$("#reloadBtn").addEventListener("click", refresh);
$("#settingsBtn").addEventListener("click", openSettings);
$("#themeBtn").addEventListener("click", () => {
  const order = ["light", "dark", "system"];
  state.theme = order[(order.indexOf(state.theme) + 1) % order.length];
  applyTheme();
  savePrefs();
  toast(`테마: ${{ light:"밝게", dark:"어둡게", system:"시스템 설정" }[state.theme]}`);
});
$("#dutyCard").addEventListener("click", showDutyLog);

document.addEventListener("keydown", event => {
  if(event.metaKey || event.ctrlKey || event.altKey) return;
  const active = document.activeElement;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(active?.tagName || "") || active?.isContentEditable;
  const openDialog = $$("dialog[open]").length > 0;

  if(event.key === "Escape" && !openDialog && state.query){
    state.query = "";
    render({ keepScroll:true });
    return;
  }
  if(typing || openDialog) return;

  if(event.key === "/" || event.key === "?"){
    event.preventDefault();
    if(event.key === "?") showKeys();
    else $("#search")?.focus();
    return;
  }
  const digit = Number(event.key);
  if(Number.isInteger(digit) && digit >= 1 && digit <= VIEW_KEYS.length){
    event.preventDefault();
    switchView(VIEW_KEYS[digit - 1]);
    return;
  }
  const lower = event.key.toLowerCase();
  if(lower === "t"){ event.preventDefault(); goToday(); return; }
  if(lower === "r"){ event.preventDefault(); refresh(); return; }
  if(lower === "p" && loaded && Object.hasOwn(PAPER_VIEWS, state.view)){ event.preventDefault(); openPrint(); return; }
  if(VIEWS[state.view].month && state.view !== "today"){
    if(event.key === "ArrowLeft"){ event.preventDefault(); stepMonth(-1); }
    if(event.key === "ArrowRight"){ event.preventDefault(); stepMonth(1); }
  }
});

let resizeTimer = null;
window.addEventListener("resize", () => {
  if(!$("#printDialog").open) return;
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(scalePreview, 150);
});
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if(state.theme === "system") applyTheme();
});
document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  updateDutyCard();
  if(Date.now() - lastRefresh > CONFIG.REFRESH_MS && !sending) refresh();
});
setInterval(() => { if(!document.hidden && !sending && !printing) refresh(); }, CONFIG.REFRESH_MS);

/* 레일의 내 당번 카드 */
function updateDutyCard(){
  const card = $("#dutyCard");
  const duties = myDuties();
  const key = todayKey();
  const next = duties.find(d => d.key >= key);
  if(!state.me || !next){ card.hidden = true; return; }
  card.hidden = false;
  card.innerHTML = `
    <span class="dc-top"><span class="seal-dot" aria-hidden="true"></span>
      <span class="dc-dday">${next.key === key ? "오늘" : `D-${dayDiff(key, next.key)}`}</span>
      <span class="dc-name">${esc(next.kind)}</span></span>
    <span class="dc-when">${whenLabel(next.key)} · ${esc(state.me)}</span>`;
}
/* ============================================================
   15. 시작
   ============================================================ */
restorePrefs();
applyTheme();
loadCache();
loading = true;
pendingScrollToToday = ["plan", "student", "calendar"].includes(state.view);
render();
refresh();
</script>
