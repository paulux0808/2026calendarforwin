function showNotices(){
  const button = $("#noticeBtn");
  if(!data.notices.length){
    button.classList.add("hidden");
    return;
  }
  button.textContent = `공지 ${data.notices.length}`;
  button.classList.remove("hidden");
  $("#noticeBody").textContent = data.notices.join("\n\n────────────────\n\n");
}

function openEvent(id){
  const event = data.eventsById[id];
  if(!event) return;

  if(!state.mobile && window.innerWidth > 850){
    openDetail(event.dateKey, id, null);
    return;
  }

  const date = dateFromKey(event.dateKey);
  const lines = [
    `날짜: ${event.dateKey} (${DOW[date.getDay()]})`,
    `부서: ${event.dept}`,
    `내용: ${event.text}`
  ];

  const prayer = data.prayer[event.dateKey];
  if(prayer?.name){
    lines.push("", "기도/말씀 담당", `- 담당: ${prayer.name}`);
    if(prayer.hymn) lines.push(`- 찬송: ${prayer.hymn}`);
    if(prayer.bible) lines.push(`- 말씀: ${prayer.bible}`);
  }

  if(data.supervisor[event.dateKey]){
    lines.push("", `자습감독: ${data.supervisor[event.dateKey]}`);
  }

  $("#eventModalTitle").textContent = `${date.getMonth()+1}월 ${date.getDate()}일 (${DOW[date.getDay()]}) · ${event.dept}`;
  $("#eventModalBody").textContent = lines.join("\n");
  $("#eventDeptBtn").style.display = "";
  $("#eventDeptBtn").onclick = ()=>{
    state.dept = event.dept;
    closeModal("eventModal");
    switchTab("dept");
  };

  $("#eventModal").classList.add("open");
}

function openStudentEvent(id){
  const event = data.studentEventsById[id];
  if(!event) return;

  if(!state.mobile && window.innerWidth > 850){
    openDetail(event.dateKey, null, id);
    return;
  }

  const date = dateFromKey(event.dateKey);
  $("#eventModalTitle").textContent = `${date.getMonth()+1}월 ${date.getDate()}일 (${DOW[date.getDay()]}) · 학생일정`;
  $("#eventModalBody").textContent = `날짜: ${event.dateKey} (${DOW[date.getDay()]})\n내용: ${event.text}`;
  $("#eventDeptBtn").style.display = "none";
  $("#eventModal").classList.add("open");
}

function closeModal(id){
  $("#"+id).classList.remove("open");
}


function normalizeScheduleEventText(value){
  return String(value || "")
    .toLowerCase()
    .replace(/[!！]/g, "")
    .replace(/[\s\u00a0]+/g, "")
    .replace(/[·•ㆍ]/g, "")
    .trim();
}

function classifiedDayEvents(key){
  const studentIds = data.studentDaysByKey[key]?.eventIds || [];
  const studentQueues = Object.create(null);
  for(const id of studentIds){
    const k = normalizeScheduleEventText(data.studentEventsById[id]?.text);
    if(k) (studentQueues[k] ??= []).push(id);
  }

  const teacherOnlyIds = [];
  const studentDeptById = Object.create(null);
  for(const id of (data.daysByKey[key]?.eventIds || [])){
    const event = data.eventsById[id];
    const k = normalizeScheduleEventText(event?.text);
    const queue = k ? studentQueues[k] : null;
    if(queue?.length){
      const studentId = queue.shift();
      studentDeptById[studentId] = event.dept;
    }else{
      teacherOnlyIds.push(id);
    }
  }
  return { teacherOnlyIds, studentIds, studentDeptById };
}

function dayText(key){
  const date = dateFromKey(key);
  const lines = [`${date.getFullYear()}년 ${date.getMonth()+1}월 ${date.getDate()}일 (${DOW[date.getDay()]})`];

  const { teacherOnlyIds, studentIds, studentDeptById } = classifiedDayEvents(key);

  teacherOnlyIds.forEach(id=>{
    const event = data.eventsById[id];
    lines.push(`[교직원/${event.dept}] ${event.text}`);
  });

  studentIds.forEach(id=>{
    const dept = studentDeptById[id];
    lines.push(`${dept ? `[${dept}] ` : ""}${data.studentEventsById[id].text}`);
  });

  const prayer = data.prayer[key];
  if(prayer?.name) lines.push(`경건회: ${prayer.name} (찬송:${prayer.hymn || "-"} / 말씀:${prayer.bible || "-"})`);
  if(data.supervisor[key]) lines.push(`자습감독: ${data.supervisor[key]}`);

  return lines.join("\n");
}

function openDetail(key, eventId=null, studentId=null){
  state.detailDate = key;
  const date = dateFromKey(key);
  $("#detailTitle").textContent = `${date.getMonth()+1}월 ${date.getDate()}일 (${DOW[date.getDay()]})`;
  $("#detailSub").textContent = `${date.getFullYear()}학년도`;

  const { teacherOnlyIds, studentIds, studentDeptById } = classifiedDayEvents(key);

  let body = `<section class="detail-section"><h3>교직원 일정</h3>`;
  body += teacherOnlyIds.length ? teacherOnlyIds.map(id=>{
    const event = data.eventsById[id];
    return `<div class="detail-event ${id===eventId?"selected":""}">
      <button class="dept-tag clickable" data-panel-dept="${escapeHTML(event.dept)}" style="--dept-color:${DEPT_COLORS[event.dept]}" type="button">${escapeHTML(event.dept)}</button>
      <div>${escapeHTML(event.text)}</div>
    </div>`;
  }).join("") : `<div class="detail-empty">학생일정과 구분되는 교직원 전용 일정이 없습니다.</div>`;
  body += `</section>`;

  if(studentIds.length){
    body += `<section class="detail-section"><h3>학생일정</h3>${studentIds.map(id=>{
      const dept = studentDeptById[id];
      return `
      <div class="detail-event ${id===studentId?"selected":""}">
        ${dept ? `<button class="dept-tag clickable" data-panel-dept="${escapeHTML(dept)}" style="--dept-color:${DEPT_COLORS[dept]}" type="button">${escapeHTML(dept)}</button>` : `<span class="dept-tag neutral" aria-hidden="true"></span>`}
        <div>${escapeHTML(data.studentEventsById[id].text)}</div>
      </div>`;
    }).join("")}</section>`;
  }

  const prayer = data.prayer[key];
  const supervisor = data.supervisor[key] || "";
  if(prayer?.name || prayer?.hymn || prayer?.bible || supervisor){
    body += `<section class="detail-section"><h3>담당 정보</h3><div class="detail-meta">
      ${prayer?.name ? `<div><strong>경건회</strong><span>${escapeHTML(prayer.name)}</span></div>` : ""}
      ${prayer?.hymn ? `<div><strong>찬송</strong><span>${escapeHTML(prayer.hymn)}</span></div>` : ""}
      ${prayer?.bible ? `<div><strong>말씀</strong><span>${escapeHTML(prayer.bible)}</span></div>` : ""}
      ${supervisor ? `<div><strong>자습감독</strong><span>${escapeHTML(supervisor)}</span></div>` : ""}
    </div></section>`;
  }

  $("#detailBody").innerHTML = body;
  $("#detailPanel").classList.add("open");
}

function closeDetail(){
  state.detailDate = "";
  $("#detailPanel").classList.remove("open");
}

function moveDetail(delta){
  if(!state.detailDate) return;
  const date = dateFromKey(state.detailDate);
  date.setDate(date.getDate() + delta);
  openDetail(getDateKey(date));
}

/* =========================
   11. 탭 및 검색 제어
   ========================= */

function switchTab(tab){
  state.tab = tab;
  closeDetail();
  closeMobileMenu();
  const focusToday = ["calendar","plan","student"].includes(tab);
  render({preserveScroll:false, focusToday, toTop:!focusToday});
}

function changeMonth(delta){
  const step = (state.tab === "calendar" && state.calendar.yearly) ? 12 : 1;
  state.viewDate = new Date(state.viewDate.getFullYear(), state.viewDate.getMonth() + delta * step, 1);
  closeDetail();
  render({preserveScroll:false,toTop:true});
}

function goToday(){
  const today = new Date();
  state.viewDate = new Date(today.getFullYear(), today.getMonth(), 1);
  render({preserveScroll:false,focusToday:true});
}

function setMobile(value){
  state.mobile = !!value;
  closeDetail();
  closeMobileMenu();
  render({preserveScroll:false,toTop:true});
}

function updateSearch(value){
  state.search.query = normalizeQuery(value);
  state.search.tokens = state.search.query ? state.search.query.split(" ").filter(Boolean) : [];
  render({preserveScroll:true});
}

function updateSearchMeta(){
  if(!state.search.tokens.length){
    $("#searchMeta").textContent = "";
    return;
  }

  let count = 0;
  if(state.tab === "student"){
    count = Object.values(data.studentEventsById).filter(event=>matchesStudent(event.text)).length;
  }else if(state.tab === "dept"){
    count = (data.deptIndex[state.dept] || []).filter(id=>matches(data.eventsById[id].dept, data.eventsById[id].text)).length;
  }else if(state.tab === "nuga"){
    count = data.nuga.filter(row=>{
      const hay = `${row.displayCategory[state.nuga.grade]} ${row.content} ${row.remark}`.toLowerCase();
      return state.search.tokens.every(token=>hay.includes(token));
    }).length;
  }else{
    count = Object.values(data.eventsById).filter(event=>matches(event.dept, event.text)).length;
  }

  $("#searchMeta").textContent = `${count}건`;
}

function scrollToday(){
  const main = $("#appMain");
  const target = $(".today,.today-row", main);
  if(!target) return;

  const targetRect = target.getBoundingClientRect();
  const mainRect = main.getBoundingClientRect();
  main.scrollTop = Math.max(0, main.scrollTop + (targetRect.top - mainRect.top) - Math.max(0, (main.clientHeight - targetRect.height) / 2));
}

/* =========================
   12. 요청 전송
   ========================= */

async function submitRequest(event){
  event.preventDefault();
  const name = $("#reqName").value.trim();
  const type = $("#reqType").value;
  const content = $("#reqContent").value.trim();
  const button = $("#submitRequestBtn");

  if(!name || !content){
    showToast("성함과 요청 내용을 입력해 주세요.", 2600);
    return;
  }

  try{
    localStorage.setItem("academic-calendar-request-draft", JSON.stringify({ name, type, content, createdAt:Date.now() }));
  }catch{}

  button.disabled = true;
  button.textContent = "전송 중...";

  try{
    await fetch(CONFIG.WEB_APP_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, type, content })
    });
    showToast("요청이 접수되었습니다.", 2400);
    $("#reqContent").value = "";
    $("#reqCount").textContent = "0";
    try{ localStorage.removeItem("academic-calendar-request-draft"); }catch{}
  }catch(error){
    showToast("전송 오류: 작성 내용은 임시 저장되었습니다.", 3400);
  }finally{
    button.disabled = false;
    button.textContent = "요청 제출하기";
  }
}

function restoreRequestDraft(){
  if(state.tab !== "request") return;
  try{
    const draft = JSON.parse(localStorage.getItem("academic-calendar-request-draft") || "null");
    if(!draft) return;
    $("#reqName").value = draft.name || "";
    $("#reqType").value = draft.type || "일정수정";
    $("#reqContent").value = draft.content || "";
    $("#reqCount").textContent = $("#reqContent").value.length;
  }catch{}
}

function showToast(message, duration=1800){
  const toast = $("#toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(()=>toast.classList.remove("show"), duration);
}

/* =========================
   13. 모바일 메뉴 제어
   ========================= */

function openMobileMenu(){
  $("#mobileMenu").classList.add("open");
  $("#mobileBackdrop").classList.add("open");
}

function closeMobileMenu(){
  $("#mobileMenu").classList.remove("open");
  $("#mobileBackdrop").classList.remove("open");
}

/* =========================
   14. 이벤트 위임
   ========================= */


function printCurrentView(){
  const onePageTable = state.tab === "plan" || state.tab === "student";
  const calendarPrint = state.tab === "calendar";
  document.body.classList.toggle("print-table-one-page", onePageTable);
  document.body.classList.toggle("print-calendar", calendarPrint);
  const cleanup = ()=>{
    document.body.classList.remove("print-table-one-page");
    document.body.classList.remove("print-calendar");
  };
  window.addEventListener("afterprint", cleanup, { once:true });
  window.print();
}

document.addEventListener("click", event=>{
  // PC 우측 상세 패널: 패널 바깥을 클릭하면 닫기.
  // 다른 날짜/일정을 클릭한 경우에는 아래 기존 핸들러가 즉시 새 상세를 다시 연다.
  if(!state.mobile && $("#detailPanel")?.classList.contains("open") && !event.target.closest("#detailPanel")){
    closeDetail();
  }
  if(event.target.closest("#noticeBtn")){
    $("#noticeModal").classList.add("open");
    return;
  }
  if(event.target.closest("#searchClearBtn")){
    $("#searchInput").value = "";
    updateSearch("");
    $("#searchInput").focus();
    return;
  }

  // 탭 전환
  const tab = event.target.closest("[data-tab]");
  if(tab){
    switchTab(tab.dataset.tab);
    return;
  }

  // 일정 아이템 클릭
  const eventItem = event.target.closest("[data-event-id]");
  if(eventItem){
    openEvent(+eventItem.dataset.eventId);
    return;
  }

  // 학생 일정 클릭
  const studentItem = event.target.closest("[data-student-id]");
  if(studentItem){
    openStudentEvent(+studentItem.dataset.studentId);
    return;
  }

  // 달력 날짜 셀 / 테이블 행 클릭 (PC 상세 패널 열기)
  const day = event.target.closest("[data-day]");
  if(day && !state.mobile && window.innerWidth > 850){
    openDetail(day.dataset.day);
    return;
  }

  // 부서 선택
  const dept = event.target.closest("[data-dept]");
  if(dept){
    state.dept = dept.dataset.dept;
    render();
    return;
  }

  // 누가기록 카테고리 필터
  const category = event.target.closest("[data-category]");
  if(category){
    state.nuga.category = category.dataset.category;
    render();
    return;
  }

  // 누가기록 학년 필터
  const grade = event.target.closest("[data-grade]");
  if(grade){
    state.nuga.grade = +grade.dataset.grade;
    state.nuga.category = "전체";
    render();
    return;
  }

  // 상세 패널 내 부서 뱃지 클릭 (해당 부서 탭으로 즉시 이동)
  const panelDept = event.target.closest("[data-panel-dept]");
  if(panelDept){
    state.dept = panelDept.dataset.panelDept;
    closeDetail();
    switchTab("dept");
    return;
  }

  // 상단 툴바 액션 (월 이동 / 오늘 / 인쇄)
  const action = event.target.closest("[data-action]")?.dataset.action;
  if(action === "prev-month"){ changeMonth(-1); return; }
  if(action === "next-month"){ changeMonth(1); return; }
  if(action === "today"){ goToday(); return; }
  if(action === "print"){ printCurrentView(); return; }

  // 모달 닫기
  const close = event.target.closest("[data-close-modal]");
  if(close){
    closeModal(close.dataset.closeModal);
    return;
  }

  if(event.target.classList.contains("modal")){
    event.target.classList.remove("open");
  }
});

document.addEventListener("change", event=>{
  if(event.target.matches("[data-option-group]")){
    const group = event.target.dataset.optionGroup;
    const key = event.target.dataset.optionKey;
    state[group][key] = event.target.checked;
    render();
    return;
  }
});

document.addEventListener("input", event=>{
  if(event.target.id === "reqContent"){
    $("#reqCount").textContent = event.target.value.length;
  }
});

document.addEventListener("submit", event=>{
  if(event.target.id === "requestForm"){
    submitRequest(event);
  }
});

document.addEventListener("keydown", event=>{
  if(event.key === "Escape"){
    closeDetail();
    closeMobileMenu();
    $$(".modal.open").forEach(modal=>modal.classList.remove("open"));
  }

  const active = document.activeElement;
  if((event.key === "Enter" || event.key === " ") && active?.matches(".cal-cell[data-day],.dept-card[data-event-id]")){
    event.preventDefault();
    if(active.matches(".dept-card")){
      openEvent(+active.dataset.eventId);
    }else{
      openDetail(active.dataset.day);
    }
  }

  if(event.key === "/" && !["INPUT","TEXTAREA","SELECT"].includes(active?.tagName)){
    event.preventDefault();
    $("#searchInput").focus();
  }

  if(event.altKey && event.key === "ArrowLeft"){
    event.preventDefault();
    changeMonth(-1);
  }

  if(event.altKey && event.key === "ArrowRight"){
    event.preventDefault();
    changeMonth(1);
  }
});

/* =========================
   15. 컨트롤 이벤트 바인딩
   ========================= */

let searchTimer = null;
$("#searchInput").addEventListener("input", event=>{
  clearTimeout(searchTimer);
  searchTimer = setTimeout(()=>{ updateSearch(event.target.value); }, 140);
});

$("#retryBtn").onclick = reloadAll;
$("#closeBannerBtn").onclick = hideError;
$("#refreshBtn").onclick = reloadAll;

$("#scaleDownBtn")?.addEventListener("click",()=>{ state.scale = clamp(-2, 2, state.scale-1); render(); });
$("#scaleResetBtn")?.addEventListener("click",()=>{ state.scale = 0; render(); });
$("#scaleUpBtn")?.addEventListener("click",()=>{ state.scale = clamp(-2, 2, state.scale+1); render(); });

$("#viewBtn")?.addEventListener("click",()=>setMobile(!state.mobile));

$("#mobileFab").onclick = openMobileMenu;
$("#mobileCloseBtn").onclick = closeMobileMenu;
$("#mobileBackdrop").onclick = closeMobileMenu;

$("#detailCloseBtn").onclick = closeDetail;
$("#detailDoneBtn")?.addEventListener("click",closeDetail);


$("#detailPrevBtn")?.addEventListener("click",()=>moveDetail(-1));
$("#detailNextBtn")?.addEventListener("click",()=>moveDetail(1));
$("#detailTodayBtn")?.addEventListener("click",()=>openDetail(getDateKey(new Date())));

$("#detailCopyBtn").onclick = async ()=>{
  if(!state.detailDate || !navigator.clipboard) return;
  await navigator.clipboard.writeText(dayText(state.detailDate));
  showToast("복사됨");
};

/* =========================
   16. 초기화 및 백그라운드 갱신
   ========================= */

restorePrefs();
state.mobile = window.innerWidth <= 850;
applyPrefs();
render();

let resizeTimer = null;
window.addEventListener("resize", ()=>{
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(()=>{
    const shouldMobile = window.innerWidth <= 850;
    if(shouldMobile !== state.mobile){
      setMobile(shouldMobile);
    }
  }, 180);
});

document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden && state.load.lastRefresh && Date.now() - state.load.lastRefresh > 300000){
    reloadAll();
  }
});

setInterval(()=>{
  if(!document.hidden && state.load.lastRefresh){
    reloadAll();
  }
}, 300000);

reloadAll();
</script>
