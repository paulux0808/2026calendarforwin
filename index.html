<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>학사일정</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script>
(function(){
  try{
    var p = JSON.parse(localStorage.getItem("hs-prefs-v2") || "{}");
    var dark = p.theme === "dark" || ((!p.theme || p.theme === "system") &&
      matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.dataset.theme = dark ? "dark" : "light";
    if([0.92,1,1.1,1.22].indexOf(p.fs) >= 0) document.documentElement.style.setProperty("--fs", p.fs);
  }catch(e){ document.documentElement.dataset.theme = "light"; }
})();
</script>
<style>
/* 학사일정 — 구글 시트 6개를 읽어 보여 주고, 요청 한 건을 보낸다. */

:root{
  color-scheme:light;
  --bg:#FFFFFF;
  --bg-2:#F5F6F8;      /* 표 머리, 주말 */
  --bg-3:#EDEFF2;
  --ink:#17181C;
  --ink-2:#5A6169;
  --ink-3:#8B929B;
  --line:#E2E5E9;
  --line-2:#CDD2D8;
  --key:#1A4B8C;       /* 선택·오늘 */
  --key-bg:#EAF0F8;
  --sat:#2563A8;
  --sun:#C1352B;
  --warn-bg:#FFF7E8;
  --warn-line:#E0BE79;
  --warn-ink:#7A5410;

  --tint-s:0%;   --tint-l:91%;
  --soft-s:0%;   --soft-l:96%;
  --label-s:16%; --label-l:28%;
  --edge-s:10%;  --edge-l:46%;

  --fs:1;
  --f-xs:calc(11px * var(--fs));
  --f-sm:calc(12px * var(--fs));
  --f-md:calc(13px * var(--fs));
  --f-lg:calc(15px * var(--fs));
  --f-xl:calc(18px * var(--fs));
  --sans:"Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont,
         "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  --r:4px;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#16181C; --bg-2:#1E2126; --bg-3:#262A30;
  --ink:#E6E8EB; --ink-2:#A3AAB3; --ink-3:#767D86;
  --line:#2C3036; --line-2:#3B4149;
  --key:#7FADE8; --key-bg:#1C2A3B;
  --sat:#7FADE8; --sun:#E8776C;
  --warn-bg:#2A2317; --warn-line:#6B5730; --warn-ink:#D8B673;
  --tint-s:-6%; --tint-l:24%;
  --soft-s:-10%; --soft-l:19%;
  --label-s:14%; --label-l:78%;
  --edge-s:10%; --edge-l:57%;
}

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:var(--f-md);line-height:1.45;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit;font-variant-numeric:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:not-allowed;opacity:.4}
h1,h2,h3,p,dl,dd{margin:0}
ul{margin:0;padding:0;list-style:none}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--key);outline-offset:1px}
mark{background:#FCE79A;color:#17181C;padding:0 1px}
:root[data-theme="dark"] mark{background:#6B5A1E;color:#F2EDDD}

/* ---- 공통 조각 ---- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  height:30px;padding:0 10px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--bg);font-size:var(--f-sm);font-weight:600;white-space:nowrap;
}
.btn:hover:not(:disabled){background:var(--bg-2)}
.btn-key{background:var(--key);border-color:var(--key);color:#fff}
:root[data-theme="dark"] .btn-key{color:#12161C}
.btn-key:hover:not(:disabled){background:var(--key);filter:brightness(1.1)}
.btn-q{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn-q:hover:not(:disabled){background:var(--bg-2);color:var(--ink)}
.btn-n{width:30px;padding:0}
.btn-s{height:26px;padding:0 8px;font-size:var(--f-xs)}
.fld{
  height:30px;padding:0 8px;border:1px solid var(--line-2);border-radius:var(--r);
  background:var(--bg);font-size:var(--f-sm);
}
.fld:focus{outline:2px solid var(--key);outline-offset:-1px;border-color:var(--key)}

/* 켜고 끄는 표시 항목 */
.opts{display:flex;gap:1px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.opts button{
  height:28px;padding:0 9px;font-size:var(--f-sm);font-weight:600;
  color:var(--ink-3);background:var(--bg-2);
}
.opts button:hover{color:var(--ink)}
.opts button[aria-pressed="true"]{background:var(--key);color:#fff}
.opts button[data-h]{
  background:hsl(var(--dh) calc(var(--ds) + var(--tint-s)) var(--tint-l));
  color:hsl(var(--dh) calc(var(--ds) + var(--label-s)) var(--label-l));
}
.opts button[data-h][aria-pressed="false"]{background:var(--bg-2);color:var(--ink-3)}
:root[data-theme="dark"] .opts button[aria-pressed="true"]{color:#12161C}

/* 부서 색 — 요소에 --dh(색상) --ds(채도)를 주고 여기서 조립한다.
   :root에서 만들면 --dh가 없어 색이 전부 죽는다. */
.tag{
  display:inline-block;flex:none;padding:0 4px;border-radius:2px;
  font-size:var(--f-xs);font-weight:700;white-space:nowrap;
  background:hsl(var(--dh,212) calc(var(--ds,7%) + var(--tint-s)) var(--tint-l));
  color:hsl(var(--dh,212) calc(var(--ds,7%) + var(--label-s)) var(--label-l));
}
.ev{
  display:block;width:100%;text-align:left;padding:1px 3px 1px 6px;
  border-left:3px solid hsl(var(--dh,212) calc(var(--ds,7%) + var(--edge-s)) var(--edge-l));
  font-size:var(--f-sm);line-height:1.4;overflow-wrap:anywhere;
}
.ev:hover{background:hsl(var(--dh,212) calc(var(--ds,7%) + var(--soft-s)) var(--soft-l))}
.ev .tag{margin-right:4px}
.ev-u{border-left-style:dotted}

/* ---- 머리 ---- */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px;padding:0 12px;min-height:44px}
.row-2{min-height:40px;border-top:1px solid var(--line);flex-wrap:wrap;padding-top:5px;padding-bottom:5px}
.wm{font-size:var(--f-lg);font-weight:800;letter-spacing:-.03em;margin-right:4px}
.tabs{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;flex:1}
.tabs::-webkit-scrollbar{display:none}
.tabs button{
  padding:12px 11px 11px;font-size:var(--f-md);font-weight:600;color:var(--ink-2);
  border-bottom:2px solid transparent;white-space:nowrap;
}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--key);border-bottom-color:var(--key);font-weight:700}
.grow{flex:1}
.find{position:relative;display:flex;align-items:center}
.find input{width:clamp(130px,15vw,210px);padding-right:44px}
.find .n{position:absolute;right:7px;font-size:var(--f-xs);color:var(--ink-3);font-weight:700;pointer-events:none}
.step{display:flex;align-items:center;gap:3px}
.step .fld{width:132px;font-weight:600}
.lbl{font-size:var(--f-sm);color:var(--ink-2);display:flex;align-items:center;gap:5px}

/* ---- 알림 줄 ---- */
.strip{display:flex;align-items:center;gap:9px;padding:7px 12px;font-size:var(--f-sm);border-bottom:1px solid var(--line)}
.strip p{flex:1;overflow-wrap:anywhere}
.strip-n{background:var(--key-bg)}
.strip-n b{color:var(--key);font-weight:700;flex:none}
.strip-w{background:var(--warn-bg);color:var(--warn-ink)}

main{padding:12px}
.none{padding:44px 12px;text-align:center;color:var(--ink-3);font-size:var(--f-sm)}
.frame{border:1px solid var(--line);border-radius:var(--r)}
.frame > table{border-collapse:separate;border-spacing:0}
.frame > table thead th:first-child{border-top-left-radius:3px}
.frame > table thead th:last-child{border-top-right-radius:3px}

/* ---- 달력 ---- */
.cap{font-size:var(--f-md);font-weight:700;margin:16px 0 6px}
.cap:first-child{margin-top:0}
.cal{display:grid;grid-template-columns:repeat(var(--c),minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cal-h{padding:5px;text-align:center;background:var(--bg-2);font-size:var(--f-xs);font-weight:700;color:var(--ink-2)}
.cal-h.s6{color:var(--sat)} .cal-h.s0{color:var(--sun)}
.d{background:var(--bg);padding:4px 5px 6px;min-height:98px;min-width:0;display:flex;flex-direction:column;gap:3px}
.d-x{background:var(--bg-2)}
.d.wk{background:var(--bg-2)}
.d.now{background:var(--key-bg);box-shadow:inset 0 2px 0 var(--key)}
.dnum{align-self:flex-start;padding:0 3px;margin-left:-3px;font-size:var(--f-md);font-weight:700;border-radius:2px}
.dnum:hover{background:var(--bg-3)}
.d.s0 .dnum{color:var(--sun)} .d.s6 .dnum{color:var(--sat)}
.d ul{display:flex;flex-direction:column;gap:2px;min-width:0}
.d .ev{font-size:var(--f-xs)}
.fold{margin-top:auto;padding-top:4px;border-top:1px dashed var(--line-2);display:flex;flex-direction:column;gap:2px}
.fold-h{font-size:var(--f-xs);font-weight:700;color:var(--ink-3)}
.d-none{font-size:var(--f-xs);color:var(--ink-3);display:none}

/* ---- 표 ---- */
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{
  padding:6px 8px;text-align:left;background:var(--bg-2);color:var(--ink-2);
  font-size:var(--f-xs);font-weight:700;border-bottom:1px solid var(--line-2);
  position:sticky;top:var(--top-h,0px);z-index:2;white-space:nowrap;
}
td{padding:4px 8px;vertical-align:top;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
tr:last-child td{border-bottom:0}
tr.wk{background:var(--bg-2)}
tr.now{background:var(--key-bg);box-shadow:inset 3px 0 0 var(--key)}
.c-d{width:44px}.c-w{width:36px}.c-n{width:96px}
td.c-d{padding-top:3px}
td.c-w{font-size:var(--f-xs);color:var(--ink-2);padding-top:6px}
tr.s0 td.c-w,tr.s0 .dnum{color:var(--sun)}
tr.s6 td.c-w,tr.s6 .dnum{color:var(--sat)}
td.c-n{font-size:var(--f-sm);padding-top:5px}
.cell{display:flex;flex-direction:column;gap:2px;padding:1px 0}
.flat .cell{display:block}
.flat .ev{display:inline;border-left:0;padding:0;margin-right:9px;border-bottom:2px solid hsl(var(--dh,212) calc(var(--ds,7%) + var(--edge-s)) var(--edge-l))}
.dash{color:var(--ink-3);font-size:var(--f-xs)}

/* ---- 부서 ---- */
.grp{display:grid;grid-template-columns:106px minmax(0,1fr);gap:10px;padding:5px 9px;border-bottom:1px solid var(--line);align-items:baseline}
.grp:last-child{border-bottom:0}
.grp span{font-size:var(--f-xs);color:var(--ink-2);font-weight:600}
.grp .ev{font-size:var(--f-md)}

/* ---- 누가기록 ---- */
.seg{display:flex;gap:1px;border:1px solid var(--line-2);border-radius:var(--r);overflow:hidden}
.seg button{height:28px;padding:0 10px;font-size:var(--f-sm);font-weight:600;color:var(--ink-3);background:var(--bg-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--key);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#12161C}
.seg b{font-weight:700;margin-left:5px}
.cm{
  width:8px;height:8px;flex:none;border-radius:1px;margin-right:1px;
  background:hsl(var(--dh,212) calc(var(--ds,7%) + var(--label-s)) var(--label-l));
}
.seg button[aria-pressed="true"] .cm{background:currentColor}
.num{text-align:right;width:64px;white-space:nowrap}
tfoot td{background:var(--bg-2);font-weight:700;border-top:1px solid var(--line-2)}
.cards{display:none}
.card{padding:8px 10px;border-bottom:1px solid var(--line)}
.card:last-child{border-bottom:0}
.card-h{display:flex;gap:8px;font-size:var(--f-xs);color:var(--ink-2);margin-bottom:2px}
.card-f{display:flex;justify-content:space-between;gap:8px;font-size:var(--f-xs);color:var(--ink-3);margin-top:2px}

/* ---- 연간 미니 달력 ---- */
.years{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,15rem),1fr));gap:9px}
.mini{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);overflow:hidden}
.mini-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px;padding:4px 8px;background:var(--bg-2);border-bottom:1px solid var(--line)}
.mini-h b{font-size:var(--f-md);font-weight:700}
.mini-h span{font-size:var(--f-xs);color:var(--ink-3)}
.mini-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:3px}
.mini-g .w{font-size:var(--f-xs);text-align:center;color:var(--ink-3);padding:2px 0}
.mini-g .w.s0{color:var(--sun)} .mini-g .w.s6{color:var(--sat)}
.mini-g button{
  min-height:30px;border-radius:3px;display:flex;align-items:center;justify-content:center;gap:2px;
  font-size:var(--f-sm);color:var(--ink-2);
}
.mini-g button:hover{background:var(--bg-2)}
.mini-g button.s0{color:var(--sun)} .mini-g button.s6{color:var(--sat)}
.mini-g button.on{font-weight:700;color:var(--ink)}
.mini-g button.now{outline:1.5px solid var(--key);outline-offset:-2px}
.mini-g .n{font-size:9px;font-weight:700;color:var(--key);background:var(--key-bg);border-radius:2px;padding:0 2px;line-height:1.4}
.mini-g .pad{visibility:hidden}

/* ---- 자료 출처 ---- */
.src{margin-top:12px;font-size:var(--f-sm);color:var(--ink-2)}
.src > summary{cursor:pointer;padding:4px 2px;color:var(--ink-2)}
.src > summary::marker{color:var(--ink-3)}
.src-body{border:1px solid var(--line);border-radius:var(--r);background:var(--bg);margin-top:5px;overflow:hidden}
.src-row{display:grid;grid-template-columns:8.5rem 1fr auto;gap:8px;align-items:baseline;padding:6px 10px;border-bottom:1px solid var(--line)}
.src-row:last-child{border-bottom:0}
.src-row b{font-weight:600;color:var(--ink)}
.src-row .st{font-size:var(--f-xs)}
.src-row .bad{color:var(--sun)}
.src-row a{font-size:var(--f-xs);white-space:nowrap}
.src-flags{border-top:1px solid var(--line-2);background:var(--warn-bg);color:var(--warn-ink);padding:7px 10px;font-size:var(--f-xs);line-height:1.6}
.src-flags b{display:block;margin-bottom:2px}
.src-flags ul{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,18rem),1fr));gap:0 14px}
.src-foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding:7px 10px;font-size:var(--f-xs);color:var(--ink-3)}
.src-foot span{flex:1;min-width:0}

/* ---- 요청 ---- */
.form{max-width:660px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
.f label{font-size:var(--f-xs);font-weight:700;color:var(--ink-2)}
.f .fld{width:100%;height:auto;padding:7px 9px;min-height:34px}
.f textarea.fld{min-height:190px;resize:vertical;line-height:1.55}
.meta{display:flex;justify-content:space-between;font-size:var(--f-xs);color:var(--ink-3);margin-top:-7px}
.send{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:4px}
.send p{flex:1;font-size:var(--f-sm)}
.send p.ok{color:var(--key);font-weight:600}
.send p.no{color:var(--sun);font-weight:600}

/* ---- 창 ---- */
dialog{
  width:min(620px,calc(100vw - 20px));max-height:84dvh;padding:0;border:1px solid var(--line-2);
  border-radius:6px;background:var(--bg);color:var(--ink);box-shadow:0 12px 40px rgba(10,14,20,.22);
}
dialog::backdrop{background:rgba(12,16,22,.45)}
dialog[open]{display:flex;flex-direction:column}
.dh{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dh h2{font-size:var(--f-lg);font-weight:700;margin-right:auto}
.db{padding:10px 12px;overflow:auto;min-height:0}
.db h3{font-size:var(--f-xs);font-weight:700;color:var(--ink-2);margin:14px 0 5px}
.db h3:first-child{margin-top:0}
.df{padding:9px 12px;border-top:1px solid var(--line);display:flex;gap:6px;justify-content:flex-end}
.df .grow{flex:1}
.item{display:flex;gap:7px;align-items:baseline;padding:5px 6px;border-radius:2px}
.item + .item{border-top:1px solid var(--line)}
.item.on{background:var(--key-bg)}
.item p{flex:1;white-space:pre-wrap;min-width:0}
.item .btn-s{align-self:center}
.duty{display:grid;grid-template-columns:64px minmax(0,1fr);gap:4px 10px;font-size:var(--f-sm)}
.duty dt{color:var(--ink-2)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:5px 16px;font-size:var(--f-sm)}
.keys div{display:flex;gap:8px;align-items:center}
kbd{
  font:inherit;font-size:var(--f-xs);font-weight:700;min-width:20px;text-align:center;
  border:1px solid var(--line-2);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--bg-2);
}
.set{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:var(--f-sm)}
.set > span{width:64px;color:var(--ink-2);flex:none}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:90;
  max-width:calc(100vw - 24px);padding:8px 13px;border-radius:var(--r);
  background:var(--ink);color:var(--bg);font-size:var(--f-sm);font-weight:600;
}

/* ---- 인쇄 미리보기 ---- */
#pdlg{width:min(900px,calc(100vw - 20px))}
.plan{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:14px}
.view{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;overflow:hidden}
.stage{width:196mm;height:281mm;background:#fff;position:relative;flex:none;transform-origin:top left;box-shadow:0 1px 8px rgba(0,0,0,.16)}
.pset{display:flex;flex-direction:column;gap:2px}
.chk{display:flex;align-items:center;gap:7px;padding:5px 3px;font-size:var(--f-sm);cursor:pointer;border-radius:2px}
.chk:hover{background:var(--bg-2)}
.chk input{width:14px;height:14px;margin:0;accent-color:var(--key);flex:none}
.fit{font-size:var(--f-sm);color:var(--ink-2);flex:1;align-self:center}
.fit.tight{color:var(--warn-ink);font-weight:600}

/* 종이 — 화면과 인쇄가 같은 트리를 쓴다 */
.paper{
  position:absolute;left:0;top:0;width:196mm;transform-origin:top left;
  color:#111;background:#fff;font-family:var(--sans);
  font-size:var(--pf,10pt);line-height:1.24;
}
.paper h1{font-size:1.55em;font-weight:800;letter-spacing:-.02em;margin:0 0 2.4mm;text-align:center}
.paper table{width:100%;table-layout:fixed;border-collapse:collapse;font-size:inherit}
.paper th,.paper td{
  border:.5pt solid #666;padding:var(--pp,1.3px) 3px;line-height:1.2;
  vertical-align:middle;overflow-wrap:anywhere;position:static;background:none;
}
.paper th{background:#ececec;font-weight:700;text-align:center;font-size:.92em}
.paper tbody tr{height:var(--pr,auto)}
.paper .p1{width:7mm;text-align:center;font-weight:700}
.paper .p2{width:8.5mm;text-align:center;white-space:nowrap}
.paper .p3{width:20mm;text-align:center}
.paper .we{background:#f4f4f4}
.paper .nw{box-shadow:inset 2pt 0 0 #1A4B8C}
.pe{display:block}
.paper.flat .pe{display:inline}
.paper.flat .pe + .pe::before{content:" · ";color:#777}
.pd{font-weight:700;font-size:.88em}
.pn{color:#aaa}
.pf{margin-top:1.6mm;display:flex;justify-content:space-between;font-size:.74em;color:#666}
.pcal{display:grid;border:.5pt solid #666;border-width:.5pt 0 0 .5pt}
.pcal > div{border:.5pt solid #666;border-width:0 .5pt .5pt 0;padding:1mm}

/* ---- 좁은 화면 ---- */
@media (max-width:860px){
  .row{padding:0 10px;min-height:42px}
  .row-1{flex-wrap:wrap}
  .tabs{order:3;width:100%;flex:none;margin:0 -10px;padding:0 10px;border-top:1px solid var(--line)}
  .tabs button{padding:9px 10px}
  .find input{width:100%}
  .find{flex:1;min-width:120px}
  .find input{font-size:16px}
  th{top:var(--top-h,0px)}
  .plan{grid-template-columns:minmax(0,1fr)}

}
@media (max-width:700px){
  main{padding:10px}
  .step{flex:1}
  .step .fld{flex:1;width:auto;font-size:16px}
  .cal{display:block;background:var(--bg);border-radius:var(--r)}
  .cal-h{display:none}
  .d{display:grid;grid-template-columns:38px minmax(0,1fr);gap:3px 9px;min-height:0;padding:7px 9px;border-bottom:1px solid var(--line);align-items:start}
  .d:last-child{border-bottom:0}
  .d-x{display:none}
  .dnum{grid-row:1/3;margin:0;text-align:center;font-size:var(--f-lg);padding-top:1px}
  .d ul,.fold{grid-column:2}
  .d .ev{font-size:var(--f-sm)}
  .d-none{display:block;grid-column:2}
  table,tbody{display:block;width:100%}
  thead{display:none}
  tbody tr{display:grid;grid-template-columns:36px minmax(0,1fr);gap:2px 9px;padding:7px 9px;border-bottom:1px solid var(--line)}
  tbody tr:last-child{border-bottom:0}
  td{display:block;border:0;padding:0;width:auto}
  td.c-d{grid-row:1/6}
  td.c-w{display:none}
  td.c-b,td.c-n{grid-column:2}
  td.c-n{font-size:var(--f-xs);color:var(--ink-2)}
  td.c-n:empty{display:none}
  td.c-n:not(:empty)::before{content:attr(data-l) " ";color:var(--ink-3);font-weight:700}
  .grp{grid-template-columns:minmax(0,1fr);gap:2px}
  .src-row{grid-template-columns:1fr auto;gap:2px 8px}
  .src-row .st{grid-column:1/-1}
  .hide-s{display:none}
  .cards{display:block}
  .pair{grid-template-columns:1fr;gap:0}
  dialog{width:calc(100vw - 14px);max-height:90dvh}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---- 인쇄 ---- */
@page{size:A4 portrait;margin:7mm}
#proot{position:absolute;left:-100000px;top:0;visibility:hidden;pointer-events:none}
@media print{
  html,body{background:#fff!important;margin:0!important;height:auto!important}
  body.pr > *:not(#proot){display:none!important}
  body.pr #proot{position:static;visibility:visible}
  body.pr #proot .stage{transform:none!important;box-shadow:none;width:196mm;height:281mm;overflow:hidden}
  .paper{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body:not(.pr) .top,body:not(.pr) .strip,body:not(.pr) .toast,body:not(.pr) .src,dialog{display:none!important}
  body:not(.pr) main{padding:0}
  .d,tr{break-inside:avoid}
}

<body>

<header class="top">
  <div class="row row-1">
    <span class="wm">학사일정</span>
    <nav class="tabs" id="tabs" aria-label="화면"></nav>
    <div class="find" id="find">
      <input class="fld" id="q" type="search" autocomplete="off" aria-label="검색" placeholder="검색">
      <span class="n" id="qn"></span>
    </div>
    <button class="btn btn-q" id="setBtn" type="button">설정</button>
  </div>
  <div class="row row-2" id="tools"></div>

<div class="strip strip-n" id="notice" hidden>
  <b>공지</b><p id="noticeText"></p>

</div>
<div class="strip strip-w" id="alert" hidden role="status">
  <p id="alertText"></p>
  <button class="btn btn-s" data-a="reload" type="button">다시 시도</button>

<main id="main" tabindex="-1"><div id="view"></div>

</main>

<dialog id="ddlg" aria-labelledby="dtitle">
  <div class="dh">
    <h2 id="dtitle"></h2>
    <button class="btn btn-n" data-a="d-prev" type="button" aria-label="이전 날">‹</button>
    <button class="btn btn-n" data-a="d-next" type="button" aria-label="다음 날">›</button>
  </div>
  <div class="db" id="dbody"></div>
  <div class="df">
    <button class="btn grow" style="justify-content:flex-start;border:0" data-a="d-ask" type="button">이 날짜로 수정 요청</button>
    <button class="btn" data-a="d-copy" type="button">복사</button>
    <button class="btn btn-key" data-a="close" type="button">닫기</button>

</dialog>

<dialog id="pdlg" aria-labelledby="ptitle">

      <div class="view" id="pview"></div>
      <div class="pset" id="pset"></div>
    </div>
  </div>
  <div class="df">
    <p class="fit" id="fit"></p>
    <button class="btn" data-a="close" type="button">닫기</button>

<dialog id="sdlg" aria-labelledby="stitle">

</dialog>

<dialog id="idlg" aria-labelledby="ititle">
  <div class="dh"><h2 id="ititle"></h2></div>
  <div class="db" id="ibody"></div>

</dialog>

<div id="proot" aria-hidden="true"><div class="stage" id="stage"></div></div>
<div class="toast" id="toast" hidden role="status"></div>

<script>
"use strict";

/* ============ 설정 ============ */
const CONFIG = Object.freeze({
  POST_URL: "https://script.google.com/macros/s/AKfycbzk1DN0iDS7EdZvKq-iomzgxmiCzOwCUZwWZkN4fjvkzOZPdF1d3P9d1xt6Ii8VNnmmPQ/exec",
  SHEET_ID: "10blDNZ4zjrFU5lwCvgtoD3npwIwcCMQTeqwPgpQ_Ffg",
  SHEETS: [
    { key:"schedule",   gid:"0",          name:"연중행사계획" },
    { key:"student",    gid:"1112677469", name:"학생일정" },
    { key:"supervisor", gid:"1459415616", name:"자습감독" },
    { key:"prayer",     gid:"1697887995", name:"기도순서" },
    { key:"notice",     gid:"1487091944", name:"공지사항" },
    { key:"nuga",       gid:"2041576858", name:"창체누가기록" }
  ],
  POLL_MS: 300000, LOAD_MS: 12000, POST_MS: 20000
});

/* 부서 — [이름, 색상, 채도]. 계열끼리 색상군으로 묶어 색만 봐도 성격이 잡히게. */
const DEPTS = [
  ["교목부",292,40], ["교무부",220,44], ["연구부",232,42], ["상담부",320,38], ["정보부",244,40],
  ["1학년부",16,52], ["2학년부",30,54], ["3학년부",44,54], ["기획위원",254,38], ["행정실",210,26],
  ["국어과",108,40], ["영어과",124,38], ["수학과",160,42], ["사회과",138,36], ["과학과",172,42],
  ["예체능과",184,40], ["정보과",196,42], ["외국어과",66,46], ["기타",212,7]
];
const DEPT_NAMES = DEPTS.map(d => d[0]);
const TONE = new Map(DEPTS.map(([n, h, s]) => [n, `--dh:${h};--ds:${s}%`]));
const tone = d => TONE.get(d) || TONE.get("기타");

/* 창체 영역 색 — 부서 칩과 같은 방식. 색상만 다르게 준다.
   마크 색은 명도대역·채도·색각이상 분리 검사를 통과한 값에서 뽑았다. */
const CAT_TONE = {
  "자율":"--dh:218;--ds:62%", "자율자치":"--dh:218;--ds:62%",
  "봉사":"--dh:168;--ds:66%", "동아리":"--dh:33;--ds:72%", "진로":"--dh:283;--ds:48%"
};
const catTone = c => CAT_TONE[c] || "--dh:212;--ds:7%";

const W = ["일","월","화","수","목","금","토"];
const VIEWS = {
  calendar:{ label:"달력",    month:true,  paper:true  },
  plan:    { label:"월중 계획", month:true,  paper:true  },
  student: { label:"학생일정",  month:true,  paper:true  },
  dept:    { label:"부서",     month:false, paper:false },
  nuga:    { label:"누가기록",  month:false, paper:false },
  request: { label:"수정 요청", month:false, paper:false }
};
const VK = Object.keys(VIEWS);
const PREFS = "hs-prefs-v2", CACHE = "hs-cache-v2", DRAFT = "hs-draft-v2";

/* ============ 유틸 ============ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const p2 = n => String(n).padStart(2, "0");
const key = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}-${p2(d.getDate())}`;
const today = () => key(new Date());

function mkDate(y, m, d){
  if(!Number.isInteger(y) || y < 1900 || y > 9999 || m < 1 || m > 12 || d < 1 || d > 31) return null;
  const x = new Date(y, m - 1, d);
  return x.getFullYear() === y && x.getMonth() === m - 1 && x.getDate() === d ? x : null;
}
/* 시트가 돌려주는 온갖 날짜 표기를 한 갈래로 모은다 */
function toDate(v){
  if(v == null || v === "") return null;
  if(v instanceof Date) return Number.isNaN(+v) ? null : mkDate(v.getFullYear(), v.getMonth() + 1, v.getDate());
  if(typeof v === "object") return toDate(v.v) || toDate(v.f);
  if(typeof v === "number"){
    const d = new Date(Math.floor(v - 25569) * 86400000);
    return mkDate(d.getUTCFullYear(), d.getUTCMonth() + 1, d.getUTCDate());
  }
  const t = String(v).trim();
  const g = t.match(/^Date\s*\(\s*(\d{4})\s*,\s*(\d{1,2})\s*,\s*(\d{1,2})(?:\s*,[^)]*)?\s*\)$/);
  if(g) return mkDate(+g[1], +g[2] + 1, +g[3]);
  const p = t.match(/^(\d{4})\D+(\d{1,2})\D+(\d{1,2})(?!\d)/);
  return p ? mkDate(+p[1], +p[2], +p[3]) : null;
}
function cell(c){
  if(c == null) return "";
  if(typeof c !== "object") return String(c).trim();
  const f = c.f != null ? String(c.f).trim() : "";
  return f !== "" ? f : String(c.v ?? "").trim();
}
/* "1~3교시", "2,4" → 시간 수. 못 읽으면 ok:false */
function periods(c){
  const label = cell(c).normalize("NFKC").replace(/[[\]]/g, "").replace(/교시/g, "").trim();
  if(!label) return { label, hours:0, ok:false };
  const set = new Set();
  for(const part of label.replace(/\s*([~〜～–—-])\s*/g, "$1").replace(/[，、/|.\s]+/g, ",").split(",").filter(Boolean)){
    const m = part.match(/^(\d+)(?:[~〜～–—-](\d+))?$/);
    if(!m) return { label, hours:0, ok:false };
    const a = +m[1], b = +(m[2] ?? m[1]);
    if(a < 1 || a > b || b > 24) return { label, hours:0, ok:false };
    for(let i = a; i <= b; i++) set.add(i);
  }
  return { label, hours:set.size, ok:set.size > 0 };
}
const ayOf = d => d.getFullYear() - (d.getMonth() < 2 ? 1 : 0);
const mKey = d => `${d.getFullYear()}-${p2(d.getMonth() + 1)}`;
const m1 = k => toDate(k + "-01");
function shiftMonth(k, n){ const d = m1(k); d.setMonth(d.getMonth() + n); return mKey(d); }
function monthDays(k, skipWeekend){
  const s = m1(k), y = s.getFullYear(), m = s.getMonth();
  const last = new Date(y, m + 1, 0).getDate();
  return Array.from({ length:last }, (_, i) => new Date(y, m, i + 1))
    .filter(d => !skipWeekend || (d.getDay() !== 0 && d.getDay() !== 6));
}
const dayLabel = k => { const d = toDate(k); return `${d.getMonth() + 1}월 ${d.getDate()}일 (${W[d.getDay()]})`; };
const read = (k, f) => { try{ const r = localStorage.getItem(k); return r == null ? f : (JSON.parse(r) ?? f); }catch{ return f; } };
const write = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch{ return false; } };

/* ============ 상태 ============ */
const S = {
  view:"calendar", month:mKey(new Date()), q:"",
  theme:"system", fs:1,
  dept:DEPT_NAMES[0], hidden:[], grade:1, cat:"전체",
  cal:{ weekend:true, year:false },
  plan:{ dept:true, prayer:true, super:true, noWeekend:false, hideEmpty:false, flat:false },
  stu:{ noWeekend:false, hideEmpty:false, flat:false },
  print:{ weekend:true, dept:true, prayer:true, super:true, flat:false }
};
let hadMonth = false;

function loadPrefs(){
  const p = read(PREFS, {}) || {};
  if(Object.hasOwn(VIEWS, p.view)) S.view = p.view;
  if(typeof p.month === "string" && /^\d{4}-\d{2}$/.test(p.month) && m1(p.month)){ S.month = p.month; hadMonth = true; }
  for(const g of ["cal", "plan", "stu", "print"])
    for(const k of Object.keys(S[g])) if(typeof p[g]?.[k] === "boolean") S[g][k] = p[g][k];
  if(["light","dark","system"].includes(p.theme)) S.theme = p.theme;
  if([0.92,1,1.1,1.22].includes(p.fs)) S.fs = p.fs;
  if(DEPT_NAMES.includes(p.dept)) S.dept = p.dept;
  if(Array.isArray(p.hidden)) S.hidden = p.hidden.filter(d => DEPT_NAMES.includes(d));
  if([1,2,3].includes(p.grade)) S.grade = p.grade;
  if(typeof p.cat === "string") S.cat = p.cat;
}
const savePrefs = () => write(PREFS, {
  view:S.view, month:S.month, theme:S.theme, fs:S.fs, dept:S.dept, hidden:S.hidden,
  grade:S.grade, cat:S.cat, cal:S.cal, plan:S.plan, stu:S.stu, print:S.print
});
function applyPrefs(){
  const dark = S.theme === "dark" || (S.theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.style.setProperty("--fs", String(S.fs));
}

/* ============ 데이터 ============ */
const M = { schedule:[], student:[], prayer:new Map(), super:new Map(), notices:[], nuga:[] };
const IX = { byId:new Map(), day:new Map(), stuDay:new Map() };
/* 시트별 상태 — 무엇이 들어왔고 어느 행이 이상한지 화면에 그대로 내보인다 */
const SRC = Object.fromEntries(CONFIG.SHEETS.map(x =>
  [x.key, { name:x.name, gid:x.gid, rows:0, at:0, error:"", flags:[] }]));
const sheetLink = gid => `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit#gid=${gid}`;

/* gviz 는 오류도 200 으로 준다. 모양을 직접 확인해야 한다. */
function validate(raw){
  if(!raw || !["ok", "warning"].includes(raw.status)){
    const said = (raw?.errors || [])
      .map(e => String(e?.detailed_message || e?.message || "").trim()).filter(Boolean).join(" / ");
    throw new Error(said || "시트 응답이 아닙니다 (접근 권한을 확인해 주세요)");
  }
  const t = raw.table;
  if(!t || !Array.isArray(t.cols) || !Array.isArray(t.rows) || !t.rows.every(r => r && Array.isArray(r.c)))
    throw new Error("시트 구조를 읽을 수 없습니다");
  return t;
}
const HEADER = /^(날짜|일자|일시|시작일|게시일|번호|연번)$/;
let loading = false, loaded = false, job = null, lastLoad = 0, first = true, cachedAt = 0;
let printing = false, printTimer = null;

function decode(k, table){
  const rows = table.rows.map(r => r.c || []);
  const flags = [];
  const flag = (n, m) => { if(flags.length < 60) flags.push(`${n + 1}행 · ${m}`); };
  const done = items => ({ items, flags });

  if(k === "schedule"){
    return done(rows.flatMap((r, n) => {
      const d = toDate(r[0]), body = cell(r[2]);
      if(!d){
        if(body && body !== "null" && !HEADER.test(cell(r[0]))) flag(n, "날짜를 읽을 수 없습니다");
        return [];
      }
      if(!body || body === "null") return [];
      return body.split(/\r?\n/).map(x => x.trim()).filter(x => x && x !== "null").map((line, i) => {
        const t = line.match(/^\[([^\]]+)\]\s*/);
        const known = t && DEPT_NAMES.includes(t[1].trim());
        if(t && !known) flag(n, `모르는 부서 이름: ${t[1].trim()}`);
        return { id:`s${n}-${i}`, k:key(d), d, dept:known ? t[1].trim() : "기타",
                 text:known ? line.slice(t[0].length) : line, src:"schedule" };
      });
    }).sort((a, b) => a.d - b.d));
  }

  if(k === "student"){
    const base = ayOf(M.schedule[0]?.d || m1(S.month));
    return done(rows.flatMap((r, n) => {
      let d = toDate(r[0]);
      const raw0 = cell(r[0]);
      if(!d && !/^\d{4}/.test(raw0)){
        const md = raw0.match(/^(\d{1,2})\s*[-./]\s*(\d{1,2})(?!\d)/);
        if(md) d = mkDate(base + (+md[1] < 3 ? 1 : 0), +md[1], +md[2]);
      }
      let text0 = r.slice(2).map(cell).filter(v => v && v !== "null").join("\n");
      if(!d){
        if((text0 || cell(r[0])) && !HEADER.test(cell(r[0]))) flag(n, "날짜를 읽을 수 없습니다");
        return [];
      }
      let text = r.slice(2).map(cell).filter(v => v && v !== "null").join("\n")
        || r.slice(1).map(cell).filter(v => v && v !== "null" && !/^[월화수목금토일]$/.test(v)).join("\n");
      if(!text){
        const tail = raw0.match(/^\s*(?:\d{4}\D+)?\d{1,2}\s*[-./월]\s*\d{1,2}\s*일?\s*\(?[월화수목금토일]?\)?\s*(.*)$/);
        text = tail?.[1] || "";
      }
      return text.split(/\r?\n/)
        .map(x => x.replace(/^\s*[-•]\s*/, "").replace(/^\s*\[[^\]]+\]\s*/, "").trim()).filter(Boolean)
        .map((line, i) => ({ id:`u${n}-${i}`, k:key(d), d, text:line, dept:"", src:"student" }));
    }).sort((a, b) => a.d - b.d));
  }

  if(k === "prayer" || k === "supervisor"){
    const map = new Map();
    rows.forEach((r, n) => {
      const d = toDate(r[0]), name = cell(r[2]);
      const has = name && name !== "null";
      if(!d){
        if(has && !HEADER.test(cell(r[0]))) flag(n, "날짜를 읽을 수 없습니다");
        return;
      }
      if(!has) return;
      map.set(key(d), k === "prayer" ? { name, bible:cell(r[3]), hymn:cell(r[4]) } : name);
    });
    return done(map);
  }

  if(k === "notice"){
    const out = [];
    rows.forEach((r, n) => {
      const text = cell(r[2]);
      if(!text || text === "null") return;
      const from = toDate(r[0]), to = toDate(r[1]);
      const rawFrom = cell(r[0]), rawTo = cell(r[1]);
      if((rawFrom && !from) || (rawTo && !to)){
        if(!HEADER.test(rawFrom)) flag(n, `게시 기간을 읽을 수 없습니다: ${rawFrom || "-"} ~ ${rawTo || "-"}`);
        return;
      }
      if(from && to && from > to){ flag(n, "게시 시작일이 종료일보다 늦습니다"); return; }
      out.push({ from, to, text });
    });
    return done(out);
  }

  const flat = v => String(v ?? "").replace(/\s/g, "");
  const head = new Map();
  (table.cols || []).forEach((c, i) => { for(const l of [c.label, c.id]) if(l) head.set(flat(l), i); });
  const pick = (names, fb) => names.map(flat).map(n => head.get(n)).find(i => i != null) ?? fb;
  const at = {
    cat:pick(["영역"], 1), date:pick(["일자","날짜"], 2), per:pick(["교시텍스트","교시"], 3),
    grades:[pick(["1학년","1"], 4), pick(["2학년","2"], 5), pick(["3학년","3"], 6)],
    body:pick(["활동내용","내용"], 7), note:pick(["비고"], 8)
  };
  return done(rows.flatMap((r, n) => {
    const d = toDate(r[at.date]);
    const cat = cell(r[at.cat]).replace(/\(.*$/, "").trim();
    if(!d || !cat){
      const any = cat || cell(r[at.date]) || cell(r[at.body]);
      if(any && !HEADER.test(cell(r[at.date])) && cell(r[at.cat]) !== "영역")
        flag(n, !d ? "날짜를 읽을 수 없습니다" : "영역이 비어 있습니다");
      return [];
    }
    const p = periods(r[at.per]);
    if(!p.ok) flag(n, `교시를 읽을 수 없습니다: ${p.label || "빈 값"}`);
    return [{ id:`n${n}`, k:key(d), d, cat, ...p,
      grades:at.grades.map(i => /^(1|o|○|◯|v|✓|✔|true|y)$/i.test(cell(r[i]))),
      text:cell(r[at.body]), note:cell(r[at.note]) }];
  }).sort((a, b) => a.d - b.d));
}

function reindex(){
  IX.byId = new Map(); IX.day = new Map(); IX.stuDay = new Map();
  for(const [rows, map] of [[M.schedule, IX.day], [M.student, IX.stuDay]])
    for(const e of rows){
      IX.byId.set(e.id, e);
      if(!map.has(e.k)) map.set(e.k, []);
      map.get(e.k).push(e);
    }
}

/* 마지막으로 받은 내용을 남겨 둔다. 연결이 없어도 화면이 비지 않게. */
function saveCache(){
  if(write(CACHE, {
    at:Date.now(),
    schedule:M.schedule.map(e => [e.k, e.dept, e.text]),
    student:M.student.map(e => [e.k, e.text]),
    prayer:[...M.prayer], super:[...M.super],
    notices:M.notices.map(n => [n.from ? key(n.from) : "", n.to ? key(n.to) : "", n.text]),
    nuga:M.nuga.map(r => [r.k, r.cat, r.label, r.hours, r.ok, r.grades, r.text, r.note]),
    src:Object.fromEntries(Object.entries(SRC).map(([k, v]) => [k, { rows:v.rows, at:v.at, flags:v.flags }]))
  })) cachedAt = Date.now();
}
function loadCache(){
  const c = read(CACHE, null);
  if(!c || !Array.isArray(c.schedule)) return false;
  try{
    M.schedule = c.schedule.map(([k, dept, text], i) => ({ id:`s c${i}`, k, d:toDate(k), dept, text, src:"schedule" })).filter(e => e.d);
    M.student = c.student.map(([k, text], i) => ({ id:`u c${i}`, k, d:toDate(k), text, dept:"", src:"student" })).filter(e => e.d);
    M.prayer = new Map(c.prayer); M.super = new Map(c.super);
    M.notices = c.notices.map(([f, t, text]) => ({ from:f ? toDate(f) : null, to:t ? toDate(t) : null, text }));
    M.nuga = c.nuga.map(([k, cat, label, hours, ok, grades, text, note], i) =>
      ({ id:`n c${i}`, k, d:toDate(k), cat, label, hours, ok, grades, text, note })).filter(r => r.d);
    cachedAt = c.at || 0;
    for(const [k, v] of Object.entries(c.src || {})){
      if(!SRC[k]) continue;
      SRC[k].rows = v.rows || 0;
      SRC[k].at = v.at || 0;
      SRC[k].flags = Array.isArray(v.flags) ? v.flags : [];
    }
    reindex();
    loaded = M.schedule.length > 0 || M.student.length > 0;
    return loaded;
  }catch{ return false; }
}

/* gviz는 JSONP만 준다 */
function fetchSheet(sheet){
  return new Promise((res, rej) => {
    const cb = `hs_${sheet.key}_${Date.now()}_${Math.random().toString(36).slice(2)}`;
    const el = document.createElement("script");
    let done = false;
    const end = (err, raw) => {
      if(done) return;
      done = true;
      clearTimeout(t); el.remove(); window[cb] = () => {};
      setTimeout(() => { delete window[cb]; }, 60000);
      err ? rej(err) : res(raw);
    };
    const t = setTimeout(() => end(new Error("응답 시간 초과")), CONFIG.LOAD_MS);
    window[cb] = raw => { try{ end(null, validate(raw)); }catch(err){ end(err); } };
    el.onerror = () => end(new Error("연결하지 못했습니다"));
    el.src = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/gviz/tq`
      + `?gid=${sheet.gid}&tqx=out:json;responseHandler:${cb}&_=${Date.now()}`;
    document.body.appendChild(el);
  });
}

async function reload(){
  if(job) return job;
  if(printing) return Promise.resolve();
  loading = true;
  $$('[data-a="reload"]').forEach(b => { b.disabled = true; });

  job = (async () => {
    const out = await Promise.allSettled(CONFIG.SHEETS.map(fetchSheet));
    const bad = [];
    const stamp = Date.now();
    let ok = 0;
    out.forEach((r, i) => {
      const sheet = CONFIG.SHEETS[i];
      const slot = SRC[sheet.key];
      try{
        if(r.status !== "fulfilled") throw r.reason;
        const table = r.value;
        const res = decode(sheet.key, table);
        M[sheet.key === "notice" ? "notices" : sheet.key === "supervisor" ? "super" : sheet.key] = res.items;
        slot.rows = table.rows.length;
        slot.at = stamp;
        slot.error = "";
        slot.flags = res.flags;
        ok++;
      }catch(err){
        slot.error = String(err?.message || err || "실패").slice(0, 160);
        bad.push(sheet.name);
      }
    });
    reindex();
    loaded = loaded || ok > 0;
    if(ok){ lastLoad = Date.now(); saveCache(); }
    if(first && !hadMonth) alignMonth();
    first = false;

    if(!ok) warn(cachedAt ? "연결되지 않아 저장본을 보여 줍니다." : "불러오지 못했습니다.");
    else if(bad.length) warn(`${bad.join(", ")} 실패`);
    else hideWarn();
  })().finally(() => {
    loading = false; job = null;
    $$('[data-a="reload"]').forEach(b => { b.disabled = false; });
    draw({ keep:true });
    if(DAY.k && $("#ddlg").open) fillDay(DAY.k, DAY.id);
  });
  return job;
}
function alignMonth(){
  const src = M.schedule.length ? M.schedule : M.student;
  if(!src.length || src.some(e => e.k.startsWith(S.month))) return;
  S.month = (src.find(e => e.k >= today()) || src.at(-1)).k.slice(0, 7);
}

/* ============ 검색 · 조회 ============ */
const terms = () => S.q.trim().toLocaleLowerCase().split(/\s+/).filter(Boolean);
function hit(...parts){
  const t = terms();
  if(!t.length) return true;
  const hay = parts.join(" ").toLocaleLowerCase();
  return t.every(x => hay.includes(x));
}
function hl(v){
  const raw = String(v ?? ""), t = [...new Set(terms())];
  if(!t.length) return esc(raw);
  const re = new RegExp(t.sort((a, b) => b.length - a.length)
    .map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "gi");
  let out = "", i = 0;
  for(const m of raw.matchAll(re)){ out += esc(raw.slice(i, m.index)) + `<mark>${esc(m[0])}</mark>`; i = m.index + m[0].length; }
  return out + esc(raw.slice(i));
}
const off = d => S.hidden.includes(d);
const onDay = k => (IX.day.get(k) || []).filter(e => !off(e.dept) && hit(e.dept, e.text));
const stuOn = k => (IX.stuDay.get(k) || []).filter(e => hit(e.text));

/* 같은 행사가 두 시트에 다 적힌 경우 한 번만 보여 준다 */
const norm = t => String(t || "").toLowerCase().replace(/[!！·•ㆍ]/g, "").replace(/[\s ]+/g, "").trim();
function dayRows(k){
  const stu = (IX.stuDay.get(k) || []).slice();
  const q = new Map();
  for(const e of stu){
    const n = norm(e.text);
    if(!n) continue;
    if(!q.has(n)) q.set(n, []);
    q.get(n).push(e);
  }
  const staff = [], deptOf = new Map();
  for(const e of IX.day.get(k) || []){
    const list = q.get(norm(e.text));
    if(list?.length) deptOf.set(list.shift().id, e.dept);
    else staff.push(e);
  }
  return { staff, stu, deptOf };
}
function notices(){
  const t = toDate(today());
  return M.notices.filter(n => (!n.from || t >= n.from) && (!n.to || t <= n.to));
}

function drawYear(){
  const y = +S.month.slice(0, 4), now = today();
  const heads = ["월","화","수","목","금","토","일"];
  let n = 0;

  const html = Array.from({ length:12 }, (_, i) => {
    const mk = `${y}-${p2(i + 1)}`;
    const days = monthDays(mk, false);
    const lead = (days[0].getDay() + 6) % 7;
    let count = 0;
    const cells = days.map(d => {
      const k = key(d), w = d.getDay(), list = onDay(k);
      count += list.length;
      const cls = [w === 0 ? "s0" : w === 6 ? "s6" : "", list.length ? "on" : "", k === now ? "now" : ""];
      return `<button type="button" data-d="${k}" class="${cls.join(" ").trim()}"
        aria-label="${i + 1}월 ${d.getDate()}일 일정 ${list.length}건">${d.getDate()}${
        list.length ? `<span class="n">${list.length}</span>` : ""}</button>`;
    }).join("");
    n += count;
    return `<section class="mini">
      <div class="mini-h"><b>${i + 1}월</b><span>${count ? count + "건" : ""}</span></div>
      <div class="mini-g">${heads.map((w, j) =>
        `<span class="w ${j === 5 ? "s6" : j === 6 ? "s0" : ""}">${w}</span>`).join("")}
        ${'<span class="pad"></span>'.repeat(lead)}${cells}</div>
    </section>`;
  }).join("");

  return { n, html:`<div class="years">${html}</div>` };
}

/* ---- 달력 ---- */
function drawCalendar(){
  const wk = S.cal.weekend;
  const months = [S.month];
  const heads = wk ? ["월","화","수","목","금","토","일"] : ["월","화","수","목","금"];
  const cols = wk ? 7 : 5;
  const now = today();
  let n = 0;

  const html = months.map(mk => {
    const days = monthDays(mk, !wk);
    const colOf = d => { const w = d.getDay() || 7; return wk ? w : Math.min(w, 5); };
    const pad = c => '<div class="d-x" aria-hidden="true"></div>'.repeat(Math.max(0, c));

    const cells = days.map(d => {
      const k = key(d), w = d.getDay();
      const list = onDay(k);
      n += list.length;

      /* 주말을 접어도 토·일 일정이 사라지지 않게 금요일 칸에 모은다 */
      let fold = "";
      if(!wk && w === 5){
        const side = [1, 2].map(i => {
          const s = new Date(d);
          s.setDate(d.getDate() + i);
          if(s.getMonth() !== d.getMonth()) return null;
          const rows = onDay(key(s));
          n += rows.length;
          return rows.length ? { s, rows } : null;
        }).filter(Boolean);
        if(side.length) fold = `<div class="fold"><span class="fold-h">주말</span>${side.map(({ s, rows }) =>
          rows.map(e => `<button type="button" class="ev" data-e="${e.id}" style="${tone(e.dept)}">
            <span class="tag">${W[s.getDay()]} ${s.getDate()}</span>${hl(e.text)}</button>`).join("")).join("")}</div>`;
      }

      const cls = ["d"];
      if(k === now) cls.push("now");
      if(w === 0) cls.push("s0", "wk");
      if(w === 6) cls.push("s6", "wk");
      return `<section class="${cls.join(" ")}" aria-label="${k}">${dnum(d)}
        <ul>${list.map(e => `<li>${evHTML(e)}</li>`).join("")}</ul>
        ${list.length || fold ? "" : '<span class="d-none">—</span>'}${fold}</section>`;
    }).join("");

    return `<div class="cal" style="--c:${cols}">
        ${heads.map(h => `<div class="cal-h ${h === "토" ? "s6" : h === "일" ? "s0" : ""}">${h}</div>`).join("")}
        ${pad(colOf(days[0]) - 1)}${cells}${pad(cols - colOf(days.at(-1)))}</div>`;
  }).join("");

  return { html, n };
}

const hiddenNote = () => S.hidden.length ? `숨김: ${S.hidden.join(", ")}` : "";

/* 글자를 키울 수 있는 만큼 키우고, 남는 세로를 행이 나눠 갖고, 그래도 넘치면 통째로 줄인다 */
function fitPaper(stage){
  const paper = stage.querySelector(".paper");
  const limH = mm(P.h) - 2, limW = mm(P.w);
  paper.style.removeProperty("--pr");
  paper.style.removeProperty("--pp");
  paper.style.transform = "none";

  const at = s => { paper.style.setProperty("--pf", `${s}pt`); return paper.getBoundingClientRect().height; };
  const best = () => {
    if(at(P.max) <= limH) return P.max;
    let lo = P.min, hi = P.max;
    for(let i = 0; i < 12; i++){ const mid = (lo + hi) / 2; if(at(mid) <= limH) lo = mid; else hi = mid; }
    return Math.floor(lo * 100) / 100;
  };

  /* 이분 탐색의 경계값은 딱 맞지 않을 수 있다. 실제로 들어갈 때까지 한 칸씩 줄인다. */
  const settle = () => {
    let font = best();
    at(font);
    for(let i = 0; i < 40 && paper.getBoundingClientRect().height > limH && font > P.min; i++){
      font = Math.max(P.min, Math.round((font - 0.05) * 100) / 100);
      at(font);
    }
    return font;
  };
  let font = settle();
  if(paper.getBoundingClientRect().height > limH){
    paper.style.setProperty("--pp", "0.5px");
    font = settle();
  }
  let h = paper.getBoundingClientRect().height;
  /* scrollWidth 는 정수로 올림돼서 1px 쯤 넘는 것처럼 보인다. 그 정도는 넘긴 것으로 치지 않는다. */
  const wide = paper.scrollWidth > limW + 1 ? limW / paper.scrollWidth : 1;
  let scale = Math.min(1, wide, limH / h);

  if(scale >= 1){
    /* 표는 행 수, 달력은 격자 줄 수를 기준으로 남는 세로를 나눈다 */
    let count = paper.querySelectorAll("tbody tr").length;
    if(!count){
      const cal = paper.querySelector(".pcal");
      const cols = getComputedStyle(cal).gridTemplateColumns.split(" ").filter(Boolean).length || 7;
      count = Math.max(1, Math.ceil(cal.children.length / cols) - 1);
    }
    let lo = 0, hi = limH / Math.max(count, 1);
    for(let i = 0; i < 12; i++){
      const mid = (lo + hi) / 2;
      paper.style.setProperty("--pr", `${mid}px`);
      if(paper.getBoundingClientRect().height <= limH) lo = mid; else hi = mid;
    }
    paper.style.setProperty("--pr", `${Math.floor(lo * 100) / 100}px`);
    h = paper.getBoundingClientRect().height;
    scale = Math.min(1, limH / h);
  }
  if(scale < 1) scale *= 0.998;
  paper.style.transform = `scale(${scale})`;
  return { font, scale, pt:font * scale };
}
function buildPaper(){
  const stage = $("#stage"), prev = stage.style.transform;
  stage.style.transform = "none";
  stage.innerHTML = paperHTML(PR.view);
  PR.fit = fitPaper(stage);
  stage.style.transform = prev;

  const pt = PR.fit.pt, tight = pt < 7.4, o = S.print;
  const tips = [];
  if(PR.view !== "calendar" && !o.flat) tips.push("한 줄");
  if(PR.view === "plan" && (o.prayer || o.super)) tips.push("경건회·자습감독 끄기");
  if(o.weekend) tips.push("주말 빼기");
  const el = $("#fit");
  el.className = `fit${tight ? " tight" : ""}`;
  el.textContent = !tight ? `A4 한 장 · ${pt.toFixed(1)}pt`
    : tips.length ? `${pt.toFixed(1)}pt — ${tips.join(", ")}` : `${pt.toFixed(1)}pt · 나눠 인쇄 권장`;
}
function scaleView(){
  const view = $("#pview"), stage = $("#stage");
  const w = view.clientWidth - 20;
  const room = Math.max(240, innerHeight * 0.84 - 190);
  const s = Math.max(0.15, Math.min(1, w / mm(P.w), room / mm(P.h)));
  stage.style.transform = `scale(${s})`;
  stage.style.marginLeft = `${Math.max(0, (w - mm(P.w) * s) / 2)}px`;
  view.style.height = `${mm(P.h) * s + 20}px`;
}
function printOpts(){

  if(v === "plan" || v === "calendar") out.push(chk("부서명", "print", "dept"));
  if(v === "plan"){ out.push(chk("경건회", "print", "prayer")); out.push(chk("자습감독", "print", "super")); }
  if(v !== "calendar") out.push(chk("한 줄", "print", "flat"));

}

  document.body.classList.add("pr");
  clearTimeout(printTimer);
  printTimer = setTimeout(endPrint, 4000);
});

/* ============ 설정 ============ */
function openSettings(){
  $("#sbody").innerHTML = `
    <div class="set"><span>테마</span><div class="seg">${
      [["light","밝게"],["dark","어둡게"],["system","시스템"]].map(([v, l]) =>
        `<button type="button" data-th="${v}" aria-pressed="${S.theme === v}">${l}</button>`).join("")}</div></div>
    <div class="set"><span>글자</span><div class="seg">${
      [[0.92,"작게"],[1,"보통"],[1.1,"크게"],[1.22,"아주 크게"]].map(([v, l]) =>
        `<button type="button" data-fs="${v}" aria-pressed="${S.fs === v}">${l}</button>`).join("")}</div></div>
    <h3>단축키</h3>
    <div class="keys">
      <div><kbd>1</kbd>–<kbd>6</kbd><span>화면</span></div>
      <div><kbd>/</kbd><span>검색</span></div>
      <div><kbd>←</kbd><kbd>→</kbd><span>이전·다음 달</span></div>
      <div><kbd>T</kbd><span>오늘</span></div>
      <div><kbd>P</kbd><span>인쇄</span></div>
      <div><kbd>R</kbd><span>새로고침</span></div>
    </div>`;
  if(!$("#sdlg").open) $("#sdlg").showModal();
}
function info(title, html){
  $("#ititle").textContent = title;
  $("#ibody").innerHTML = html;
  if(!$("#idlg").open) $("#idlg").showModal();
}

/* ============ 요청 보내기 ============ */
function saveDraft(){
  if(!$("#rf")) return;
  draft = { name:$("#rn").value, type:$("#rt").value, content:$("#rc").value };
  write(DRAFT, draft);
  $("#rcount").textContent = `${draft.content.length}자`;
}
function syncRequest(){
  const f = $("#rf");
  if(!f) return;
  $$("input,textarea,select,button", f).forEach(el => { el.disabled = sending; });
  f.querySelector('button[type="submit"]').textContent = sending ? "보내는 중" : "보내기";
  const p = $("#rmsg");
  p.textContent = sendMsg;
  p.className = sendTone;
}
async function send(ev){
  ev.preventDefault();
  if(sending) return;
  saveDraft();
  const body = { name:draft.name.trim(), type:draft.type, content:draft.content.trim() };
  if(!body.name || !body.content){ sendMsg = "작성자와 내용을 채워 주세요"; sendTone = "no"; syncRequest(); return; }
  sending = true; sendMsg = ""; sendTone = ""; syncRequest();

  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), CONFIG.POST_MS);
  try{
    /* Apps Script는 CORS 응답을 주지 않아 결과를 읽을 수 없다. 성공을 단정하지 않는다. */
    await fetch(CONFIG.POST_URL, { method:"POST", mode:"no-cors",
      headers:{ "Content-Type":"text/plain;charset=UTF-8" }, body:JSON.stringify(body), signal:ac.signal });
    sendMsg = "보냈습니다. 반영은 담당자 확인 후."; sendTone = "ok";
    draft = { name:body.name, type:body.type, content:"" };
    write(DRAFT, draft);
    $("#rc").value = "";
    $("#rcount").textContent = "0자";
  }catch{
    sendMsg = "보내지 못했습니다. 내용은 그대로 있습니다."; sendTone = "no";
  }finally{
    clearTimeout(t);
    sending = false;
    syncRequest();
  }
}

/* ============ 조작 ============ */
document.addEventListener("click", ev => {
  const t = ev.target.closest("button");
  if(!t) return;

  if(t.dataset.v){ go(t.dataset.v); return; }
  if(t.dataset.e){
    const e = IX.byId.get(t.dataset.e);
    if(e) openDay(e.k, e.id);
    return;
  }
  if(t.dataset.d){ openDay(t.dataset.d); return; }
  if(t.dataset.ask){ const e = IX.byId.get(t.dataset.ask); askAbout(e ? e.k : DAY.k, e); return; }
  if(t.dataset.dept){
    $("#ddlg").close();
    S.dept = t.dataset.dept; S.view = "dept"; S.q = ""; $("#q").value = "";
    draw();
    window.scrollTo({ top:0, behavior:"instant" });
    return;
  }
  if(t.dataset.h){
    const d = t.dataset.h;
    S.hidden = off(d) ? S.hidden.filter(x => x !== d) : [...S.hidden, d];
    draw({ keep:true });
    return;
  }
  if(t.dataset.c && t.tagName === "BUTTON"){
    const [g, k] = t.dataset.c.split(".");
    if(typeof S[g]?.[k] === "boolean"){ S[g][k] = !S[g][k]; draw({ keep:true }); }
    return;
  }
  if(t.dataset.g){ S.grade = +t.dataset.g; S.cat = "전체"; draw({ keep:true }); return; }
  if(t.dataset.cat){ S.cat = t.dataset.cat; draw({ keep:true }); return; }
  if(t.dataset.th){ S.theme = t.dataset.th; applyPrefs(); savePrefs(); openSettings(); return; }
  if(t.dataset.fs){ S.fs = +t.dataset.fs; applyPrefs(); savePrefs(); openSettings(); return; }

  switch(t.dataset.a){
    case "prev": step(-1); break;
    case "next": step(1); break;
    case "today": goToday(); break;
    case "reload": reload(); break;
    case "alert-x": hideWarn(); break;
    case "close": t.closest("dialog")?.close(); break;
    case "open-print": openPrint(); break;
    case "print": doPrint(); break;
    case "notices": info("공지사항", notices().map(n =>
      `<p style="white-space:pre-wrap;margin-bottom:12px">${esc(n.text)}</p>`).join("")); break;
    case "d-prev": moveDay(-1); break;
    case "d-next": moveDay(1); break;
    case "d-copy": copyDay(); break;
    case "d-ask": askAbout(DAY.k, null); break;
    case "clear":
      try{ localStorage.removeItem(CACHE); }catch{}
      cachedAt = 0;
      drawSource();
      toast("이 기기에 보관하던 사본을 지웠습니다");
      break;
  }
});

document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.c && el.type === "checkbox"){
    const [g, k] = el.dataset.c.split(".");
    if(typeof S[g]?.[k] === "boolean"){
      S[g][k] = el.checked;
      savePrefs();
      if(g === "print"){ buildPaper(); scaleView(); } else draw({ keep:true });
    }
    return;
  }
  if(el.id === "mi"){
    const v = el.type === "number" ? `${el.value}-01` : el.value;
    if(/^\d{4}-\d{2}$/.test(v) && m1(v)){ S.month = v; draw(); }
    else el.value = el.type === "number" ? S.month.slice(0, 4) : S.month;
    return;
  }
  if(el.id === "ds"){ S.dept = el.value; draw(); return; }
  if(el.closest("#rf")) saveDraft();
});

let qt = null;
const applyQ = () => { S.q = $("#q").value; draw({ keep:true }); };
document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "q"){
    clearTimeout(qt);
    if(!el.dataset.ime) qt = setTimeout(applyQ, 140);
    return;
  }
  if(el.closest("#rf")) saveDraft();
});
document.addEventListener("compositionstart", ev => { if(ev.target.id === "q") ev.target.dataset.ime = "1"; });
document.addEventListener("compositionend", ev => {
  if(ev.target.id !== "q") return;
  delete ev.target.dataset.ime;
  clearTimeout(qt);
  applyQ();
});
document.addEventListener("submit", ev => { if(ev.target.id === "rf") send(ev); });

for(const id of ["ddlg", "pdlg", "sdlg", "idlg"]){
  const dlg = $("#" + id);
  dlg.addEventListener("click", ev => {
    if(ev.target !== dlg) return;
    const r = dlg.getBoundingClientRect();
    if(ev.clientX < r.left || ev.clientX > r.right || ev.clientY < r.top || ev.clientY > r.bottom) dlg.close();
  });
}
$("#ddlg").addEventListener("close", () => { DAY.k = ""; DAY.id = ""; });
$("#pdlg").addEventListener("close", () => {
  $("#proot").appendChild($("#stage"));
  $("#stage").style.transform = "none";
  $("#stage").style.marginLeft = "0";
});
$("#sdlg").addEventListener("close", () => draw({ keep:true }));
$("#setBtn").addEventListener("click", openSettings);

document.addEventListener("keydown", ev => {
  if(ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const a = document.activeElement;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(a?.tagName || "") || a?.isContentEditable;
  const dlgOpen = $$("dialog[open]").length > 0;

  if(ev.key === "Escape" && !dlgOpen && S.q){ S.q = ""; $("#q").value = ""; draw({ keep:true }); return; }
  if(typing || dlgOpen) return;

  if(ev.key === "/"){ ev.preventDefault(); $("#q")?.focus(); return; }
  const n = Number(ev.key);
  if(Number.isInteger(n) && n >= 1 && n <= VK.length){ ev.preventDefault(); go(VK[n - 1]); return; }
  const k = ev.key.toLowerCase();
  if(k === "t"){ ev.preventDefault(); goToday(); return; }
  if(k === "r"){ ev.preventDefault(); reload(); return; }
  if(k === "p" && loaded && VIEWS[S.view].paper){ ev.preventDefault(); openPrint(); return; }
  if(VIEWS[S.view].month){
    if(ev.key === "ArrowLeft"){ ev.preventDefault(); step(-1); }
    if(ev.key === "ArrowRight"){ ev.preventDefault(); step(1); }
  }
});

let rt = null;
addEventListener("resize", () => {
  clearTimeout(rt);
  rt = setTimeout(() => {
    document.documentElement.style.setProperty("--top-h", $(".top").offsetHeight + "px");
    if($("#pdlg").open) scaleView();
  }, 150);
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if(S.theme === "system") applyPrefs(); });
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && Date.now() - lastLoad > CONFIG.POLL_MS && !sending) reload();
});
setInterval(() => { if(!document.hidden && !sending && !printing) reload(); }, CONFIG.POLL_MS);

/* ============ 시작 ============ */
loadPrefs();
applyPrefs();
loadCache();
loading = true;
jumpToday = ["calendar", "plan", "student"].includes(S.view);
draw();
reload();
</script>
