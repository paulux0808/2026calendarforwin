<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꽃달력</title>
<meta name="description" content="보성여고 학사일정. 하루는 꽃 한 송이, 일정은 꽃잎 한 장.">
<meta name="theme-color" content="#F3F5F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1412" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꽃달력">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Diphylleia&family=Nanum+Gothic:wght@400;700;800&display=swap">
<style>
/* ── 토큰 ───────────────────────────────────────────── */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --sunk:#EBEFED;
  --ink:#17201C; --ink-2:#56625C; --ink-3:#8A948F; --line:#E1E6E3;
  --leaf:#2F8A5B; --leaf-2:#78BE8F; --leaf-soft:rgba(47,138,91,.1);
  --pollen:#F2B53A; --edge:rgba(255,255,255,.7); --glow-op:.5; --sun:#D0453B; --sat:#3767C4;
  --note-bg:#FFF6DE; --note-ink:#5E4A0E;
  --sans:"Nanum Gothic",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Diphylleia","Nanum Myeongjo","AppleMyungjo",serif;
  --top-h:calc(58px + env(safe-area-inset-top));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1412; --surface:#161E1B; --sunk:#1C2622;
    --ink:#E7EEEA; --ink-2:#A9B6B0; --ink-3:#7B8782; --line:#26312D;
    --leaf:#74C99A; --leaf-2:#3F8A5F; --leaf-soft:rgba(116,201,154,.12);
    --edge:rgba(14,20,18,.45); --glow-op:.14;
    --sun:#F08A80; --sat:#8EB0F4; --note-bg:#2E2814; --note-ink:#F1DFA6;
    color-scheme:dark;
  }
}

/* ── 바탕 ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--leaf)}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* ── 꽃 ─────────────────────────────────────────────── */
.fl{display:block;overflow:visible}
.fl .pt{transform:rotate(var(--a))}
.fl .pt path{stroke:var(--edge);stroke-width:1.4;paint-order:stroke}
.fl.anim .pt{animation:bloom .9s cubic-bezier(.2,.85,.25,1.08) both;animation-delay:calc(var(--k) * 55ms + var(--d, 0ms))}
.fl.anim .ctr{animation:pop .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--n) * 55ms + 150ms)}
.fl.anim .stem{stroke-dasharray:260;animation:grow .7s ease-out both}
.fl.anim .leaf{animation:pop .6s .25s cubic-bezier(.2,.9,.3,1.2) both}
.fl .pt.dim{opacity:.22;transition:opacity .2s}
.fl .pt.hot{filter:brightness(1.06) saturate(1.15)}
@keyframes bloom{from{transform:rotate(calc(var(--a) - 50deg)) scale(.05);opacity:0}to{transform:rotate(var(--a)) scale(1);opacity:1}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes grow{from{stroke-dashoffset:260}to{stroke-dashoffset:0}}

/* ── 머리 ───────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:var(--bg);transition:box-shadow .2s}
@supports (backdrop-filter:blur(10px)) or (-webkit-backdrop-filter:blur(10px)){
  .top{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px) saturate(1.4);backdrop-filter:blur(14px) saturate(1.4)}
}
.top.lifted{box-shadow:0 1px 0 var(--line)}
.top .wrap{height:58px;display:flex;align-items:center;gap:6px}
.logo{flex:1;min-width:0;margin:0;display:flex;align-items:center;gap:7px;font:400 23px/1 var(--display);letter-spacing:-.01em}
.logo svg{width:22px;height:22px;flex:none}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px;gap:1px}
.seg button{border:0;background:none;height:30px;min-width:34px;padding:0 9px;border-radius:999px;font-size:13px;font-weight:800;color:var(--ink-2);transition:background .15s,color .15s}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ib{position:relative;width:38px;height:38px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.ib:active{background:var(--sunk)}
.ib .dot{position:absolute;top:8px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--sun)}
.ib.spin .i{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 오늘의 꽃 ──────────────────────────────────────── */
.hero{position:relative;text-align:center;padding:4px 0 6px;isolation:isolate}
.hero::before{content:"";position:absolute;z-index:-1;left:50%;top:-20px;width:340px;height:300px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,var(--glow,transparent),transparent);opacity:var(--glow-op)}
.hero .fl{width:min(60vw,238px);height:auto;margin:0 auto}
.hero .fl .pt{cursor:pointer}
.date{margin:2px 0 0;font:400 46px/1.05 var(--display);letter-spacing:-.015em}
.date small{font-size:24px;color:var(--ink-2);margin-left:8px;letter-spacing:0}
.stage{margin:10px 0 0;font-size:16px;font-weight:800}
.stage span{font-weight:400;color:var(--ink-2)}
.stage-sub{margin:2px 0 0;font-size:13px;color:var(--ink-3)}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:800}
button.chip:active{background:var(--sunk)}

.note{display:flex;gap:10px;align-items:baseline;margin-top:18px;padding:12px 16px;border-radius:16px;background:var(--note-bg);color:var(--note-ink);font-size:14px}
.note + .note{margin-top:6px}
.note span{flex:1;font-weight:700}
.note small{white-space:nowrap;opacity:.75}

/* ── 조각 ───────────────────────────────────────────── */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 10px;font-size:17px;font-weight:800;letter-spacing:-.01em}
.sec-h small{font-size:13px;font-weight:400;color:var(--ink-3)}
.sec-h .end{margin-left:auto;display:flex;gap:2px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.empty{padding:18px;color:var(--ink-3);font-size:14px}
.hint{margin:10px 4px 0;font-size:13px;color:var(--ink-3);line-height:1.6}
.link{border:0;background:none;padding:4px 2px;font-size:13px;font-weight:700;color:var(--leaf)}

.evs{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);transition:background .25s}
.evs > .ev:first-child{border-top:0}
.ev .gl{width:24px;height:24px}
.ev .dp{display:block;font-size:12px;font-weight:800;color:var(--ink-3);margin-bottom:1px}
.ev .tx{font-size:15px}
.ev .tg{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:1px}
.ev .tg i{font-style:normal;font-size:11.5px;font-weight:700;line-height:19px;padding:0 7px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.ev .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ev.memo .tx{color:var(--sun);font-weight:700}
.ev.lit{background:var(--leaf-soft)}
.ev[data-ev]{cursor:pointer}
.ruler{display:grid;grid-template-columns:repeat(7,5px);gap:2px;align-items:end}
.ruler i{height:16px;border-radius:2px;background:var(--sunk)}
.ruler i.on{background:var(--c)}
.sublabel{margin:0;padding:12px 16px 0;font-size:12px;font-weight:800;color:var(--ink-3);border-top:1px solid var(--line)}
.sublabel + .evs .ev:first-child{border-top:0}

/* 이번 주 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border:0;background:none;border-radius:16px}
.wd .fl{width:40px;height:40px}
.wd span{font-size:11.5px;color:var(--ink-3)}
.wd b{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.wd.sun b,.wd.sun span{color:var(--sun)}.wd.sat b,.wd.sat span{color:var(--sat)}
.wd.today{background:var(--leaf-soft)}
.wd:active{background:var(--sunk)}

/* 곧 만개 */
.peak{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 16px 10px 10px;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.peaks li:first-child .peak{border-top:0}
.peak .fl{width:52px;height:52px}
.peak .t{font-size:15px;font-weight:700}
.peak .t small{display:block;font-size:12.5px;font-weight:400;color:var(--ink-3)}
.peak .dd{font-size:14px;font-weight:800;color:var(--leaf);font-variant-numeric:tabular-nums}
.peaks{list-style:none;margin:0;padding:0}

/* 정원 (달력) */
.gh{display:flex;align-items:center;gap:4px;margin:0 0 10px 4px}
.gh h2{flex:1;margin:0;font:400 30px/1 var(--display);letter-spacing:-.01em}
.gh h2 small{font:400 14px var(--sans);color:var(--ink-3);margin-left:6px}
.gh .ib:disabled{opacity:.3}
.tog{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;margin-right:4px}
.tog button{border:0;background:none;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.tog button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.garden{padding:10px 6px 8px;touch-action:pan-y}
.dow,.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:11.5px;color:var(--ink-3);padding-bottom:4px}
.dow span:first-child{color:var(--sun)}.dow span:last-child{color:var(--sat)}
.cell{display:flex;flex-direction:column;align-items:center;gap:0;min-height:62px;padding:4px 0 2px;border:0;background:none;border-radius:14px}
.cell .n{font-size:12px;font-weight:700;line-height:18px;min-width:22px;border-radius:9px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cell .fl{width:38px;height:38px}
.cell.sun .n{color:var(--sun)}.cell.sat .n{color:var(--sat)}
.cell.today .n{background:var(--ink);color:var(--bg)}
.cell.out{visibility:hidden}
.cell.past .fl{opacity:.55}
.cell:active{background:var(--sunk)}
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;padding:14px 12px}
.ym{border:0;background:none;padding:0;text-align:left}
.ym h3{margin:0 0 5px;font:400 17px var(--display)}
.ym h3 small{font:400 11px var(--sans);color:var(--ink-3);margin-left:4px}
.ydots{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ydots i{aspect-ratio:1;display:grid;place-items:center}
.ydots i::before{content:"";width:var(--s,3px);height:var(--s,3px);border-radius:50%;background:var(--c,var(--line))}
.ydots i.today{box-shadow:inset 0 0 0 1.5px var(--ink);border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:0 16px 14px;font-size:12px;color:var(--ink-3)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:50%;background:var(--c)}

.foot{margin:34px 4px 0;font-size:12.5px;color:var(--ink-3);line-height:1.7}
.foot p{margin:0 0 8px}
.foot a,.foot button{color:var(--ink-2)}
.foot button{border:0;background:none;padding:0;text-decoration:underline;font-size:inherit}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:14px;font-weight:800;color:var(--ink);text-decoration:none}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.skel{height:14px;border-radius:7px;background:var(--sunk);margin:16px;animation:pulse 1.4s ease-in-out infinite}
.skel + .skel{width:60%}
@keyframes pulse{50%{opacity:.45}}

/* ── 아래서 올라오는 판 ─────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,14,.4);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:var(--bg);border-radius:26px 26px 0 0;box-shadow:0 -16px 40px rgba(0,0,0,.18);transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);outline:none}
.sheet.open{transform:none}
.scrim[hidden],.sheet[hidden]{display:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:9px auto 0;flex:none}
.sheet-top{display:flex;align-items:center;gap:8px;padding:8px 12px 6px 20px;flex:none}
.sheet-top h2{flex:1;margin:0;font-size:17px;font-weight:800}
.x{width:34px;height:34px;border:0;border-radius:50%;background:var(--sunk);display:grid;place-items:center;color:var(--ink-2)}
.x svg{width:15px;height:15px;stroke:currentColor;stroke-width:2.3;fill:none;stroke-linecap:round}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.dayhead{text-align:center;padding:0 0 6px}
.dayhead .fl{width:170px;height:170px;margin:0 auto}
.dayhead .date{font-size:36px}
.daynav{display:flex;gap:8px;margin-top:16px}
.daynav .btn{flex:1}
.search{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.search:focus-within{border-color:var(--leaf)}
.search .i{width:19px;height:19px;color:var(--ink-3)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:16px}
.search input::-webkit-search-cancel-button{display:none}
.hit .d{font-size:12px;font-weight:800;color:var(--ink-3);margin-right:6px}
mark{background:#FFE08A;color:#1C1A10;border-radius:3px;padding:0 1px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:14px;background:var(--sunk)}
.opt button{height:40px;border:0;border-radius:11px;background:none;font-weight:800;color:var(--ink-2)}
.opt button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.srcs{list-style:none;margin:0;padding:0}
.srcs li{display:flex;gap:10px;align-items:baseline;padding:12px 16px;font-size:14px;border-top:1px solid var(--line)}
.srcs li:first-child{border-top:0}
.srcs b{flex:1}
.srcs small{color:var(--ink-3);text-align:right;font-size:12.5px}
.srcs small.bad{color:var(--sun)}
.verse p{margin:0 0 6px;font-size:15px}
.verse sup{font-size:11px;color:var(--ink-3);margin-right:4px}
.explain{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:14px 16px;border-top:1px solid var(--line);font-size:14px}
.explain:first-child{border-top:0}
.explain .fl{width:64px;height:64px}
.explain b{display:block;font-size:14.5px}
.explain span{color:var(--ink-2);font-size:13px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs id="defs">
    <radialGradient id="pollen"><stop offset="0" stop-color="#FFE7A0"/><stop offset=".7" stop-color="#F5BE45"/><stop offset="1" stop-color="#E29A1E"/></radialGradient>
  </defs>
</svg>

<header class="top" id="top">
  <div class="wrap">
    <h1 class="logo"><svg viewBox="-100 -100 200 200" aria-hidden="true">
      <g fill-opacity=".95"><path d="M0 0C19 -8.4 39.9 -35.3 31.2 -65.5C23.6 -85.7 -23.6 -85.7 -31.2 -65.5C-39.9 -35.3 -19 -8.4 0 0Z" fill="oklch(.74 .14 350)"/>
      <path d="M0 0C19 -8.4 39.9 -35.3 31.2 -65.5C23.6 -85.7 -23.6 -85.7 -31.2 -65.5C-39.9 -35.3 -19 -8.4 0 0Z" fill="oklch(.72 .13 255)" transform="rotate(72)"/>
      <path d="M0 0C19 -8.4 39.9 -35.3 31.2 -65.5C23.6 -85.7 -23.6 -85.7 -31.2 -65.5C-39.9 -35.3 -19 -8.4 0 0Z" fill="oklch(.8 .14 75)" transform="rotate(144)"/>
      <path d="M0 0C19 -8.4 39.9 -35.3 31.2 -65.5C23.6 -85.7 -23.6 -85.7 -31.2 -65.5C-39.9 -35.3 -19 -8.4 0 0Z" fill="oklch(.72 .13 305)" transform="rotate(216)"/>
      <path d="M0 0C19 -8.4 39.9 -35.3 31.2 -65.5C23.6 -85.7 -23.6 -85.7 -31.2 -65.5C-39.9 -35.3 -19 -8.4 0 0Z" fill="oklch(.76 .11 205)" transform="rotate(288)"/></g>
      <circle r="20" fill="url(#pollen)"/></svg>꽃달력</h1>
    <div class="seg" role="group" aria-label="학년" id="grades"></div>
    <button class="ib" data-action="search" aria-label="일정 찾기"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    <button class="ib" data-action="more" aria-label="설정과 자료" id="more-btn"><svg class="i" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.3" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.3" fill="currentColor" stroke="none"/></svg></button>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="scrim" id="scrim" hidden data-action="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-top"><h2 id="sheet-title"></h2><button class="x" data-action="close" aria-label="닫기"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13"/></svg></button></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script>
'use strict';

/* ── 시트 ──────────────────────────────────────────── */
const SHEET_ID = '10blDNZ4zjrFU5lwCvgtoD3npwIwcCMQTeqwPgpQ_Ffg';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/edit`;
const SRC = {
  plan:   {sheet: '연중행사계획',        label: '연중행사계획'},
  planS:  {sheet: '(학생용)연중행사계획', label: '연중행사계획(학생용)'},
  notice: {sheet: '공지사항',            label: '공지사항'},
  pray:   {sheet: '기도순서',            label: '기도순서'},
  night:  {sheet: '자습감독',            label: '자습감독'},
};
const NEED = {teacher: ['plan', 'notice', 'pray', 'night'], student: ['planS']};
const TIMEOUT = 15000;
const STALE = 5 * 60 * 1000;

/* ── 꽃 규칙 ───────────────────────────────────────── */
// 일정 이름의 뜻은 읽지 않는다. 꽃은 시트의 수와 모양에서만 나온다.
//  · 꽃잎 하나 = 일정 하나. 색은 부서, 길이는 그 일정이 한 해에 얼마나 드문지.
//  · 꽃의 크기 = 올해 수업일 가운데 그날이 얼마나 바쁜지(백분위).
//  · 시트는 할 일마다 [부서]를 붙인다. 부서 없는 줄(공휴일 이름 같은)은 쉬는 날 메모로 둔다.
const STAGES = [[30, '봉오리'], [65, '피는 중'], [90, '활짝'], [101, '만개']];
const PERIOD_SHARE = 0.15;  // 교시 하나를 차지할 때마다 더하는 무게
const CHAIN_SHARE = 0.25;   // 같은 일정이 수업일마다 연달아 나올 때 하루마다 더하는 무게 (5일까지)
const REACH_SHARE = 0.25;   // 전체 보기에서 학년이 하나 더 적힐 때마다 더하는 무게
const FRONT_SHARE = 0.5;    // "~10/2" 처럼 기간이 적힌 일정이 둘째 날부터 남기는 무게
const PEAK = 90;            // 이 백분위부터 '만개'
const WD = ['일', '월', '화', '수', '목', '금', '토'];
const CIRCLED = {'①': 1, '②': 2, '③': 3};

/* ── 유틸 ───────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const toDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const keyOf = dt => ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
const addDays = (k, n) => { const d = toDate(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const todayKey = () => keyOf(new Date());
const dow = k => toDate(k).getDay();
const md = k => { const d = toDate(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
const shortDate = k => { const d = toDate(k); return `${d.getMonth() + 1}.${d.getDate()} (${WD[d.getDay()]})`; };
const clock = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const monthOf = k => k.slice(0, 7);
const shiftMonth = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const schoolYear = () => { const d = new Date(); return d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear() - 1; };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const valid = (y, m, d) => {
  if (!(y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  return new Date(y, m - 1, d).getMonth() === m - 1 ? ymd(y, m, d) : null;
};
const relDay = k => { const n = diffDays(S.today, k); return n === 0 ? '오늘' : n === 1 ? '내일' : n === -1 ? '어제' : `${WD[dow(k)]}요일`; };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };
const n1 = x => Math.round(x * 10) / 10;
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const CACHE = 'kkot:cache:';
const PREFS = 'kkot:prefs';

/* ── 상태 ───────────────────────────────────────────── */
const prefs = store.get(PREFS) || {};
const forParam = new URLSearchParams(location.search).get('for');
const S = {
  mode: forParam === 'student' || forParam === 'teacher' ? forParam : (prefs.mode === 'student' ? 'student' : 'teacher'),
  grade: [1, 2, 3].includes(prefs.grade) ? prefs.grade : 0,
  src: {}, loading: false, lastLoad: 0, today: todayKey(),
  month: null, yearView: false, sheet: null, q: '', word: null, bloomed: '',
};
const savePrefs = () => store.set(PREFS, {mode: S.mode, grade: S.grade});
if (forParam) savePrefs();
let M = emptyModel();

/* ── 시트 읽기 (gviz JSONP) ─────────────────────────── */
let seq = 0;
function gviz(sheet, tq) {
  return new Promise((resolve, reject) => {
    const cb = `__kkot${++seq}_${Date.now().toString(36)}`;
    const el = document.createElement('script');
    let done = false;
    const finish = (err, val) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      window[cb] = () => {};
      el.remove();
      err ? reject(err) : resolve(val);
    };
    const timer = setTimeout(() => finish(new Error('응답이 없습니다')), TIMEOUT);
    window[cb] = res => {
      if (!res || res.status === 'error') {
        const e = res && res.errors && res.errors[0];
        const msg = e && (e.detailed_message || e.message || e.reason);
        finish(new Error(msg ? String(msg).replace(/<[^>]*>/g, '') : '시트가 오류를 돌려주었습니다'));
        return;
      }
      const t = res.table;
      if (!t || !Array.isArray(t.rows) || !Array.isArray(t.cols)) { finish(new Error('표 형식이 아닙니다')); return; }
      finish(null, t);
    };
    el.onerror = () => finish(new Error('연결하지 못했습니다'));
    // 비공개 시트는 로그인 페이지를 돌려줘 콜백이 불리지 않는다
    el.onload = () => setTimeout(() => finish(new Error('시트를 읽을 수 없습니다. 공유 설정을 확인하세요')), 50);
    el.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}`
      + `&sheet=${encodeURIComponent(sheet)}` + (tq ? `&tq=${encodeURIComponent(tq)}` : '') + `&_=${Date.now()}`;
    document.head.appendChild(el);
  });
}

async function fetchSource(k) {
  const st = S.src[k] || (S.src[k] = {});
  try {
    const t = await gviz(SRC[k].sheet);
    Object.assign(st, {table: t, at: Date.now(), cached: false, error: null});
    store.set(CACHE + k, {at: st.at, table: t});
  } catch (e) {
    st.error = e.message || String(e);
  }
}

function primeFromCache() {
  for (const k of NEED[S.mode]) {
    const st = S.src[k] || (S.src[k] = {});
    if (st.table) continue;
    const c = store.get(CACHE + k);
    if (c && c.table && Array.isArray(c.table.rows)) Object.assign(st, {table: c.table, at: c.at, cached: true});
  }
}

async function load() {
  if (S.loading) return;
  S.loading = true;
  paintTop();
  await Promise.all(NEED[S.mode].map(fetchSource));
  S.loading = false;
  S.lastLoad = Date.now();
  rebuild();
  render();
  if (S.sheet) paintSheet();
}

/* ── 셀 해석 ───────────────────────────────────────── */
function cText(c) {
  if (!c) return '';
  if (c.f != null && c.f !== '') return String(c.f).trim();
  return c.v == null ? '' : String(c.v).trim();
}

// MM-DD 로만 적힌 날짜의 연도: 12월 → 1월로 넘어가면 해를 올린다
function yearCursor(start) {
  let year = start, last = 0;
  return {
    year(m) { if (last && m < last && last - m >= 6) year++; last = m; return year; },
    seen(m, y) { year = y; last = m; },
  };
}

function cellDate(c, cur) {
  if (!c) return null;
  if (typeof c.v === 'string') {
    const g = c.v.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
    if (g) { if (cur) cur.seen(+g[2] + 1, +g[1]); return valid(+g[1], +g[2] + 1, +g[3]); }
  }
  const t = cText(c);
  let m = t.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m) { if (cur) cur.seen(+m[2], +m[1]); return valid(+m[1], +m[2], +m[3]); }
  m = t.match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?$/);
  if (m && cur) return valid(cur.year(+m[1]), +m[1], +m[2]);
  return null;
}

// 머리글 줄을 찾아 열 위치를 정한다. 못 찾으면 시트의 현재 배치를 쓴다.
function columns(table, fallback) {
  const names = Object.keys(fallback);
  const out = {...fallback};
  for (const r of table.rows.slice(0, 8)) {
    const t = (r.c || []).map(cText);
    if (names.filter(n => t.includes(n)).length >= Math.min(2, names.length)) {
      names.forEach(n => { const i = t.indexOf(n); if (i >= 0) out[n] = i; });
      return out;
    }
  }
  const labels = (table.cols || []).map(c => String(c.label || '').trim().split(/\s+/).pop());
  names.forEach(n => { const i = labels.indexOf(n); if (i >= 0) out[n] = i; });
  return out;
}

/* ── 일정 한 줄 해석 ───────────────────────────────── */
// "[교무부]개학식(②③,1)" → 부서 교무부, 2·3학년, 1교시
function splitCell(text) {
  const parts = [];
  for (const line of String(text || '').replace(/\r/g, '').split('\n')) {
    for (const piece of line.split(/\s+(?=\[[^\[\]]{1,20}\])/)) {
      const s = piece.trim();
      if (!s) continue;
      if (s.startsWith('[') || !parts.length) parts.push(s);
      else parts[parts.length - 1] += ' ' + s;
    }
  }
  return parts;
}

// 적혀 있는 학년들 (①②③ 또는 "2, 3학년")
function markedGrades(s) {
  const set = new Set();
  for (const ch of s) if (CIRCLED[ch]) set.add(CIRCLED[ch]);
  if (!set.size) {
    for (const m of s.matchAll(/([1-3](?:\s*[,·~\-]\s*[1-3])*)\s*학년(?!부)/g)) {
      const nums = m[1].match(/[1-3]/g).map(Number);
      if (/[~\-]/.test(m[1]) && nums.length === 2) for (let k = Math.min(...nums); k <= Math.max(...nums); k++) set.add(k);
      else nums.forEach(n => set.add(n));
    }
  }
  return [...set].sort();
}

const PERIOD_TOKEN = /^(\d)\s*(?:[~\-–]\s*(\d))?\s*(?:교시)?$/;
const RANGE_TOKEN = /^~\s*\d{1,2}(?:\s*[\/.]\s*\d{1,2})?\s*일?$/;

function findPeriods(s) {
  const set = new Set();
  const add = (a, b) => { a = +a; b = b ? +b : a; if (a < 1 || b > 9 || b < a) return; for (let k = a; k <= b; k++) set.add(k); };
  for (const m of s.matchAll(/(\d)\s*(?:[~\-–]\s*(\d)\s*)?교시/g)) add(m[1], m[2]);
  for (const g of s.matchAll(/\(([^()]*)\)/g)) {
    for (const tok of g[1].split(/[,，]/)) {
      const m = tok.replace(/[①②③]/g, '').trim().match(PERIOD_TOKEN);
      if (m) add(m[1], m[2]);
    }
  }
  return set.size ? [...set].sort((a, b) => a - b) : null;
}

function findEnd(s, start) {
  const [sy, sm, sd] = start.split('-').map(Number);
  let y = sy, mo, d;
  let m = s.match(/~\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})/);
  if (m) {
    mo = +m[1]; d = +m[2];
    if (mo < sm && sm - mo >= 6) y++;
  } else {
    // "~13일", "(②, ~13)" 처럼 날만 적은 경우. "1~3학년", "~4시" 는 기간이 아니다.
    m = s.match(/~\s*(\d{1,2})\s*일?(?=\s*[),]|\s*$)/);
    if (!m) return null;
    mo = sm; d = +m[1];
    if (d < sd) { mo++; if (mo > 12) { mo = 1; y++; } }
  }
  const k = valid(y, mo, d);
  return k && k > start ? k : null;
}

// 학년·교시·기간만 담긴 괄호는 따로 보여 주므로 본문에서 뺀다
function cleanText(s) {
  return s.replace(/\s*\(([^()]*)\)/g, (all, inner) => {
    const toks = inner.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    const rest = toks.filter(t => {
      const x = t.replace(/[①②③]/g, '').trim();
      return !(x === '' || PERIOD_TOKEN.test(x) || RANGE_TOKEN.test(x));
    });
    if (rest.length === toks.length) return all;
    return rest.length ? `(${rest.join(', ')})` : '';
  }).replace(/\s{2,}/g, ' ').trim();
}

function parseItem(src, date) {
  let s = src.trim(), dept = '', cat = '';
  let m = s.match(/^\[([^\]]{1,20})\]\s*/);
  if (m) { dept = m[1].trim(); s = s.slice(m[0].length); }
  m = s.match(/^<([^>]{1,10})>\s*/);
  if (m) { cat = m[1].trim(); s = s.slice(m[0].length); }
  const marked = markedGrades(s);
  return {
    date, dept, cat, raw: src,
    text: cleanText(s) || s,
    // 같은 일정인지 가르는 열쇠: 괄호·숫자·기호·띄어쓰기를 뺀 글자 ("1학기 중간고사 2일차" = "2학기 중간고사 1일차")
    key: s.replace(/\([^)]*\)/g, '').replace(/[\p{N}\p{P}\p{S}\s]/gu, '') || s,
    grades: marked.length && marked.length < 3 ? marked : null,
    reach: marked.length,
    periods: findPeriods(s),
    end: findEnd(s, date),
    memo: !dept,
    w: 0,
  };
}

/* ── 모델 ───────────────────────────────────────────── */
function emptyModel() {
  return {byDate: new Map(), dates: [], index: new Map(), score: [], dist: [], color: new Map(), duty: new Map(), notices: [], year: null, total: 0};
}

function parsePlan(t, m) {
  const h = columns(t, {'날짜': 0, '요일': 1, '일정': 2});
  for (const r of t.rows) {
    const c = r.c || [];
    const date = cellDate(c[h['날짜']]);
    if (!date) continue;
    const items = splitCell(cText(c[h['일정']])).map(s => parseItem(s, date)).filter(it => it.text);
    const list = m.byDate.get(date) || [];
    list.push(...items);
    m.byDate.set(date, list);
  }
}

const dutyOf = (m, date) => m.duty.get(date) || (m.duty.set(date, {}), m.duty.get(date));

function parsePray(t, m) {
  const h = columns(t, {'날짜': 0, '요일': 1, '이름': 2, '성경': 3, '찬송': 4});
  const cur = yearCursor(m.year || schoolYear());
  for (const r of t.rows) {
    const c = r.c || [];
    const date = cellDate(c[h['날짜']], cur);
    if (!date) continue;
    const p = {name: cText(c[h['이름']]), bible: cText(c[h['성경']]), hymn: cText(c[h['찬송']])};
    if (p.name || p.bible || p.hymn) dutyOf(m, date).pray = p;
  }
}

function parseNight(t, m) {
  const h = columns(t, {'날짜': 0, '요일': 1, '이름': 2});
  const cur = yearCursor(m.year || schoolYear());
  for (const r of t.rows) {
    const c = r.c || [];
    const date = cellDate(c[h['날짜']], cur);
    const name = cText(c[h['이름']]);
    if (date && name) dutyOf(m, date).night = name;
  }
}

function parseNotice(t, m) {
  const h = columns(t, {'게시 시작일': 0, '게시 종료일': 1, '내용': 2});
  for (const r of t.rows) {
    const c = r.c || [];
    const start = cellDate(c[h['게시 시작일']]);
    const text = cText(c[h['내용']]);
    if (!start || !text) continue;
    let end = cellDate(c[h['게시 종료일']]) || start;
    if (end < start) end = start;
    m.notices.push({start, end, text});
  }
  m.notices.sort((a, b) => a.start.localeCompare(b.start));
}

// 일정마다 무게를 매기고, 학년별로 날마다의 점수와 그 분포를 만든다
function weigh(m) {
  const keysAt = m.dates.map(d => new Set(m.byDate.get(d).filter(it => !it.memo).map(it => it.key)));
  const days = new Map();
  let workDays = 0;
  for (const keys of keysAt) {
    if (keys.size) workDays++;
    for (const k of keys) days.set(k, (days.get(k) || 0) + 1);
  }
  const ranged = [];
  m.dates.forEach((date, i) => {
    for (const it of m.byDate.get(date)) {
      if (it.memo) continue;
      // 앞뒤 수업일에 같은 일정이 몇 날 이어지는가
      let run = 1;
      for (let j = i - 1; j >= 0 && keysAt[j].has(it.key); j--) run++;
      for (let j = i + 1; j < keysAt.length && keysAt[j].has(it.key); j++) run++;
      it.w = Math.log2(1 + workDays / days.get(it.key))
        * (1 + PERIOD_SHARE * (it.periods ? it.periods.length : 0))
        * (1 + CHAIN_SHARE * (Math.min(run, 5) - 1));
      if (it.end) ranged.push(it);
    }
  });
  m.score = [0, 1, 2, 3].map(g => {
    const map = new Map();
    for (const date of m.dates) {
      const list = m.byDate.get(date);
      let s = 0;
      for (const it of list) if (!it.memo && gradeOk(it, g)) s += it.w * (g ? 1 : 1 + REACH_SHARE * Math.max(0, it.reach - 1));
      // 부서 없는 줄만 있는 날(쉬는 날)에는 기간 일정도 지나가지 않는다
      const rest = list.length > 0 && list.every(it => it.memo);
      if (!rest) for (const it of ranged) if (it.date < date && it.end >= date && gradeOk(it, g)) s += FRONT_SHARE * it.w;
      map.set(date, s);
    }
    return map;
  });
  m.dist = m.score.map(map => [...map.values()].filter(s => s > 0).sort((a, b) => a - b));
}

// 부서마다 꽃잎 색: 이름 순서대로 황금각만큼 색상을 돌린다. 잎과 헷갈리는 초록 대역은 건너뛴다.
function paint(m) {
  const names = [...new Set([...m.byDate.values()].flat().filter(it => it.dept).map(it => it.dept))].sort((a, b) => a.localeCompare(b, 'ko'));
  let defs = '';
  names.forEach((name, i) => {
    const t = (i * 0.618034) % 1;
    const h = Math.round((180 + t * 262) % 360);  // 청록 → 파랑 → 보라 → 분홍 → 빨강 → 주황(82)
    m.color.set(name, {i, h});
    defs += `<linearGradient id="pg${i}" x1="0" y1="1" x2="0" y2="0">`
      + `<stop offset="0" stop-color="oklch(.6 .15 ${h})"/><stop offset=".55" stop-color="oklch(.75 .13 ${h})"/><stop offset="1" stop-color="oklch(.9 .06 ${h})"/></linearGradient>`;
  });
  const holder = $('#defs');
  holder.querySelectorAll('linearGradient').forEach(g => g.remove());
  holder.insertAdjacentHTML('beforeend', defs);
}
const tone = dept => M.color.get(dept);
const solid = (dept, l = .72, c = .14) => { const t = tone(dept); return t ? `oklch(${l} ${c} ${t.h})` : 'var(--ink-3)'; };

function rebuild() {
  const m = emptyModel();
  const run = (k, fn) => {
    const st = S.src[k];
    if (!st || !st.table) return;
    try { fn(st.table, m); st.parseError = null; }
    catch (e) { st.parseError = e.message; console.error(k, e); }
  };
  run(S.mode === 'student' ? 'planS' : 'plan', parsePlan);
  m.dates = [...m.byDate.keys()].sort();
  m.dates.forEach((d, i) => m.index.set(d, i));
  m.year = m.dates.length ? toDate(m.dates[0]).getFullYear() : null;
  for (const list of m.byDate.values()) m.total += list.length;
  weigh(m);
  paint(m);
  if (S.mode === 'teacher') {
    run('notice', parseNotice);
    run('pray', parsePray);
    run('night', parseNight);
  }
  M = m;
}

const planSrc = () => S.src[S.mode === 'student' ? 'planS' : 'plan'] || {};
const ready = () => !!planSrc().table;

/* ── 하루 계산 ─────────────────────────────────────── */
const gradeOk = (it, g) => !g || !it.grades || it.grades.includes(g);
const itemsOn = (date, g = S.grade) => (M.byDate.get(date) || []).filter(it => gradeOk(it, g));
const scoreOf = (date, g = S.grade) => (M.score[g] && M.score[g].get(date)) || 0;
const topShare = busy => `올해 수업일 중 상위 ${Math.max(1, 100 - busy)}%`;

// 점수가 0 보다 큰 날들 가운데 이 점수 이하인 날의 비율 (1–99)
function busyOf(date, g = S.grade) {
  const s = scoreOf(date, g), sorted = M.dist[g] || [];
  if (!s || !sorted.length) return 0;
  let lo = 0, hi = sorted.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] <= s) lo = mid + 1; else hi = mid; }
  return Math.min(99, Math.max(1, Math.round(lo / sorted.length * 100)));
}
const stageOf = busy => busy ? STAGES.find(([cut]) => busy < cut)[1] : '쉼';

function fronts(date, g = S.grade) {
  const out = [];
  for (const d of M.dates) {
    if (d >= date) break;
    for (const it of M.byDate.get(d)) if (it.end && it.end >= date && gradeOk(it, g)) out.push(it);
  }
  return out;
}

function day(date, g = S.grade) {
  const items = itemsOn(date, g);
  const work = items.filter(it => !it.memo);
  const memos = items.filter(it => it.memo);
  const busy = busyOf(date, g);
  const head = work.reduce((a, it) => (!a || it.w > a.w ? it : a), null);
  const periods = [...new Set(work.flatMap(it => it.periods || []))].sort((a, b) => a - b);
  return {date, g, items, work, memos, busy, stage: stageOf(busy), head, fronts: fronts(date, g), periods, known: M.byDate.has(date)};
}

function nextWorkDay(date, g = S.grade) {
  for (const d of M.dates) if (d > date && itemsOn(d, g).some(it => !it.memo)) return d;
  return null;
}

// 만개가 수업일 사이로 이어지면 한 구간으로 묶는다
function peakRuns(from, g, limit, within = 400) {
  const until = addDays(from, within);
  const runs = [];
  for (const d of M.dates) {
    if (d < from || d > until || busyOf(d, g) < PEAK) continue;
    const last = runs[runs.length - 1];
    if (last && M.index.get(d) === M.index.get(last.end) + 1) { last.end = d; last.days.push(d); }
    else runs.push({start: d, end: d, days: [d]});
  }
  return runs.slice(0, limit).map(r => ({...r, title: runTitle(r.days, g)}));
}

// 구간 이름: 여러 날에 되풀이된 일정이 있으면 그 글자들의 공통 앞부분("2학기 중간고사 1일차"·"2일차" → "2학기 중간고사"),
// 없으면 구간에서 가장 무거운 일정
function runTitle(days, g) {
  const byKey = new Map();
  for (const d of days) {
    for (const it of itemsOn(d, g)) {
      if (it.memo) continue;
      if (!byKey.has(it.key)) byKey.set(it.key, []);
      byKey.get(it.key).push(it);
    }
  }
  const repeated = [...byKey.values()]
    .filter(list => new Set(list.map(it => it.date)).size > 1)
    .sort((a, b) => Math.max(...b.map(it => it.w)) - Math.max(...a.map(it => it.w)))[0];
  if (repeated) {
    let p = repeated[0].text;
    for (const it of repeated) { let i = 0; while (i < p.length && p[i] === it.text[i]) i++; p = p.slice(0, i); }
    p = p.replace(/[\s\p{N}\p{P}]+$/u, '');
    return p.length >= 2 ? p : repeated[0].text;
  }
  const top = [...byKey.values()].flat().reduce((a, it) => (!a || it.w > a.w ? it : a), null);
  return top ? top.text : '';
}

function periodLabel(p) {
  const run = p.every((x, i) => i === 0 || x === p[i - 1] + 1);
  return (p.length > 1 && run ? `${p[0]}–${p[p.length - 1]}` : p.join('·')) + '교시';
}

/* ── 꽃 그리기 ─────────────────────────────────────── */
// 좌표계는 꽃 가운데가 (0,0), 반지름 100
function petalPath(L, W) {
  return `M0 0C${n1(W * .5)} ${n1(-L * .1)} ${n1(W * 1.05)} ${n1(-L * .42)} ${n1(W * .82)} ${n1(-L * .78)}`
    + `C${n1(W * .62)} ${n1(-L * 1.02)} ${n1(-W * .62)} ${n1(-L * 1.02)} ${n1(-W * .82)} ${n1(-L * .78)}`
    + `C${n1(-W * 1.05)} ${n1(-L * .42)} ${n1(-W * .5)} ${n1(-L * .1)} 0 0Z`;
}
const fill = dept => (tone(dept) ? `url(#pg${tone(dept).i})` : 'var(--ink-3)');

function sproutG(s = 1) {
  return `<g transform="scale(${s})"><path class="stem" d="M0 58C2 30 -2 12 0 -6" stroke="var(--leaf)" stroke-width="7" fill="none" stroke-linecap="round"/>`
    + `<path class="leaf" d="M0 8C-26 10 -50 -8 -52 -40C-22 -40 -4 -22 0 8Z" fill="var(--leaf)"/>`
    + `<path class="leaf" d="M1 -2C22 -2 44 -20 44 -50C16 -48 2 -30 1 -2Z" fill="var(--leaf-2)"/></g>`;
}
function budG(f) {
  const lead = f.fronts.reduce((a, it) => (!a || it.w > a.w ? it : a), null);
  const c = lead ? fill(lead.dept) : 'var(--ink-3)';
  return `<path class="stem" d="M0 70C3 40 -3 20 0 0" stroke="var(--leaf)" stroke-width="6" fill="none" stroke-linecap="round"/>`
    + `<path class="leaf" d="M0 44C-18 44 -34 32 -36 12C-16 12 -4 24 0 44Z" fill="var(--leaf-2)"/>`
    + `<g class="pt" style="--a:-10deg;--k:0"><path d="${petalPath(62, 24)}" fill="${c}"/></g>`
    + `<g class="pt" style="--a:12deg;--k:1"><path d="${petalPath(56, 22)}" fill="${c}" opacity=".85"/></g>`;
}
function seedG() {
  return `<circle r="9" fill="none" stroke="var(--line)" stroke-width="5"/>`;
}

/**
 * f: day() 결과. o.detail: 꽃술까지 그린다. o.stem: 줄기와 잎. o.anim: 피어나는 움직임.
 * 꽃잎은 무거운 일정부터 12시 방향에서 시계 방향으로 놓인다. 일정이 다섯보다 적으면 돌아가며 채운다.
 */
function flowerSVG(f, o = {}) {
  const cls = `fl${o.anim && !reduced() ? ' anim' : ''}`;
  const vb = o.stem ? '-118 -118 236 272' : '-112 -112 224 224';
  const label = o.label !== false ? ` role="img" aria-label="${f.work.length ? `${f.stage}, 꽃잎 ${f.work.length}장` : f.stage}"` : ' aria-hidden="true"';
  let g = '';
  if (!f.work.length) {
    // 오늘 꽃(stem)은 할 일이 없는 날에도 새싹으로 보여 준다. 작은 꽃은 시트에 없는 날을 씨앗으로 둔다.
    const sprout = o.stem || f.memos.length || (f.known && ![0, 6].includes(dow(f.date)));
    g = f.busy ? budG(f) : sprout ? sproutG(o.stem ? 1.5 : 1) : seedG();
    return `<svg class="${cls}" viewBox="${o.stem ? '-118 -100 236 200' : vb}"${label}>${g}</svg>`;
  }
  const ev = f.work.map((it, i) => ({it, i})).sort((a, b) => b.it.w - a.it.w);
  const maxW = ev[0].it.w;
  const n = Math.min(14, Math.max(5, ev.length));
  const scale = 0.6 + 0.4 * f.busy / 100;
  const R = 100 * scale;
  const spin = (hash(f.date) - .5) * 24;
  if (o.stem) {
    g += `<path class="stem" d="M0 ${n1(R * .3)}C10 ${n1(R * .3 + 45)} -12 ${n1(R * .3 + 80)} 0 148" stroke="var(--leaf)" stroke-width="6" fill="none" stroke-linecap="round"/>`
      + `<path class="leaf" d="M-2 128C-30 128 -58 110 -64 80C-34 78 -10 96 -2 128Z" fill="var(--leaf)" style="transform-origin:-2px 128px"/>`
      + `<path class="leaf" d="M2 108C24 106 46 90 50 64C26 64 8 80 2 108Z" fill="var(--leaf-2)" style="transform-origin:2px 108px"/>`;
  }
  const ring = (k0, count, len, rot, op, shift = 0) => {
    let h = '';
    for (let k = 0; k < count; k++) {
      const e = ev[(k + shift) % ev.length];
      const L = len * (0.66 + 0.34 * e.it.w / maxW) * (k >= ev.length ? 0.88 : 1);
      const W = Math.min(L * 0.38, (2 * Math.PI * len * 0.5 / count) * 0.64);
      const a = spin + rot + k * 360 / count + (hash(f.date + k) - .5) * 7;
      h += `<g class="pt" data-ev="${e.i}" style="--a:${n1(a)}deg;--k:${k0 + k}"><path d="${petalPath(L, W)}" fill="${fill(e.it.dept)}"${op ? ` opacity="${op}"` : ''}/></g>`;
    }
    return h;
  };
  g += ring(0, n, R, 0, 0);
  if (f.busy >= PEAK) g += ring(n, n, R * .58, 180 / n, .97, 1);
  const cr = n1(R * .17 + 3);
  let ctr = `<circle r="${cr}" fill="url(#pollen)"/>`;
  if (o.detail) {
    const dots = Math.max(6, Math.min(12, f.periods.length * 2 || 6));
    for (let k = 0; k < dots; k++) {
      const a = (k / dots) * Math.PI * 2 + hash(f.date) * 3;
      ctr += `<circle cx="${n1(Math.cos(a) * cr * .62)}" cy="${n1(Math.sin(a) * cr * .62)}" r="${n1(cr * .1 + .6)}" fill="#C9800F" opacity=".75"/>`;
    }
  }
  const total = n + (f.busy >= PEAK ? n : 0);
  g += `<g class="ctr" style="--n:${total}">${ctr}</g>`;
  return `<svg class="${cls}" viewBox="${vb}"${label}>${g}</svg>`;
}

function petalGlyph(it) {
  if (it.memo) return `<svg class="gl" viewBox="-60 -60 120 120" aria-hidden="true"><g transform="translate(0 6) scale(.9)">${sproutG()}</g></svg>`;
  const pet = petalPath(88, 34), c = fill(it.dept);
  return `<svg class="gl" viewBox="-100 -100 200 200" aria-hidden="true">${[0, 72, 144, 216, 288].map(a => `<path d="${pet}" fill="${c}" transform="rotate(${a})"/>`).join('')}<circle r="20" fill="url(#pollen)"/></svg>`;
}

/* ── 그리기: 조각 ─────────────────────────────────── */
function rulerHTML(it) {
  if (!it.periods) return '<span></span>';
  const max = Math.max(7, ...it.periods);
  let h = `<span class="ruler" style="--c:${solid(it.dept, .66, .15)};grid-template-columns:repeat(${max},5px)" role="img" aria-label="${periodLabel(it.periods)}">`;
  for (let p = 1; p <= max; p++) h += `<i${it.periods.includes(p) ? ' class="on"' : ''}></i>`;
  return h + '</span>';
}

function evHTML(it, o = {}) {
  const tags = [];
  if (it.grades) tags.push(`${it.grades.join('·')}학년`);
  if (it.periods) tags.push(periodLabel(it.periods));
  if (it.end && o.end !== false) tags.push(`~${md(it.end)}`);
  const head = [it.dept, it.cat].filter(Boolean).map(esc).join(' · ');
  const text = o.hl ? hl(it.text) : esc(it.text);
  const attr = o.idx != null ? ` data-ev="${o.idx}"` : o.go ? ` data-day="${it.date}"` : '';
  return `<li class="ev${it.memo ? ' memo' : ''}"${attr}>${petalGlyph(it)}`
    + `<span>${o.date ? `<span class="dp">${shortDate(it.date)}${head ? ` · ${head}` : ''}</span>` : head ? `<span class="dp">${head}</span>` : ''}`
    + `<span class="tx">${text}</span>${tags.length ? `<span class="tg">${tags.map(x => `<i>${x}</i>`).join('')}</span>` : ''}`
    + (o.sub ? `<span class="sub">${o.sub}</span>` : '') + `</span>${o.ruler === false ? '<span></span>' : rulerHTML(it)}</li>`;
}

// 하루 목록: 쉬는 날 메모 → 교시 없는 일정 → 교시 순
function dayList(f, o = {}) {
  const idx = new Map(f.work.map((it, i) => [it, i]));
  const order = [...f.memos, ...f.work.filter(it => !it.periods), ...f.work.filter(it => it.periods).sort((a, b) => a.periods[0] - b.periods[0])];
  let h = order.length ? `<ul class="evs">${order.map(it => evHTML(it, {idx: o.link ? idx.get(it) : null})).join('')}</ul>` : '';
  const fr = f.fronts;
  if (fr.length) {
    h += `<p class="sublabel">이어지는 일정</p><ul class="evs">${fr.map(it =>
      evHTML(it, {end: false, go: o.go, sub: `${shortDate(it.date)} ~ ${shortDate(it.end)} · ${diffDays(f.date, it.end) ? `${diffDays(f.date, it.end)}일 남음` : '오늘까지'}`})).join('')}</ul>`;
  }
  return h || `<div class="empty">적힌 일정이 없습니다.</div>`;
}

const sec = (title, small, body, end = '') =>
  `<section class="sec"><h2 class="sec-h">${title}${small ? `<small>${small}</small>` : ''}${end ? `<span class="end">${end}</span>` : ''}</h2>${body}</section>`;

/* ── 그리기: 첫 화면 ─────────────────────────────── */
function heroHTML(f) {
  const d = toDate(S.today);
  const date = `<p class="date">${d.getMonth() + 1}월 ${d.getDate()}일<small>${WD[d.getDay()]}요일</small></p>`;
  if (!f) {
    const busyLoading = S.loading || !S.lastLoad;
    return `<section class="hero">${flowerSVG({date: S.today, work: [], memos: [], fronts: [], busy: 0, stage: '', known: false}, {stem: true, label: false})}${date}`
      + `<p class="stage">${busyLoading ? '시트를 읽는 중' : '시트를 읽지 못했습니다'}</p></section>`;
  }
  const key = `${S.today}|${S.grade}|${S.mode}|${f.work.length}`;
  const anim = S.bloomed !== key;
  S.bloomed = key;
  const lead = f.head && tone(f.head.dept);
  const glow = lead ? `oklch(.85 .1 ${lead.h})` : 'transparent';
  let stage;
  if (f.work.length) stage = `<p class="stage">${f.stage} <span>· 일정 ${f.work.length}건</span></p><p class="stage-sub">${topShare(f.busy)}</p>`;
  else if (f.busy) stage = `<p class="stage">${f.stage} <span>· 이어지는 일정만 있습니다</span></p><p class="stage-sub">${topShare(f.busy)}</p>`;
  else stage = `<p class="stage">쉼 <span>· ${f.memos.length ? esc(f.memos.map(it => it.text).join(' · ')) : [0, 6].includes(dow(S.today)) ? '주말' : '적힌 일정이 없습니다'}</span></p>`;
  let chips = '';
  const du = S.mode === 'teacher' ? M.duty.get(S.today) : null;
  if (du && du.pray && du.pray.name) {
    const more = du.pray.bible || du.pray.hymn;
    chips += `<${more ? 'button' : 'span'} class="chip"${more ? ' data-action="word"' : ''}>기도 <b>${esc(du.pray.name)}</b>${du.pray.bible ? ` · ${esc(du.pray.bible)}` : ''}</${more ? 'button' : 'span'}>`;
  }
  if (du && du.night) chips += `<span class="chip">야자 감독 <b>${esc(du.night)}</b></span>`;
  return `<section class="hero" style="--glow:${glow}" id="hero">${flowerSVG(f, {stem: true, detail: true, anim})}${date}${stage}`
    + (chips ? `<div class="chips">${chips}</div>` : '') + `</section>`;
}

function notesHTML() {
  const t = S.today;
  return M.notices.filter(n => n.start <= t && t <= n.end)
    .map(n => `<div class="note" role="note"><span>${esc(n.text)}</span><small>${md(n.end)}까지</small></div>`).join('');
}

function todayHTML(f) {
  if (!f) return sec('오늘', '', failHTML());
  let h = '';
  if (f.work.length || f.fronts.length || f.memos.length) {
    h += sec(f.work.length ? '오늘 핀 일정' : '오늘', f.work.length ? `${f.work.length}건` : '', `<div class="card">${dayList(f, {link: true, go: true})}</div>`);
  }
  // 오늘 할 일이 없으면 다음 수업일을 미리 보여 준다
  const nd = !f.work.length && nextWorkDay(S.today);
  if (nd) h += sec(`다음 수업일 · ${shortDate(nd)}`, `${diffDays(S.today, nd)}일 뒤`, `<div class="card">${dayList(day(nd), {go: true})}</div>`);
  return h;
}

function weekHTML() {
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(S.today, i);
    const f = day(d);
    const wd = dow(d);
    const cls = [wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', i === 0 ? 'today' : ''].filter(Boolean).join(' ');
    h += `<button class="wd ${cls}" data-day="${d}" aria-label="${shortDate(d)} ${f.stage} 일정 ${f.work.length}건">`
      + `<span>${i === 0 ? '오늘' : WD[wd]}</span>${flowerSVG(f, {label: false})}<b>${toDate(d).getDate()}</b></button>`;
  }
  return sec('앞으로 7일', '', `<div class="card"><div class="week">${h}</div></div>`);
}

function peaksHTML() {
  const runs = peakRuns(addDays(S.today, 1), S.grade, 3, 90);
  if (!runs.length) return '';
  const rows = runs.map(r => {
    const top = r.days.reduce((a, d) => (scoreOf(d) > scoreOf(a) ? d : a), r.days[0]);
    return `<li><button class="peak" data-day="${r.start}">${flowerSVG(day(top), {label: false})}`
      + `<span class="t">${esc(r.title)}<small>${shortDate(r.start)}${r.days.length > 1 ? `부터 ${r.days.length}일` : ''}</small></span>`
      + `<span class="dd">D-${diffDays(S.today, r.start)}</span></button></li>`;
  }).join('');
  return sec('곧 만개', '올해 가장 바쁜 10%', `<div class="card"><ul class="peaks">${rows}</ul></div>`);
}

/* 정원: 한 달 또는 한 해 */
function monthBounds() { return M.dates.length ? [monthOf(M.dates[0]), monthOf(M.dates[M.dates.length - 1])] : [null, null]; }

function gardenHTML() {
  if (!ready() || !M.dates.length) return '';
  const [lo, hi] = monthBounds();
  if (!S.month) S.month = monthOf(S.today) < lo ? lo : monthOf(S.today) > hi ? hi : monthOf(S.today);
  const [y, m] = S.month.split('-').map(Number);
  const tog = `<span class="tog" role="group" aria-label="보기"><button data-action="view-month" aria-pressed="${!S.yearView}">한 달</button><button data-action="view-year" aria-pressed="${S.yearView}">한 해</button></span>`;
  if (S.yearView) {
    return `<section class="sec" id="garden"><div class="gh"><h2>${M.year}학년도<small>정원</small></h2>${tog}</div><div class="card">${yearHTML()}${legendHTML()}</div></section>`;
  }
  const first = `${S.month}-01`;
  const lead = dow(first);
  const days = new Date(y, m, 0).getDate();
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<span class="cell out"></span>';
  for (let d = 1; d <= days; d++) {
    const k = ymd(y, m, d);
    const f = day(k);
    const wd = dow(k);
    const cls = ['cell', wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', k === S.today ? 'today' : '', k < S.today ? 'past' : ''].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-day="${k}" aria-label="${m}월 ${d}일 ${f.stage}${f.work.length ? ` 일정 ${f.work.length}건` : ''}"><span class="n">${d}</span>${flowerSVG(f, {label: false})}</button>`;
  }
  return `<section class="sec" id="garden"><div class="gh"><h2>${m}월<small>${y}</small></h2>${tog}`
    + `<button class="ib" data-action="prev" aria-label="이전 달"${lo && S.month <= lo ? ' disabled' : ''}><svg class="i" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button>`
    + `<button class="ib" data-action="next" aria-label="다음 달"${hi && S.month >= hi ? ' disabled' : ''}><svg class="i" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg></button></div>`
    + `<div class="card garden" id="garden-grid"><div class="dow" aria-hidden="true">${WD.map(w => `<span>${w}</span>`).join('')}</div><div class="mgrid">${cells}</div></div></section>`;
}

function yearHTML() {
  const [lo, hi] = monthBounds();
  let h = '';
  for (let mk = lo; mk <= hi; mk = shiftMonth(mk, 1)) {
    const [y, m] = mk.split('-').map(Number);
    const lead = dow(`${mk}-01`);
    const n = new Date(y, m, 0).getDate();
    let dots = '<i></i>'.repeat(lead), peaks = 0;
    for (let d = 1; d <= n; d++) {
      const k = ymd(y, m, d);
      const f = day(k);
      if (f.busy >= PEAK) peaks++;
      const s = f.work.length ? n1(3 + f.busy / 100 * 6) : f.busy ? 3.5 : 3;
      const c = f.work.length ? solid(f.head.dept, .7, .15) : f.memos.length ? 'var(--leaf)' : 'var(--line)';
      dots += `<i${k === S.today ? ' class="today"' : ''} style="--s:${s}px;--c:${c}"></i>`;
    }
    h += `<button class="ym" data-month="${mk}" aria-label="${m}월 보기"><h3>${m}월${peaks ? `<small>만개 ${peaks}</small>` : ''}</h3><span class="ydots">${dots}</span></button>`;
  }
  return `<div class="year">${h}</div>`;
}

function legendHTML() {
  const counts = new Map();
  for (const list of M.byDate.values()) for (const it of list) if (it.dept) counts.set(it.dept, (counts.get(it.dept) || 0) + 1);
  const top = [...counts].sort((a, b) => b[1] - a[1]).slice(0, 10);
  return `<div class="legend">${top.map(([d]) => `<span><i style="--c:${solid(d, .7, .15)}"></i>${esc(d)}</span>`).join('')}</div>`;
}

function footHTML() {
  const st = planSrc();
  return `<footer class="foot">`
    + `<p>꽃잎 한 장이 일정 하나예요. 색은 부서, 꽃잎 길이는 그 일정이 한 해에 얼마나 드문지, 꽃의 크기는 올해 수업일 가운데 그날이 얼마나 바쁜지예요. 가장 바쁜 10%의 날은 꽃잎이 두 겹으로 핍니다.</p>`
    + `<p>${st.at ? `${st.cached ? '저장해 둔 ' : ''}시트 ${clock(st.at)}` : ''}${st.error && st.table ? ' · 연결하지 못해 저장본을 보여 줍니다 · <button data-action="refresh">다시 받기</button>' : ''}</p>`
    + `</footer>`;
}

function failHTML() {
  if (S.loading || !S.lastLoad) return `<div class="card"><div class="skel"></div><div class="skel"></div></div>`;
  return `<div class="card" style="padding:18px"><b>시트를 읽지 못했습니다.</b>`
    + `<p class="hint" style="margin:6px 0 0">${esc(planSrc().error || '')}<br>시트가 ‘링크가 있는 모든 사용자’에게 보기로 공유되어 있어야 합니다.</p>`
    + `<div class="btns"><button class="btn solid" data-action="refresh">다시 받기</button><a class="btn" href="${SHEET_URL}" target="_blank" rel="noopener">시트 열기</a></div></div>`;
}

/* ── 그리기: 전체 ─────────────────────────────────── */
function paintTop() {
  $('#grades').innerHTML = [0, 1, 2, 3].map(g =>
    `<button data-grade="${g}" aria-pressed="${S.grade === g}" aria-label="${g ? `${g}학년` : '전체 학년'}">${g || '전체'}</button>`).join('');
  const more = $('#more-btn');
  const dot = more.querySelector('.dot');
  const bad = NEED[S.mode].some(k => S.src[k]?.error);
  if (bad && !dot) more.insertAdjacentHTML('beforeend', '<i class="dot"></i>');
  if (!bad && dot) dot.remove();
}

function render() {
  S.today = todayKey();
  const f = ready() ? day(S.today) : null;
  $('#main').innerHTML = heroHTML(f) + (f ? notesHTML() : '') + todayHTML(f)
    + (f ? weekHTML() + peaksHTML() + gardenHTML() : '') + footHTML();
  paintTop();
}

function renderGarden() {
  const el = $('#garden');
  if (el) el.outerHTML = gardenHTML();
}

/* ── 아래서 올라오는 판 ─────────────────────────────── */
function openSheet(kind, arg) {
  const wasOpen = !!S.sheet;
  S.sheet = {kind, arg, anim: true};
  paintSheet();
  const el = $('#sheet'), bg = $('#scrim');
  if (!wasOpen) {
    el.hidden = false; bg.hidden = false;
    document.documentElement.classList.add('locked');
    requestAnimationFrame(() => { el.classList.add('open'); bg.classList.add('open'); el.focus({preventScroll: true}); });
    history.pushState({sheet: 1}, '');
  }
  $('#sheet-body').scrollTop = 0;
  if (kind === 'search') setTimeout(() => $('#q') && $('#q').focus(), wasOpen ? 0 : 320);
}

function hideSheet() {
  if (!S.sheet) return;
  S.sheet = null; S.word = null;
  const el = $('#sheet'), bg = $('#scrim');
  el.classList.remove('open'); bg.classList.remove('open');
  document.documentElement.classList.remove('locked');
  setTimeout(() => { if (!S.sheet) { el.hidden = true; bg.hidden = true; } }, reduced() ? 0 : 320);
}
function closeSheet() { if (history.state && history.state.sheet) history.back(); else hideSheet(); }

function paintSheet() {
  const {kind, arg} = S.sheet;
  let title = '', body = '';
  if (kind === 'day') ({title, body} = daySheet(arg));
  else if (kind === 'search') { title = '일정 찾기'; body = searchSheet(); }
  else if (kind === 'more') { title = '설정과 자료'; body = moreSheet(); }
  else if (kind === 'word') { title = '기도 순서'; body = wordSheet(); }
  $('#sheet-title').textContent = title;
  const focusQ = document.activeElement && document.activeElement.id === 'q';
  $('#sheet-body').innerHTML = body;
  if (focusQ && $('#q')) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  S.sheet.anim = false;
}

function daySheet(date) {
  const d = toDate(date);
  if (!ready()) return {title: shortDate(date), body: ''};
  const f = day(date);
  const du = S.mode === 'teacher' ? M.duty.get(date) : null;
  const facts = [f.work.length ? `일정 ${f.work.length}건` : '', f.busy ? topShare(f.busy) : '', S.grade ? `${S.grade}학년 기준` : ''].filter(Boolean).join(' · ');
  let body = `<div class="dayhead">${flowerSVG(f, {detail: true, anim: S.sheet.anim})}`
    + `<p class="date">${d.getMonth() + 1}월 ${d.getDate()}일<small>${WD[d.getDay()]}요일</small></p>`
    + `<p class="stage">${f.stage}${facts ? ` <span>· ${facts}</span>` : ''}</p></div>`;
  body += `<div class="card" style="margin-top:14px">${dayList(f)}</div>`;
  if (du && (du.pray?.name || du.night)) {
    body += `<div class="chips" style="justify-content:flex-start;margin-top:12px">`
      + (du.pray?.name ? `<span class="chip">기도 <b>${esc(du.pray.name)}</b>${du.pray.bible ? ` · ${esc(du.pray.bible)}` : ''}</span>` : '')
      + (du.night ? `<span class="chip">야자 감독 <b>${esc(du.night)}</b></span>` : '') + '</div>';
  }
  body += `<div class="daynav"><button class="btn" data-day="${addDays(date, -1)}">‹ ${md(addDays(date, -1))}</button>`
    + (date !== S.today ? `<button class="btn" data-day="${S.today}">오늘</button>` : '')
    + `<button class="btn" data-day="${addDays(date, 1)}">${md(addDays(date, 1))} ›</button></div>`;
  return {title: date === S.today ? '오늘' : relDay(date), body};
}

function hl(s) {
  if (!S.q) return esc(s);
  const q = S.q.toLowerCase(), lo = s.toLowerCase();
  let out = '', i = 0, j;
  while ((j = lo.indexOf(q, i)) >= 0) { out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>'; i = j + q.length; }
  return out + esc(s.slice(i));
}

function searchSheet() {
  return `<label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>`
    + `<span class="sr">일정 찾기</span><input id="q" type="search" placeholder="예: 부장회의, 모의고사, 교무부" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search"></label>`
    + `<div id="hits">${hitsHTML()}</div>`;
}

function hitsHTML() {
  if (!S.q) return `<p class="hint">일정 이름이나 부서로 찾습니다.${S.grade ? ` 지금은 ${S.grade}학년 일정만 찾습니다.` : ''}</p>`;
  if (!ready()) return '<p class="hint">시트를 받은 뒤에 찾을 수 있습니다.</p>';
  const q = S.q.toLowerCase(), hits = [];
  for (const d of M.dates) for (const it of itemsOn(d)) if (it.raw.toLowerCase().includes(q)) hits.push(it);
  if (!hits.length) return `<p class="hint">‘${esc(S.q)}’이(가) 들어간 일정이 없습니다.</p>`;
  const list = hits.slice(0, 100).map(it => evHTML(it, {go: true, date: true, hl: true, ruler: false})).join('');
  return `<p class="hint" style="margin-bottom:8px">${hits.length}건${hits.length > 100 ? ' 중 100건' : ''}</p><div class="card"><ul class="evs">${list}</ul></div>`;
}

function moreSheet() {
  const studentUrl = location.origin + location.pathname + '?for=student';
  let h = `<div class="opt" role="group" aria-label="보기"><button data-action="mode" data-v="teacher" aria-pressed="${S.mode === 'teacher'}">교사용</button>`
    + `<button data-action="mode" data-v="student" aria-pressed="${S.mode === 'student'}">학생용</button></div>`
    + `<p class="hint">${S.mode === 'student' ? '학생용은 ‘(학생용)연중행사계획’ 시트로 꽃을 피웁니다.' : '교사용은 연중행사계획에 기도·감독·공지를 더해 보여 줍니다.'} 학생에게는 학생용 주소를 보내 주세요.</p>`
    + `<div class="btns"><button class="btn" data-action="copy" data-url="${esc(studentUrl)}">학생용 주소 복사</button></div>`;

  if (ready()) {
    const ex = (busy, n, label, sub) => {
      const work = Array.from({length: n}, (_, i) => ({w: 1 + (i % 3) * .4, dept: [...M.color.keys()][i % Math.max(1, M.color.size)] || ''}));
      return `<div class="explain">${flowerSVG({date: label, work, memos: [], fronts: [], busy, periods: []}, {label: false, detail: true})}<span><b>${label}</b><span>${sub}</span></span></div>`;
    };
    h += sec('꽃 읽는 법', '', `<div class="card">`
      + `<div class="explain">${flowerSVG({date: 'rest', work: [], memos: [{}], fronts: [], busy: 0, known: true}, {label: false})}<span><b>쉼</b><span>할 일이 적히지 않은 날. 부서 없이 적힌 공휴일 이름은 메모로 붙습니다.</span></span></div>`
      + ex(20, 3, '봉오리', '올해 수업일 중 하위 30%')
      + ex(55, 5, '피는 중', '30–65%')
      + ex(80, 7, '활짝', '65–90%')
      + ex(95, 9, '만개', '가장 바쁜 10%. 꽃잎이 두 겹')
      + `</div><p class="hint">꽃잎 하나가 일정 하나, 색은 부서입니다. 꽃잎 길이는 그 일정이 한 해에 얼마나 드문지로 정합니다. 매주 있는 회의는 짧고, 한 번뿐인 일정은 깁니다. 일정 이름의 뜻은 읽지 않습니다.</p>`);
  }

  h += sec('자료', ready() ? `일정 ${M.total}건` : '', `<div class="card"><ul class="srcs">${NEED[S.mode].map(k => {
    const st = S.src[k] || {};
    let s, bad = false;
    if (st.table) s = `${st.cached ? '저장본 ' : ''}${clock(st.at)} · ${st.table.rows.length}행${st.error ? ' · 연결 안 됨' : ''}`;
    else if (st.error) { s = esc(st.error); bad = true; }
    else s = S.loading ? '받는 중' : '아직 없음';
    if (st.parseError) { s += ' · 읽는 중 오류'; bad = true; }
    return `<li><b>${esc(SRC[k].label)}</b><small${bad ? ' class="bad"' : ''}>${s}</small></li>`;
  }).join('')}</ul></div>`
    + `<div class="btns"><button class="btn solid" data-action="refresh">다시 받기</button><a class="btn" href="${SHEET_URL}" target="_blank" rel="noopener">원본 시트</a><button class="btn" data-action="forget">저장본 지우기</button></div>`
    + `<p class="hint">‘2026학년도 학사일정’ 구글 시트를 그대로 읽습니다. 시트를 고치면 여기도 바뀝니다.</p>`);
  return h;
}

/* 기도 순서와 말씀·찬송: 기도순서에 적힌 본문을 성경 말씀·찬송가 가사 시트에서 찾아 온다 */
const hymnLabel = h => (h ? (/[장찬]/.test(h) ? h : `찬송 ${h}장`) : '');

function wordSheet() {
  const rows = [];
  for (let i = 0; i < 21 && rows.length < 8; i++) {
    const d = addDays(S.today, i), p = M.duty.get(d)?.pray;
    if (p && p.name) rows.push(`<li class="ev" style="grid-template-columns:1fr"><span><span class="dp">${relDay(d)} · ${shortDate(d)}</span><span class="tx">${esc(p.name)}</span>`
      + `${p.bible || p.hymn ? `<span class="tg">${[p.bible, hymnLabel(p.hymn)].filter(Boolean).map(x => `<i>${esc(x)}</i>`).join('')}</span>` : ''}</span></li>`);
  }
  let h = `<div class="card"><ul class="evs">${rows.join('') || '<li class="empty">앞으로 3주 안에 순서가 없습니다.</li>'}</ul></div>`;
  const p = M.duty.get(S.today)?.pray;
  const w = S.word;
  if (p && (p.bible || p.hymn)) {
    if (!w) h += `<div class="btns"><button class="btn solid" data-action="read-word">오늘 말씀·찬송 펼치기</button></div>`;
    else {
      if (p.bible) h += sec(`말씀 · ${esc(p.bible)}`, '', `<div class="card verse" style="padding:16px">${
        w.verses == null ? '<p>불러오는 중…</p>' : w.verses.length ? w.verses.map(v => `<p><sup>${esc(v.n)}</sup>${esc(v.t)}</p>`).join('')
          : '<p>본문을 찾지 못했습니다. 성경 칸을 ‘시 23:1-6’처럼 적으면 찾아옵니다.</p>'}</div>`);
      if (p.hymn) h += sec(esc(hymnLabel(p.hymn)), '', `<div class="card verse" style="padding:16px">${
        w.lyrics == null ? '<p>불러오는 중…</p>' : w.lyrics ? w.lyrics.split(/\s*(?=\(\d+\))/).map(v => `<p>${esc(v.trim())}</p>`).join('') : '<p>가사를 찾지 못했습니다.</p>'}</div>`);
    }
  }
  return h;
}

function parseRef(t) {
  const m = String(t || '').match(/^\s*([가-힣]+)\s*(\d+)\s*(?:[:：]|장)\s*(\d+)\s*절?\s*(?:[-~–]\s*(\d+)\s*절?)?/);
  if (!m) return null;
  const from = +m[3];
  return {book: m[1], ch: +m[2], from, to: Math.min(Math.max(m[4] ? +m[4] : from, from), from + 80)};
}

async function readWord() {
  const p = M.duty.get(S.today)?.pray;
  if (!p) return;
  const w = S.word = {verses: p.bible ? null : [], lyrics: p.hymn ? null : ''};
  paintSheet();
  const jobs = [];
  const r = parseRef(p.bible);
  if (p.bible && !r) w.verses = [];
  if (r) {
    jobs.push(gviz('성경 말씀', `select C, D, E where (A = '${r.book}' or B = '${r.book}') and C = ${r.ch} and D >= ${r.from} and D <= ${r.to} order by D`)
      .then(t => { w.verses = t.rows.map(x => ({n: cText(x.c[1]), t: cText(x.c[2])})).filter(x => x.t); })
      .catch(() => { w.verses = []; }));
  }
  const hn = (String(p.hymn || '').match(/\d{1,3}/) || [])[0];
  if (p.hymn && !hn) w.lyrics = '';
  if (hn) {
    jobs.push(gviz('찬송가 가사', `select A, B where A = ${hn}`)
      .catch(() => gviz('찬송가 가사', `select A, B where A = '${hn}'`))
      .then(t => { w.lyrics = cText(t.rows[0]?.c?.[1]); })
      .catch(() => { w.lyrics = ''; }));
  }
  await Promise.all(jobs);
  if (S.word === w && S.sheet && S.sheet.kind === 'word') paintSheet();
}

/* ── 꽃잎 ↔ 목록 ───────────────────────────────────── */
let litTimer = 0;
function light(i, scroll) {
  const hero = $('#hero');
  if (!hero) return;
  clearTimeout(litTimer);
  hero.querySelectorAll('.pt').forEach(p => { p.classList.toggle('dim', i != null && p.dataset.ev !== String(i)); p.classList.toggle('hot', p.dataset.ev === String(i)); });
  document.querySelectorAll('#main .ev[data-ev]').forEach(r => r.classList.toggle('lit', r.dataset.ev === String(i)));
  const row = document.querySelector(`#main .ev[data-ev="${i}"]`);
  if (scroll && row) row.scrollIntoView({block: 'center', behavior: reduced() ? 'auto' : 'smooth'});
  if (i != null) litTimer = setTimeout(() => light(null), 2600);
}

/* ── 조작 ───────────────────────────────────────────── */
document.addEventListener('click', e => {
  const pt = e.target.closest('#hero .pt');
  if (pt) { light(pt.dataset.ev, true); return; }
  const row = e.target.closest('#main .ev[data-ev]');
  if (row) { light(row.dataset.ev, false); return; }
  const gr = e.target.closest('[data-grade]');
  if (gr) {
    const g = +gr.dataset.grade;
    if (g !== S.grade) { S.grade = g; savePrefs(); render(); if (S.sheet) paintSheet(); }
    return;
  }
  const mo = e.target.closest('[data-month]');
  if (mo) { S.month = mo.dataset.month; S.yearView = false; renderGarden(); $('#garden').scrollIntoView({block: 'start', behavior: reduced() ? 'auto' : 'smooth'}); return; }
  const dy = e.target.closest('[data-day]');
  if (dy) { if (S.sheet && S.sheet.kind === 'day') { S.sheet = {kind: 'day', arg: dy.dataset.day, anim: true}; paintSheet(); $('#sheet-body').scrollTop = 0; } else openSheet('day', dy.dataset.day); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  switch (a.dataset.action) {
    case 'close': closeSheet(); break;
    case 'refresh': load(); break;
    case 'search': case 'more': case 'word': openSheet(a.dataset.action); break;
    case 'read-word': readWord(); break;
    case 'prev': S.month = shiftMonth(S.month, -1); renderGarden(); break;
    case 'next': S.month = shiftMonth(S.month, 1); renderGarden(); break;
    case 'view-month': S.yearView = false; renderGarden(); break;
    case 'view-year': S.yearView = true; renderGarden(); break;
    case 'mode': {
      const v = a.dataset.v;
      if (v === S.mode) break;
      S.mode = v; S.month = null;
      savePrefs();
      primeFromCache(); rebuild(); render(); paintSheet(); load();
      break;
    }
    case 'copy': {
      const url = a.dataset.url;
      const done = () => { a.textContent = '복사했습니다'; setTimeout(() => { a.textContent = '학생용 주소 복사'; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('학생용 주소', url));
      else prompt('학생용 주소', url);
      break;
    }
    case 'forget':
      Object.keys(SRC).forEach(k => store.del(CACHE + k));
      a.textContent = '지웠습니다';
      break;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
});

let qTimer = 0;
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value.trim();
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { const h = $('#hits'); if (h) h.innerHTML = hitsHTML(); }, 120);
});

addEventListener('popstate', () => { if (S.sheet) hideSheet(); });
addEventListener('scroll', () => $('#top').classList.toggle('lifted', scrollY > 4), {passive: true});

// 정원은 옆으로 밀어 달을 넘긴다
let touch = null;
document.addEventListener('touchstart', e => {
  touch = e.target.closest('#garden-grid') ? {x: e.touches[0].clientX, y: e.touches[0].clientY} : null;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const [lo, hi] = monthBounds();
  const next = shiftMonth(S.month, dx < 0 ? 1 : -1);
  if (next < lo || next > hi) return;
  S.month = next;
  renderGarden();
}, {passive: true});

// 판을 아래로 끌어내리면 닫힌다
let drag = null;
$('#sheet').addEventListener('touchstart', e => {
  if (e.target.closest('.sheet-body') && $('#sheet-body').scrollTop > 0) { drag = null; return; }
  drag = {y: e.touches[0].clientY, dy: 0};
}, {passive: true});
$('#sheet').addEventListener('touchmove', e => {
  if (!drag) return;
  drag.dy = Math.max(0, e.touches[0].clientY - drag.y);
  if (drag.dy > 0) { $('#sheet').style.transition = 'none'; $('#sheet').style.transform = `translateY(${drag.dy}px)`; }
}, {passive: true});
$('#sheet').addEventListener('touchend', () => {
  if (!drag) return;
  const el = $('#sheet');
  el.style.transition = ''; el.style.transform = '';
  if (drag.dy > 110) closeSheet();
  drag = null;
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - S.lastLoad > STALE) load();
  else if (todayKey() !== S.today) render();
});
setInterval(() => {
  if (document.visibilityState !== 'visible' || S.sheet) return;
  if (Date.now() - S.lastLoad > STALE) load();
  else if (todayKey() !== S.today) render();
}, 60000);
