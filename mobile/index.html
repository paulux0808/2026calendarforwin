<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>꽃달력</title>
<meta name="description" content="보성여고 학사일정. 하루는 꽃 한 송이, 일정은 꽃잎 한 장.">
<meta name="theme-color" content="#E6F4FF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#152331" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="꽃달력">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- 글꼴은 화면을 막지 않게 받는다: 먼저 시스템 글꼴로 그리고, 받는 대로 바꾼다 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Nanum+Gothic:wght@400;700;800&display=swap"></noscript>
<style>
/* ── 토큰 ───────────────────────────────────────────── */
:root{
  --bg:#E6F4FF; --surface:#FFFFFF; --sunk:#F2EDE8; --hair:#ECE5DE;
  --ink:#2A211D; --ink-2:#5E534D; --ink-3:#8F857F;
  --line:#2A211D;
  --link:#1C7ED6; --sun:#E03131; --sat:#1971C2;
  --yellow:#FFD43B; --note:#FFE066;
  --sans:"Nanum Gothic",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --display:"Jua","Nanum Gothic",-apple-system,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#152331; --surface:#213243; --sunk:#2A3D50; --hair:#304559;
    --ink:#F3EEE8; --ink-2:#C4BAB2; --ink-3:#8FA0AE;
    --line:#060A0F; --link:#74C0FC; --sun:#FF8787; --sat:#74C0FC;
    color-scheme:dark;
  }
}

/* ── 바탕 ───────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.locked{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--link)}
:focus-visible{outline:3px solid var(--link);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}

/* ── 꽃 ─────────────────────────────────────────────── */
.fl{display:block;overflow:visible}
.fl .pt{transform:rotate(var(--a))}
.fl .spark{transform:translate(var(--x),var(--y))}
.fl.anim .pt{animation:boing .65s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--k) * 70ms + 120ms)}
.fl.anim .ctr{animation:pop .45s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--n) * 70ms + 160ms)}
.fl.anim .leaf{animation:pop .5s .1s cubic-bezier(.34,1.56,.64,1) both}
.fl.anim .spark{animation:twinkle 2.4s ease-in-out infinite,sparkin .5s both;animation-delay:var(--d),calc(var(--n) * 70ms + 300ms)}
.fl:not(.anim) .spark.live{animation:twinkle 2.4s ease-in-out infinite;animation-delay:var(--d)}
.fl .pt.dim{opacity:.25;transition:opacity .2s}
@keyframes boing{from{transform:rotate(var(--a)) scale(0)}to{transform:rotate(var(--a)) scale(1)}}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes twinkle{0%,100%{transform:translate(var(--x),var(--y)) scale(1)}50%{transform:translate(var(--x),var(--y)) scale(.55) rotate(20deg)}}
@keyframes sparkin{from{opacity:0}to{opacity:1}}

/* ── 머리 ───────────────────────────────────────────── */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top);background:var(--bg);transition:box-shadow .15s}
.top.lifted{box-shadow:0 2.5px 0 var(--line)}
.top .wrap{height:60px;display:flex;align-items:center;gap:6px}
.logo{flex:1;min-width:0;margin:0;display:flex;align-items:center;gap:6px;font:400 24px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
.logo a{display:flex;align-items:center;gap:6px;color:inherit;text-decoration:none}
.logo svg{width:30px;height:30px;flex:none}
.gsel{position:relative;display:inline-flex;flex:none}
.gsel select{appearance:none;-webkit-appearance:none;max-width:132px;text-overflow:ellipsis;height:38px;padding:0 32px 0 14px;border:2.5px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:2px 2px 0 var(--line);font-weight:800;font-size:14px;color:var(--ink)}
.gsel::after{content:"";position:absolute;right:14px;top:50%;width:7px;height:7px;border-right:2.5px solid var(--ink);border-bottom:2.5px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.gsel.on select{background:var(--c,var(--yellow));color:#2A211D}
.gsel.on::after{border-color:#2A211D}
.ib{position:relative;width:40px;height:40px;border:0;background:none;border-radius:12px;display:grid;place-items:center;color:var(--ink);flex:none}
.ib:active{background:var(--sunk)}
.ib .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--sun);border:2px solid var(--line)}
.ib:disabled{opacity:.3}

/* ── 오늘의 꽃 ──────────────────────────────────────── */
.hero{text-align:center;padding:6px 0 4px}
.hero .fl{width:min(62vw,244px);height:auto;margin:0 auto}
.flw{position:relative}
.flw .pt{cursor:pointer}
.fl .lb text{font-family:var(--display);fill:#2A211D;stroke:#fff;stroke-width:4.5px;stroke-linejoin:round;paint-order:stroke;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.fl.anim .lb{animation:sparkin .3s both;animation-delay:calc(var(--k) * 70ms + 480ms)}
.fl .lb.dim{opacity:.25}
.bubble{position:absolute;z-index:6;width:max-content;max-width:min(300px,calc(100% - 8px));padding:10px 14px 11px;border-radius:16px;background:var(--surface);border:2.5px solid var(--line);box-shadow:3px 3px 0 var(--line);text-align:left;animation:pop .28s cubic-bezier(.34,1.56,.64,1) both;transform-origin:var(--tx) 0}
.bubble.up{transform-origin:var(--tx) 100%}
.bubble::before{content:"";position:absolute;left:calc(var(--tx) - 8px);top:-10px;width:14px;height:14px;background:var(--surface);border-left:2.5px solid var(--line);border-top:2.5px solid var(--line);border-top-left-radius:3px;transform:rotate(45deg)}
.bubble.up::before{top:auto;bottom:-10px;transform:rotate(225deg)}
.bubble .bd{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.bubble .bd i{width:13px;height:13px;border-radius:50%;background:var(--c);border:2px solid var(--line);flex:none}
.bubble b{display:block;margin-top:3px;font-size:16px;line-height:1.4}
.bubble .tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.bubble .tg i{font-style:normal;font-size:11.5px;font-weight:800;line-height:19px;padding:0 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2)}
.date{margin:4px 0 0;font:400 40px/1.1 var(--display);letter-spacing:-.01em}
.date small{font-size:22px;color:var(--ink-2);margin-left:8px}
.stage{margin:10px 0 0;display:flex;justify-content:center;align-items:center;gap:8px;font-size:16px;font-weight:800}
.badge{display:inline-flex;align-items:center;height:30px;padding:0 13px;border-radius:999px;background:var(--c);color:#2A211D;border:2.5px solid var(--line);box-shadow:2px 2px 0 var(--line);font:400 17px/1 var(--display)}
.stage-sub{margin:6px 0 0;font-size:13.5px;color:var(--ink-2)}
.chips{display:flex;justify-content:center;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:2px solid var(--line);background:var(--surface);box-shadow:2px 2px 0 var(--line);font-size:13.5px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:800}
button.chip:active{transform:translate(2px,2px);box-shadow:none}

.note{display:flex;gap:10px;align-items:baseline;margin-top:20px;padding:13px 16px;border-radius:16px;background:var(--note);color:#2A211D;border:2.5px solid var(--line);box-shadow:3px 3px 0 var(--line);font-size:14px}
.note + .note{margin-top:10px}
.note span{flex:1;font-weight:800}
.note small{white-space:nowrap;opacity:.7;font-weight:700}

/* ── 조각 ───────────────────────────────────────────── */
.sec{margin-top:32px}
.sec-h{display:flex;align-items:baseline;gap:8px;margin:0 4px 12px;font:400 22px/1.2 var(--display)}
.sec-h small{font:400 13px var(--sans);color:var(--ink-3)}
.card{background:var(--surface);border:2.5px solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--line);overflow:hidden}
.empty{padding:18px;color:var(--ink-3);font-size:14px}
.hint{margin:12px 4px 0;font-size:13px;color:var(--ink-2);line-height:1.65}

.evs{list-style:none;margin:0;padding:0}
.ev{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 16px;border-top:2px solid var(--hair);transition:background .25s}
.evs > .ev:first-child{border-top:0}
.ev .gl{width:26px;height:26px}
.ev .no{font:400 12px var(--display);color:var(--ink-3);margin-right:5px}
.ev .dp{display:block;font-size:12px;font-weight:800;color:var(--ink-3);margin-bottom:1px}
.ev .tx{font-size:15px;font-weight:700}
.ev .tg{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:1px}
.ev .tg i{font-style:normal;font-size:11.5px;font-weight:800;line-height:19px;padding:0 8px;border-radius:999px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.ev .sub{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ev.memo .tx{color:var(--sun)}
.ev.lit{background:var(--note);color:#2A211D}
.ev.lit .dp,.ev.lit .sub{color:#5E534D}
.ev[data-ev]{cursor:pointer}
.ruler{display:grid;grid-template-columns:repeat(7,6px);gap:2px;align-items:end}
.ruler i{height:16px;border-radius:3px;background:var(--sunk)}
.ruler i.on{background:var(--ink)}
.ev.lit .ruler i.on{background:#2A211D}
.sublabel{margin:0;padding:12px 16px 0;font-size:12px;font-weight:800;color:var(--ink-3);border-top:2px solid var(--hair)}
.sublabel + .evs .ev:first-child{border-top:0}

/* 앞으로 7일 */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 6px;border:0;background:none;border-radius:16px}
.wd .fl{width:42px;height:42px}
.wd span{font-size:12px;font-weight:700;color:var(--ink-3)}
.wd b{font:400 17px var(--display)}
.wd.sun b,.wd.sun span{color:var(--sun)}.wd.sat b,.wd.sat span{color:var(--sat)}
.wd.today{background:var(--note);box-shadow:inset 0 0 0 2.5px var(--line)}
.wd.today span,.wd.today b{color:#2A211D}
.wd:active{background:var(--sunk)}

/* 곧 만개 */
.peaks{list-style:none;margin:0;padding:0}
.peak{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 16px 10px 10px;border:0;border-top:2px solid var(--hair);background:none;text-align:left}
.peaks li:first-child .peak{border-top:0}
.peak .fl{width:56px;height:56px}
.peak .t{font:400 19px/1.25 var(--display)}
.peak .t small{display:block;font:400 12.5px/1.4 var(--sans);color:var(--ink-3);margin-top:2px}
.dday{font:400 15px var(--display);padding:4px 10px;border-radius:999px;background:var(--yellow);color:#2A211D;border:2px solid var(--line)}

/* 정원 */
.gh{display:flex;align-items:center;gap:4px;margin:0 0 12px 4px}
.gh h2{flex:1;margin:0;font:400 26px/1 var(--display)}
.gh h2 small{font:400 14px var(--sans);color:var(--ink-3);margin-left:6px}
.tog{display:inline-flex;border:2px solid var(--line);border-radius:999px;padding:2px;background:var(--surface);margin-right:4px}
.tog button{border:0;background:none;height:28px;padding:0 11px;border-radius:999px;font-size:12.5px;font-weight:800;color:var(--ink-2)}
.tog button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.garden{padding:10px 6px 8px;touch-action:pan-y}
.dow,.mgrid{display:grid;grid-template-columns:repeat(7,1fr)}
.dow span{text-align:center;font-size:12px;font-weight:800;color:var(--ink-3);padding-bottom:4px}
.dow span:first-child{color:var(--sun)}.dow span:last-child{color:var(--sat)}
.cell{display:flex;flex-direction:column;align-items:center;min-height:64px;padding:4px 0 2px;border:0;background:none;border-radius:14px}
.cell .n{font:400 13px/20px var(--display);min-width:24px;border-radius:10px;color:var(--ink-2)}
.cell .fl{width:40px;height:40px}
.cell.sun .n{color:var(--sun)}.cell.sat .n{color:var(--sat)}
.cell.today .n{background:var(--ink);color:var(--surface)}
.cell.out{visibility:hidden}
.cell.past .fl{opacity:.5}
.cell:active{background:var(--sunk)}
.year{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 10px;padding:14px 12px}
.ym{border:0;background:none;padding:0;text-align:left}
.ym h3{margin:0 0 5px;font:400 17px var(--display)}
.ym h3 small{font:400 11px var(--sans);color:var(--ink-3);margin-left:4px}
.ydots{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.ydots i{aspect-ratio:1;display:grid;place-items:center}
.ydots i::before{content:"";width:var(--s,3px);height:var(--s,3px);border-radius:50%;background:var(--c,var(--hair))}
.ydots i.big::before{box-shadow:0 0 0 1.2px var(--line)}
.ydots i.today{box-shadow:inset 0 0 0 1.8px var(--ink);border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:0 16px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:50%;background:var(--c);border:2px solid var(--line)}

.foot{margin:36px 4px 0;font-size:12.5px;color:var(--ink-2);line-height:1.7}
.foot p{margin:0 0 8px}
.foot button{border:0;background:none;padding:0;text-decoration:underline;font-size:inherit;color:inherit}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:14px;border:2.5px solid var(--line);background:var(--surface);box-shadow:3px 3px 0 var(--line);font-size:14px;font-weight:800;color:var(--ink);text-decoration:none}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--line)}
.btn.solid{background:var(--yellow);color:#2A211D}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.skel{height:14px;border-radius:7px;background:var(--sunk);margin:16px;animation:pulse 1.4s ease-in-out infinite}
.skel + .skel{width:60%}
@keyframes pulse{50%{opacity:.45}}

/* ── 아래서 올라오는 판 ─────────────────────────────── */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(10,16,24,.45);opacity:0;transition:opacity .25s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-width:560px;margin:0 auto;max-height:90vh;max-height:90dvh;display:flex;flex-direction:column;background:var(--bg);border:2.5px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);outline:none}
.sheet.open{transform:none}
.scrim[hidden],.sheet[hidden]{display:none}
.grab{width:44px;height:6px;border-radius:3px;background:var(--line);opacity:.3;margin:9px auto 0;flex:none}
.sheet-top{display:flex;align-items:center;gap:8px;padding:8px 12px 6px 20px;flex:none}
.sheet-top h2{flex:1;margin:0;font:400 22px/1.2 var(--display)}
.sheet-top h2 small{font:400 13px var(--sans);color:var(--ink-3);margin-left:6px}
.x{width:36px;height:36px;border:2px solid var(--line);border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.x svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.6;fill:none;stroke-linecap:round}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
.dayhead{text-align:center;padding:0 0 4px}
.dayhead .fl{width:176px;height:auto;margin:0 auto}
.daynav{display:flex;gap:10px;margin-top:18px}
.daynav .btn{flex:1}
.search{display:flex;align-items:center;gap:8px;height:48px;padding:0 14px;border-radius:14px;background:var(--surface);border:2.5px solid var(--line);box-shadow:3px 3px 0 var(--line)}
.search .i{width:20px;height:20px;color:var(--ink-2)}
.search input{flex:1;min-width:0;height:100%;border:0;background:none;outline:none;font-size:16px}
.search input::-webkit-search-cancel-button{display:none}
mark{background:var(--yellow);color:#2A211D;border-radius:3px;padding:0 1px}
.opt{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:16px;border:2.5px solid var(--line);background:var(--surface)}
.opt button{height:40px;border:0;border-radius:12px;background:none;font-weight:800;color:var(--ink-2)}
.opt button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.srcs{list-style:none;margin:0;padding:0}
.srcs li{display:flex;gap:10px;align-items:baseline;padding:12px 16px;font-size:14px;border-top:2px solid var(--hair)}
.srcs li:first-child{border-top:0}
.srcs b{flex:1}
.srcs small{color:var(--ink-3);text-align:right;font-size:12.5px}
.srcs small.bad{color:var(--sun)}
.verse p{margin:0 0 6px;font-size:15px}
.verse sup{font-size:11px;color:var(--ink-3);margin-right:4px}
.explain{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;padding:12px 16px;border-top:2px solid var(--hair)}
.explain:first-child{border-top:0}
.explain .fl{width:64px;height:64px}
.explain b{display:block;font:400 18px var(--display)}
.explain span span{color:var(--ink-2);font-size:13px}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs></defs></svg>

<header class="top" id="top">
  <div class="wrap">
    <h1 class="logo"><a href="../" title="원래 학사일정으로 돌아가기"><svg class="fl" viewBox="-112 -112 224 224" aria-hidden="true" id="logo"></svg>꽃달력</a></h1>
    <label class="gsel" id="gsel"><span class="sr">부서</span>
      <select id="dept"><option value="">전체 부서</option></select>
    </label>
    <button class="ib" data-action="search" aria-label="일정 찾기"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg></button>
    <button class="ib" data-action="more" aria-label="설정과 자료" id="more-btn"><svg class="i" viewBox="0 0 24 24"><circle cx="5.5" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.5" fill="currentColor" stroke="none"/></svg></button>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="scrim" id="scrim" hidden data-action="close"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" tabindex="-1" hidden>
  <div class="grab" aria-hidden="true"></div>
  <div class="sheet-top"><h2 id="sheet-title"></h2><button class="x" data-action="close" aria-label="닫기"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3 3 13"/></svg></button></div>
  <div class="sheet-body" id="sheet-body"></div>
</section>

<script>
'use strict';

// 일정 이름의 뜻은 읽지 않는다. 꽃은 시트의 수와 모양에서만 나온다.

};
const PERIOD_SHARE = 0.15;  // 교시 하나를 차지할 때마다 더하는 무게
const CHAIN_SHARE = 0.25;   // 같은 일정이 수업일마다 연달아 나올 때 하루마다 더하는 무게 (5일까지)

const FRONT_SHARE = 0.5;    // "~10/2" 처럼 기간이 적힌 일정이 둘째 날부터 남기는 무게
const PEAK = 90;            // 이 백분위부터 '만개'
// 부서마다 꽃잎 색 [꽃잎, 그늘]. 자주 나오는 부서부터 차례로 나눠 준다.

];

/* ── 유틸 ───────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const ymd = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
const toDate = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const keyOf = dt => ymd(dt.getFullYear(), dt.getMonth() + 1, dt.getDate());
const addDays = (k, n) => { const d = toDate(k); d.setDate(d.getDate() + n); return keyOf(d); };
const diffDays = (a, b) => Math.round((toDate(b) - toDate(a)) / 86400000);
const todayKey = () => keyOf(new Date());
const dow = k => toDate(k).getDay();
const md = k => { const d = toDate(k); return `${d.getMonth() + 1}/${d.getDate()}`; };
const shortDate = k => { const d = toDate(k); return `${d.getMonth() + 1}.${d.getDate()} (${WD[d.getDay()]})`; };
const clock = t => { const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const monthOf = k => k.slice(0, 7);
const shiftMonth = (mk, n) => { const [y, m] = mk.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const schoolYear = () => { const d = new Date(); return d.getMonth() >= 2 ? d.getFullYear() : d.getFullYear() - 1; };
const reduced = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const valid = (y, m, d) => {
  if (!(y > 1900 && m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  return new Date(y, m - 1, d).getMonth() === m - 1 ? ymd(y, m, d) : null;
};
const relDay = k => { const n = diffDays(S.today, k); return n === 0 ? '오늘' : n === 1 ? '내일' : n === -1 ? '어제' : `${WD[dow(k)]}요일`; };
const hash = s => { let h = 2166136261; for (const c of String(s)) { h ^= c.codePointAt(0); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967296; };
const n1 = x => Math.round(x * 10) / 10;
const store = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};
const CACHE = 'kkot:cache:';
const PREFS = 'kkot:prefs';

/* ── 상태 ───────────────────────────────────────────── */
const prefs = store.get(PREFS) || {};

  mode: forParam === 'student' || forParam === 'teacher' ? forParam : (prefs.mode === 'student' ? 'student' : 'teacher'),

  src: {}, loading: false, lastLoad: 0, today: todayKey(),
  month: null, yearView: false, sheet: null, q: '', word: null, bloomed: '',

/* ── 시트 읽기 (gviz JSONP) ─────────────────────────── */
let seq = 0;
function gviz(sheet, tq) {
  return new Promise((resolve, reject) => {
    const cb = `__kkot${++seq}_${Date.now().toString(36)}`;
    const el = document.createElement('script');
    let done = false;
    const finish = (err, val) => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      window[cb] = () => {};
      el.remove();
      err ? reject(err) : resolve(val);
    };
    const timer = setTimeout(() => finish(new Error('응답이 없습니다')), TIMEOUT);
    window[cb] = res => {
      if (!res || res.status === 'error') {
        const e = res && res.errors && res.errors[0];
        const msg = e && (e.detailed_message || e.message || e.reason);
        finish(new Error(msg ? String(msg).replace(/<[^>]*>/g, '') : '시트가 오류를 돌려주었습니다'));
        return;
      }
      const t = res.table;
      if (!t || !Array.isArray(t.rows) || !Array.isArray(t.cols)) { finish(new Error('표 형식이 아닙니다')); return; }
      finish(null, t);
    };
    el.onerror = () => finish(new Error('연결하지 못했습니다'));
    // 비공개 시트는 로그인 페이지를 돌려줘 콜백이 불리지 않는다
    el.onload = () => setTimeout(() => finish(new Error('시트를 읽을 수 없습니다. 공유 설정을 확인하세요')), 50);
    el.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json;responseHandler:${cb}`
      + `&sheet=${encodeURIComponent(sheet)}` + (tq ? `&tq=${encodeURIComponent(tq)}` : '') + `&_=${Date.now()}`;
    document.head.appendChild(el);
  });
}

async function fetchSource(k) {
  const st = S.src[k] || (S.src[k] = {});
  try {
    const t = await gviz(SRC[k].sheet);
    Object.assign(st, {table: t, at: Date.now(), cached: false, error: null});
    store.set(CACHE + k, {at: st.at, table: t});
  } catch (e) {
    st.error = e.message || String(e);
  }
}

function primeFromCache() {
  for (const k of NEED[S.mode]) {
    const st = S.src[k] || (S.src[k] = {});
    if (st.table) continue;
    const c = store.get(CACHE + k);
    if (c && c.table && Array.isArray(c.table.rows)) Object.assign(st, {table: c.table, at: c.at, cached: true});
  }
}

async function load() {
  if (S.loading) return;
  S.loading = true;
  paintTop();
  await Promise.all(NEED[S.mode].map(fetchSource));
  S.loading = false;
  S.lastLoad = Date.now();
  rebuild();
  render();
  if (S.sheet) paintSheet();
}

/* ── 셀 해석 ───────────────────────────────────────── */
function cText(c) {
  if (!c) return '';
  if (c.f != null && c.f !== '') return String(c.f).trim();
  return c.v == null ? '' : String(c.v).trim();
}

// MM-DD 로만 적힌 날짜의 연도: 12월 → 1월로 넘어가면 해를 올린다
function yearCursor(start) {
  let year = start, last = 0;
  return {
    year(m) { if (last && m < last && last - m >= 6) year++; last = m; return year; },
    seen(m, y) { year = y; last = m; },
  };
}

function cellDate(c, cur) {
  if (!c) return null;
  if (typeof c.v === 'string') {
    const g = c.v.match(/^Date\((\d+),\s*(\d+),\s*(\d+)/);
    if (g) { if (cur) cur.seen(+g[2] + 1, +g[1]); return valid(+g[1], +g[2] + 1, +g[3]); }
  }
  const t = cText(c);
  let m = t.match(/(\d{4})\s*[.\-\/년]\s*(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})/);
  if (m) { if (cur) cur.seen(+m[2], +m[1]); return valid(+m[1], +m[2], +m[3]); }
  m = t.match(/^(\d{1,2})\s*[.\-\/월]\s*(\d{1,2})\s*일?$/);
  if (m && cur) return valid(cur.year(+m[1]), +m[1], +m[2]);
  return null;
}

// 머리글 줄을 찾아 열 위치를 정한다. 못 찾으면 시트의 현재 배치를 쓴다.
function columns(table, fallback) {
  const names = Object.keys(fallback);
  const out = {...fallback};
  for (const r of table.rows.slice(0, 8)) {
    const t = (r.c || []).map(cText);
    if (names.filter(n => t.includes(n)).length >= Math.min(2, names.length)) {
      names.forEach(n => { const i = t.indexOf(n); if (i >= 0) out[n] = i; });
      return out;
    }
  }
  const labels = (table.cols || []).map(c => String(c.label || '').trim().split(/\s+/).pop());
  names.forEach(n => { const i = labels.indexOf(n); if (i >= 0) out[n] = i; });
  return out;
}

/* ── 일정 한 줄 해석 ───────────────────────────────── */
// "[교무부]개학식(②③,1)" → 부서 교무부, 2·3학년, 1교시
function splitCell(text) {
  const parts = [];
  for (const line of String(text || '').replace(/\r/g, '').split('\n')) {
    for (const piece of line.split(/\s+(?=\[[^\[\]]{1,20}\])/)) {
      const s = piece.trim();
      if (!s) continue;
      if (s.startsWith('[') || !parts.length) parts.push(s);
      else parts[parts.length - 1] += ' ' + s;
    }
  }
  return parts;
}

// 적혀 있는 학년들 (①②③ 또는 "2, 3학년")
function markedGrades(s) {
  const set = new Set();
  for (const ch of s) if (CIRCLED[ch]) set.add(CIRCLED[ch]);
  if (!set.size) {
    for (const m of s.matchAll(/([1-3](?:\s*[,·~\-]\s*[1-3])*)\s*학년(?!부)/g)) {
      const nums = m[1].match(/[1-3]/g).map(Number);
      if (/[~\-]/.test(m[1]) && nums.length === 2) for (let k = Math.min(...nums); k <= Math.max(...nums); k++) set.add(k);
      else nums.forEach(n => set.add(n));
    }
  }
  return [...set].sort();
}

const PERIOD_TOKEN = /^(\d)\s*(?:[~\-–]\s*(\d))?\s*(?:교시)?$/;
const RANGE_TOKEN = /^~\s*\d{1,2}(?:\s*[\/.]\s*\d{1,2})?\s*일?$/;

function findPeriods(s) {
  const set = new Set();
  const add = (a, b) => { a = +a; b = b ? +b : a; if (a < 1 || b > 9 || b < a) return; for (let k = a; k <= b; k++) set.add(k); };
  for (const m of s.matchAll(/(\d)\s*(?:[~\-–]\s*(\d)\s*)?교시/g)) add(m[1], m[2]);
  for (const g of s.matchAll(/\(([^()]*)\)/g)) {
    for (const tok of g[1].split(/[,，]/)) {
      const m = tok.replace(/[①②③]/g, '').trim().match(PERIOD_TOKEN);
      if (m) add(m[1], m[2]);
    }
  }
  return set.size ? [...set].sort((a, b) => a - b) : null;
}

function findEnd(s, start) {
  const [sy, sm, sd] = start.split('-').map(Number);
  let y = sy, mo, d;
  let m = s.match(/~\s*(\d{1,2})\s*[\/.]\s*(\d{1,2})/);
  if (m) {
    mo = +m[1]; d = +m[2];
    if (mo < sm && sm - mo >= 6) y++;
  } else {
    // "~13일", "(②, ~13)" 처럼 날만 적은 경우. "1~3학년", "~4시" 는 기간이 아니다.
    m = s.match(/~\s*(\d{1,2})\s*일?(?=\s*[),]|\s*$)/);
    if (!m) return null;
    mo = sm; d = +m[1];
    if (d < sd) { mo++; if (mo > 12) { mo = 1; y++; } }
  }
  const k = valid(y, mo, d);
  return k && k > start ? k : null;
}

// 학년·교시·기간만 담긴 괄호는 따로 보여 주므로 본문에서 뺀다
function cleanText(s) {
  return s.replace(/\s*\(([^()]*)\)/g, (all, inner) => {
    const toks = inner.split(/[,，]/).map(t => t.trim()).filter(Boolean);
    const rest = toks.filter(t => {
      const x = t.replace(/[①②③]/g, '').trim();
      return !(x === '' || PERIOD_TOKEN.test(x) || RANGE_TOKEN.test(x));
    });
    if (rest.length === toks.length) return all;
    return rest.length ? `(${rest.join(', ')})` : '';
  }).replace(/\s{2,}/g, ' ').trim();
}

function parseItem(src, date) {
  let s = src.trim(), dept = '', cat = '';
  let m = s.match(/^\[([^\]]{1,20})\]\s*/);
  if (m) { dept = m[1].trim(); s = s.slice(m[0].length); }
  m = s.match(/^<([^>]{1,10})>\s*/);
  if (m) { cat = m[1].trim(); s = s.slice(m[0].length); }
  const marked = markedGrades(s);
  return {
    date, dept, cat, raw: src,
    text: cleanText(s) || s,
    // 같은 일정인지 가르는 열쇠: 괄호·숫자·기호·띄어쓰기를 뺀 글자 ("1학기 중간고사 2일차" = "2학기 중간고사 1일차")
    key: s.replace(/\([^)]*\)/g, '').replace(/[\p{N}\p{P}\p{S}\s]/gu, '') || s,
    grades: marked.length && marked.length < 3 ? marked : null,
    reach: marked.length,
    periods: findPeriods(s),
    end: findEnd(s, date),
    memo: !dept,
    w: 0,
  };
}

/* ── 모델 ───────────────────────────────────────────── */
function emptyModel() {
  return {byDate: new Map(), dates: [], index: new Map(), ranged: [], scores: new Map(), depts: [], color: new Map(), duty: new Map(), notices: [], year: null, total: 0};
}

function parsePlan(t, m) {
  const h = columns(t, {'날짜': 0, '요일': 1, '일정': 2});
  for (const r of t.rows) {
    const c = r.c || [];
    const date = cellDate(c[h['날짜']]);
    if (!date) continue;
    const items = splitCell(cText(c[h['일정']])).map(s => parseItem(s, date)).filter(it => it.text);
    const list = m.byDate.get(date) || [];
    list.push(...items);
    m.byDate.set(date, list);
  }
}

const dutyOf = (m, date) => m.duty.get(date) || (m.duty.set(date, {}), m.duty.get(date));

function parsePray(t, m) {
  const h = columns(t, {'날짜': 0, '요일': 1, '이름': 2, '성경': 3, '찬송': 4});
  const cur = yearCursor(m.year || schoolYear());
  for (const r of t.rows) {
    const c = r.c || [];
    const date = cellDate(c[h['날짜']], cur);
    if (!date) continue;
    const p = {name: cText(c[h['이름']]), bible: cText(c[h['성경']]), hymn: cText(c[h['찬송']])};
    if (p.name || p.bible || p.hymn) dutyOf(m, date).pray = p;
  }
}

function parseNight(t, m) {
  const h = columns(t, {'날짜': 0, '요일': 1, '이름': 2});
  const cur = yearCursor(m.year || schoolYear());
  for (const r of t.rows) {
    const c = r.c || [];
    const date = cellDate(c[h['날짜']], cur);
    const name = cText(c[h['이름']]);
    if (date && name) dutyOf(m, date).night = name;
  }
}

function parseNotice(t, m) {
  const h = columns(t, {'게시 시작일': 0, '게시 종료일': 1, '내용': 2});
  for (const r of t.rows) {
    const c = r.c || [];
    const start = cellDate(c[h['게시 시작일']]);
    const text = cText(c[h['내용']]);
    if (!start || !text) continue;
    let end = cellDate(c[h['게시 종료일']]) || start;
    if (end < start) end = start;
    m.notices.push({start, end, text});
  }
  m.notices.sort((a, b) => a.start.localeCompare(b.start));
}

// 일정마다 무게를 매기고, 학년별로 날마다의 점수와 그 분포를 만든다
function weigh(m) {
  const keysAt = m.dates.map(d => new Set(m.byDate.get(d).filter(it => !it.memo).map(it => it.key)));
  const days = new Map();
  let workDays = 0;
  for (const keys of keysAt) {
    if (keys.size) workDays++;
    for (const k of keys) days.set(k, (days.get(k) || 0) + 1);
  }
  const ranged = [];
  m.dates.forEach((date, i) => {
    for (const it of m.byDate.get(date)) {
      if (it.memo) continue;
      // 앞뒤 수업일에 같은 일정이 몇 날 이어지는가
      let run = 1;
      for (let j = i - 1; j >= 0 && keysAt[j].has(it.key); j--) run++;
      for (let j = i + 1; j < keysAt.length && keysAt[j].has(it.key); j++) run++;
      it.w = Math.log2(1 + workDays / days.get(it.key))
        * (1 + PERIOD_SHARE * (it.periods ? it.periods.length : 0))
        * (1 + CHAIN_SHARE * (Math.min(run, 5) - 1));
      if (it.end) ranged.push(it);
    }
  });
  m.ranged = ranged;
}

// 부서 하나(''는 전체)로 거른 날마다의 점수와 그 분포. 처음 필요할 때 한 번 만든다.
function scoresFor(dp) {
  if (M.scores.has(dp)) return M.scores.get(dp);
  const map = new Map();
  for (const date of M.dates) {
    const list = M.byDate.get(date);
    let s = 0;
    for (const it of list) if (!it.memo && deptOk(it, dp)) s += it.w * (1 + REACH_SHARE * Math.max(0, it.reach - 1));
    // 부서 없는 줄만 있는 날(쉬는 날)에는 기간 일정도 지나가지 않는다
    const rest = list.length > 0 && list.every(it => it.memo);
    if (!rest) for (const it of M.ranged) if (it.date < date && it.end >= date && deptOk(it, dp)) s += FRONT_SHARE * it.w;
    map.set(date, s);
  }
  const out = {map, dist: [...map.values()].filter(v => v > 0).sort((x, y) => x - y)};
  M.scores.set(dp, out);
  return out;
}

function rebuild() {
  const m = emptyModel();
  const run = (k, fn) => {
    const st = S.src[k];
    if (!st || !st.table) return;
    try { fn(st.table, m); st.parseError = null; }
    catch (e) { st.parseError = e.message; console.error(k, e); }
  };
  run(S.mode === 'student' ? 'planS' : 'plan', parsePlan);
  m.dates = [...m.byDate.keys()].sort();
  m.dates.forEach((d, i) => m.index.set(d, i));
  m.year = m.dates.length ? toDate(m.dates[0]).getFullYear() : null;
  for (const list of m.byDate.values()) m.total += list.length;
  weigh(m);
  const counts = new Map();
  for (const list of m.byDate.values()) for (const it of list) if (it.dept) counts.set(it.dept, (counts.get(it.dept) || 0) + 1);
  m.depts = [...counts].sort((x, y) => y[1] - x[1] || x[0].localeCompare(y[0], 'ko')).map(([name, n]) => ({name, n}));
  m.depts.forEach((d, i) => m.color.set(d.name, DEPT_COLORS[i % DEPT_COLORS.length]));
  if (S.dept && m.dates.length && !m.color.has(S.dept)) S.dept = '';
  if (S.mode === 'teacher') {
    run('notice', parseNotice);
    run('pray', parsePray);
    run('night', parseNight);
  }
  M = m;
}

const planSrc = () => S.src[S.mode === 'student' ? 'planS' : 'plan'] || {};
const ready = () => !!planSrc().table;

/* ── 하루 계산 ─────────────────────────────────────── */
// dp: 고른 부서('' 는 전체). 부서 없는 줄(쉬는 날 메모)은 어느 부서로 걸러도 남긴다.
const deptOk = (it, dp) => !dp || it.memo || it.dept === dp;
const itemsOn = (date, dp = S.dept) => (M.byDate.get(date) || []).filter(it => deptOk(it, dp));
const scoreOf = (date, dp = S.dept) => scoresFor(dp).map.get(date) || 0;
const topShare = busy => `올해 가장 활짝 핀 날 상위 ${Math.max(1, 100 - busy)}%`;
const deptColor = dept => M.color.get(dept) || (dept ? DEPT_COLORS[Math.floor(hash(dept) * DEPT_COLORS.length)] : ['#DEE2E6', '#ADB5BD']);

// 꽃잎에 적는 부서 줄임말: "1학년부" → "1", "교무부" → "교무", "기획위원" → "기획"
function short(dept) {
  const g = String(dept || '').match(/^([1-3])\s*학년/);
  if (g) return g[1];
  const s = String(dept || '').replace(/(부|실|과|팀|위원회|위원)$/, '');
  return [...(s || dept || '')].slice(0, 2).join('');
}

// 점수가 0 보다 큰 날들 가운데 이 점수 이하인 날의 비율 (1–99)
function busyOf(date, dp = S.dept) {
  const s = scoreOf(date, dp), sorted = scoresFor(dp).dist;
  if (!s || !sorted.length) return 0;
  let lo = 0, hi = sorted.length;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid] <= s) lo = mid + 1; else hi = mid; }
  return Math.min(99, Math.max(1, Math.round(lo / sorted.length * 100)));
}
const stageOf = busy => busy ? STAGES.find(([cut]) => busy < cut)[1] : '쉼';

function fronts(date, dp = S.dept) {
  const out = [];
  for (const k of M.dates) {
    if (k >= date) break;
    for (const it of M.byDate.get(k)) if (it.end && it.end >= date && deptOk(it, dp)) out.push(it);
  }
  return out;
}

function day(date, dp = S.dept) {
  const items = itemsOn(date, dp);
  const work = items.filter(it => !it.memo);
  const memos = items.filter(it => it.memo);
  const busy = busyOf(date, dp);
  const head = work.reduce((a, it) => (!a || it.w > a.w ? it : a), null);
  const periods = [...new Set(work.flatMap(it => it.periods || []))].sort((a, b) => a - b);
  return {date, dp, items, work, memos, busy, stage: stageOf(busy), head, fronts: fronts(date, dp), periods, known: M.byDate.has(date)};
}

function nextWorkDay(date, dp = S.dept) {
  for (const k of M.dates) if (k > date && itemsOn(k, dp).some(it => !it.memo)) return k;
  return null;
}

// 만개한 날이 수업일 사이로 이어지면 한 구간으로 묶는다
function peakRuns(from, dp, limit, within = 400) {
  const until = addDays(from, within);
  const runs = [];
  for (const k of M.dates) {
    if (k < from || k > until || busyOf(k, dp) < PEAK) continue;
    const last = runs[runs.length - 1];
    if (last && M.index.get(k) === M.index.get(last.end) + 1) { last.end = k; last.days.push(k); }
    else runs.push({start: k, end: k, days: [k]});
  }
  return runs.slice(0, limit).map(r => ({...r, title: runTitle(r.days, dp)}));
}

// 구간 이름: 여러 날에 되풀이된 일정이 있으면 그 글자들의 공통 앞부분("2학기 중간고사 1일차"·"2일차" → "2학기 중간고사"),
// 없으면 구간에서 가장 무거운 일정
function runTitle(days, dp) {
  const byKey = new Map();
  for (const k of days) {
    for (const it of itemsOn(k, dp)) {
      if (it.memo) continue;
      if (!byKey.has(it.key)) byKey.set(it.key, []);
      byKey.get(it.key).push(it);
    }
  }
  const repeated = [...byKey.values()]
    .filter(list => new Set(list.map(it => it.date)).size > 1)
    .sort((a, b) => Math.max(...b.map(it => it.w)) - Math.max(...a.map(it => it.w)))[0];
  if (repeated) {
    let p = repeated[0].text;
    for (const it of repeated) { let i = 0; while (i < p.length && p[i] === it.text[i]) i++; p = p.slice(0, i); }
    p = p.replace(/[\s\p{N}\p{P}]+$/u, '');
    return p.length >= 2 ? p : repeated[0].text;
  }
  const top = [...byKey.values()].flat().reduce((a, it) => (!a || it.w > a.w ? it : a), null);
  return top ? top.text : '';
}

function periodLabel(p) {
  const run = p.every((x, i) => i === 0 || x === p[i - 1] + 1);
  return (p.length > 1 && run ? `${p[0]}–${p[p.length - 1]}` : p.join('·')) + '교시';
}

/* ── 꽃 그리기 (만화 렌더링) ───────────────────────── */
// 좌표계는 꽃 가운데가 (0,0), 반지름 100. 굵은 먹선 + 납작한 색 + 꽃잎 밑동의 그늘 + 흰 반사광.
const INK = '#2A211D';
const SW = 4.5;
const GREEN = ['#69DB7C', '#40C057', '#2B8A3E'];
const colorOf = stage => STAGE_COLOR[stage] || STAGE_COLOR['쉼'];

function petalPath(L, W) {
  return `M0 0C${n1(W * .5)} ${n1(-L * .1)} ${n1(W * 1.05)} ${n1(-L * .42)} ${n1(W * .82)} ${n1(-L * .78)}`
    + `C${n1(W * .62)} ${n1(-L * 1.02)} ${n1(-W * .62)} ${n1(-L * 1.02)} ${n1(-W * .82)} ${n1(-L * .78)}`
    + `C${n1(-W * 1.05)} ${n1(-L * .42)} ${n1(-W * .5)} ${n1(-L * .1)} 0 0Z`;
}
const line = (d, w, c = INK) => `<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"/>`;
// 먹선을 두른 줄기: 굵은 먹 위에 가는 초록
const stem = d => `<g class="stem">${line(d, 13)}${line(d, 6.5, GREEN[1])}</g>`;
function leaf(d, rib, origin, light) {
  return `<g class="leaf" style="transform-origin:${origin}"><path d="${d}" fill="${light ? GREEN[0] : GREEN[1]}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>${line(rib, 3, GREEN[2])}</g>`;
}
const mound = (y, w) => `<path d="M${-w} ${y}C${-w * .6} ${y - 22} ${w * .6} ${y - 22} ${w} ${y}Z" fill="${GREEN[0]}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>`;

function petalG(L, W, c, detail, attrs) {
  return `<g class="pt" ${attrs}><path d="${petalPath(L, W)}" fill="${c[0]}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>`
    + `<path d="${petalPath(L * .5, W * .64)}" fill="${c[1]}"/>`
    + (detail ? line(`M${n1(W * .26)} ${n1(-L * .9)}Q${n1(W * .56)} ${n1(-L * .84)} ${n1(W * .64)} ${n1(-L * .7)}`, SW * .8, 'rgba(255,255,255,.9)') : '')
    + `</g>`;
}
function centerG(r, c, detail, n) {
  return `<g class="ctr" style="--n:${n}"><circle r="${n1(r)}" fill="${c[1]}"/><circle cy="${n1(-r * .16)}" r="${n1(r * .8)}" fill="${c[0]}"/>`
    + `<circle r="${n1(r)}" fill="none" stroke="${INK}" stroke-width="${SW}"/>`
    + (detail ? `<ellipse cx="${n1(-r * .34)}" cy="${n1(-r * .4)}" rx="${n1(r * .24)}" ry="${n1(r * .15)}" transform="rotate(-30 ${n1(-r * .34)} ${n1(-r * .4)})" fill="#fff" opacity=".9"/>` : '')
    + `</g>`;
}
const sparkG = (x, y, s, d) => `<g class="spark live" style="--x:${n1(x)}px;--y:${n1(y)}px;--d:${d}ms">`
  + `<path d="M0 ${-s}Q0 0 ${s} 0Q0 0 0 ${s}Q0 0 ${-s} 0Q0 0 0 ${-s}Z" fill="#FFE066" stroke="${INK}" stroke-width="${SW * .75}" stroke-linejoin="round"/></g>`;

function sproutG(s, ground) {
  return `<g transform="scale(${s})">${stem('M0 58C2 32 -2 14 0 -4')}`
    + leaf('M0 6C-24 8 -48 -8 -52 -38C-22 -38 -4 -20 0 6Z', 'M-4 0Q-22 -12 -40 -30', '0px 6px', false)
    + leaf('M1 -4C22 -4 42 -20 44 -48C16 -46 2 -28 1 -4Z', 'M4 -10Q22 -22 36 -40', '1px -4px', true)
    + (ground ? mound(66, 58) : '') + `</g>`;
}
function budG(f) {
  const lead = f.fronts.reduce((a, it) => (!a || it.w > a.w ? it : a), null);
  const c = lead ? deptColor(lead.dept) : colorOf(f.stage);
  return stem('M0 70C3 40 -3 20 0 0')
    + leaf('M0 46C-18 46 -34 34 -36 14C-16 14 -4 26 0 46Z', 'M-3 40Q-16 30 -28 20', '0px 46px', true)
    + `<g class="pt" style="--a:0deg;--k:0"><path d="${petalPath(66, 32)}" fill="${c[0]}" stroke="${INK}" stroke-width="${SW}" stroke-linejoin="round"/>`
    + `<path d="${petalPath(30, 22)}" fill="${c[1]}"/></g>`
    + `<path d="M0 0C-14 -2 -22 -10 -24 -20C-10 -18 -2 -10 0 0C2 -10 10 -18 24 -20C22 -10 14 -2 0 0Z" fill="${GREEN[1]}" stroke="${INK}" stroke-width="${SW * .8}" stroke-linejoin="round"/>`;
}
const seedG = () => `<circle r="7" fill="none" stroke="var(--ink-3)" stroke-width="3" opacity=".45"/>`;

/**
 * f: day() 결과. o.stem: 줄기·잎·흙더미. o.detail: 반사광·반짝이. o.labels: 꽃잎에 부서 줄임말. o.anim: 톡톡 피어나기.
 * 꽃잎 수 = 그날 일정 수, 꽃잎 색 = 부서. 꽃잎은 목록 순서대로 12시 방향부터 시계 방향으로 놓인다.
 */
function flowerSVG(f, o = {}) {
  const cls = `fl${o.anim && !reduced() ? ' anim' : ''}`;
  const n = f.work.length;
  const label = o.label === false ? ' aria-hidden="true"' : ` role="img" aria-label="${n ? `${f.stage}, 꽃잎 ${n}장` : f.stage}"`;
  if (!n) {
    // 오늘 꽃(stem)은 할 일이 없는 날에도 새싹으로 보여 준다. 작은 꽃은 시트에 없는 날을 씨앗으로 둔다.
    const sprout = o.stem || f.memos.length || (f.known && ![0, 6].includes(dow(f.date)));
    const g = f.busy ? budG(f) : sprout ? sproutG(o.stem ? 1.45 : 1, o.stem) : seedG();
    return `<svg class="${cls}" viewBox="${o.stem ? '-118 -100 236 210' : '-112 -112 224 224'}"${label}>${g}</svg>`;
  }
  const order = ordered(f);
  const maxW = Math.max(...order.map(it => it.w), 1e-9);
  const R = 100 * (0.62 + 0.38 * f.busy / 100);
  const spin = n > 1 ? (hash(f.date) - .5) * 16 : 0;
  let g = '';
  if (o.stem) {
    g += stem(`M0 ${n1(R * .3)}C8 ${n1(R * .3 + 40)} -10 ${n1(R * .3 + 75)} 0 146`)
      + leaf('M-1 122C-28 124 -54 108 -62 80C-34 76 -10 92 -1 122Z', 'M-5 116Q-30 104 -52 86', '-1px 122px', false)
      + leaf('M1 104C22 102 44 88 50 62C26 62 8 76 1 104Z', 'M5 98Q26 86 42 70', '1px 104px', true)
      + mound(154, 80);
  }
  let labels = '';
  order.forEach((it, k) => {
    const L = R * (0.86 + 0.14 * it.w / maxW);
    const W = Math.min(L * .44, (2 * Math.PI * R * .55 / n) * .62);
    const a = n === 2 ? (k ? 32 : -32) : spin + k * 360 / n;
    const i = f.work.indexOf(it);
    g += petalG(L, W, it.c || deptColor(it.dept), o.detail, `data-ev="${i}" style="--a:${n1(a)}deg;--k:${k}"`);
    if (o.labels && it.dept) {
      // 글자는 꽃잎을 따라 돌지 않고 늘 똑바로 선다
      const t = short(it.dept), r = L * .56, rad = a * Math.PI / 180;
      const fs = n1(Math.max(11, Math.min(t.length > 1 ? 22 : 28, W * (t.length > 1 ? .78 : 1.15))));
      labels += `<g class="lb" data-ev="${i}" style="--k:${k}"><text x="${n1(Math.sin(rad) * r)}" y="${n1(-Math.cos(rad) * r)}" font-size="${fs}">${esc(t)}</text></g>`;
    }
  });
  g += labels + centerG(R * .2 + 4, ['#FFD43B', '#F59F00'], o.detail, n);
  if (f.busy >= PEAK && o.detail) {
    g += sparkG(R * 1.02, -R * .8, 17, 0) + sparkG(-R * 1.06, -R * .38, 12, 700) + sparkG(R * .92, R * .62, 10, 1400);
  }
  return `<svg class="${cls}" viewBox="${o.stem ? '-118 -118 236 290' : '-112 -112 224 224'}"${label}>${g}</svg>`;
}

// 목록과 꽃잎이 같은 순서를 쓴다: 교시 없는 일정 → 교시 순
const ordered = f => [...f.work.filter(it => !it.periods), ...f.work.filter(it => it.periods).sort((a, b) => a.periods[0] - b.periods[0])];

// 여러 꽃잎을 누를 수 있는 꽃: 누르면 말풍선이 뜬다
const tapFlower = (f, o) => `<div class="flw" data-date="${f.date}">${flowerSVG(f, {...o, labels: true})}</div>`;

function petalGlyph(it) {
  const c = deptColor(it.dept);
  if (it.memo) return `<svg class="gl" viewBox="-60 -60 120 120" aria-hidden="true"><g transform="translate(0 4) scale(.85)">${sproutG(1, false)}</g></svg>`;
  return `<svg class="gl" viewBox="-44 -100 88 106" aria-hidden="true"><path d="${petalPath(94, 40)}" fill="${c[0]}" stroke="${INK}" stroke-width="7" stroke-linejoin="round"/><path d="${petalPath(46, 26)}" fill="${c[1]}"/></svg>`;
}

/* ── 그리기: 조각 ─────────────────────────────────── */
function rulerHTML(it) {
  if (!it.periods) return '<span></span>';
  const max = Math.max(7, ...it.periods);
  let h = `<span class="ruler" style="grid-template-columns:repeat(${max},6px)" role="img" aria-label="${periodLabel(it.periods)}">`;
  for (let p = 1; p <= max; p++) h += `<i${it.periods.includes(p) ? ' class="on"' : ''}></i>`;
  return h + '</span>';
}

function evHTML(it, o = {}) {
  const tags = [];
  if (it.grades) tags.push(`${it.grades.join('·')}학년`);
  if (it.periods) tags.push(periodLabel(it.periods));
  if (it.end && o.end !== false) tags.push(`~${md(it.end)}`);
  const head = [it.dept, it.cat].filter(Boolean).map(esc).join(' · ');
  const text = o.hl ? hl(it.text) : esc(it.text);
  const attr = o.idx != null ? ` data-ev="${o.idx}"` : o.go ? ` data-day="${it.date}"` : '';
  return `<li class="ev${it.memo ? ' memo' : ''}"${attr}>${petalGlyph(it)}`
    + `<span>${o.date ? `<span class="dp">${shortDate(it.date)}${head ? ` · ${head}` : ''}</span>` : head ? `<span class="dp">${head}</span>` : ''}`
    + `<span class="tx">${text}</span>${tags.length ? `<span class="tg">${tags.map(x => `<i>${x}</i>`).join('')}</span>` : ''}`
    + (o.sub ? `<span class="sub">${o.sub}</span>` : '') + `</span>${o.ruler === false ? '<span></span>' : rulerHTML(it)}</li>`;
}

// 하루 목록: 쉬는 날 메모 → 꽃잎 순서(교시 없는 일정 → 교시 순) → 이어지는 일정
function dayList(f, o = {}) {
  const rows = [...f.memos.map(it => evHTML(it)), ...ordered(f).map(it => evHTML(it, {idx: o.link ? f.work.indexOf(it) : null}))];
  let h = rows.length ? `<ul class="evs">${rows.join('')}</ul>` : '';
  if (f.fronts.length) {
    h += `<p class="sublabel">이어지는 일정</p><ul class="evs">${f.fronts.map(it =>
      evHTML(it, {end: false, go: o.go, sub: `${shortDate(it.date)} ~ ${shortDate(it.end)} · ${diffDays(f.date, it.end) ? `${diffDays(f.date, it.end)}일 남음` : '오늘까지'}`})).join('')}</ul>`;
  }
  return h || `<div class="empty">적힌 일정이 없습니다.</div>`;
}

const sec = (title, small, body) => `<section class="sec"><h2 class="sec-h">${title}${small ? `<small>${small}</small>` : ''}</h2>${body}</section>`;
const longDate = k => { const d = toDate(k); return `${d.getMonth() + 1}월 ${d.getDate()}일`; };

function stageLine(f) {
  const c = colorOf(f.stage);
  const badge = `<span class="badge" style="--c:${c[0]}">${f.stage}</span>`;
  if (f.work.length) return `<p class="stage">${badge}꽃잎 ${f.work.length}장</p><p class="stage-sub">${topShare(f.busy)}</p>`;
  if (f.busy) return `<p class="stage">${badge}이어지는 일정만 있어요</p><p class="stage-sub">${topShare(f.busy)}</p>`;
  const why = f.memos.length ? esc(f.memos.map(it => it.text).join(' · ')) : [0, 6].includes(dow(f.date)) ? '주말' : '적힌 일정이 없어요';
  return `<p class="stage">${badge}${why}</p>`;
}

/* ── 그리기: 첫 화면 ─────────────────────────────── */
function heroHTML(f) {
  const d = toDate(S.today);
  const date = `<p class="date">${longDate(S.today)}<small>${WD[d.getDay()]}요일</small></p>`;
  if (!f) {
    const blank = {date: S.today, work: [], memos: [], fronts: [], busy: 0, stage: '쉼', known: false};
    return `<section class="hero">${flowerSVG(blank, {stem: true, label: false})}${date}`
      + `<p class="stage-sub">${S.loading || !S.lastLoad ? '시트를 읽는 중이에요' : '시트를 읽지 못했어요'}</p></section>`;
  }
  const key = `${S.today}|${S.dept}|${S.mode}|${f.work.length}`;
  const anim = S.bloomed !== key;
  S.bloomed = key;
  let chips = '';
  const du = S.mode === 'teacher' ? M.duty.get(S.today) : null;
  if (du && du.pray && du.pray.name) {
    const more = du.pray.bible || du.pray.hymn;
    chips += `<${more ? 'button' : 'span'} class="chip"${more ? ' data-action="word"' : ''}>기도 <b>${esc(du.pray.name)}</b>${du.pray.bible ? ` · ${esc(du.pray.bible)}` : ''}</${more ? 'button' : 'span'}>`;
  }
  if (du && du.night) chips += `<span class="chip">야자 감독 <b>${esc(du.night)}</b></span>`;
  return `<section class="hero" id="hero">${tapFlower(f, {stem: true, detail: true, anim})}${date}${stageLine(f)}`
    + (chips ? `<div class="chips">${chips}</div>` : '') + `</section>`;
}

function notesHTML() {
  const t = S.today;
  return M.notices.filter(n => n.start <= t && t <= n.end)
    .map(n => `<div class="note" role="note"><span>${esc(n.text)}</span><small>${md(n.end)}까지</small></div>`).join('');
}

function todayHTML(f) {
  if (!f) return sec('오늘', '', failHTML());
  let h = '';
  if (f.work.length || f.fronts.length || f.memos.length) {
    h += sec(f.work.length ? '오늘의 꽃잎' : '오늘', f.work.length ? `${f.work.length}장 · 꽃잎을 누르면 일정이 나와요` : '', `<div class="card">${dayList(f, {link: true, go: true})}</div>`);
  }
  // 오늘 할 일이 없으면 다음 수업일을 미리 보여 준다
  const nd = !f.work.length && nextWorkDay(S.today);
  if (nd) h += sec(`${longDate(nd)} ${WD[dow(nd)]}요일`, `다음 수업일 · ${diffDays(S.today, nd)}일 뒤`, `<div class="card">${dayList(day(nd), {go: true})}</div>`);
  return h;
}

function weekHTML() {
  let h = '';
  for (let i = 0; i < 7; i++) {
    const d = addDays(S.today, i);
    const f = day(d);
    const wd = dow(d);
    const cls = [wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', i === 0 ? 'today' : ''].filter(Boolean).join(' ');
    h += `<button class="wd ${cls}" data-day="${d}" aria-label="${longDate(d)} ${f.stage}${f.work.length ? ` 꽃잎 ${f.work.length}장` : ''}">`
      + `<span>${i === 0 ? '오늘' : WD[wd]}</span>${flowerSVG(f, {label: false})}<b>${toDate(d).getDate()}</b></button>`;
  }
  return sec('앞으로 7일', '', `<div class="card"><div class="week">${h}</div></div>`);
}

function peaksHTML() {
  const runs = peakRuns(addDays(S.today, 1), S.dept, 3, 90);
  if (!runs.length) return '';
  const rows = runs.map(r => {
    const top = r.days.reduce((a, d) => (scoreOf(d) > scoreOf(a) ? d : a), r.days[0]);
    const f = day(top);
    const more = r.days.length > 1 ? ` · ${r.days.length}일 이어져요` : ` · 꽃잎 ${f.work.length}장`;
    return `<li><button class="peak" data-day="${r.start}">${flowerSVG(f, {label: false})}`
      + `<span class="t">${longDate(r.start)} (${WD[dow(r.start)]})<small>${esc(r.title)}${more}</small></span>`
      + `<span class="dday">D-${diffDays(S.today, r.start)}</span></button></li>`;
  }).join('');
  return sec('곧 만개', '올해 가장 만개한 날들', `<div class="card"><ul class="peaks">${rows}</ul></div>`);
}

/* 정원: 한 달 또는 한 해 */
function monthBounds() { return M.dates.length ? [monthOf(M.dates[0]), monthOf(M.dates[M.dates.length - 1])] : [null, null]; }

function gardenHTML() {
  if (!ready() || !M.dates.length) return '';
  const [lo, hi] = monthBounds();
  if (!S.month) S.month = monthOf(S.today) < lo ? lo : monthOf(S.today) > hi ? hi : monthOf(S.today);
  const [y, m] = S.month.split('-').map(Number);
  const tog = `<span class="tog" role="group" aria-label="보기"><button data-action="view-month" aria-pressed="${!S.yearView}">한 달</button><button data-action="view-year" aria-pressed="${S.yearView}">한 해</button></span>`;
  if (S.yearView) {
    return `<section class="sec" id="garden"><div class="gh"><h2>${M.year}학년도<small>정원</small></h2>${tog}</div><div class="card">${yearHTML()}${legendHTML()}</div></section>`;
  }
  const first = `${S.month}-01`;
  const lead = dow(first);
  const days = new Date(y, m, 0).getDate();
  let cells = '<span class="cell out"></span>'.repeat(lead);
  for (let d = 1; d <= days; d++) {
    const k = ymd(y, m, d);
    const f = day(k);
    const wd = dow(k);
    const cls = ['cell', wd === 0 ? 'sun' : wd === 6 ? 'sat' : '', k === S.today ? 'today' : '', k < S.today ? 'past' : ''].filter(Boolean).join(' ');
    cells += `<button class="${cls}" data-day="${k}" aria-label="${m}월 ${d}일 ${f.stage}${f.work.length ? ` 꽃잎 ${f.work.length}장` : ''}"><span class="n">${d}</span>${flowerSVG(f, {label: false})}</button>`;
  }
  return `<section class="sec" id="garden"><div class="gh"><h2>${m}월<small>${y}</small></h2>${tog}`
    + `<button class="ib" data-action="prev" aria-label="이전 달"${lo && S.month <= lo ? ' disabled' : ''}><svg class="i" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></svg></button>`
    + `<button class="ib" data-action="next" aria-label="다음 달"${hi && S.month >= hi ? ' disabled' : ''}><svg class="i" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></svg></button></div>`
    + `<div class="card garden" id="garden-grid"><div class="dow" aria-hidden="true">${WD.map(w => `<span>${w}</span>`).join('')}</div><div class="mgrid">${cells}</div></div></section>`;
}

function yearHTML() {
  const [lo, hi] = monthBounds();
  let h = '';
  for (let mk = lo; mk <= hi; mk = shiftMonth(mk, 1)) {
    const [y, m] = mk.split('-').map(Number);
    const n = new Date(y, m, 0).getDate();
    let dots = '<i></i>'.repeat(dow(`${mk}-01`)), peaks = 0;
    for (let d = 1; d <= n; d++) {
      const k = ymd(y, m, d);
      const f = day(k);
      if (f.busy >= PEAK) peaks++;
      const s = f.busy ? n1(4 + f.busy / 100 * 6) : f.memos.length ? 4 : 3;
      const c = f.busy ? colorOf(f.stage)[0] : f.memos.length ? GREEN[0] : 'var(--hair)';
      const cls = [k === S.today ? 'today' : '', f.busy ? 'big' : ''].filter(Boolean).join(' ');
      dots += `<i${cls ? ` class="${cls}"` : ''} style="--s:${s}px;--c:${c}"></i>`;
    }
    h += `<button class="ym" data-month="${mk}" aria-label="${m}월 보기"><h3>${m}월${peaks ? `<small>만개 ${peaks}</small>` : ''}</h3><span class="ydots">${dots}</span></button>`;
  }
  return `<div class="year">${h}</div>`;
}

const legendHTML = () => `<div class="legend">${['쉼', ...STAGES.map(s => s[1])].map(st => `<span><i style="--c:${colorOf(st)[0]}"></i>${st}</span>`).join('')}</div>`;

function footHTML() {
  const st = planSrc();
  return `<footer class="foot">`
    + `<p>꽃잎 한 장이 일정 하나, 꽃잎 색은 부서예요. 꽃잎을 누르면 그 일정이 나와요. 꽃의 크기는 올해 수업일 가운데 그날이 얼마나 활짝 피었는지예요. 일정이 많을수록, 드문 일정일수록 활짝 핍니다. 가장 만개한 10%의 날엔 반짝이가 붙어요.</p>`
    + `<p>${st.at ? `${st.cached ? '저장해 둔 ' : ''}시트 ${clock(st.at)}` : ''}${st.error && st.table ? ' · 연결하지 못해 저장본을 보여 줍니다 · <button data-action="refresh">다시 받기</button>' : ''}</p>`
    + `</footer>`;
}

function failHTML() {
  if (S.loading || !S.lastLoad) return `<div class="card"><div class="skel"></div><div class="skel"></div></div>`;
  return `<div class="card" style="padding:18px"><b>시트를 읽지 못했어요.</b>`
    + `<p class="hint" style="margin:6px 0 0">${esc(planSrc().error || '')}<br>시트가 ‘링크가 있는 모든 사용자’에게 보기로 공유되어 있어야 해요.</p>`
    + `<div class="btns"><button class="btn solid" data-action="refresh">다시 받기</button><a class="btn" href="${SHEET_URL}" target="_blank" rel="noopener">시트 열기</a></div></div>`;
}

/* ── 그리기: 전체 ─────────────────────────────────── */
function paintTop() {
  const sel = $('#dept');
  const opts = '<option value="">전체 부서</option>' + M.depts.map(d => `<option value="${esc(d.name)}">${esc(d.name)}</option>`).join('');
  if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; }
  sel.value = S.dept;
  $('#gsel').classList.toggle('on', !!S.dept);
  $('#gsel').style.setProperty('--c', S.dept ? deptColor(S.dept)[0] : '');
  const more = $('#more-btn');
  const dot = more.querySelector('.dot');
  const bad = NEED[S.mode].some(k => S.src[k]?.error);
  if (bad && !dot) more.insertAdjacentHTML('beforeend', '<i class="dot"></i>');
  if (!bad && dot) dot.remove();
}

function render() {
  S.today = todayKey();
  const f = ready() ? day(S.today) : null;
  $('#main').innerHTML = heroHTML(f) + (f ? notesHTML() : '') + todayHTML(f)
    + (f ? weekHTML() + peaksHTML() + gardenHTML() : '') + footHTML();
  paintTop();
}

function renderGarden() {
  const el = $('#garden');
  if (el) el.outerHTML = gardenHTML();
}

/* ── 아래서 올라오는 판 ─────────────────────────────── */
function openSheet(kind, arg) {
  const wasOpen = !!S.sheet;
  S.sheet = {kind, arg, anim: true};
  paintSheet();
  const el = $('#sheet'), bg = $('#scrim');
  if (!wasOpen) {
    el.hidden = false; bg.hidden = false;
    document.documentElement.classList.add('locked');
    requestAnimationFrame(() => { el.classList.add('open'); bg.classList.add('open'); el.focus({preventScroll: true}); });
    history.pushState({sheet: 1}, '');
  }
  $('#sheet-body').scrollTop = 0;
  if (kind === 'search') setTimeout(() => $('#q') && $('#q').focus(), wasOpen ? 0 : 320);
}

function hideSheet() {
  if (!S.sheet) return;
  closeBubble();
  S.sheet = null; S.word = null;
  const el = $('#sheet'), bg = $('#scrim');
  el.classList.remove('open'); bg.classList.remove('open');
  document.documentElement.classList.remove('locked');
  setTimeout(() => { if (!S.sheet) { el.hidden = true; bg.hidden = true; } }, reduced() ? 0 : 320);
}
function closeSheet() { if (history.state && history.state.sheet) history.back(); else hideSheet(); }

function paintSheet() {
  const {kind, arg} = S.sheet;
  let title = '', body = '';
  if (kind === 'day') ({title, body} = daySheet(arg));
  else if (kind === 'search') { title = '일정 찾기'; body = searchSheet(); }
  else if (kind === 'more') { title = '설정과 자료'; body = moreSheet(); }
  else if (kind === 'word') { title = '기도 순서'; body = wordSheet(); }
  $('#sheet-title').innerHTML = title;
  const focusQ = document.activeElement && document.activeElement.id === 'q';
  $('#sheet-body').innerHTML = body;
  if (focusQ && $('#q')) { const q = $('#q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  S.sheet.anim = false;
}

function daySheet(date) {
  const n = diffDays(S.today, date);
  const rel = n === 0 ? '오늘' : n === 1 ? '내일' : n === -1 ? '어제' : '';
  const title = `${longDate(date)} ${WD[dow(date)]}요일${rel ? `<small>${rel}</small>` : ''}`;
  if (!ready()) return {title, body: ''};
  const f = day(date);
  const du = S.mode === 'teacher' ? M.duty.get(date) : null;
  let body = `<div class="dayhead">${tapFlower(f, {detail: true, anim: S.sheet.anim})}${stageLine(f)}</div>`;
  body += `<div class="card" style="margin-top:16px">${dayList(f)}</div>`;
  if (du && (du.pray?.name || du.night)) {
    body += `<div class="chips" style="justify-content:flex-start;margin-top:14px">`
      + (du.pray?.name ? `<span class="chip">기도 <b>${esc(du.pray.name)}</b>${du.pray.bible ? ` · ${esc(du.pray.bible)}` : ''}</span>` : '')
      + (du.night ? `<span class="chip">야자 감독 <b>${esc(du.night)}</b></span>` : '') + '</div>';
  }
  body += `<div class="daynav"><button class="btn" data-day="${addDays(date, -1)}">‹ ${md(addDays(date, -1))}</button>`
    + (date !== S.today ? `<button class="btn" data-day="${S.today}">오늘</button>` : '')
    + `<button class="btn" data-day="${addDays(date, 1)}">${md(addDays(date, 1))} ›</button></div>`;
  return {title, body};
}

function hl(s) {
  if (!S.q) return esc(s);
  const q = S.q.toLowerCase(), lo = s.toLowerCase();
  let out = '', i = 0, j;
  while ((j = lo.indexOf(q, i)) >= 0) { out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>'; i = j + q.length; }
  return out + esc(s.slice(i));
}

function searchSheet() {
  return `<label class="search"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg>`
    + `<span class="sr">일정 찾기</span><input id="q" type="search" placeholder="예: 부장회의, 모의고사, 교무부" value="${esc(S.q)}" autocomplete="off" enterkeyhint="search"></label>`
    + `<div id="hits">${hitsHTML()}</div>`;
}

function hitsHTML() {
  if (!S.q) return `<p class="hint">일정 이름이나 부서로 찾아요.${S.dept ? ` 지금은 ${esc(S.dept)} 일정만 찾아요.` : ''}</p>`;
  if (!ready()) return '<p class="hint">시트를 받은 뒤에 찾을 수 있어요.</p>';
  const q = S.q.toLowerCase(), hits = [];
  for (const d of M.dates) for (const it of itemsOn(d)) if (it.raw.toLowerCase().includes(q)) hits.push(it);
  if (!hits.length) return `<p class="hint">‘${esc(S.q)}’이(가) 들어간 일정이 없어요.</p>`;
  const list = hits.slice(0, 100).map(it => evHTML(it, {go: true, date: true, hl: true, ruler: false})).join('');
  return `<p class="hint" style="margin-bottom:10px">${hits.length}건${hits.length > 100 ? ' 중 100건' : ''}</p><div class="card"><ul class="evs">${list}</ul></div>`;
}

function moreSheet() {
  const studentUrl = location.origin + location.pathname + '?for=student';
  let h = `<div class="opt" role="group" aria-label="보기"><button data-action="mode" data-v="teacher" aria-pressed="${S.mode === 'teacher'}">교사용</button>`
    + `<button data-action="mode" data-v="student" aria-pressed="${S.mode === 'student'}">학생용</button></div>`
    + `<p class="hint">${S.mode === 'student' ? '학생용은 ‘(학생용)연중행사계획’ 시트로 꽃을 피워요.' : '교사용은 연중행사계획에 기도·감독·공지를 더해 보여 줘요.'} 학생에게는 학생용 주소를 보내 주세요.</p>`
    + `<div class="btns"><button class="btn" data-action="copy" data-url="${esc(studentUrl)}">학생용 주소 복사</button></div>`;

  const ex = (stage, busy, n, sub) => {
    const work = Array.from({length: n}, (_, i) => ({w: 1, periods: null, i, c: DEPT_COLORS[(i * 5 + n) % DEPT_COLORS.length]}));
    const f = {date: stage, work, memos: [], fronts: [], busy, stage, known: true};
    return `<div class="explain">${flowerSVG(f, {label: false, detail: true})}<span><b>${stage}</b><span>${sub}</span></span></div>`;
  };
  h += sec('꽃 읽는 법', '', `<div class="card">`
    + `<div class="explain">${flowerSVG({date: 'rest', work: [], memos: [{}], fronts: [], busy: 0, stage: '쉼', known: true}, {label: false})}<span><b>쉼</b><span>할 일이 적히지 않은 날. 새싹이 돋아요.</span></span></div>`
    + ex('봉오리', 20, 2, '올해 수업일 중 하위 30%')
    + ex('피는 중', 50, 4, '30–65%')
    + ex('활짝', 80, 6, '65–90%')
    + ex('만개', 95, 8, '가장 만개한 10%. 반짝여요.')
    + `</div><p class="hint">꽃잎 수는 그날 일정 수, 꽃잎 색은 부서예요. 첫 화면 꽃잎에는 부서 줄임말(1학년부는 ‘1’, 교무부는 ‘교무’)이 적혀 있고, 누르면 그 일정이 나와요. 꽃의 크기와 단계는 올해 수업일 가운데 그날이 얼마나 활짝 피었는지로 정해요. 일정이 많을수록, 한 해에 드물게 나오는 일정일수록 활짝 핍니다. 일정 이름의 뜻은 읽지 않아요.</p>`);

  h += sec('자료', ready() ? `일정 ${M.total}건` : '', `<div class="card"><ul class="srcs">${NEED[S.mode].map(k => {
    const st = S.src[k] || {};
    let s, bad = false;
    if (st.table) s = `${st.cached ? '저장본 ' : ''}${clock(st.at)} · ${st.table.rows.length}행${st.error ? ' · 연결 안 됨' : ''}`;
    else if (st.error) { s = esc(st.error); bad = true; }
    else s = S.loading ? '받는 중' : '아직 없음';
    if (st.parseError) { s += ' · 읽는 중 오류'; bad = true; }
    return `<li><b>${esc(SRC[k].label)}</b><small${bad ? ' class="bad"' : ''}>${s}</small></li>`;
  }).join('')}</ul></div>`
    + `<div class="btns"><button class="btn solid" data-action="refresh">다시 받기</button><a class="btn" href="${SHEET_URL}" target="_blank" rel="noopener">원본 시트</a><button class="btn" data-action="forget">저장본 지우기</button></div>`
    + `<p class="hint">‘2026학년도 학사일정’ 구글 시트를 그대로 읽어요. 시트를 고치면 여기도 바뀝니다.</p>`);
  return h;
}

/* 기도 순서와 말씀·찬송: 기도순서에 적힌 본문을 성경 말씀·찬송가 가사 시트에서 찾아 온다 */
const hymnLabel = h => (h ? (/[장찬]/.test(h) ? h : `찬송 ${h}장`) : '');

function wordSheet() {
  const rows = [];
  for (let i = 0; i < 21 && rows.length < 8; i++) {
    const d = addDays(S.today, i), p = M.duty.get(d)?.pray;
    if (p && p.name) rows.push(`<li class="ev" style="grid-template-columns:1fr"><span><span class="dp">${relDay(d)} · ${shortDate(d)}</span><span class="tx">${esc(p.name)}</span>`
      + `${p.bible || p.hymn ? `<span class="tg">${[p.bible, hymnLabel(p.hymn)].filter(Boolean).map(x => `<i>${esc(x)}</i>`).join('')}</span>` : ''}</span></li>`);
  }
  let h = `<div class="card"><ul class="evs">${rows.join('') || '<li class="empty">앞으로 3주 안에 순서가 없어요.</li>'}</ul></div>`;
  const p = M.duty.get(S.today)?.pray;
  const w = S.word;
  if (p && (p.bible || p.hymn)) {
    if (!w) h += `<div class="btns"><button class="btn solid" data-action="read-word">오늘 말씀·찬송 펼치기</button></div>`;
    else {
      if (p.bible) h += sec(`말씀 · ${esc(p.bible)}`, '', `<div class="card verse" style="padding:16px">${
        w.verses == null ? '<p>불러오는 중…</p>' : w.verses.length ? w.verses.map(v => `<p><sup>${esc(v.n)}</sup>${esc(v.t)}</p>`).join('')
          : '<p>본문을 찾지 못했어요. 성경 칸을 ‘시 23:1-6’처럼 적으면 찾아와요.</p>'}</div>`);
      if (p.hymn) h += sec(esc(hymnLabel(p.hymn)), '', `<div class="card verse" style="padding:16px">${
        w.lyrics == null ? '<p>불러오는 중…</p>' : w.lyrics ? w.lyrics.split(/\s*(?=\(\d+\))/).map(v => `<p>${esc(v.trim())}</p>`).join('') : '<p>가사를 찾지 못했어요.</p>'}</div>`);
    }
  }
  return h;
}

function parseRef(t) {
  const m = String(t || '').match(/^\s*([가-힣]+)\s*(\d+)\s*(?:[:：]|장)\s*(\d+)\s*절?\s*(?:[-~–]\s*(\d+)\s*절?)?/);
  if (!m) return null;
  const from = +m[3];
  return {book: m[1], ch: +m[2], from, to: Math.min(Math.max(m[4] ? +m[4] : from, from), from + 80)};
}

async function readWord() {
  const p = M.duty.get(S.today)?.pray;
  if (!p) return;
  const w = S.word = {verses: p.bible ? null : [], lyrics: p.hymn ? null : ''};
  paintSheet();
  const jobs = [];
  const r = parseRef(p.bible);
  if (p.bible && !r) w.verses = [];
  if (r) {
    jobs.push(gviz('성경 말씀', `select C, D, E where (A = '${r.book}' or B = '${r.book}') and C = ${r.ch} and D >= ${r.from} and D <= ${r.to} order by D`)
      .then(t => { w.verses = t.rows.map(x => ({n: cText(x.c[1]), t: cText(x.c[2])})).filter(x => x.t); })
      .catch(() => { w.verses = []; }));
  }
  const hn = (String(p.hymn || '').match(/\d{1,3}/) || [])[0];
  if (p.hymn && !hn) w.lyrics = '';
  if (hn) {
    jobs.push(gviz('찬송가 가사', `select A, B where A = ${hn}`)
      .catch(() => gviz('찬송가 가사', `select A, B where A = '${hn}'`))
      .then(t => { w.lyrics = cText(t.rows[0]?.c?.[1]); })
      .catch(() => { w.lyrics = ''; }));
  }
  await Promise.all(jobs);
  if (S.word === w && S.sheet && S.sheet.kind === 'word') paintSheet();
}

/* ── 꽃잎 말풍선 ───────────────────────────────────── */
function closeBubble() {
  document.querySelectorAll('.bubble').forEach(b => b.remove());
  document.querySelectorAll('.fl .dim').forEach(p => p.classList.remove('dim'));
  document.querySelectorAll('#main .ev.lit').forEach(r => r.classList.remove('lit'));
}

// 꽃잎 하나만 밝히고, 첫 화면이면 목록의 그 줄도 켠다
function mark(w, i) {
  w.querySelectorAll('.pt, .lb').forEach(p => p.classList.toggle('dim', p.dataset.ev !== String(i)));
  if (w.closest('#hero')) document.querySelectorAll(`#main .ev[data-ev="${i}"]`).forEach(r => r.classList.add('lit'));
}

function openBubble(pt) {
  const w = pt.closest('.flw');
  const i = pt.dataset.ev;
  const again = w.querySelector(`.bubble[data-ev="${i}"]`);
  closeBubble();
  if (again) return;
  const it = day(w.dataset.date).work[+i];
  if (!it) return;
  mark(w, i);
  const tags = [];
  if (it.grades) tags.push(`${it.grades.join('·')}학년`);
  if (it.periods) tags.push(periodLabel(it.periods));
  if (it.end) tags.push(`~${md(it.end)}`);
  const b = document.createElement('div');
  b.className = 'bubble';
  b.dataset.ev = i;
  b.setAttribute('role', 'status');
  b.innerHTML = `<span class="bd"><i style="--c:${deptColor(it.dept)[0]}"></i>${esc([it.dept, it.cat].filter(Boolean).join(' · '))}</span>`
    + `<b>${esc(it.text)}</b>${tags.length ? `<span class="tg">${tags.map(x => `<i>${x}</i>`).join('')}</span>` : ''}`;
  b.style.visibility = 'hidden';
  w.appendChild(b);
  // 위쪽 꽃잎이면 꽃잎 아래로, 아래쪽 꽃잎이면 꽃잎 위로 띄운다
  const wr = w.getBoundingClientRect(), pr = pt.getBoundingClientRect(), cr = w.querySelector('.ctr').getBoundingClientRect();
  const cx = pr.left + pr.width / 2 - wr.left, cy = pr.top + pr.height / 2 - wr.top;
  const upper = pr.top + pr.height / 2 <= cr.top + cr.height / 2;
  const bw = b.offsetWidth, bh = b.offsetHeight;
  const left = Math.max(4, Math.min(wr.width - bw - 4, cx - bw / 2));
  b.style.left = `${left}px`;
  b.style.top = `${upper ? cy + 16 : cy - bh - 16}px`;
  b.style.setProperty('--tx', `${Math.max(18, Math.min(bw - 18, cx - left))}px`);
  b.classList.toggle('up', !upper);
  b.style.visibility = '';
}

/* ── 조작 ───────────────────────────────────────────── */
// 학사일정 화면 위에 겹쳐 열렸으면 제목을 눌러 겹친 창을 닫는다. 따로 열었으면 링크대로 학사일정으로 간다.
const EMBED = window.parent !== window;

document.addEventListener('click', e => {
  if (EMBED && e.target.closest('.logo a')) { e.preventDefault(); parent.postMessage({kkot: 'close'}, '*'); return; }
  const pt = e.target.closest('.flw .pt');
  if (pt) { openBubble(pt); return; }
  if (!e.target.closest('.bubble')) closeBubble();
  const row = e.target.closest('#main .ev[data-ev]');
  if (row) { const hero = $('#hero .flw'); if (hero) mark(hero, row.dataset.ev); return; }
  const mo = e.target.closest('[data-month]');
  if (mo) { S.month = mo.dataset.month; S.yearView = false; renderGarden(); $('#garden').scrollIntoView({block: 'start', behavior: reduced() ? 'auto' : 'smooth'}); return; }
  const dy = e.target.closest('[data-day]');
  if (dy) { if (S.sheet && S.sheet.kind === 'day') { S.sheet = {kind: 'day', arg: dy.dataset.day, anim: true}; paintSheet(); $('#sheet-body').scrollTop = 0; } else openSheet('day', dy.dataset.day); return; }
  const a = e.target.closest('[data-action]');
  if (!a) return;
  switch (a.dataset.action) {
    case 'close': closeSheet(); break;
    case 'refresh': load(); break;
    case 'search': case 'more': case 'word': openSheet(a.dataset.action); break;
    case 'read-word': readWord(); break;
    case 'prev': S.month = shiftMonth(S.month, -1); renderGarden(); break;
    case 'next': S.month = shiftMonth(S.month, 1); renderGarden(); break;
    case 'view-month': S.yearView = false; renderGarden(); break;
    case 'view-year': S.yearView = true; renderGarden(); break;
    case 'mode': {
      const v = a.dataset.v;
      if (v === S.mode) break;
      S.mode = v; S.month = null;
      savePrefs();
      primeFromCache(); rebuild(); render(); paintSheet(); load();
      break;
    }
    case 'copy': {
      const url = a.dataset.url;
      const done = () => { a.textContent = '복사했어요'; setTimeout(() => { a.textContent = '학생용 주소 복사'; }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(url).then(done, () => prompt('학생용 주소', url));
      else prompt('학생용 주소', url);
      break;
    }
    case 'forget':
      Object.keys(SRC).forEach(k => store.del(CACHE + k));
      a.textContent = '지웠어요';
      break;
  }
});

document.addEventListener('change', e => {
  if (e.target.id !== 'dept') return;
  S.dept = e.target.value;
  closeBubble();
  savePrefs();
  render();
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.sheet) closeSheet();
});

let qTimer = 0;
document.addEventListener('input', e => {
  if (e.target.id !== 'q') return;
  S.q = e.target.value.trim();
  clearTimeout(qTimer);
  qTimer = setTimeout(() => { const h = $('#hits'); if (h) h.innerHTML = hitsHTML(); }, 120);
});

addEventListener('popstate', () => { if (S.sheet) hideSheet(); });
addEventListener('scroll', () => $('#top').classList.toggle('lifted', scrollY > 4), {passive: true});

// 정원은 옆으로 밀어 달을 넘긴다
let touch = null;
document.addEventListener('touchstart', e => {
  touch = e.target.closest('#garden-grid') ? {x: e.touches[0].clientX, y: e.touches[0].clientY} : null;
}, {passive: true});
document.addEventListener('touchend', e => {
  if (!touch) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
  const [lo, hi] = monthBounds();
  const next = shiftMonth(S.month, dx < 0 ? 1 : -1);
  if (next < lo || next > hi) return;
  S.month = next;
  renderGarden();
}, {passive: true});

// 판을 아래로 끌어내리면 닫힌다
let drag = null;
$('#sheet').addEventListener('touchstart', e => {
  if (e.target.closest('.sheet-body') && $('#sheet-body').scrollTop > 0) { drag = null; return; }
  drag = {y: e.touches[0].clientY, dy: 0};
}, {passive: true});
$('#sheet').addEventListener('touchmove', e => {
  if (!drag) return;
  drag.dy = Math.max(0, e.touches[0].clientY - drag.y);
  if (drag.dy > 0) { $('#sheet').style.transition = 'none'; $('#sheet').style.transform = `translateY(${drag.dy}px)`; }
}, {passive: true});
$('#sheet').addEventListener('touchend', () => {
  if (!drag) return;
  const el = $('#sheet');
  el.style.transition = ''; el.style.transform = '';
  if (drag.dy > 110) closeSheet();
  drag = null;
});

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (Date.now() - S.lastLoad > STALE) load();
  else if (todayKey() !== S.today) render();
});
setInterval(() => {
  if (document.visibilityState !== 'visible' || S.sheet) return;
  if (Date.now() - S.lastLoad > STALE) load();
  else if (todayKey() !== S.today) render();
}, 60000);

// 머리의 꽃: 다섯 색 꽃잎
$('#logo').innerHTML = flowerSVG({date: 'logo', work: [0, 1, 2, 3, 4].map(i => ({w: 1, periods: null, c: DEPT_COLORS[i]})), memos: [], fronts: [], busy: 100, stage: '만개'}, {label: false}).replace(/^<svg[^>]*>|<\/svg>$/g, '');

primeFromCache();
rebuild();
render();
load();
</script>
</body>
</html>
